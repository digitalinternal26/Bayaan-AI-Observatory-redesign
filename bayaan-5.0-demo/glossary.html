<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bayaan — Glossary</title>
<link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/components/bayaan-footer.css" />
<link rel="stylesheet" href="css/pages/glossary.css" />
<script>
  (function () {
    var t = localStorage.getItem("bayaan-theme") || "light";
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<script src="js/theme.js"></script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>
</head>
<body>

<div id="screen-glossary" class="ws-screen header-flush active">
  <div data-bayaan-header></div>

  <main class="glossary-main">
    <section class="glossary-hero">
      <div class="hero-banner" aria-hidden="true">
        <img id="glossaryHeroBannerImg" src="assets/banner-default.jpg" alt="" />
      </div>
      <nav class="glossary-breadcrumb-row" aria-label="Breadcrumb">
        <div class="glossary-breadcrumb">
          <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Home</a>
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
          <span class="glossary-bc-current">Glossary</span>
        </div>
      </nav>
      <div class="glossary-hero-inner">
        <h1>Glossary</h1>
        <p class="glossary-hero-sub">Explore definitions and terminology used across Bayaan.</p>

        <div class="glossary-hero-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <label for="glossarySearch" class="sr-only">Search glossary terms or definitions</label>
          <input id="glossarySearch" type="text" placeholder="Search terms or definitions" autocomplete="off" />
          
          <button type="button" class="glossary-hero-send" id="glossaryHeroSend" title="Search glossary" aria-label="Search glossary">
            <i class="ti ti-arrow-up" aria-hidden="true"></i>
          </button>
        </div>

       
      </div>
    </section>

    <div class="glossary-wrap">
      <section class="glossary-toolbar-panel">
        <div class="glossary-filter-group">
          <div class="prod-filter-dd" id="glossaryDomainDd">
            <button
              type="button"
              class="prod-filter-dd-trigger"
              id="glossaryDomainTrigger"
              aria-expanded="false"
              aria-controls="glossaryDomainMenu"
              aria-label="Filter by domain"
            >
              <i class="ti ti-category prod-filter-dd-lead" aria-hidden="true"></i>
              <span id="glossaryDomainLabel">All domains</span>
              <i class="ti ti-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="prod-filter-dd-menu" id="glossaryDomainMenu" role="listbox" aria-label="Filter by domain" hidden></div>
          </div>

          <div class="prod-filter-dd" id="glossarySubDomainDd">
            <button
              type="button"
              class="prod-filter-dd-trigger"
              id="glossarySubDomainTrigger"
              aria-expanded="false"
              aria-controls="glossarySubDomainMenu"
              aria-label="Filter by sub-domain"
            >
              <i class="ti ti-subtask prod-filter-dd-lead" aria-hidden="true"></i>
              <span id="glossarySubDomainLabel">All sub-domains</span>
              <i class="ti ti-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="prod-filter-dd-menu" id="glossarySubDomainMenu" role="listbox" aria-label="Filter by sub-domain" hidden></div>
          </div>
        </div>

        <div class="glossary-language" role="group" aria-label="Language">
          <button type="button" class="is-active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
        </div>
      </section>

      <div class="glossary-alphabet-wrap">
        <div class="glossary-alphabet" id="glossaryAlphabet" role="group" aria-label="Jump to letter"></div>
      </div>

      <div class="glossary-results-head">
        <div class="glossary-results-title"><b id="glossaryResultCount">0 terms</b> found</div>
        <button type="button" class="glossary-sort-btn" id="glossarySortBtn">
          <span class="glossary-sort-label">Sort: A–Z</span>
          <i class="ti ti-chevron-down" aria-hidden="true"></i>
        </button>
      </div>

      <div class="glossary-results" id="glossaryResults" aria-live="polite"></div>

      <div class="glossary-pagination">
        <div id="glossaryPageSummary">Showing 0 of 0 terms</div>
        <nav class="glossary-pager" id="glossaryPager" aria-label="Pagination"></nav>
      </div>
    </div>
  </main>

  <div data-bayaan-footer></div>
</div>

<script>
  (function () {
    function bootGlossary() {
      if (window.BayaanHeader) {
        BayaanHeader.initScreenHeader("screen-glossary");
      }
      var nav = document.querySelector("#screen-glossary .topnav");
      if (nav) {
        var logo = nav.querySelector(".nav-logo");
        if (logo) {
          logo.setAttribute("href", "index.html");
          logo.removeAttribute("onclick");
        }
        nav.querySelectorAll(".nav-link[data-nav]").forEach(function (link) {
          link.setAttribute(
            "href",
            link.dataset.nav === "geo" ? "addp/index.html" : "index.html",
          );
          link.removeAttribute("onclick");
        });
      }
      if (window.initBayaanFooter) initBayaanFooter();
    }

    window.onHeaderSearchClick = window.onHeaderSearchClick || function () {
      window.location.href = "index.html";
    };

    /* Same hero image as #prodHeroBannerImg on the Products screen — the
       default banner, swapped for its dark variant with the theme. */
    function updateGlossaryHeroBanner() {
      var img = document.getElementById("glossaryHeroBannerImg");
      if (!img) return;
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      img.src = isDark ? "assets/banner-default-dark.png" : "assets/banner-default.jpg";
    }
    window.addEventListener("bayaan-theme-change", updateGlossaryHeroBanner);
    updateGlossaryHeroBanner();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootGlossary);
    } else {
      bootGlossary();
    }
  })();
</script>
<script src="js/glossary.js"></script>

</body>
</html>
