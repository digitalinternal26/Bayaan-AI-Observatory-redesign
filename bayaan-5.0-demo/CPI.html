    <link rel="stylesheet" href="css/pages/ai.css" />

          "data-theme",
          t === "dark" ? "dark" : "light"
        );
      })();
    </script>

  <script src="js/header.js?v=20260913-breadcrumbs3"></script>

    <style>
      /* Section headings styled like the home page module titles: bold black
         title + prominent accent icon (replaces the section pip).
         Mirrors .screen-home .home-module-title / .home-module-title-icon. */
      /* Section containers styled like home-page modules — gradient card,
         radius, soft shadow, padding. Values mirror .home-section-module. */
      #screen-cpi-obs #cpi-obs-content > section {
        background:
          radial-gradient(ellipse 90% 70% at 0% 0%, rgba(219, 234, 254, 0.55) 0%, transparent 52%),
          linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.05),
          0 10px 28px rgba(42, 61, 76, 0.07);
        padding: 24px 28px 28px;
        margin-bottom: 24px;
      }
      html[data-theme="dark"] #screen-cpi-obs #cpi-obs-content > section {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero {
        background:
          radial-gradient(ellipse 70% 55% at 8% 15%, rgba(59, 130, 246, 0.18) 0%, transparent 55%),
          linear-gradient(135deg, var(--surface2) 0%, var(--surface) 45%, #151E32 100%);
        border-color: var(--border-md);
        box-shadow: var(--shadow-sm);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero::before {
        background-image: radial-gradient(rgba(59, 130, 246, 0.12) 1.5px, transparent 1.5px);
        opacity: 0.5;
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero-title {
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero-sub {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero-meta-sep {
        color: var(--text-tertiary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero .brief-speech {
        background: linear-gradient(120deg, rgba(30, 58, 95, 0.95), rgba(20, 30, 50, 0.9));
        box-shadow: inset 0 0 0 1px var(--border-md), 0 4px 12px rgba(0, 0, 0, 0.25);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hero .brief-speech.is-active {
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35), 0 5px 14px rgba(0, 0, 0, 0.3);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hdr-date-label {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hdr-date-input {
        background: var(--surface);
        border-color: var(--border-md);
        box-shadow: none;
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hdr-date-field:hover .cpi-hdr-date-input,
      html[data-theme="dark"] #screen-cpi-obs .cpi-hdr-date-field:focus-within .cpi-hdr-date-input {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-hdr-date-field > i {
        color: var(--text-tertiary);
      }
      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-icon {
        background: color-mix(in srgb, var(--tone) 14%, var(--surface));
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-stat-k {
        color: var(--text-tertiary);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-risk--moderate {
        color: #FBBF24;
      }
      #screen-cpi-obs .section-hdr {
        margin-bottom: 20px;
      }

      /* Header ↔ banner spacing: tighten the title's line-height and drop the
         divider + bottom padding so the hero sits neatly below the subtitle. */
      #screen-cpi-obs .topic-title {
        line-height: 1.2;
      }
      #screen-cpi-obs .cpi-page-header-inner {
        border-bottom: none;
        padding-bottom: 0;
      }

      #screen-cpi-obs .cpi-page-header-inner .cpi-page-header-box {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      #screen-cpi-obs .cpi-page-header-box .cpi-page-title-row {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      #screen-cpi-obs .cpi-page-header-box .topic-title-sub {
        margin: 0;
      }

      /* Hero banner — CPI trend callout with the illustration anchored right. */
      #screen-cpi-obs .cpi-hero {
        position: relative;
        overflow: hidden;
        min-height: 150px;
        margin-bottom: 24px;
        border-radius: 20px;
        border-radius: 16px;
        padding: 24px 28px;
        background: radial-gradient(ellipse 70% 55% at 8% 15%, rgba(99, 179, 255, 0.22) 0%, transparent 55%), linear-gradient(135deg, #f0f6ff 0%, #eef4fc 45%, #e8f0fa 100%);
        border: 1px solid #bfdbfe;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
      }
      #screen-cpi-obs .cpi-hero::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1.5px, transparent 1.5px);
          background-size: 18px 18px;
          pointer-events: none;
          opacity: 0.7;
        }
      #screen-cpi-obs .cpi-hero-inner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      /* Audio brief + date — top-right meta row inside the hero header. */
      #screen-cpi-obs .cpi-hero-meta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        margin-left: auto;
        align-self: flex-start;
      }
      #screen-cpi-obs .cpi-hero-meta-sep {
        color: #cbd5e1;
        font-size: 16px;
        font-weight: 300;
        line-height: 1;
        user-select: none;
      }
      #screen-cpi-obs .cpi-hero-meta .brief-speech {
        margin-top: 0;
      }
      #screen-cpi-obs .cpi-hero-meta .cpi-hero-date {
        margin-left: 0;
      }
      /* "Data as of" date, moved from the header into the hero, pinned to its
         top-right corner. */
      #screen-cpi-obs .cpi-hero-date {
        position: relative;
        z-index: 2;
        align-self: flex-start;
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hero-ico {
        color: #fff;
        font-size: 22px;
        line-height: 1;
        margin-top: 1px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.28);
      }
      #screen-cpi-obs .cpi-hero-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f2744;
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .cpi-hero-sub {
        margin-top: 20px;
        max-width: 100%;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text2);
      }

      /* ── Audio brief — Bayaan standard listen control (icon-only, as on
         the home page's Daily Brief and the Census Observatory hero;
         css/pages/daily-brief.css). No pill/chip background and no visible
         "Audio brief" label — the text stays in the DOM for the aria-label
         and screen readers only. Keep in sync with `.daily-brief--split
         .brief-*` there. ── */
      #screen-cpi-obs .cpi-hero {
        --brief-blue: #246bfd;
        --brief-red: #e5484d;
      }
      #screen-cpi-obs .cpi-hero .brief-speech {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        height: 32px;
        padding: 0;
        border-radius: 16px;
        background: transparent;
        box-shadow: none;
        transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen-cpi-obs .cpi-hero .brief-speech::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: linear-gradient(110deg, rgba(36, 107, 253, 0.22), transparent 42%);
        opacity: 0;
        z-index: -1;
        transition: 0.3s;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active {
        box-shadow: none;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active::before {
        opacity: 1;
      }
      #screen-cpi-obs .cpi-hero .brief-listen {
        display: flex;
        align-items: center;
        gap: 0;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: #28415f;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: 0.22s ease;
      }
      #screen-cpi-obs .cpi-hero .brief-listen:hover .brief-listen__icon {
        transform: scale(1.06);
        box-shadow: 0 5px 12px rgba(36, 107, 253, 0.32);
      }
      #screen-cpi-obs .cpi-hero .brief-listen:focus-visible,
      #screen-cpi-obs .cpi-hero .brief-audio-action:focus-visible {
        outline: 3px solid rgba(36, 107, 253, 0.17);
        outline-offset: 2px;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, #1f5ef0, #5b97f8);
        box-shadow: 0 3px 8px rgba(36, 107, 253, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__icon::after {
        content: "";
        position: absolute;
        inset: -2px;
        border: 1px solid rgba(36, 107, 253, 0.22);
        border-radius: 50%;
        transform: scale(0.84);
        opacity: 0;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__speaker,
      #screen-cpi-obs .cpi-hero .brief-listen__play,
      #screen-cpi-obs .cpi-hero .brief-listen__pause {
        grid-area: 1 / 1;
        font-size: 16px;
        line-height: 1;
        transition: opacity 0.15s, transform 0.15s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__play {
        margin-left: 1px;
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__pause {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__speaker {
        opacity: 1;
        transform: scale(1);
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__speaker,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__speaker {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__pause {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__play {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__icon {
        background: linear-gradient(145deg, #3b7af5, #7aafff);
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__icon::after {
        animation: brief-voice-ring 1.8s ease-out infinite;
      }
      /* Icon-only — the "Audio brief" text label is hidden (kept in the DOM
         for the aria-label / screen readers and the driver's label swap). */
      #screen-cpi-obs .cpi-hero .brief-listen__copy {
        display: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__text {
        color: #2b4462;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__text,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__text {
        display: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 14px;
        color: var(--brief-blue);
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i {
        display: block;
        width: 2px;
        height: 5px;
        border-radius: 2px;
        background: currentColor;
        animation: brief-wave 0.72s ease-in-out infinite;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(2) {
        animation-delay: 0.12s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(3) {
        animation-delay: 0.24s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(4) {
        animation-delay: 0.36s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__wave,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave {
        display: inline-flex;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave i {
        height: 8px;
        animation-play-state: paused;
      }
      #screen-cpi-obs .cpi-hero .brief-speech__actions {
        display: flex;
        align-items: center;
        gap: 1px;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateX(-6px);
        transition: max-width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s, transform 0.3s;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active .brief-speech__actions {
        max-width: 56px;
        opacity: 1;
        transform: none;
      }
      #screen-cpi-obs .cpi-hero .brief-speech__actions::before {
        content: "";
        width: 1px;
        height: 14px;
        margin: 0 2px 0 0;
        background: #d7e2f0;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6d7f95;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action:hover {
        color: var(--brief-blue);
        background: #fff;
        box-shadow: 0 4px 10px rgba(36, 75, 125, 0.1);
        transform: scale(1.06);
      }
      #screen-cpi-obs .cpi-hero .brief-stop-box {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action--stop:hover {
        color: var(--brief-red);
        background: #fff5f5;
      }
      #screen-cpi-obs .cpi-hero .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes brief-wave {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 14px;
        }
      }
      @keyframes brief-voice-ring {
        0% {
          transform: scale(0.82);
          opacity: 0.8;
        }
        80%,
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      /* Page-header actions (right side): date picker + download button.
         Date pill mirrors the sibling pages' .tr-datepick; download uses the
         brand primary fill. */
      #screen-cpi-obs .cpi-hdr-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hdr-search {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        min-width: 240px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        color: var(--text2);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-size: 13px;
        cursor: text;
        transition: border-color 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-search[hidden] {
        display: none;
      }
      #screen-cpi-obs .cpi-hdr-search:hover,
      #screen-cpi-obs .cpi-hdr-search:focus-within {
        border-color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-search > i {
        font-size: 16px;
        color: var(--text2);
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hdr-kbd {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accent-light);
        color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-date {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        cursor: default;
        margin-left: auto;
      }
      #screen-cpi-obs .cpi-hdr-date-label {
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        white-space: nowrap;
      }
      #screen-cpi-obs .cpi-hdr-date-field {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      #screen-cpi-obs .cpi-hdr-date-input {
        height: 36px;
        min-width: 132px;
        padding: 0 36px 0 12px;
        border: 1px solid rgba(191, 219, 254, 0.65);
        border-radius: 10px;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-date-field:hover .cpi-hdr-date-input,
      #screen-cpi-obs .cpi-hdr-date-field:focus-within .cpi-hdr-date-input {
        border-color: #bfdbfe;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        outline: none;
      }
      #screen-cpi-obs .cpi-hdr-date-input::-webkit-calendar-picker-indicator {
        position: absolute;
        right: 0;
        top: 0;
        width: 36px;
        height: 100%;
        margin: 0;
        padding: 0;
        opacity: 0;
        cursor: pointer;
      }
      #screen-cpi-obs .cpi-hdr-date-field > i {
        position: absolute;
        right: 10px;
        pointer-events: none;
        color: #64748b;
        font-size: 16px;
        line-height: 1;
      }
      #screen-cpi-obs .cpi-hdr-download {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-download[hidden] {
        display: none !important;
      }
      #screen-cpi-obs .cpi-hdr-download:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      #screen-cpi-obs .cpi-hdr-download i {
        font-size: 16px;
        color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-search {
        display: inline-flex !important;
      }
      #screen-cpi-obs .section-hdr h2.cpi-section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        color: #000;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .section-hdr h2.cpi-section-title i {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-cpi-obs .section-hdr h2.cpi-section-title {
        color: var(--text);
      }

      /* Overview — wireframe-accurate grouped metric cards, composed from the
         app's existing tokens/components. Layout-only additions; no changes to
         the shared design system. */
      #screen-cpi-obs .cpi-overview-grid {
        display: grid;
        /* Equal thirds — the Inflation internals are sized down to fit rather
           than the track being widened to accommodate them. */
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: stretch;
      }
      /* Cards inside each section — matched to the home page "subcard" recipe
         (:is(.screen-home, …) .exec-subcard / .product-card in style.css).
         Tokens redeclared here because the originals are scoped to .screen-home. */
      #screen-cpi-obs {
        --figma-subcard-bg: rgba(255, 255, 255, 0.6);
        --figma-subcard-shadow: 0 24px 30px 0 rgba(42, 61, 76, 0.03);
      }
      #screen-cpi-obs .obs-card {
        border-radius: 16px;
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease,
          transform 0.22s ease,
          background 0.22s ease;
      }
      /* Surface colours are light-theme only — dark theme already restyles
         .obs-card in css/theme.css and must be left to win. */
      /* Pre-existing: the light border shorthand in cpi-obs.css outranks the
         dark `border-color` in theme.css, leaving pale edges on dark cards. */
      html[data-theme="dark"] #screen-cpi-obs .obs-card {
        border-color: var(--border);
      }

      /* Inflation card — icon chip + large value + muted unit, so the card
         carries the same weight as its sparkline-bearing neighbours instead of
         trailing off into empty space. Icon treatment matches the Key Impacts
         rows below (and the home Daily Brief points they came from). */
      #screen-cpi-obs .infl-rows {
        display: flex;
        flex-direction: column;
        margin-top: 4px;
      }
      #screen-cpi-obs .infl-row {
        --tone: #8b93a7;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 14px 0;
        min-width: 0;
      }
      /* Tighter gutters than the other two cards — this one packs an icon and
         two text runs per metric, so it needs the horizontal room. */
      #screen-cpi-obs .kpi-card--infl .ov-metric {
        padding: 0 10px;
      }
      #screen-cpi-obs .kpi-card--infl .ov-metric:first-child {
        padding-left: 0;
      }
      #screen-cpi-obs .kpi-card--infl .ov-metric:last-child {
        padding-right: 0;
      }

      /* CPI card — combined multi-series chart */
      #screen-cpi-obs .cpi-kpi-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      #screen-cpi-obs .cpi-kpi {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      #screen-cpi-obs .cpi-kpi-row--3 {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 10px;
      }
      #screen-cpi-obs .cpi-kpi-row--3 .kpi-label {
        font-size: 9.5px;
      }
      #screen-cpi-obs .cpi-kpi-row--3 .cpi-kpi-val--sm {
        font-size: 16px;
      }
      #screen-cpi-obs .cpi-kpi-row--3 .dc-changes {
        margin-top: 1px;
        font-size: 10px;
        flex-wrap: wrap;
      }
      #screen-cpi-obs .cpi-kpi-val {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      #screen-cpi-obs .cpi-chart-wrap {
        height: 56px;
        width: 100%;
        margin-top: 6px;
      }
      #screen-cpi-obs .cpi-chart-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #screen-cpi-obs .cpi-chart-wrap .cpi-chart-grid {
        stroke: #e2e8f0;
      }
      #screen-cpi-obs .obs-chart-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin-top: 8px;
      }
      #screen-cpi-obs .obs-chart-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text2);
      }
      #screen-cpi-obs .obs-chart-legend-line {
        width: 22px;
        height: 3px;
        border-radius: 2px;
        flex-shrink: 0;
        background: var(--legend-color, #2563eb);
      }
      #screen-cpi-obs .obs-chart-legend-line--dashed {
        height: 0;
        border-top: 2.5px dashed var(--legend-color, #7ec89a);
        background: none;
      }

      /* CPI by card — compact row layout */
      #screen-cpi-obs .cpiby-rows {
        display: flex;
        flex-direction: column;
        margin-top: 2px;
      }
      #screen-cpi-obs .cpiby-row {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        min-width: 0;
      }
      #screen-cpi-obs .cpiby-row + .cpiby-row {
        border-top: 1px solid rgba(15, 23, 42, 0.06);
      }
      #screen-cpi-obs .cpiby-row-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      #screen-cpi-obs .cpiby-row-val {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #screen-cpi-obs .cpiby-row-meta {
        font-size: 11px;
        color: var(--text2);
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #screen-cpi-obs .cpiby-row-meta .up {
        color: var(--up);
        font-weight: 600;
      }
      #screen-cpi-obs .cpiby-row-spark {
        width: 52px;
        height: 28px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpiby-row-spark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Value and unit sit inline, but wrap instead of overflowing when the
         column is tight — these metrics live in a narrow grid track. */
      #screen-cpi-obs .infl-figure {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 1px 5px;
        min-width: 0;
      }
      #screen-cpi-obs .infl-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      #screen-cpi-obs .infl-row--up {
        --tone: #e5484d;
      }
      #screen-cpi-obs .infl-row--down {
        --tone: #0c9b70;
      }
      #screen-cpi-obs .infl-icon {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        flex-shrink: 0;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 9%, white);
      }
      #screen-cpi-obs .infl-icon i {
        font-size: 13px;
        line-height: 1;
      }
      #screen-cpi-obs .infl-val {
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--tone);
      }
      #screen-cpi-obs .infl-unit {
        font-size: 10px;
        font-weight: 500;
        color: #8492a6;
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-row {
        border-color: var(--border);
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-icon {
        background: color-mix(in srgb, var(--tone) 18%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-unit {
        color: var(--text-secondary);
      }

      /* No rule under the page title/subtitle. Zero width rather than a colour
         override, so the dark-theme border-bottom-color in css/theme.css can't
         bring it back. The padding-bottom stays as spacing. */
      #screen-cpi-obs .cpi-page-header-inner {
        border-bottom: 0;
      }

      /* Driver date badge as a standard pill — geometry from the page's own
         .kpi-badge (css/pages/cpi-obs.css): flat, inline-flex, fully rounded,
         no border. Single line, so the rounded-rect + <br> version is gone. */
      #screen-cpi-obs .dc-date {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 9px;
        border: 0;
        border-radius: 100px;
        background: var(--accent-light);
        color: var(--accent);
        line-height: 1.5;
        white-space: nowrap;
        text-align: initial;
      }

      /* Groups the date pill with the expand affordance, top-right of the
         Inflation Drivers card. */
      #screen-cpi-obs .dc-head-right {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      /* Expand affordance — the same "this card opens a detail view" signal
         used on the Observe screens' product cards (ti-arrow-up-right,
         title="Expand"), so clickable cards read the same way across the
         Diagnose and Observe surfaces. */
      #screen-cpi-obs .obs-card-expand {
        font-size: 14px;
        color: var(--text2);
        flex-shrink: 0;
        transition: color 0.15s;
      }
      #screen-cpi-obs .obs-card:hover .obs-card-expand {
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-cpi-obs .obs-card-expand {
        color: var(--text-secondary);
      }

      /* Key Impacts — matched to the home page Daily Brief summary points
         (.brief-point in css/pages/daily-brief.css). Tone lives on the icon;
         the copy stays neutral with bold dark emphasis, as in the reference.
         Laid out as a 2×2 grid with a horizontal rule between the rows only. */
      #screen-cpi-obs .impacts-list {
        padding: 0;
        border-radius: 0;
        border: none;
        background-color: transparent;
      }
      #screen-cpi-obs .impacts-list,
      #screen-cpi-obs .impacts-list:hover {
        box-shadow: none;
      }
      #screen-cpi-obs .impacts-list .impact-item {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 11px;
        align-items: start;
        padding: 10px 0;
        border-bottom: 1px solid #eaecf0;
        font-size: 14px;
        line-height: 1.5;
        color: #536277;
        transition: transform 0.22s ease;
      }

      /* Bottom row carries no horizontal rule. */
      #screen-cpi-obs .impacts-list .impact-item:nth-last-child(-n + 2) {
        border-bottom: 0;
      }
      #screen-cpi-obs .impacts-list .impact-item:hover {
        background: none;
        transform: translateX(3px);
      }

      #screen-cpi-obs .impacts-list .impact-icon {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 9%, white);
      }
      #screen-cpi-obs .impacts-list .impact-icon i {
        font-size: 17px;
        line-height: 1;
      }
      #screen-cpi-obs .impacts-list .impact-icon--up {
        --tone: #e5484d;
      }
      #screen-cpi-obs .impacts-list .impact-icon--down {
        --tone: #0c9b70;
      }
      #screen-cpi-obs .impacts-list .impact-icon--neutral {
        --tone: #246bfd;
      }

      /* Reference emphasis is bold ink, not a tone colour. */
      #screen-cpi-obs .impacts-list .impact-val {
        color: #172033;
        font-weight: 700;
      }

      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-item {
        border-color: var(--border);
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-val {
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-icon {
        background: color-mix(in srgb, var(--tone) 18%, transparent);
      }

      /* Card sparklines — mirrors .brief-kpi__spark-area / -line
         (css/pages/daily-brief.css) from the home page cards. */
      #screen-cpi-obs .obs-spark-area {
        opacity: 1;
      }
      #screen-cpi-obs .obs-spark-line {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Single trend line — a compact sparkline height is enough now that the
         five separated year-lines are gone. */
      #screen-cpi-obs .cpiby-spark,
      #screen-cpi-obs .cpiby-spark svg,
      #screen-cpi-obs .dc-spark,
      #screen-cpi-obs .dc-spark svg {
        height: 44px;
      }

      /* Driver-card charts styled like the reference widget: the area/line and
         the year axis share the exact same horizontal band, so every tick sits
         directly under the chart edge it labels. Both get a small inset for
         breathing room instead of running flush to the card padding. */
      #screen-cpi-obs .driver-card .dc-spark {
        height: 52px;
        padding-inline: 6px;
      }
      #screen-cpi-obs .driver-card .obs-year-axis {
        margin-top: 10px;
        padding-inline: 6px;
        font-size: 9.5px;
      }

      /* Year x-axis — five evenly-spaced ticks under the chart, spanning its
         full width (first tick at the left edge, last at the right). */
      #screen-cpi-obs .obs-year-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #9aa7b8;
      }
      html[data-theme="dark"] #screen-cpi-obs .obs-year-axis {
        color: var(--text-tertiary);
      }

      /* ── Driver detail modal ──
         Reusable overlay opened from an Inflation Drivers card. The stat
         header reuses .obs-card / .dc-* verbatim (same markup as
         buildObsDriverCard, minus the sparkline) and the body reuses
         buildCategoryPerformanceChart — the same drill-down chart the CPI
         category detail view already renders — so nothing about the modal
         introduces a new visual language. */
      #screen-cpi-obs .driver-card--clickable {
        cursor: pointer;
      }
      #screen-cpi-obs .driver-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 24px;
      }
      #screen-cpi-obs .driver-modal-overlay.open {
        display: flex;
      }
      #screen-cpi-obs .driver-modal {
        position: relative;
        width: 480px;
        max-width: 100%;
        max-height: calc(100vh - 48px);
        display: flex;
        flex-direction: column;
        background-color: #fff;
        gap: 12px;
        border-radius: 14px;
        animation: driverModalIn 0.2s ease;
      }
      #screen-cpi-obs .driver-modal .obs-card {
        border: 0;
        box-shadow: none;
      }

      #screen-cpi-obs .driver-modal .obs-card:not(.impacts-list):hover {
        border: 0;
      }

      @keyframes driverModalIn {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      #screen-cpi-obs .driver-modal-close {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: var(--up);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
        z-index: 1;
      }
      #screen-cpi-obs .driver-modal-close:hover {
        background: #fee2e2;
      }
      #screen-cpi-obs .driver-modal-close i {
        font-size: 14px;
      }
      #screen-cpi-obs .driver-modal-stat .dc-value {
        margin-top: 6px;
      }
      #screen-cpi-obs .driver-modal-stat .dc-changes {
        margin-top: 4px;
      }
      #screen-cpi-obs .driver-modal-footer {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text2);
      }
      #screen-cpi-obs .driver-modal-footer i {
        color: #8b5cf6;
        font-size: 14px;
        margin-top: 1px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .driver-modal-footer b {
        color: var(--text);
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-close {
        background: rgba(220, 38, 38, 0.16);
        border-color: rgba(220, 38, 38, 0.35);
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-footer {
        border-color: var(--border);
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-footer b {
        color: var(--text-primary);
      }
      /* Ask AI trigger — the app-wide standard: a plain 32px accent-coloured
         circle, icon-only (ti-sparkles), transparent until hover. Matches the
         same affordance on the Benchmark/Forecast "At a Glance" panels and
         the other observatories, rather than a filled CTA pill. */
      #screen-cpi-obs .driver-modal-ask-ai {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        margin-left: auto;
        align-self: center;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        transition: background 0.15s ease;
      }
      #screen-cpi-obs .driver-modal-ask-ai:hover {
        background: var(--accent-light, rgba(0, 102, 255, 0.12));
      }
      #screen-cpi-obs .driver-modal-ask-ai i {
        color: var(--accent);
        font-size: 18px;
        animation: sparkleGlow 2.4s ease-in-out infinite;
      }

      /* Overview CPI card modal — same overlay/card chrome as the driver
         modal, plus a Combined / Overall / Essentials tab row. */
      #screen-cpi-obs .driver-modal-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        align-self: flex-start;
        background: #f1f5f9;
        border-radius: 10px;
        padding: 4px;
        margin-left: 16px;
      }
      #screen-cpi-obs .driver-modal-tab {
        appearance: none;
        border: 0;
        background: transparent;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, box-shadow 0.15s;
      }
      #screen-cpi-obs .driver-modal-tab:hover {
        color: var(--text);
      }
      #screen-cpi-obs .driver-modal-tab.active {
        background: var(--white);
        color: var(--accent);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
      }
      /* The on-page CPI card's mini multi-series chart, moderately enlarged
         for the Combined tab's modal body — its grid is a compact-card
         texture (a dashed line per data point), so stretching it as tall as
         the single-series chart above makes that grid overly busy. */
      #screen-cpi-obs .driver-modal-chart-card .cpi-chart-wrap {
        height: 130px;
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-tabs {
        background: rgba(255, 255, 255, 0.06);
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-tab {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .driver-modal-tab.active {
        background: var(--surface);
        color: var(--text-primary);
      }

      /* ── Inflation contribution modal ──
         Opened from the Inflation KPI card. Reuses all driver-modal chrome
         (overlay, close button, .obs-card panels, footer/Ask AI) but the
         card runs wider to hold a treemap or historical chart, and its own
         stat header + three independent tab groups (Current/Historical,
         Overall/Essentials, YoY/MoM) sit above the body. */
      #screen-cpi-obs .driver-modal--infl {
        width: 760px;
        transition: width 0.2s ease;
      }
      #screen-cpi-obs .driver-modal--infl.driver-modal--expanded {
        width: min(1180px, calc(100vw - 48px));
      }
      #screen-cpi-obs .infl-modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      #screen-cpi-obs .infl-modal-stat {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #screen-cpi-obs .infl-modal-stat .dc-icon-wrap {
        flex-shrink: 0;
      }
      #screen-cpi-obs .infl-modal-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text2);
      }
      #screen-cpi-obs .infl-modal-value {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 2px;
      }
      #screen-cpi-obs .infl-modal-value b {
        font-size: 22px;
        font-weight: 800;
        color: var(--up, #dc2626);
      }
      #screen-cpi-obs .infl-modal-value i {
        font-size: 15px;
        color: var(--up, #dc2626);
      }
      #screen-cpi-obs .infl-modal-date {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--accent);
        flex-shrink: 0;
      }
      #screen-cpi-obs .infl-modal-date span:last-child {
        font-size: 13px;
        color: var(--text);
        letter-spacing: 0;
      }
      #screen-cpi-obs .infl-expand-btn {
        position: absolute;
        top: -12px;
        right: 30px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--accent-mid, #99c2ff);
        background: #eff6ff;
        color: var(--accent);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
        z-index: 1;
      }
      #screen-cpi-obs .infl-expand-btn:hover {
        background: #dbeafe;
      }
      #screen-cpi-obs .infl-expand-btn i {
        font-size: 13px;
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-expand-btn {
        background: rgba(37, 99, 235, 0.16);
        border-color: rgba(37, 99, 235, 0.35);
      }
      #screen-cpi-obs .infl-tabs-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      #screen-cpi-obs .infl-tabs-row .driver-modal-tabs {
        margin-left: 0;
      }
      #screen-cpi-obs .infl-tabs-row .driver-modal-tab {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      #screen-cpi-obs .infl-section-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 10px;
      }

      /* CPI by row → tier detail modal ──
         Opened from a .cpiby-row (Income / Welfare / Household). Reuses the
         inflation modal's icon+label+value stat header (.infl-modal-*) since
         that's the closest existing layout to a single tracked figure with a
         top-right date badge, plus the shared driver-modal-tabs pill row —
         here wrapping onto two lines to hold "Combined" + every income/
         welfare/household band — and the shared chart card/footer/Ask AI
         and .cpi-notice banner used everywhere else on this page. */
      #screen-cpi-obs .driver-modal--cpiby {
        width: 540px;
        transition: width 0.2s ease;
      }
      #screen-cpi-obs .driver-modal--cpiby.driver-modal--expanded {
        width: min(900px, calc(100vw - 48px));
      }
      #screen-cpi-obs .cpiby-row.driver-card--clickable {
        cursor: pointer;
        margin-inline: -18px;
        padding-inline: 18px;
        border-radius: 8px;
        transition: background 0.15s;
      }
      #screen-cpi-obs .cpiby-row.driver-card--clickable:hover,
      #screen-cpi-obs .cpiby-row.driver-card--clickable:focus-visible {
        background: rgba(15, 23, 42, 0.035);
        outline: none;
      }
      html[data-theme="dark"] #screen-cpi-obs .cpiby-row.driver-card--clickable:hover,
      html[data-theme="dark"] #screen-cpi-obs .cpiby-row.driver-card--clickable:focus-visible {
        background: rgba(255, 255, 255, 0.05);
      }
      #screen-cpi-obs .driver-modal-tabs--cpiby {
        flex-wrap: wrap;
        width: 100%;
        margin-left: 0;
        margin-top: 12px;
      }
      #screen-cpi-obs .driver-modal-tab--combined {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #screen-cpi-obs .driver-modal-tab--combined .tab-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.6;
      }
      #screen-cpi-obs .driver-modal--cpiby .cpi-notice {
        margin: 14px 0 0;
      }

      /* Treemap — bold, saturated tiles (unlike the muted Analytics
         treemap) since here colour intensity itself encodes contribution
         magnitude; tone is still up/down/flat so it reads the same way as
         every other CPI colour cue on this page. */
      #screen-cpi-obs .infl-treemap {
        position: relative;
        width: 100%;
        height: 380px;
        border-radius: 12px;
        overflow: hidden;
      }
      #screen-cpi-obs .infl-tile {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 8px;
        border-radius: 8px;
        text-align: center;
        color: #fff;
        overflow: hidden;
        transition: left 0.3s ease, top 0.3s ease, width 0.3s ease, height 0.3s ease, filter 0.15s ease;
      }
      #screen-cpi-obs .infl-tile:hover {
        filter: brightness(1.08);
      }
      #screen-cpi-obs .infl-tile-icon {
        font-size: 15px;
        opacity: 0.9;
      }
      #screen-cpi-obs .infl-tile-name {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.25;
        max-width: 100%;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #screen-cpi-obs .infl-tile-value {
        font-size: 13px;
        font-weight: 800;
      }
      #screen-cpi-obs .infl-tile--sm {
        gap: 2px;
        padding: 6px;
      }
      #screen-cpi-obs .infl-tile--sm .infl-tile-name {
        -webkit-line-clamp: 1;
      }
      #screen-cpi-obs .infl-tile--xs {
        gap: 1px;
        padding: 4px;
      }
      #screen-cpi-obs .infl-tile--xs .infl-tile-icon {
        display: none;
      }
      #screen-cpi-obs .infl-tile--xs .infl-tile-name {
        font-size: 9.5px;
        -webkit-line-clamp: 1;
      }
      #screen-cpi-obs .infl-tile--xs .infl-tile-value {
        font-size: 10px;
      }
      #screen-cpi-obs .infl-tile--micro {
        padding: 2px;
        gap: 0;
      }
      #screen-cpi-obs .infl-tile--micro .infl-tile-name {
        display: none;
      }
      #screen-cpi-obs .infl-tile--micro .infl-tile-value {
        font-size: 9px;
      }

      /* Historical stacked contribution chart */
      #screen-cpi-obs .infl-hist-wrap {
        width: 100%;
      }
      #screen-cpi-obs .infl-hist-svg {
        width: 100%;
        height: auto;
        display: block;
      }
      #screen-cpi-obs .infl-hist-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #eaecf0;
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-hist-legend {
        border-color: var(--border);
      }
      #screen-cpi-obs .infl-hist-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text2);
      }
      #screen-cpi-obs .infl-hist-legend-dot {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      @media (max-width: 800px) {
        #screen-cpi-obs .driver-modal--infl {
          width: 100%;
        }
      }

      /* Lift on hover for grid cards only — full-width list cards stay put,
         same as the home page's list modules. */
      #screen-cpi-obs .obs-card:not(.impacts-list):hover {
        border: 1px solid #eaecf0;
        box-shadow: none;
        transform: none;
      }
      /* Home subcards have no coloured top rule. */
      #screen-cpi-obs .kpi-card::before {
        display: none;
      }
      #screen-cpi-obs .ov-card-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
      }
      #screen-cpi-obs .ov-card-title i {
        font-size: 16px;
        color: var(--accent);
      }
      #screen-cpi-obs .ov-metrics {
        display: grid;
        gap: 0;
      }
      #screen-cpi-obs .ov-metrics.cols-2 {
        grid-template-columns: 1fr 1fr;
      }
      #screen-cpi-obs .ov-metrics.cols-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      #screen-cpi-obs .ov-metric {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        padding: 0 14px;
      }
      #screen-cpi-obs .ov-metric:first-child {
        padding-left: 0;
      }
      #screen-cpi-obs .ov-metric:last-child {
        padding-right: 0;
      }
      #screen-cpi-obs .ov-metric + .ov-metric {
        border-left: 1px solid rgba(15, 23, 42, 0.06);
      }
      /* Raised from 1100px: with equal thirds, three cards side by side need
         ~1250px before CPI-by rows start colliding with their track. */
      @media (max-width: 1250px) {
        #screen-cpi-obs .cpi-overview-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        #screen-cpi-obs .cpiby-row-spark {
          width: 40px;
        }
        #screen-cpi-obs .cpiby-row-meta {
          white-space: normal;
        }
      }

      html[data-theme="dark"] #screen-cpi-obs .cpi-kpi-val {
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpiby-row-val {
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpiby-row + .cpiby-row {
        border-color: var(--border);
      }
      html[data-theme="dark"] #screen-cpi-obs .obs-chart-legend-item {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .cpi-chart-wrap .cpi-chart-grid {
        stroke: rgba(148, 163, 184, 0.22);
      }

      /* The breadcrumb sits outside .page-wrap, so it clears neither the 120px
         sidebar rail nor the page gutter — it falls back to the global
         .container inline padding of 32px. Realign it with the content column
         (rail + --page-gutter on the left, --page-gutter on the right). */
      #screen-cpi-obs .crisis-scroll > .container {
        /* mirrors .sidebar-rail min-width in css/pages/obs-sidebar.css */
        --obs-rail-w: 120px;
        padding-inline: calc(var(--obs-rail-w) + var(--page-gutter))
          var(--page-gutter);
      }

      /* Sidebar on brand primary (--accent / #0066FF) instead of the legacy
         navy #0c4a8e, mirroring the #screen-topic variant already in
         css/pages/obs-sidebar.css. Dark theme is left alone — it resolves to
         var(--accent) already. */
      html:not([data-theme="dark"]) #screen-cpi-obs .sidebar-icon {
        background: #ebf3ff;
        color: var(--accent);
      }
      html:not([data-theme="dark"])
        #screen-cpi-obs
        .sidebar-item:hover:not(.active):not(.sidebar-item--ai)
        .sidebar-icon {
        background: #dbe9ff;
      }
      html:not([data-theme="dark"])
        #screen-cpi-obs
        .sidebar-item.active:not(.sidebar-item--ai)
        .sidebar-icon {
        background: var(--accent);
        color: #fff;
      }

      /* AI entry point on the app's AI gradient — same fill as .ai-mode-btn in
         style.css, the "AI Mode" button in the top nav. Replaces the pale blue
         tint, which read as just another idle item. */
      /* .sidebar in the chain so this outranks both the light-theme
         .sidebar-icon rule above and the dark-theme one in css/theme.css. */
      html #screen-cpi-obs .sidebar .sidebar-item--ai .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition: transform 0.15s, box-shadow 0.2s;
      }
      html #screen-cpi-obs .sidebar .sidebar-item--ai:hover .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        transform: scale(1.04);
      }

      /* Compact floating sidebar — fits all items within the viewport,
         centered in the space below the top nav (never over it or the bottom). */
      #screen-cpi-obs .sidebar {
        top: calc(50% + 34px);
        padding: 8px 10px;
        gap: 9px;
      }
      #screen-cpi-obs .sidebar-item {
        padding: 4px 0;
        gap: 5px;
        font-size: 10.5px;
      }
      /* Sidebar items that navigate are anchors — strip the link underline so
         they render identically to the button items. */
      #screen-cpi-obs a.sidebar-item {
        text-decoration: none;
      }
      #screen-cpi-obs .sidebar-icon {
        width: 38px;
        height: 38px;
      }
      #screen-cpi-obs .sidebar-icon i {
        font-size: 17px;
      }

      /* Icon-only rail that expands on hover: the labels are part of the
         sidebar itself, sliding out to the right of every icon at once when
         the pill is hovered — no per-item tooltips. */
      #screen-cpi-obs .sidebar {
        max-width: none;
        border-radius: 999px;
        align-items: stretch;
        transition: none;
      }
      /* When expanded (labels out), soften to a rounded rectangle so the long
         pill doesn't get awkward capsule ends. */
      #screen-cpi-obs .sidebar:hover {
        border-radius: 28px;
      }
      #screen-cpi-obs .sidebar-item {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 4px 4px;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-item {
        justify-content: flex-start;
        gap: 10px;
      }
      #screen-cpi-obs .sidebar-label {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        transition: max-width 0.22s ease, opacity 0.18s ease;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-label {
        max-width: 120px;
        opacity: 1;
      }
      #screen-cpi-obs .sidebar-item.active:not(.sidebar-item--ai) .sidebar-label {
        color: #272829;
      }
      html[data-theme="dark"] #screen-cpi-obs .sidebar-label {
        color: #cdd6e0;
      }
      #screen-cpi-obs .sidebar-item--ai .sidebar-label {
        color: #0066ff;
      }
      /* Divider between the AI entry and the view switcher. Stretches to the
         sidebar's inner width, so it grows as the pill expands on hover. */
      #screen-cpi-obs .sidebar-divider {
        width: 16px;
        height: 2px;
        border-radius: 999px;
        background: #e2e8f0;
        margin: 1px 0 1px 15px;
        align-self: flex-start;
        transition: width 0.22s ease, margin-left 0.22s ease;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-divider {
        width: calc(100% - 12px);
        margin-left: 6px;
      }
      html[data-theme="dark"] #screen-cpi-obs .sidebar-divider {
        background: #3a4453;
      }

      /* ====================================================================
         DIAGNOSE VIEW
         Styled to the CPI page's own design system: neutral .obs-card surfaces,
         the shared section-module shell, .kpi-label typography, the --up/--down
         semantic tones, and a category card grid (no carousel). No new colour
         language is introduced — tone lives only on values, the risk pill, and
         header/insight icons.
         ==================================================================== */
      #screen-cpi-obs #cpi-diagnose-content {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      /* The view containers carry `display` rules that would otherwise beat the
         [hidden] attribute the tab switch toggles — restore hide behaviour with
         a higher-specificity rule (id + attribute). */
      #screen-cpi-obs #cpi-obs-content[hidden],
      #screen-cpi-obs #cpi-diagnose-content[hidden] {
        display: none;
      }

      /* ── View header ── */
      #screen-cpi-obs .dg-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      #screen-cpi-obs .dg-title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #screen-cpi-obs .dg-scan {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent-light);
        color: var(--accent);
        font-size: 21px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .dg-month {
        display: inline-flex;
        align-items: center;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 9px;
        border-radius: 100px;
        background: var(--accent-light);
        color: var(--accent);
        line-height: 1.4;
      }
      #screen-cpi-obs .dg-title-col {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      #screen-cpi-obs .dg-h1 {
        font-size: 21px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        line-height: 1.1;
      }
      #screen-cpi-obs .dg-search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 240px;
        padding: 9px 12px;
        border-radius: 12px;
        border: 1px solid var(--border, #eaecf0);
        background: var(--surface, #fff);
        color: var(--text2);
        font-size: 13px;
      }
      #screen-cpi-obs .dg-search i {
        font-size: 16px;
      }
      #screen-cpi-obs .dg-search .dg-kbd {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accent-light);
        color: var(--accent);
      }

      /* ── Two-panel row — each panel is a section module (same shell as the
         Analytics section and the Interpret view's sections). ── */
      #screen-cpi-obs .dg-panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      @media (max-width: 1580px) {
        #screen-cpi-obs .dg-panels {
          grid-template-columns: 1fr;
        }
      }

      /* Section body — AI Summary stacked above the category card grid. */
      #screen-cpi-obs .dg-body {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #screen-cpi-obs .dg-indicators {
        min-width: 0;
      }

      /* AI Summary callout — the app's AI-insight treatment: blue→violet
         gradient tint, sparkle + "AI Summary" header. Ref: .hw-ai-insight in
         css/pages/built-widget-module.css. */
      #screen-cpi-obs .dg-aisummary {
        position: relative;
        padding: 0;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.06), rgba(124, 58, 237, 0.04));
        border: 1px solid rgba(0, 102, 255, 0.12);
      }
      /* Text spans the full width so the summary height is driven purely by the
         copy — this keeps the taller "Needs attention" box in step with the
         shorter "Stable" one instead of the art squeezing the text into extra
         wrapped lines. A right pad reserves room for the overlaid illustration. */
      #screen-cpi-obs .dg-aisummary-text {
        padding: 15px 88px 15px 18px;
      }
      /* Illustration is taken out of flow and anchored to the top/bottom/right
         edges, so it fills the summary height without inflating it. No fixed
         dimensions: width is a share of the summary, height follows the box. */
      #screen-cpi-obs .dg-aisummary-art {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30%;
        height: 100%;
        object-fit: contain;
        object-position: center right;
      }
      /* "Needs attention" copy is longer, so its art is narrowed to leave room
         for the text on single lines — this keeps the box the same height as the
         shorter "Stable" summary instead of wrapping into a taller block.
         The magnifier illustration is near-square, so it's contained (not
         cover-cropped) to keep the whole icon in frame. */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary-art {
        width: 20%;
        object-fit: contain;
        object-position: top right;
      }
      /* Extra right-pad reserves room for the enlarged magnifier so the copy
         still clears it (the summary grows a little taller as a result). */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary-text {
        padding-right: 92px;
      }
      /* On narrow screens the summary is too tight for the overlaid art without
         cropping it or pushing it out of place, so drop it and let the copy
         reclaim the full width. */
      @media (max-width: 768px) {
        #screen-cpi-obs .dg-aisummary-art {
          display: none;
        }
        #screen-cpi-obs .dg-aisummary-text,
        #screen-cpi-obs .dg-panel--warn .dg-aisummary-text {
          padding-right: 18px;
        }
      }
      #screen-cpi-obs .dg-aisummary-hd {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent, #0066ff);
        margin-bottom: 8px;
      }
      #screen-cpi-obs .dg-aisummary-hd i {
        font-size: 14px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-aisummary {
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.12), rgba(124, 58, 237, 0.10));
        border-color: rgba(0, 102, 255, 0.25);
      }
      /* In the "Needs attention" panel the AI Summary reads as an alert, so it
         takes the red chip tint (matches .dg-pill--accel) instead of the blue
         AI gradient. The "Stable & optimized" panel keeps the blue treatment. */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
        border-color: color-mix(in srgb, var(--up, #e5484d) 20%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 22%, transparent);
        border-color: color-mix(in srgb, var(--up, #e5484d) 35%, transparent);
      }
      /* "Stable & optimized" panel — AI Summary takes the green chip tint
         (matches .dg-pill--stable / --down) to read as healthy. */
      #screen-cpi-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 12%, white);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 35%, transparent);
      }
      #screen-cpi-obs .dg-eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #718198;
        margin-bottom: 12px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-eyebrow {
        color: var(--text-secondary);
      }

      /* Summary points — compact text rows: a tone-coloured bold label followed
         by the copy, no icon and no dividers. */
      #screen-cpi-obs .dg-points {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #screen-cpi-obs .dg-point {
        --tone: #246bfd;
        font-size: 12px;
        line-height: 1.55;
        color: #536277;
      }
      #screen-cpi-obs .dg-point--critical {
        --tone: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-point--good {
        --tone: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-point--info {
        --tone: var(--text-primary, #0f172a);
      }
      #screen-cpi-obs .dg-point-tx b {
        color: var(--tone);
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-point {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-point-tx b {
        color: var(--text-primary);
      }
      #screen-cpi-obs .dg-panel,
      #screen-cpi-obs .dg-section {
        background:
          linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 28px;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
        padding: 24px 28px 28px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel,
      html[data-theme="dark"] #screen-cpi-obs .dg-section {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
      }
      #screen-cpi-obs .dg-panel-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #screen-cpi-obs .dg-panel-hdr .dg-lead {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      #screen-cpi-obs .dg-panel--warn .dg-lead {
        color: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-panel--ok .dg-lead {
        color: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-panel-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .dg-panel-sub {
        font-size: 12.5px;
        color: var(--text2);
        margin: 4px 0 16px 31px;
      }

      /* ── Insight / status callout — neutral obs-card surface, tone only on the
         icon chip so it reads as advisory, not alarming. ── */
      #screen-cpi-obs .dg-insight {
        position: relative;
        display: flex;
        gap: 11px;
        align-items: flex-start;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--text2);
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--border, #eaecf0);
        box-shadow: 0 24px 30px 0 rgba(42, 61, 76, 0.03);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-insight {
        background: color-mix(in srgb, var(--accent) 6%, transparent);
        border-color: var(--border);
        color: var(--text-secondary);
      }
      #screen-cpi-obs .dg-insight-ic {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 16px;
        margin-top: 1px;
        color: var(--accent);
        background: var(--accent-light);
      }
      #screen-cpi-obs .dg-insight--warn .dg-insight-ic {
        color: var(--up, #e5484d);
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
      }
      #screen-cpi-obs .dg-insight--ok .dg-insight-ic {
        color: var(--down, #0c9b70);
        background: color-mix(in srgb, var(--down, #0c9b70) 10%, white);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-insight--warn .dg-insight-ic {
        background: color-mix(in srgb, var(--up, #e5484d) 20%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-insight--ok .dg-insight-ic {
        background: color-mix(in srgb, var(--down, #0c9b70) 20%, transparent);
      }
      #screen-cpi-obs .dg-insight b {
        color: var(--text);
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-insight b {
        color: var(--text-primary);
      }

      /* ── Category card grid — all cards visible; column count follows panel. ── */
      #screen-cpi-obs .dg-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        min-width: 0;
        @media (max-width: 1580px) {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 1024px) {
        #screen-cpi-obs .dg-panel--warn .dg-cards {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        #screen-cpi-obs .dg-panel--ok .dg-cards {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @media (max-width: 760px) {
        #screen-cpi-obs .dg-panel--warn .dg-cards,
        #screen-cpi-obs .dg-panel--ok .dg-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* ── Category card — quick-view layout; tone on values + risk pill only. ── */
      #screen-cpi-obs .dg-panel--warn {
        --dg-card-tone: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-panel--ok {
        --dg-card-tone: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-card {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
        border-radius: 16px;
        padding: 11px;
        background: linear-gradient(150deg, #fff 0%, #fff 66%, #f8fafc 100%);
        box-shadow: 0 5px 15px rgba(25, 48, 75, 0.03), inset 0 1px #fff;
        transform-style: preserve-3d;
        cursor: pointer;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-card {
        background: linear-gradient(150deg, var(--surface, #141a26) 0%, var(--surface, #141a26) 66%, rgba(255, 255, 255, 0.02) 100%);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18), inset 0 1px rgba(255, 255, 255, 0.04);
      }
      #screen-cpi-obs .dg-card::before {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        right: -48px;
        top: -50px;
        background: var(--dg-card-tone);
        opacity: 0.055;
        transition: transform 0.25s ease, opacity 0.25s ease;
        pointer-events: none;
      }
      #screen-cpi-obs .obs-card.dg-card:hover {
        transform: translateY(-4px) rotateX(1deg);
        border-color: #c7d2e1;
        box-shadow: 0 18px 34px rgba(32, 56, 84, 0.09);
      }
      #screen-cpi-obs .obs-card.dg-card:hover::before {
        transform: scale(1.35);
        opacity: 0.09;
      }
      html[data-theme="dark"] #screen-cpi-obs .obs-card.dg-card:hover {
        border-color: var(--border);
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      }
      @keyframes dg-card-reveal {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #screen-cpi-obs .dg-card {
          animation: none !important;
        }
      }
      #screen-cpi-obs .dg-cardhead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      #screen-cpi-obs .dg-card-ic {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 15px;
        color: #405775;
        background: linear-gradient(145deg, #f8fafc, #edf2f7);
        box-shadow: inset 0 0 0 1px #e8edf3;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-card-ic {
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--text-secondary);
      }
      #screen-cpi-obs .dg-card-id-text {
        flex: 1;
        min-width: 0;
      }
      #screen-cpi-obs .dg-card-name {
        font-size: 11.2px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #screen-cpi-obs .dg-card-tag {
        font-size: 8.5px;
        color: var(--text2);
        margin-top: 1px;
      }
      #screen-cpi-obs .dg-pill {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 100px;
      }
      #screen-cpi-obs .dg-pill i {
        font-size: 11px;
      }
      #screen-cpi-obs .dg-pill--critical {
        color: #b4232d;
        background: #ffe7e9;
        box-shadow: inset 0 0 0 1px #f6c9cd;
      }
      #screen-cpi-obs .dg-pill--moderate {
        color: #9a5b00;
        background: #fff3d6;
        box-shadow: inset 0 0 0 1px #f0dbad;
      }
      #screen-cpi-obs .dg-pill--watch {
        color: #185aa9;
        background: #e7f1ff;
        box-shadow: inset 0 0 0 1px #cbdff8;
      }
      #screen-cpi-obs .dg-pill--stable {
        color: #087b4b;
        background: #e6f8ef;
        box-shadow: inset 0 0 0 1px #c8ead9;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-pill--critical {
        background: color-mix(in srgb, #e5484d 22%, transparent);
        color: #ff8a8a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #e5484d 35%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-pill--moderate {
        background: color-mix(in srgb, #f5a623 20%, transparent);
        color: #f0b25a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #f5a623 30%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-pill--watch {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: #7eb8ff;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-pill--stable {
        background: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
        color: #34c99a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--down, #0c9b70) 32%, transparent);
      }
      #screen-cpi-obs .dg-pill--accel {
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
        color: var(--up, #e5484d);
        align-self: center;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-pill--accel {
        background: color-mix(in srgb, var(--up, #e5484d) 22%, transparent);
        color: #ff6b6b;
      }
      #screen-cpi-obs .dg-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px 9px;
        margin: 9px -1px 0;
        padding: 9px 9px 7px;
        border-radius: 10px;
        background: rgba(248, 250, 252, 0.67);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-stats {
        background: rgba(255, 255, 255, 0.04);
      }
      #screen-cpi-obs .dg-stat-k {
        display: block;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8996a9;
        margin-bottom: 0;
      }
      #screen-cpi-obs .dg-stat-v {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
      }
      #screen-cpi-obs .dg-stat-v.up {
        color: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-stat-v.down {
        color: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-card-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 7px;
        padding-top: 2px;
      }

      /* ── Analytics section header + table ── */
      #screen-cpi-obs .dg-analytics-hdr {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
