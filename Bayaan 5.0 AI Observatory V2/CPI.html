      /* ── Observatory content builders (shared with the main app) ── */
      function buildObsSectionHdr(title, icon, action) {
        const actionHtml = action
          ? `<span class="obs-section-action">${action} <i class="ti ti-arrow-right"></i></span>`
          : "";
        return `<div class="section-hdr">
  <h2 class="cpi-section-title"><i class="ti ${icon || "ti-circle"}" aria-hidden="true"></i>${title}</h2>
  ${actionHtml}
</div>`;
      }

      /* Sparklines follow the home page card chart (renderBriefKpi in
         index.html): a tinted area path under a round-joined line, drawn in an
         84×30 box with the baseline at y=27. Point data stays in its original
         100×32 space and is rescaled here, so the data arrays are untouched. */
      const OBS_SPARK_COLOR = {
        "sp-up": "#e5484d",
        "sp-down": "#0c9b70",
        "sp-neutral": "#246bfd",
        "sp-flat": "#8b93a7",
      };

      /* Unique gradient id per sparkline so each SVG's fill fade is isolated. */
      let obsSparkId = 0;

      function buildObsSparkline(points, cls) {
        const color = OBS_SPARK_COLOR[cls] || OBS_SPARK_COLOR["sp-flat"];
        const pts = points
          .trim()
          .split(/\s+/)
          .map((pair) => {
            const [x, y] = pair.split(",").map(Number);
            /* x → [1,83], y → [0,27] so the curve never dips below baseline */
            return [1 + (x / 100) * 82, (y / 32) * 27];
          });
        if (!pts.length) return "";

        const fmt = (n) => Math.round(n * 100) / 100;

        /* Smooth line via Catmull-Rom → cubic bézier, matching the smooth
           gradient sparklines used by the Indicators screen on the home page
           (indBuildSparkline / Chart.js tension: 0.4). */
        let line = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
        if (pts.length < 3) {
          line = `M${pts.map(([x, y]) => `${fmt(x)} ${fmt(y)}`).join(" L")}`;
        } else {
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i];
            const p1 = pts[i];
            const p2 = pts[i + 1];
            const p3 = pts[i + 2] || p2;
            const c1x = p1[0] + (p2[0] - p0[0]) / 6;
            const c1y = p1[1] + (p2[1] - p0[1]) / 6;
            const c2x = p2[0] - (p3[0] - p1[0]) / 6;
            const c2y = p2[1] - (p3[1] - p1[1]) / 6;
            line += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${fmt(p2[0])} ${fmt(p2[1])}`;
          }
        }

        const first = pts[0];
        const last = pts[pts.length - 1];
        const area = `${line} L${fmt(last[0])} 27 L${fmt(first[0])} 27 Z`;
        const gid = "obsSparkGrad" + obsSparkId++;

        /* preserveAspectRatio="none" lets the chart fill the full card width;
           non-scaling-stroke keeps the line an even weight despite the stretch.
           The area is a top-down gradient fade, same as the Indicators charts. */
        return `<svg viewBox="0 0 84 30" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <path class="obs-spark-area" fill="url(#${gid})" d="${area}"/>
  <path class="obs-spark-line" stroke="${color}" vector-effect="non-scaling-stroke" d="${line}"/>
</svg>`;
      }

      /* ── Year-over-year comparison charts ──
         Same multi-line, legended chart the home page's GCC comparison uses,
         but the series are the five most recent years rather than six GCC
         economies. Sequential blue scale: older years muted, the latest year
         emphasised (heavier stroke, on top). */
      const OBS_YEARS = [
        { year: "2022", color: "#c3d3ec" },
        { year: "2023", color: "#93b4e8" },
        { year: "2024", color: "#5b8bd9" },
        { year: "2025", color: "#2f66cf" },
        { year: "2026", color: "#1a3f86" },
      ];

      /* Catmull-Rom → cubic bézier, shared with buildObsSparkline's smoothing. */
      function obsSmoothPath(pts, fmt) {
        if (pts.length < 3) {
          return `M${pts.map(([x, y]) => `${fmt(x)} ${fmt(y)}`).join(" L")}`;
        }
        let d = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${fmt(p2[0])} ${fmt(p2[1])}`;
        }
        return d;
      }

      /* Derives five year-lines from one base spark: each year is the base
         trend shifted vertically (older years sit lower), with a little shape
         variation so the lines read as distinct traces. */
      /* One trend line spanning the five years (2022→2026), drawn in the app's
         Indicators sparkline style — a tinted blue area fade under a rounded
         line (buildObsSparkline). The years are read off the x-axis. */
      function buildObsYearChart(points) {
        return buildObsSparkline(points, "sp-neutral");
      }

      /* Five evenly-spaced year ticks under the chart (replaces the old colour
         legend). */
      function buildObsYearAxis() {
        return `<div class="obs-year-axis" aria-hidden="true">${OBS_YEARS.map(
          (yr) => `<span>${yr.year}</span>`
        ).join("")}</div>`;
      }

      function buildObsMultiSeriesChart(series) {
        const fmt = (n) => Math.round(n * 100) / 100;
        const W = 240;
        const H = 40;
        const pad = 4;
        const plotW = W - pad * 2;
        const plotH = H - pad * 2;
        const plotBottom = pad + plotH;

        const allVals = series.flatMap((s) => s.points);
        const rawMin = Math.min(...allVals);
        const rawMax = Math.max(...allVals);
        const yMin = Math.floor(rawMin) - 0.2;
        const yMax = Math.ceil(rawMax) + 0.2;
        const ySpan = yMax - yMin || 1;

        const toX = (i, count) => pad + (i / (count - 1)) * plotW;
        const toY = (v) => pad + plotH - ((v - yMin) / ySpan) * plotH;

        const yTickCount = 4;
        let gridHtml = "";
        for (let i = 0; i <= yTickCount; i++) {
          const val = yMin + (i / yTickCount) * ySpan;
          const y = toY(val);
          gridHtml += `<line class="cpi-chart-grid" x1="${pad}" y1="${fmt(y)}" x2="${W - pad}" y2="${fmt(y)}" stroke-width="0.75" stroke-dasharray="2 3"/>`;
        }

        const pointCount = series[0].points.length;
        for (let i = 0; i < pointCount; i++) {
          const x = toX(i, pointCount);
          gridHtml += `<line class="cpi-chart-grid" x1="${fmt(x)}" y1="${pad}" x2="${fmt(x)}" y2="${plotBottom}" stroke-width="0.75" stroke-dasharray="2 3"/>`;
        }

        const pathsHtml = series
          .map((s) => {
            const pts = s.points.map((v, i) => [toX(i, s.points.length), toY(v)]);
            const line = obsSmoothPath(pts, fmt);
            const dashAttr = s.dash ? ' stroke-dasharray="4 3"' : "";
            return `<path class="obs-spark-line" fill="none" stroke="${s.color}" stroke-width="1.75"${dashAttr} vector-effect="non-scaling-stroke" d="${line}"/>`;
          })
          .join("\n  ");

        const ariaLabel = series.map((s) => `${s.label} ${s.value}`).join(", ");

        return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${ariaLabel} line chart">
  ${gridHtml}
  ${pathsHtml}
</svg>`;
      }

      function buildObsChartLegend(series) {
        return `<div class="obs-chart-legend">${series
          .map(
            (s) => `<div class="obs-chart-legend-item">
      <span class="obs-chart-legend-line${s.dash ? " obs-chart-legend-line--dashed" : ""}" style="--legend-color:${s.color}"></span>
      <span>${s.label}</span>
    </div>`
          )
          .join("")}</div>`;
      }

      function buildObsDriverCard(d) {
        return `<div class="obs-card driver-card">
  <div class="dc-head">
    <div class="dc-icon-wrap"><i class="ti ${d.icon}"></i></div>
    <div class="dc-title-col">
      <div class="dc-title">${d.title}</div>
      ${d.sub ? `<div class="dc-subtitle">${d.sub}</div>` : ""}
    </div>
    <div class="dc-date">${d.date}</div>
  </div>
  <div class="dc-value">${d.value}${d.unit ? `<small>${d.unit}</small>` : ""}</div>
  <div class="dc-changes">${d.changes}</div>
  <div class="dc-spark">${buildObsYearChart(d.spark)}</div>
  ${buildObsYearAxis()}
</div>`;
      }

        const cpiCard = `<div class="obs-card kpi-card kpi-card--cpi">

        root.innerHTML = `

      /* ============================================================
         AUDIO BRIEF — the home page's Daily Brief listen control, ported
         under the CPI hero. Narrates the hero headline + summary via the
         Web Speech API. Mirrors initDailyBriefSpeech() in index.html:
         idle → speaking → paused, with restart + stop affordances. */
      function initCpiBriefSpeech() {
        const button = document.getElementById("cpiBriefListen");
        const controls = document.getElementById("cpiBriefSpeech");
        const restartButton = document.getElementById("cpiBriefRestart");
        const stopButton = document.getElementById("cpiBriefStop");
        const status = document.getElementById("cpiBriefSpeechStatus");
        if (!button || !controls) return;

        const label = button.querySelector(".brief-listen__text");
        if (!("speechSynthesis" in window)) {
          controls.hidden = true;
          return;
        }
        const synth = window.speechSynthesis;
        let utterance = null;
        let state = "idle";

        const setState = (next) => {
          state = next;
          button.dataset.state = next;
          controls.classList.toggle("is-active", next !== "idle");
          button.setAttribute("aria-pressed", String(next === "speaking"));
          button.setAttribute(
            "aria-label",
            next === "speaking"
              ? "Pause brief"
              : next === "paused"
                ? "Resume brief"
                : "Listen to the CPI brief"
          );
          if (label) {
            label.textContent =
              next === "speaking" ? "Pause" : next === "paused" ? "Resume" : "Audio brief";
          }
          if (status) {
            status.textContent =
              next === "speaking"
                ? "CPI brief is playing"
                : next === "paused"
                  ? "CPI brief paused"
                  : "CPI brief stopped";
          }
        };

        const getBriefText = () => {
          const hero = button.closest(".cpi-hero");
          const title = (hero.querySelector(".cpi-hero-title") || {}).textContent || "";
          const sub = (hero.querySelector(".cpi-hero-sub") || {}).textContent || "";
          return `${title.trim()}. ${sub.trim()}`;
        };

        const start = () => {
          synth.cancel();
          utterance = new SpeechSynthesisUtterance(getBriefText());
          utterance.lang = "en-GB";
          utterance.rate = 0.94;
          utterance.pitch = 1;
          utterance.onstart = () => setState("speaking");
          utterance.onend = () => setState("idle");
          utterance.onerror = (event) => {
            if (event.error !== "canceled" && event.error !== "interrupted" && status) {
              status.textContent = "Unable to play the CPI brief";
            }
            setState("idle");
          };
          synth.speak(utterance);
        };

        button.addEventListener("click", () => {
          if (state === "speaking") {
            synth.pause();
            setState("paused");
          } else if (state === "paused") {
            synth.resume();
            setState("speaking");
          } else {
            start();
          }
        });

        if (restartButton) restartButton.addEventListener("click", start);
        if (stopButton) {
          stopButton.addEventListener("click", () => {
            synth.cancel();
            setState("idle");
          });
        }
        window.addEventListener("beforeunload", () => synth.cancel());
      }

      function dgTone(v) {
        const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
        if (isNaN(n) || n === 0) return "flat";
        return n > 0 ? "up" : "down";

      /* Percent classes for card stats (colour only). */

        const cls = colour ? " " + dgTone(v) : "";

      }

  <div class="dg-cardhead">
    <div class="dg-card-ic"><i class="ti ${c.icon}"></i></div>

      <div class="dg-card-tag">${c.trend}</div>
    </div>
  </div>
  <div class="dg-stats">
    ${dgStat("Index", c.index)}${dgStat("Weight", c.weight)}
    ${dgStat("YoY", c.yoy, true)}${dgStat("MoM", c.mom, true)}
  </div>
  <div class="dg-card-foot">
    <span class="dg-pill ${badgeCls}">${badgeLabel}</span>
    ${accelHtml}
  </div>
</article>`;
