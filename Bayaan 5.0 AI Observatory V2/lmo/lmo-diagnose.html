<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labour Market Observatory — Diagnose · Bayaan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/pages/lmo-common.css">
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../css/theme.css" />
<script>
  (function () {
    var t = localStorage.getItem("bayaan-theme") || "light";
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<script src="../js/theme.js"></script>
<script src="../js/header.js"></script>
<script src="../js/lmo-chrome.js"></script>
<link rel="stylesheet" href="../css/pages/lmo-diagnose.css">
<link rel="stylesheet" href="../css/pages/lmo-lsd.css">
<script src="lmo-sidenav.js"></script>
<script src="lmo-shared.js"></script>
<script src="lmo-lsd.js"></script>
</head>
<body class="lmo lmo--diagnose" data-lmo-active="diagnose" data-lmo-ai-onclick="openChat('Summarise the strongest labour market signals across every theme and flag what needs watching','Diagnose Overview')">

<div id="screen-lmo-obs" class="ws-screen header-flush">
<div data-bayaan-header></div>

<div id="lmo-sidenav-mount"></div>

<div class="app-shell">
<div class="wrap">
<div class="page">

  <nav class="ind-page-breadcrumb" aria-label="Breadcrumb">
    <a href="#" data-lmo-bc="home">Home</a>
    <span class="ind-bc-sep">›</span>
    <a href="#" data-lmo-bc="observatory">Observatory</a>
    <span class="ind-bc-sep">›</span>
    <span class="ind-bc-current">Labour Market Observatory</span>
  </nav>

  <div class="ph">
    <div class="ph-l">
      <h1 class="ph-title">Diagnose</h1>
      <div class="ph-meta">Labor supply–demand gap analysis · Abu Dhabi · Sep 2025</div>
    </div>
    <div class="ph-r">
      <button class="btn btn-ghost" type="button"><i class="ti ti-download" aria-hidden="true"></i> Export</button>
    </div>
  </div>

  <div id="lmo-diagnose-content"></div>

</div>
</div>

<aside class="cpanel ai-panel" id="cpanel" role="complementary" aria-label="Bayaan AI Panel">
  <div class="bai-header">
    <div class="bai-header-left">
      <img class="bai-icon-wrap" src="../assets/ai-chat-thumb.svg" alt="Bayaan AI" width="38" height="38">
      <div><div class="bai-header-title">Bayaan AI</div></div>
    </div>
    <div class="bai-header-right">
      <button class="bai-close-btn" type="button" onclick="closeChat()" title="Close AI Panel"><i class="ti ti-x"></i></button>
    </div>
  </div>
  <div class="bai-context-strip">
    <span class="bai-ctx-label">Analysing</span>
    <span class="bai-ctx-pill" id="ctx-val">Diagnose</span>
    <span class="bai-ctx-dot"></span>
    <span class="bai-ctx-dot-label">Generating</span>
  </div>
  <div class="bai-messages msgs" id="msgs"></div>
  <div class="suggs" id="suggs"></div>
  <div class="bai-input-area">
    <div class="bai-input-row">
      <textarea class="bai-input" id="cin" placeholder="Ask about labour supply–demand gaps…" rows="2" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendC()}"></textarea>
      <button class="bai-send-btn" type="button" onclick="sendC()" title="Send"><i class="ti ti-send"></i></button>
    </div>
  </div>
</aside>
</div>
</div>

<script>
function openChat(ctx, title) {
  if (document.body.classList.contains("embed") && window.parent !== window) {
    window.parent.postMessage({ type: "lmo-chat", ctx, title: title || "Diagnose" }, "*");
    return;
  }
  document.getElementById("ctx-val").textContent = title || "Diagnose";
  document.getElementById("msgs").innerHTML = "";
  addMsg(
    "ai",
    "Diagnostic read on <strong>" +
      (title || "Labor Supply–Demand Analysis") +
      "</strong>: " +
      ctx +
      " In production this connects to Bayaan AI with live LFS and administrative data."
  );
  document.getElementById("suggs").innerHTML = [
    "Which age bands show the largest gap?",
    "How does Emirati supply compare to demand?",
    "Compare to GCC peers",
    "What should policymakers do?",
  ]
    .map((s) => `<button type="button" class="sugg" onclick="sendCT('${s}')">${s}</button>`)
    .join("");
  document.getElementById("cpanel").classList.add("open");
}

function closeChat() {
  document.getElementById("cpanel").classList.remove("open");
}

function addMsg(role, text) {
  const ms = document.getElementById("msgs");
  const d = document.createElement("div");
  d.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble " + role;
  b.innerHTML = text;
  d.appendChild(b);
  ms.appendChild(d);
  ms.scrollTop = ms.scrollHeight;
}

function sendC() {
  const inp = document.getElementById("cin");
  const t = inp.value.trim();
  if (!t) return;
  sendCT(t);
  inp.value = "";
}

function sendCT(text) {
  addMsg("user", text);
  setTimeout(
    () =>
      addMsg(
        "ai",
        "Analysis for your query is being prepared. In production this connects to Bayaan AI with live LFS and administrative data."
      ),
    700
  );
}

window.addEventListener("load", () => {
  const root = document.getElementById("lmo-diagnose-content");
  root.innerHTML = LMO_LSD.render();
  LMO_LSD.init(root);
  LMO.initLmoEmbed();
  setTimeout(LMO.reportEmbedHeight, 500);
});

window.addEventListener("resize", () => setTimeout(LMO.reportEmbedHeight, 200));
</script>
</body>
</html>
