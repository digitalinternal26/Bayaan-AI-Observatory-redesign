<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crisis Intelligence — Observatory · Bayaan</title>
    <link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <!-- Shared design system (same order as the main application) -->
    <link rel="stylesheet" href="css/pages/ai.css" />
    <link rel="stylesheet" href="css/pages/cpi-obs.css" />
    <link rel="stylesheet" href="css/pages/obs-sidebar.css" />
    <link rel="stylesheet" href="css/pages/exec-home.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/pages/home-widgets.css" />
    <link rel="stylesheet" href="css/components/bayaan-footer.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script>
      (function () {
        var t = localStorage.getItem("bayaan-theme") || "light";
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" ? "dark" : "light"
        );
      })();
    </script>
    <script src="js/theme.js"></script>
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/section-scroll-spy.js"></script>
    <style>
      /* ====================================================================
         CRISIS INTELLIGENCE OBSERVATORY (standalone)

         Built on #screen-crisis-obs, which already carries a full component
         set for this screen id in style.css (~9717-10735) and its dark-theme
         counterpart in css/theme.css (203-227, 2878-2964) — the severity
         palette, gauges, severity columns, indicator table and pagination all
         come from there for free.

         The shell below is the standard observatory prelude shared verbatim by
         CPI.html / observe.html / benchmark.html / forecast.html / trade.html,
         re-scoped from #screen-cpi-obs. Components are re-scoped copies of the
         real cpi-obs.css specs, kept under their original class names so a
         future extraction to a shared stylesheet is a merge, not a rename.
         No shared .css file is modified by this page.
         ==================================================================== */

      /* ── Token alignment ──
         style.css:9718 gives #screen-crisis-obs a slightly different palette
         from cpi-obs.css:2's #screen-cpi-obs (--text/--text2/--muted/--bg all
         differ, --page-gutter is undefined, and the semantic up/down pair is
         named --red/--green here). Re-point them at the CPI values so body
         copy, captions, the page plate and the breadcrumb's column alignment
         match the sibling pages. Dark mode is untouched: theme.css:203 is
         [data-theme="dark"] #screen-crisis-obs and outranks this block. */
      #screen-crisis-obs {
        --text: #0f172a;
        --text2: #475569;
        --muted: #94a3b8;
        --bg: #f8fafc;
        --page-gutter: clamp(16px, 2vw, 32px);
        /* cpi-obs.css components reference --up/--down; crisis names them --red/--green. */
        --up: var(--red);
        --down: var(--green);
        /* --navy (#0d1b3e) is declared for this screen id in style.css:9721 and
           painted by eight live rules, but CPI declares the same token and never
           uses it — every CPI ink role resolves to --text. Re-pointing it here
           fixes all eight at once instead of overriding them one by one. */
        --navy: var(--text);
      }

      /* CPI declares --figma-subcard-* but never applies them: its .obs-card
         stays opaque white with a tight 1px/6px shadow. The translucent 60%
         fill + 30px-blur treatment that benchmark.html uses is deliberately NOT
         part of the CPI card, so it is not redeclared here. */

      /* Pre-existing: the light border shorthand in cpi-obs.css outranks the
         dark `border-color` in theme.css, leaving pale edges on dark cards. */
      html[data-theme="dark"] #screen-crisis-obs .obs-card {
        border-color: var(--border);
      }

      /* No rule under the page title — zero width rather than a colour
         override, so the dark-theme border-bottom-color can't bring it back. */
      #screen-crisis-obs .cpi-page-header-inner {
        border-bottom: 0;
        padding-bottom: 0;
      }
      #screen-crisis-obs .topic-title {
        line-height: 1.2;
      }

      /* Breadcrumb sits outside .page-wrap, so it clears neither the 120px rail
         nor the page gutter. Realign it with the content column. */
      #screen-crisis-obs .crisis-scroll > .container {
        --obs-rail-w: 120px;
        padding-inline: calc(var(--obs-rail-w) + var(--page-gutter))
          var(--page-gutter);
      }

      /* .crisis-scroll is the scroll container on this shell; style.css:9896
         sets #screen-crisis-obs .main { overflow-y: auto } for the old
         single-view screen, which would nest a second scrollbar here. */
      #screen-crisis-obs .main {
        overflow: visible;
        /* style.css:10534 pads .main 24px inline; drop it so the header and
           every view pane share the breadcrumb's column (120px rail + gutter,
           see .crisis-scroll > .container below) instead of sitting 24px in. */
        padding-inline: 0;
      }

      /* style.css:10534 styles a bare `footer` element under this screen id
         (specificity 1,0,1) — it outranks the shared footer component's own
         class rule (.bayaan-products-footer, 0,1,0) regardless of stylesheet
         order, which would paint the shared footer navy-on-navy in light mode. */
      #screen-crisis-obs footer.bayaan-products-footer {
        background: var(--bpf-bg);
        color: var(--bpf-text);
        padding: 0;
        margin: 0;
        border: none;
      }

      /* Sidebar on brand primary (--accent / #0066FF), mirroring #screen-topic
         in css/pages/obs-sidebar.css. obs-sidebar.css:239-270 grants this to
         #screen-cpi-obs but deliberately excludes #screen-crisis-obs, which
         falls back to the legacy navy fills — hence this block. */
      html:not([data-theme="dark"]) #screen-crisis-obs .sidebar-icon {
        background: #ebf3ff;
        color: var(--accent);
      }
      html:not([data-theme="dark"])
        #screen-crisis-obs
        .sidebar-item:hover:not(.active):not(.sidebar-item--ai)
        .sidebar-icon {
        background: #dbe9ff;
      }
      html:not([data-theme="dark"])
        #screen-crisis-obs
        .sidebar-item.active:not(.sidebar-item--ai)
        .sidebar-icon {
        background: var(--accent);
        color: #fff;
      }
      /* AI entry point on the app's AI gradient — same fill as .ai-mode-btn. */
      html #screen-crisis-obs .sidebar .sidebar-item--ai .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition: transform 0.15s, box-shadow 0.2s;
      }
      html #screen-crisis-obs .sidebar .sidebar-item--ai:hover .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        transform: scale(1.04);
      }
      /* Compact floating sidebar — fits all items below the top nav. */
      #screen-crisis-obs .sidebar {
        top: calc(50% + 34px);
        padding: 14px 10px;
        gap: 9px;
      }
      #screen-crisis-obs .sidebar-item {
        padding: 4px 0;
        gap: 5px;
        font-size: 10.5px;
      }
      /* Sidebar items that navigate are anchors — strip the link underline so
         they render identically to the button items. */
      #screen-crisis-obs a.sidebar-item {
        text-decoration: none;
      }
      #screen-crisis-obs .sidebar-icon {
        width: 38px;
        height: 38px;
      }
      #screen-crisis-obs .sidebar-icon i {
        font-size: 17px;
      }

      /* === Standard expanding icon rail (shared across observatory views) ===
         Icons only by default; hovering the pill reveals every label at once,
         to the right of its icon. CIO AI sits on top, split from the view
         switcher by a divider that grows with the rail. */
      #screen-crisis-obs .sidebar {
        max-width: none;
        border-radius: 999px;
        align-items: stretch;
        padding: 8px 10px;
        transition: none;
      }
      #screen-crisis-obs .sidebar:hover {
        border-radius: 28px;
      }
      #screen-crisis-obs .sidebar-item {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 4px 4px;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-item {
        justify-content: flex-start;
        gap: 10px;
      }
      #screen-crisis-obs .sidebar-label {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        transition: max-width 0.22s ease, opacity 0.18s ease;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-label {
        max-width: 120px;
        opacity: 1;
      }
      #screen-crisis-obs .sidebar-item.active:not(.sidebar-item--ai) .sidebar-label {
        color: #272829;
      }
      html[data-theme="dark"] #screen-crisis-obs .sidebar-label {
        color: #cdd6e0;
      }
      #screen-crisis-obs .sidebar-item--ai .sidebar-label {
        color: #0066ff;
      }
      #screen-crisis-obs .sidebar-divider {
        width: 16px;
        height: 2px;
        border-radius: 999px;
        background: #e2e8f0;
        margin: 1px 0 1px 15px;
        align-self: flex-start;
        transition: width 0.22s ease, margin-left 0.22s ease;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-divider {
        width: calc(100% - 12px);
        margin-left: 6px;
      }
      html[data-theme="dark"] #screen-crisis-obs .sidebar-divider {
        background: #3a4453;
      }

      /* ── Page header band (cpi-obs.css:54-61, #screen-cpi-obs-scoped) ── */
      #screen-crisis-obs .cpi-page-header {
        padding: 24px var(--page-gutter) 0;
        /* 32px between the title band (title + subtitle + header actions) and
           the view content below it — applies to every crisis-observatory view. */
        margin-bottom: 32px;
      }
      #screen-crisis-obs .cpi-page-header-inner {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      #screen-crisis-obs .cpi-hdr-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      @media (max-width: 640px) {
        #screen-crisis-obs .cpi-page-header-inner {
          flex-direction: column;
        }
      }

      /* ── View panes + section modules ──
         Each pane's content is grouped into home-page-style gradient module
         cards, exactly as CPI.html:46-62 does for #cpi-obs-content > section. */
      #screen-crisis-obs .cio-pane {
        padding: 0 var(--page-gutter) 8px;
      }
      #screen-crisis-obs .cio-pane[hidden] {
        display: none;
      }
      #screen-crisis-obs .cio-pane > section {
        background:
          radial-gradient(ellipse 90% 70% at 0% 0%, rgba(219, 234, 254, 0.55) 0%, transparent 52%),
          linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.05),
          0 10px 28px rgba(42, 61, 76, 0.07);
        padding: 24px 28px 28px;
        margin-bottom: 24px;
      }
      html[data-theme="dark"] #screen-crisis-obs .cio-pane > section {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }
      /* Toolbars and notices sit on the plate, not inside a module. */
      #screen-crisis-obs .cio-pane > .bm-toolbar,
      #screen-crisis-obs .cio-pane > .bm-filter-row,
      #screen-crisis-obs .cio-pane > .cpi-notice {
        margin-bottom: 20px;
      }

      /* Section headings styled like the home page module titles: bold black
         title + prominent accent icon (replaces the section pip).
         Mirrors .screen-home .home-module-title / .home-module-title-icon. */
      #screen-crisis-obs .section-hdr {
        margin-bottom: 20px;
      }
      #screen-crisis-obs .section-hdr h2.cpi-section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        color: #000;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      #screen-crisis-obs .section-hdr h2.cpi-section-title i {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .section-hdr h2.cpi-section-title {
        color: var(--text);
      }
      #screen-crisis-obs .obs-section-action {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }

      /* ── Cards (cpi-obs.css:395-407 + CPI.html:649-655, 1015-1019) ── */
      #screen-crisis-obs .obs-card {
        background: var(--white, #fff);
        border: 1px solid #eaecf0;
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        transition: box-shadow 0.22s ease, border-color 0.22s ease,
          transform 0.22s ease, background 0.22s ease;
      }
      /* CPI cards deliberately do not react on hover. */
      #screen-crisis-obs .obs-card:not(.impacts-list):hover {
        border: 1px solid #eaecf0;
        box-shadow: none;
        transform: none;
      }

      /* Two domain tags the shared component doesn't define (style.css:10196
         ships financial/economic/energy/tourism/infrastructure/trade/
         consumption — no environment or social). Same recipe, new hues. */
      #screen-crisis-obs .tag-environment {
        background: #ecfdf5;
        color: #047857;
      }
      #screen-crisis-obs .tag-social {
        background: #fdf2f8;
        color: #a21caf;
      }
      html[data-theme="dark"] #screen-crisis-obs .tag-environment,
      html[data-theme="dark"] #screen-crisis-obs .tag-social {
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      /* ── Driver / indicator cards (cpi-obs.css:571-700, re-scoped) ──
         Backs Overview's economic drivers, Observe's indicator grid and
         Interpret's top movers. */
      #screen-crisis-obs .driver-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      #screen-crisis-obs .mover-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      #screen-crisis-obs .driver-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #screen-crisis-obs .dc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #screen-crisis-obs .dc-icon-wrap {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        flex-shrink: 0;
      }
      html[data-theme="dark"] #screen-crisis-obs .dc-icon-wrap {
        background: var(--surface);
      }
      #screen-crisis-obs .dc-icon-wrap i {
        font-size: 14px;
        color: var(--text2);
      }
      #screen-crisis-obs .dc-title-col {
        flex: 1;
        min-width: 0;
      }
      #screen-crisis-obs .dc-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
      }
      #screen-crisis-obs .dc-chips {
        display: flex;
        gap: 5px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      #screen-crisis-obs .dc-date {
        font-size: 9.5px;
        font-weight: 700;
        color: var(--accent);
        text-align: right;
        line-height: 1.25;
        background: var(--accent-light);
        border: 1px solid #bfdbfe;
        padding: 3px 6px;
        border-radius: 5px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      html[data-theme="dark"] #screen-crisis-obs .dc-date {
        border-color: rgba(59, 130, 246, 0.28);
      }
      #screen-crisis-obs .dc-value {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }
      #screen-crisis-obs .dc-value small {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }
      #screen-crisis-obs .dc-changes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
      }
      #screen-crisis-obs .dc-changes .up {
        color: var(--up);
      }
      #screen-crisis-obs .dc-changes .down {
        color: var(--down);
      }
      #screen-crisis-obs .dc-freq {
        font-size: 10.5px;
        color: var(--muted);
        font-weight: 500;
      }
      #screen-crisis-obs .dc-spark {
        height: 26px;
      }
      #screen-crisis-obs .dc-spark svg {
        width: 100%;
        height: 100%;
      }
      #screen-crisis-obs .obs-spark-area {
        opacity: 1;
      }
      #screen-crisis-obs .obs-spark-line {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #screen-crisis-obs .obs-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #9aa7b8;
      }
      html[data-theme="dark"] #screen-crisis-obs .obs-axis {
        color: var(--text-tertiary);
      }
      #screen-crisis-obs .dc-note {
        font-size: 10.5px;
        color: var(--muted);
      }

      /* ── Notice banner (cpi-obs.css:141-171, re-scoped) ── */
      #screen-crisis-obs .cpi-notice {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--amber-bg);
        border: 1px solid var(--amber-border);
        border-radius: 8px;
        font-size: 12.5px;
        color: #854f0b;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-notice {
        color: #fbbf24;
      }
      #screen-crisis-obs .cpi-notice i {
        font-size: 15px;
        flex-shrink: 0;
      }
      #screen-crisis-obs .cpi-notice-text {
        flex: 1;
      }

      /* ── Buttons (cpi-obs.css:100-139, re-scoped) ── */
      #screen-crisis-obs .cpi-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        font-family: inherit;
        white-space: nowrap;
        transition: all 0.15s;
      }
      #screen-crisis-obs .cpi-btn i {
        font-size: 15px;
      }
      #screen-crisis-obs .cpi-btn--primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      #screen-crisis-obs .cpi-btn--primary:hover {
        background: #0052cc;
      }
      #screen-crisis-obs .cpi-btn--secondary {
        background: var(--white, #fff);
        color: var(--text);
        border-color: var(--border);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      #screen-crisis-obs .cpi-btn--secondary:hover {
        background: var(--bg);
      }

      /* ── Impacts list (cpi-obs.css:802-866, re-scoped) ── */
      #screen-crisis-obs .impacts-list {
        overflow: hidden;
        padding: 0;
      }
      #screen-crisis-obs .impacts-list.cols-2 {
        column-count: 2;
        column-gap: 0;
      }
      #screen-crisis-obs .impact-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 13px 18px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.06);
        font-size: 13px;
        color: var(--text2);
        line-height: 1.55;
        break-inside: avoid;
      }
      html[data-theme="dark"] #screen-crisis-obs .impact-item {
        border-bottom-color: var(--border);
      }
      #screen-crisis-obs .impact-item:hover {
        background: #f8fafc;
      }
      html[data-theme="dark"] #screen-crisis-obs .impact-item:hover {
        background: var(--surface);
      }
      #screen-crisis-obs .impact-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #screen-crisis-obs .impact-icon--up {
        background: #fef2f2;
        color: var(--up);
      }
      #screen-crisis-obs .impact-icon--down {
        background: #f0fdf4;
        color: var(--down);
      }
      #screen-crisis-obs .impact-icon--neutral {
        background: var(--accent-light);
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .impact-icon--up {
        background: rgba(248, 113, 113, 0.13);
      }
      html[data-theme="dark"] #screen-crisis-obs .impact-icon--down {
        background: rgba(52, 211, 153, 0.13);
      }
      #screen-crisis-obs .impact-item b {
        font-weight: 700;
        color: var(--text);
      }

      /* ── News / situation cards (cpi-obs.css:701-801 `.events-grid`, re-scoped) ── */
      #screen-crisis-obs .events-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      #screen-crisis-obs .event-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #screen-crisis-obs .ev-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      #screen-crisis-obs .ev-cat {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        color: var(--text2);
      }
      #screen-crisis-obs .ev-cat i {

           column (see grid-template-columns above), so the copy text

      /* ── Animated globe (Mobility Tracker promo) ──────────────────────
         Layered, CSS-only "quiet data visualization": a shaded sphere with
         a rotating dotted texture underneath a fixed terminator/highlight
         (so the lighting reads as static while the surface turns), two
         tilted orbit rings with particles riding them via offset-path, a
         breathing atmosphere glow, and a restrained hover state. No SVG/
         canvas/JS — everything here is transform/opacity, so it stays on
         the compositor thread. ── */
      #screen-crisis-obs .geo-globe-atmosphere {
        position: absolute;
        inset: -16px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 34%, rgba(191, 219, 254, 0.65) 0%, rgba(96, 165, 250, 0.22) 48%, transparent 72%);
        filter: blur(3px);
        opacity: 0.6;
        animation: geoBreathe 5.5s ease-in-out infinite;
        pointer-events: none;
        will-change: opacity, transform;
      }
      #screen-crisis-obs .geo-globe-orb {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: radial-gradient(circle at 32% 28%, #bfdbfe 0%, #60a5fa 32%, #2563eb 62%, #1e3a8a 100%);
        box-shadow:
          inset -20px -16px 32px rgba(8, 15, 35, 0.4),
          inset 12px 10px 20px rgba(255, 255, 255, 0.18),
          0 10px 26px rgba(30, 64, 175, 0.32);
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.4, 1);
        transform: translateZ(0) scale(1);
      }
      #screen-crisis-obs .geo-globe-texture {
        display: none;
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.7) 1px, transparent 1.3px);
        background-size: 8px 8px;
        -webkit-mask-image:
          radial-gradient(ellipse 30% 20% at 26% 30%, #000 62%, transparent 74%),
          radial-gradient(ellipse 20% 24% at 60% 22%, #000 58%, transparent 72%),
          radial-gradient(ellipse 26% 16% at 38% 60%, #000 58%, transparent 72%),
          radial-gradient(ellipse 16% 20% at 72% 56%, #000 58%, transparent 72%),
          radial-gradient(ellipse 18% 13% at 55% 78%, #000 58%, transparent 72%);
        mask-image:
          radial-gradient(ellipse 30% 20% at 26% 30%, #000 62%, transparent 74%),
          radial-gradient(ellipse 20% 24% at 60% 22%, #000 58%, transparent 72%),
          radial-gradient(ellipse 26% 16% at 38% 60%, #000 58%, transparent 72%),
          radial-gradient(ellipse 16% 20% at 72% 56%, #000 58%, transparent 72%),
          radial-gradient(ellipse 18% 13% at 55% 78%, #000 58%, transparent 72%);
        opacity: 0.8;
        transform-origin: 50% 50%;
        animation: geoRotate 26s linear infinite;
        will-change: transform;
      }
      /* Fixed (non-rotating) darkening near the left/right limb, so the
         texture spinning underneath reads as going "around" the sphere
         rather than sliding across a flat disc. */
      #screen-crisis-obs .geo-globe-terminator {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(90deg, rgba(10, 20, 50, 0.55) 0%, transparent 20%, transparent 80%, rgba(10, 20, 50, 0.55) 100%);
        pointer-events: none;
      }
      #screen-crisis-obs .geo-globe-highlight {
        position: absolute;
        width: 46%;
        height: 30%;
        left: 18%;
        top: 14%;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.55) 0%, transparent 70%);
        filter: blur(1px);
        pointer-events: none;
      }

      /* Orbit rings — each wrapper carries the tilt (a static rotate); the
         particles inside travel an *unrotated* ellipse via offset-path, so
         tilting the wrapper carries the whole ring + its particles as one
         rigid assembly. */
      #screen-crisis-obs .geo-orbit-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #screen-crisis-obs .geo-orbit-wrap--a {
        transform: rotate(-16deg);
      }
      #screen-crisis-obs .geo-orbit-wrap--b {
        transform: rotate(20deg);
      }
      #screen-crisis-obs .geo-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 50%;
        border: 1.4px solid rgba(147, 197, 253, 0.8);
        box-shadow: 0 0 6px rgba(96, 165, 250, 0.25);
      }
      #screen-crisis-obs .geo-orbit--a {
        width: 164px;
        height: 52px;
        margin: -26px 0 0 -82px;
      }
      #screen-crisis-obs .geo-orbit--b {
        width: 136px;
        height: 72px;
        margin: -36px 0 0 -68px;
        border-color: rgba(196, 181, 253, 0.65);
      }
      /* Each ring is split into two halves so it can actually wrap the
         sphere: the back half paints before .geo-globe-orb in the DOM (so
         the globe covers it), the front half paints after (so it covers
         the globe). Split at the ellipse's own horizontal midline, before
         the wrapper's tilt is applied, so the seam still lands correctly
         once rotated. */
      #screen-crisis-obs .geo-orbit--back {
        clip-path: inset(0 0 50% 0);
        opacity: 0.5;
      }
      #screen-crisis-obs .geo-orbit--front {
        clip-path: inset(50% 0 0 0);
      }
      #screen-crisis-obs .geo-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: radial-gradient(circle, #f0f9ff 0%, #60a5fa 55%, transparent 78%);
        box-shadow: 0 0 5px 1px rgba(96, 165, 250, 0.7);
        opacity: 0.9;
        offset-distance: 0%;
        transition: opacity 0.4s ease;
        will-change: offset-distance, opacity;
      }
      #screen-crisis-obs .geo-particle--a1 {
        offset-path: path("M -7 75 A 82 26 0 1 0 157 75 A 82 26 0 1 0 -7 75");
        animation: geoOrbitA 15s linear infinite, geoPulse 3.4s ease-in-out infinite;
        animation-delay: 0s, 0s;
      }
      #screen-crisis-obs .geo-particle--a2 {
        offset-path: path("M -7 75 A 82 26 0 1 0 157 75 A 82 26 0 1 0 -7 75");
        width: 3px;
        height: 3px;
        animation: geoOrbitA 19s linear infinite, geoPulse 4.2s ease-in-out infinite;
        animation-delay: -9s, -1.6s;
      }
      #screen-crisis-obs .geo-particle--b1 {
        offset-path: path("M 7 75 A 68 36 0 1 0 143 75 A 68 36 0 1 0 7 75");
        animation: geoOrbitB 13s linear infinite, geoPulse 3.8s ease-in-out infinite;
        animation-delay: -4s, -2.4s;
      }
      #screen-crisis-obs .geo-particle--b2 {
        offset-path: path("M 7 75 A 68 36 0 1 0 143 75 A 68 36 0 1 0 7 75");
        width: 3px;
        height: 3px;
        animation: geoOrbitB 17s linear infinite, geoPulse 4.6s ease-in-out infinite;
        animation-delay: -11s, -3.1s;
      }
      @keyframes geoRotate {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes geoOrbitA {
        to {
          offset-distance: 100%;
        }
      }
      @keyframes geoOrbitB {
        to {
          offset-distance: 100%;
        }
      }
      @keyframes geoPulse {
        0%, 100% {
          transform: scale(1);
          filter: brightness(1);
        }
        50% {
          transform: scale(1.35);
          filter: brightness(1.3);
        }
      }
      @keyframes geoBreathe {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.72;
        }
      }
      /* Hover — gentle scale, brighter atmosphere/particles, rotation eases
         off rather than speeding up. Kept small on purpose (1.5%). */
      #screen-crisis-obs .geo-promo-art:hover .geo-globe-orb {
        transform: translateZ(0) scale(1.015);
      }
      #screen-crisis-obs .geo-promo-art:hover .geo-globe-atmosphere {
        opacity: 0.85;
      }
      #screen-crisis-obs .geo-promo-art:hover .geo-globe-texture {
        animation-duration: 40s;
      }
      #screen-crisis-obs .geo-promo-art:hover .geo-particle {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs .geo-globe-texture,
        #screen-crisis-obs .geo-globe-atmosphere,
        #screen-crisis-obs .geo-particle {
          animation: none !important;
        }
        #screen-crisis-obs .geo-particle {
          opacity: 0.6;
          offset-distance: 15%;
        }
        #screen-crisis-obs .geo-promo-art:hover .geo-globe-orb {

      @media (max-width: 900px) {
        #screen-crisis-obs .geo-promo {

      #screen-crisis-obs .prod-filter-dd {

      #screen-crisis-obs .prod-filter-dd-trigger {

      #screen-crisis-obs .prod-filter-dd-trigger:hover:not(:disabled),

      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger {

      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger:hover:not(:disabled),
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger.is-open {

      #screen-crisis-obs .prod-filter-dd-option {

        align-items: center;

        font-size: 13px;
        font-weight: 500;
        color: #0f2744;
        font-family: inherit;
        text-align: left;
        cursor: pointer;

      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option {
        color: var(--text-primary);
      }
      #screen-crisis-obs .prod-filter-dd-option:hover {
        background: #f8fbff;

      #screen-crisis-obs .prod-filter-dd-option.is-active {

      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option:hover,

      #screen-crisis-obs .dd-check {

        background: var(--accent);

      }
      #screen-crisis-obs .prod-filter-dd-option.dd-all {
        border-bottom: 1px solid var(--border, #eaecf0);

        margin-bottom: 4px;
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option.dd-all {
        border-bottom-color: var(--border-md);

      /* ── Signal Health ladder (Observe) — ported from trade.html's Alert
         Ladder (trade.html:831-1020): a lead label card + tone-count cards in
         one row. Adds a fourth, --good count (trade's ladder only ever needed
         three) for this page's Stable bucket, matching the tone convention. ── */
      #screen-crisis-obs .tr-ladder {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
        gap: 12px;
        padding: 14px;
        border-radius: 24px;
        margin-bottom: 16px;
      }
      html:not([data-theme="dark"]) #screen-crisis-obs .tr-ladder {
        background: #fff;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-ladder {
        background: var(--surface);
        border: 1px solid var(--border);
      }
      #screen-crisis-obs .tr-lad-card {
        --tone: var(--accent);
        border-radius: 16px;
        padding: 14px 16px;
        min-width: 0;
        background: color-mix(in srgb, var(--tone) 7%, white);
      }
      #screen-crisis-obs .tr-lad-lead {
        background: transparent;
        border: none;
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-card {
        background: color-mix(in srgb, var(--tone) 16%, transparent);
      }
      #screen-crisis-obs .tr-lad-lead {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #screen-crisis-obs .tr-lad-ic {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent-light);
        color: var(--accent);
        font-size: 20px;
        flex-shrink: 0;
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-ic {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      #screen-crisis-obs .tr-lad-ttl {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }
      #screen-crisis-obs .tr-lad-sub {
        margin-top: 3px;
        font-size: 12px;
        color: var(--text2);
      }
      #screen-crisis-obs .tr-lad-count {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        column-gap: 12px;
      }
      #screen-crisis-obs .tr-lad-count-ic {
        grid-column: 1;
        grid-row: 1 / span 3;
        align-self: start;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 18px;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 14%, white);
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-count-ic {
        background: color-mix(in srgb, var(--tone) 24%, transparent);
      }
      #screen-crisis-obs .tr-lad-num,
      #screen-crisis-obs .tr-lad-name,
      #screen-crisis-obs .tr-lad-hint {
        grid-column: 2;
      }
      #screen-crisis-obs .tr-lad-num {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: var(--tone);
      }
      #screen-crisis-obs .tr-lad-name {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--text);
      }
      #screen-crisis-obs .tr-lad-hint {
        font-size: 11.5px;
        color: var(--text2);
      }
      #screen-crisis-obs .tr-lad-count--bad {
        --tone: var(--red, #e5484d);
      }
      #screen-crisis-obs .tr-lad-count--warn {
        --tone: var(--amber, #e0912a);
      }
      #screen-crisis-obs .tr-lad-count--info {
        --tone: var(--blue-watch, #2563eb);
      }
      #screen-crisis-obs .tr-lad-count--good {
        --tone: var(--green, #16a34a);
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-count--bad {
        --tone: #ff6b6b;
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-count--warn {
        --tone: #f0b25a;
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-count--good {
        --tone: #34c99a;
      }
      @media (max-width: 900px) {
        #screen-crisis-obs .tr-ladder {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 560px) {
        #screen-crisis-obs .tr-ladder {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ── Indicator card (Observe) — ported from the main app's Products
         grid card (style.css:3651-4104, .products-grid .product-card and its
         children), re-scoped here under the same class names so a future
         extraction is a merge. Skips the e-commerce-only pieces (select
         checkbox, download/bookmark actions, confidential tag) that don't
         apply to a standalone indicator card; keeps the category tag, name,
         value, change, chart and the AI-summary footer row. Replaces the old
         .cio-insight callout box with .product-ai-row's quieter treatment. ── */
      #screen-crisis-obs .product-card {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      #screen-crisis-obs .product-card-toprow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      #screen-crisis-obs .product-cat-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--text2);
        background: #f3f4f6;
        border-radius: 5px;
        padding: 2px 8px;
      }
      #screen-crisis-obs .product-cat-tag i {
        font-size: 11px;
      }
      html[data-theme="dark"] #screen-crisis-obs .product-cat-tag {
        background: var(--surface2);
        color: var(--text-secondary);
      }
      #screen-crisis-obs .product-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 10px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #screen-crisis-obs .product-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.1;
      }
      #screen-crisis-obs .product-val small {
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        margin-left: 2px;
      }
      #screen-crisis-obs .product-change {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        margin-top: 3px;
        margin-bottom: 8px;
        font-weight: 500;
      }
      #screen-crisis-obs .product-viz {
        width: 100%;
        height: 92px;
        position: relative;
        margin-bottom: 2px;
      }
      #screen-crisis-obs .product-viz svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #screen-crisis-obs .product-ai-row {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        font-size: 11px;
        color: var(--text2);
        line-height: 1.5;
        padding-top: 10px;
        margin-top: auto;
        border-top: 1px solid var(--border);
      }
      #screen-crisis-obs .product-ai-row i.ti-bulb {
        font-size: 12px;
        color: var(--accent);
        flex-shrink: 0;
        margin-top: 1px;
      }
      #screen-crisis-obs .product-ai-lbl {
        font-weight: 700;
        color: var(--text);
      }

      /* ── Indicator Analytics filter row ── */
      #screen-crisis-obs .tasks-filters {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px 14px;
        flex-wrap: wrap;
      }

      /* ====================================================================
         CPI ALIGNMENT — component interiors
         The crisis component set in style.css:9717-10735 predates the CPI
         design system. Everything below re-points its interiors at the CPI
         spec: the 700 display weight, the negative tracking on numerals, the
         uppercase tracked table header, the 16px card radius, the tinted
         severity pill, and the slate-tinted shadow. Each rule names its CPI
         source so the two stay traceable.
         ==================================================================== */

      /* ── Header actions: CPI's own 40px download control (CPI.html:587) ── */
      #screen-crisis-obs .cpi-hdr-download {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white, #fff);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #screen-crisis-obs .cpi-hdr-download:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      #screen-crisis-obs .cpi-hdr-download i {
        font-size: 16px;
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hdr-download {
        background: var(--surface);
        border-color: var(--border-md);
        color: var(--text-primary);
      }

      /* Date control (CPI.html:528-586) */
      #screen-crisis-obs .cpi-hdr-date {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #screen-crisis-obs .cpi-hdr-date-label {
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        white-space: nowrap;
      }
      #screen-crisis-obs .cpi-hdr-date-field {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      #screen-crisis-obs .cpi-hdr-date-input {
        height: 36px;
        min-width: 132px;
        padding: 0 36px 0 12px;
        border: 1px solid rgba(191, 219, 254, 0.65);
        border-radius: 10px;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      #screen-crisis-obs .cpi-hdr-date-field:hover .cpi-hdr-date-input,
      #screen-crisis-obs .cpi-hdr-date-field:focus-within .cpi-hdr-date-input {
        border-color: #bfdbfe;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        outline: none;
      }
      #screen-crisis-obs .cpi-hdr-date-input::-webkit-calendar-picker-indicator {
        position: absolute;
        right: 0;
        top: 0;
        width: 36px;
        height: 100%;
        margin: 0;
        padding: 0;
        opacity: 0;
        cursor: pointer;
      }
      #screen-crisis-obs .cpi-hdr-date-field > i {
        position: absolute;
        right: 10px;
        pointer-events: none;
        color: #64748b;
        font-size: 16px;
        line-height: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hdr-date-input {
        background: var(--surface);
        border-color: var(--border-md);
        color: var(--text-primary);
      }

      /* ── Executive Brief hero — ported from CPI.html's .cpi-hero (CPI.html:131-219),
         replacing the old .overview-card's narrative half. The KPI stat-pills move to
         their own section below (still .overview-card/.stat-pill — unchanged, just
         relocated). Audio brief control is CPI.html's own port (CPI.html:221-460) of
         the home page Daily Brief listen affordance (css/pages/daily-brief.css),
         re-scoped here the same way. ── */
      #screen-crisis-obs .cpi-hero {
        position: relative;
        overflow: hidden;
        min-height: 150px;
        margin-bottom: 24px;
        border-radius: 16px;
        padding: 24px 28px;
        background: radial-gradient(ellipse 70% 55% at 8% 15%, rgba(99, 179, 255, 0.22) 0%, transparent 55%), linear-gradient(135deg, #f0f6ff 0%, #eef4fc 45%, #e8f0fa 100%);
        border: 1px solid #bfdbfe;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        --brief-blue: #246bfd;
        --brief-red: #e5484d;
      }
      #screen-crisis-obs .cpi-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1.5px, transparent 1.5px);
        background-size: 18px 18px;
        pointer-events: none;
        opacity: 0.7;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero {
        background:
          radial-gradient(ellipse 70% 55% at 8% 15%, rgba(59, 130, 246, 0.18) 0%, transparent 55%),
          linear-gradient(135deg, var(--surface2) 0%, var(--surface) 45%, #151e32 100%);
        border-color: var(--border-md);
        box-shadow: var(--shadow-sm);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero::before {
        background-image: radial-gradient(rgba(59, 130, 246, 0.12) 1.5px, transparent 1.5px);
        opacity: 0.5;
      }
      #screen-crisis-obs .cpi-hero-inner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      #screen-crisis-obs .cpi-hero-meta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        margin-left: auto;
        align-self: flex-start;
      }
      #screen-crisis-obs .cpi-hero-meta-sep {
        color: #cbd5e1;
        font-size: 16px;
        font-weight: 300;
        line-height: 1;
        user-select: none;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero-meta-sep {
        color: var(--text-tertiary);
      }
      #screen-crisis-obs .cpi-hero-meta .brief-speech {
        margin-top: 0;
      }
      #screen-crisis-obs .cpi-hero-meta .cpi-hero-date {
        margin-left: 0;
      }
      #screen-crisis-obs .cpi-hero-date {
        position: relative;
        z-index: 2;
        align-self: flex-start;
        flex-shrink: 0;
      }
      #screen-crisis-obs .cpi-hero-ico {
        color: #fff;
        font-size: 22px;
        line-height: 1;
        margin-top: 1px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.28);
      }
      #screen-crisis-obs .cpi-hero-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f2744;
        letter-spacing: -0.01em;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero-title {
        color: var(--text-primary);
      }
      #screen-crisis-obs .intel-engine-sub {
        font-size: 12px;
        color: var(--text2);
      }
      #screen-crisis-obs .cpi-hero-sub {
        margin-top: 20px;
        max-width: 100%;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text2);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero-sub {
        color: var(--text-secondary);
      }

      #screen-crisis-obs .cpi-hero .brief-speech {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        height: 36px;
        padding: 2px 3px 2px 2px;
        border-radius: 18px;
        background: linear-gradient(120deg, rgba(237, 244, 255, 0.95), rgba(255, 255, 255, 0.9));
        box-shadow: inset 0 0 0 1px rgba(185, 205, 232, 0.72), 0 4px 12px rgba(36, 76, 130, 0.08);
        transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen-crisis-obs .cpi-hero .brief-speech::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: linear-gradient(110deg, rgba(36, 107, 253, 0.22), transparent 42%);
        opacity: 0;
        z-index: -1;
        transition: 0.3s;
      }
      #screen-crisis-obs .cpi-hero .brief-speech.is-active {
        box-shadow: inset 0 0 0 1px rgba(120, 166, 236, 0.55), 0 5px 14px rgba(36, 107, 253, 0.13);
      }
      #screen-crisis-obs .cpi-hero .brief-speech.is-active::before {
        opacity: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero .brief-speech {
        background: linear-gradient(120deg, rgba(30, 58, 95, 0.95), rgba(20, 30, 50, 0.9));
        box-shadow: inset 0 0 0 1px var(--border-md), 0 4px 12px rgba(0, 0, 0, 0.25);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero .brief-speech.is-active {
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35), 0 5px 14px rgba(0, 0, 0, 0.3);

      #screen-crisis-obs .cpi-hero .brief-listen {

        align-items: center;

        height: 32px;
        padding: 0 10px 0 1px;

        box-shadow: 0 5px 12px rgba(36, 107, 253, 0.32);
