<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Census Observatory — Geo View · Bayaan</title>
  <link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <link rel="stylesheet" href="css/pages/ai.css" />
  <link rel="stylesheet" href="css/pages/cpi-obs.css" />
  <link rel="stylesheet" href="css/pages/obs-sidebar.css" />
  <link rel="stylesheet" href="css/pages/exec-home.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/pages/home-widgets.css" />
  <link rel="stylesheet" href="css/components/bayaan-footer.css" />
  <link rel="stylesheet" href="css/theme.css" />

  <script>
    (function () {
      var t = localStorage.getItem("bayaan-theme") || "light";
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <script src="js/theme.js"></script>
  <script src="js/header.js?v=20260913-breadcrumbs3"></script>
  <script src="js/footer.js"></script>
  <script src="js/census-global-filter.js"></script>
  <script src="js/table-column-visibility.js"></script>

  <style>
    /* Census specific overrides */
    .screen--cpi-obs {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }
    .crisis-scroll {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Geo map handles its own scroll */
    }
    /* Override grid layout from obs-sidebar.css so the map fills the width underneath the floating sidebar */
    :is(#screen-cpi-obs) .page-wrap {
        display: block !important;
        flex: 1;
        height: 100%;
        width: 100%;
    }
    .geo-main {
        height: 100%;
        width: 100%;
        position: relative;
    }
    /* ADDP Geo View, embedded from ADDP/ADDP.html?embed=1 — full-bleed;
       the map runs edge to edge under the floating census rail, and ADDP's
       own panel is shifted clear of the rail from inside (html.addp-embed
       .left-panel in ADDP.html). */
    .geo-spatial-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }
  </style>
</head>
<body>
  <div id="screen-cpi-obs" class="screen screen--cpi-obs ws-screen active header-flush">
    <div data-bayaan-header></div>
    <div class="crisis-scroll">
      <div class="page-wrap">
        <aside class="sidebar" aria-label="Census Observatory views">
          <div id="census-global-filter-mount"></div>
          <button type="button" class="sidebar-item sidebar-item--ai" onclick="censusComingSoon('Census AI')">
            <div class="sidebar-icon"><i class="ti ti-sparkles"></i></div>
            <span class="sidebar-label">Census AI</span>
          </button>
          <span class="sidebar-divider" aria-hidden="true"></span>
          <a class="sidebar-item" href="CensusObservatory.html">
            <div class="sidebar-icon"><i class="ti ti-layout-dashboard"></i></div>
            <span class="sidebar-label">Overview</span>
          </a>
          <a class="sidebar-item" href="census-interpret.html">
            <div class="sidebar-icon"><i class="ti ti-search"></i></div>
            <span class="sidebar-label">Interpret</span>
          </a>
          <a class="sidebar-item" href="census-population-projection.html">
            <div class="sidebar-icon"><i class="ti ti-chart-line"></i></div>
            <span class="sidebar-label">Forecast</span>
          </a>
          <a class="sidebar-item" href="census-benchmark.html">
            <div class="sidebar-icon"><i class="ti ti-chart-bar"></i></div>
            <span class="sidebar-label">Benchmark</span>
          </a>
          <a class="sidebar-item" href="census-observe.html">
            <div class="sidebar-icon"><i class="ti ti-eye"></i></div>
            <span class="sidebar-label">Observe</span>
          </a>
          <button type="button" class="sidebar-item active" onclick="activateSidebar(this)">
            <div class="sidebar-icon"><i class="ti ti-map-2"></i></div>
            <span class="sidebar-label">Geo View</span>
          </button>
        </aside>

        <div class="geo-main" id="geoMain">
          <iframe
            class="geo-spatial-frame"
            src="ADDP/ADDP.html?embed=1&hideScoreOverlay=1"
            title="ADDP — Geo View"
            loading="eager"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    function activateSidebar(el) {
      // Stub — Geo View is the current screen
    }

    function censusComingSoon(msg) {
      alert(msg + " is coming soon!");
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (window.BayaanHeader && typeof window.BayaanHeader.init === "function") {
        window.BayaanHeader.init();
        window.BayaanHeader.syncActive("screen-cpi-obs");
      }
      if (window.CensusGlobalFilter) CensusGlobalFilter.mount();
    });
  </script>
</body>
</html>
