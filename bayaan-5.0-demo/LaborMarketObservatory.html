<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consumer Price Index — Briefing Desk · Bayaan</title>
    <link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <!-- Shared design system (same order as the main application) -->
    <link rel="stylesheet" href="css/pages/ai.css" />
    <link rel="stylesheet" href="css/pages/cpi-obs.css" />
    <link rel="stylesheet" href="css/pages/obs-sidebar.css" />
    <link rel="stylesheet" href="css/pages/exec-home.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/pages/home-widgets.css" />
    <link rel="stylesheet" href="css/components/bayaan-footer.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <script>
      (function () {
        var t = localStorage.getItem("bayaan-theme") || "light";
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" ? "dark" : "light"
        );
      })();
    </script>
    <script src="js/theme.js"></script>
  <script src="js/header.js?v=20260913-breadcrumbs3"></script>
    <script src="js/census-global-filter.js"></script>
    <!-- Interactive product-card charts (same version/config as the home page) -->
    <script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>
    <style>
      /* Section headings styled like the home page module titles: bold black
         title + prominent accent icon (replaces the section pip).
         Mirrors .screen-home .home-module-title / .home-module-title-icon. */
      /* Section containers styled like home-page modules — gradient card,
         radius, soft shadow, padding. Values mirror .home-section-module. */
      #screen-cpi-obs #cpi-obs-content > section {
        background:
          linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 28px;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
        padding: 24px 28px 28px;
        margin-bottom: 24px;
      }
      #screen-cpi-obs .section-hdr {
        margin-bottom: 20px;
      }

      /* Header ↔ banner spacing: tighten the title's line-height and drop the
         divider + bottom padding so the hero sits neatly below the subtitle. */
      #screen-cpi-obs .topic-title {
        line-height: 1.2;
      }
      #screen-cpi-obs .cpi-page-header-inner {
        border-bottom: none;
        padding-bottom: 0;
      }

      /* Hero banner — CPI trend callout with the illustration anchored right. */
      #screen-cpi-obs .cpi-hero {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        min-height: 150px;
        padding: 24px;
        margin-bottom: 24px;
        border-radius: 20px;
        background:
          linear-gradient(90deg, #e8f0ff 0%, #eef4ff 42%, rgba(238, 244, 255, 0.35) 100%);
      }
      #screen-cpi-obs .cpi-hero-inner {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      /* "Data as of" date, moved from the header into the hero, pinned to its
         top-right corner. */
      #screen-cpi-obs .cpi-hero-date {
        position: relative;
        z-index: 2;
        align-self: flex-start;
        flex-shrink: 0;
        margin-left: 16px;
      }
      #screen-cpi-obs .cpi-hero-ico {
        flex-shrink: 0;
        color: var(--accent);
        font-size: 22px;
        line-height: 1;
        margin-top: 1px;
      }
      #screen-cpi-obs .cpi-hero-title {
        font-size: 18px;
        font-weight: 700;
        color: #0f2744;
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .cpi-hero-sub {
        margin-top: 8px;
        max-width: 100%;
        font-size: 13px;
        line-height: 1.55;
        color: var(--text2);
      }
      /* Summary card body — mirrors the .cpi-hero-sub body-copy tokens
         (13px / 1.55 / --text2). The .obs-card + .kpi-card shell and
         .ov-card-title supply everything else. Layout-only; no shared files. */
      #screen-cpi-obs .lmo-summary-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--text2);
      }

      /* ── Audio brief — Bayaan standard listen control (icon-only, as on
         the home page's Daily Brief and the Census Observatory hero;
         css/pages/daily-brief.css). No pill/chip background and no visible
         "Audio brief" label — the text stays in the DOM for the aria-label
         and screen readers only. Keep in sync with `.daily-brief--split
         .brief-*` there. ── */
      #screen-cpi-obs .cpi-hero {
        --brief-blue: #246bfd;
        --brief-red: #e5484d;
      }
      #screen-cpi-obs .cpi-hero .brief-speech {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        margin-top: 14px;
        height: 32px;
        padding: 0;
        border-radius: 16px;
        background: transparent;
        box-shadow: none;
        transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen-cpi-obs .cpi-hero .brief-speech::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: linear-gradient(110deg, rgba(36, 107, 253, 0.22), transparent 42%);
        opacity: 0;
        z-index: -1;
        transition: 0.3s;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active {
        box-shadow: none;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active::before {
        opacity: 1;
      }
      #screen-cpi-obs .cpi-hero .brief-listen {
        display: flex;
        align-items: center;
        gap: 0;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: transparent;
        color: #28415f;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: 0.22s ease;
      }
      #screen-cpi-obs .cpi-hero .brief-listen:hover .brief-listen__icon {
        transform: scale(1.06);
        box-shadow: 0 5px 12px rgba(36, 107, 253, 0.32);
      }
      #screen-cpi-obs .cpi-hero .brief-listen:focus-visible,
      #screen-cpi-obs .cpi-hero .brief-audio-action:focus-visible {
        outline: 3px solid rgba(36, 107, 253, 0.17);
        outline-offset: 2px;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, #1f5ef0, #5b97f8);
        box-shadow: 0 3px 8px rgba(36, 107, 253, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__icon::after {
        content: "";
        position: absolute;
        inset: -2px;
        border: 1px solid rgba(36, 107, 253, 0.22);
        border-radius: 50%;
        transform: scale(0.84);
        opacity: 0;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__speaker,
      #screen-cpi-obs .cpi-hero .brief-listen__play,
      #screen-cpi-obs .cpi-hero .brief-listen__pause {
        grid-area: 1 / 1;
        font-size: 16px;
        line-height: 1;
        transition: opacity 0.15s, transform 0.15s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__play {
        margin-left: 1px;
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__pause {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__speaker {
        opacity: 1;
        transform: scale(1);
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__speaker,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__speaker {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__pause {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__play {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__icon {
        background: linear-gradient(145deg, #3b7af5, #7aafff);
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__icon::after {
        animation: brief-voice-ring 1.8s ease-out infinite;
      }
      /* Icon-only — the "Audio brief" text label is hidden (kept in the DOM
         for the aria-label / screen readers and the driver's label swap). */
      #screen-cpi-obs .cpi-hero .brief-listen__copy {
        display: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__text {
        color: #2b4462;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__text,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__text {
        display: none;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 14px;
        color: var(--brief-blue);
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i {
        display: block;
        width: 2px;
        height: 5px;
        border-radius: 2px;
        background: currentColor;
        animation: brief-wave 0.72s ease-in-out infinite;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(2) {
        animation-delay: 0.12s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(3) {
        animation-delay: 0.24s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen__wave i:nth-child(4) {
        animation-delay: 0.36s;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__wave,
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave {
        display: inline-flex;
      }
      #screen-cpi-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave i {
        height: 8px;
        animation-play-state: paused;
      }
      #screen-cpi-obs .cpi-hero .brief-speech__actions {
        display: flex;
        align-items: center;
        gap: 1px;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateX(-6px);
        transition: max-width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s, transform 0.3s;
      }
      #screen-cpi-obs .cpi-hero .brief-speech.is-active .brief-speech__actions {
        max-width: 56px;
        opacity: 1;
        transform: none;
      }
      #screen-cpi-obs .cpi-hero .brief-speech__actions::before {
        content: "";
        width: 1px;
        height: 14px;
        margin: 0 2px 0 0;
        background: #d7e2f0;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6d7f95;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action:hover {
        color: var(--brief-blue);
        background: #fff;
        box-shadow: 0 4px 10px rgba(36, 75, 125, 0.1);
        transform: scale(1.06);
      }
      #screen-cpi-obs .cpi-hero .brief-stop-box {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }
      #screen-cpi-obs .cpi-hero .brief-audio-action--stop:hover {
        color: var(--brief-red);
        background: #fff5f5;
      }
      #screen-cpi-obs .cpi-hero .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes brief-wave {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 14px;
        }
      }
      @keyframes brief-voice-ring {
        0% {
          transform: scale(0.82);
          opacity: 0.8;
        }
        80%,
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      /* Page-header actions (right side): date picker + download button.
         Date pill mirrors the sibling pages' .tr-datepick; download uses the
         brand primary fill. */
      #screen-cpi-obs .cpi-hdr-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hdr-search {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        min-width: 240px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        color: var(--text2);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-size: 13px;
        cursor: text;
        transition: border-color 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-search[hidden] {
        display: none;
      }
      #screen-cpi-obs .cpi-hdr-search:hover,
      #screen-cpi-obs .cpi-hdr-search:focus-within {
        border-color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-search > i {
        font-size: 16px;
        color: var(--text2);
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hdr-kbd {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accent-light);
        color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-date {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-size: 13px;
        font-weight: 600;
        transition: border-color 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-date:hover,
      #screen-cpi-obs .cpi-hdr-date:focus-within {
        border-color: var(--accent);
      }
      #screen-cpi-obs .cpi-hdr-date > i {
        color: var(--accent);
        font-size: 17px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .cpi-hdr-date input {
        border: 0;
        outline: none;
        background: none;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: inherit;
        cursor: pointer;
      }
      #screen-cpi-obs .cpi-hdr-date input::-webkit-calendar-picker-indicator {
        opacity: 0;
        display: none;
      }
      #screen-cpi-obs .cpi-hdr-download {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #screen-cpi-obs .cpi-hdr-download:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      #screen-cpi-obs .cpi-hdr-download i {
        font-size: 16px;
        color: var(--accent);
      }
      #screen-cpi-obs .section-hdr h2.cpi-section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        color: #000;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .section-hdr h2.cpi-section-title i {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }

      /* Overview — wireframe-accurate grouped metric cards, composed from the
         app's existing tokens/components. Layout-only additions; no changes to
         the shared design system. */
      #screen-cpi-obs .cpi-overview-grid {
        display: grid;
        /* Equal thirds — the Inflation internals are sized down to fit rather
           than the track being widened to accommodate them. */
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: stretch;
      }
      /* Cards inside each section — matched to the home page "subcard" recipe
         (:is(.screen-home, …) .exec-subcard / .product-card in style.css).
         Tokens redeclared here because the originals are scoped to .screen-home. */
      #screen-cpi-obs {
        --figma-subcard-bg: rgba(255, 255, 255, 0.6);
        --figma-subcard-shadow: 0 24px 30px 0 rgba(42, 61, 76, 0.03);
      }
      #screen-cpi-obs .obs-card {
        border-radius: 16px;
        transition:
          box-shadow 0.22s ease,
          border-color 0.22s ease,
          transform 0.22s ease,
          background 0.22s ease;
      }
      /* Surface colours are light-theme only — dark theme already restyles
         .obs-card in css/theme.css and must be left to win. */
      html:not([data-theme="dark"]) #screen-cpi-obs .obs-card {
        background: var(--figma-subcard-bg);
        border: 1px solid #eaecf0;
        box-shadow: var(--figma-subcard-shadow);
      }
      html:not([data-theme="dark"]) #screen-cpi-obs .obs-card:hover {
        border-color: var(--gray-300);
        box-shadow: var(--shadow-md);
      }
      /* Pre-existing: the light border shorthand in cpi-obs.css outranks the
         dark `border-color` in theme.css, leaving pale edges on dark cards. */
      html[data-theme="dark"] #screen-cpi-obs .obs-card {
        border-color: var(--border);
      }

      /* Inflation card — icon chip + large value + muted unit, so the card
         carries the same weight as its sparkline-bearing neighbours instead of
         trailing off into empty space. Icon treatment matches the Key Impacts
         rows below (and the home Daily Brief points they came from). */
      #screen-cpi-obs .infl-rows {
        display: flex;
        flex-direction: column;
        margin-top: 4px;
      }
      #screen-cpi-obs .infl-row {
        --tone: #8b93a7;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 0;
        min-width: 0;
      }
      /* Tighter gutters than the other two cards — this one packs an icon and
         two text runs per metric, so it needs the horizontal room. */
      #screen-cpi-obs .kpi-card--infl .ov-metric {
        padding: 0 10px;
      }
      #screen-cpi-obs .kpi-card--infl .ov-metric:first-child {
        padding-left: 0;
      }
      #screen-cpi-obs .kpi-card--infl .ov-metric:last-child {
        padding-right: 0;
      }
      /* Same reasoning for CPI by — three tracks sharing one card, and its
         26px figures are the widest content in the row. */
      #screen-cpi-obs .kpi-card--essentials .ov-metric {
        padding: 0 8px;
      }
      #screen-cpi-obs .kpi-card--essentials .ov-metric:first-child {
        padding-left: 0;
      }
      #screen-cpi-obs .kpi-card--essentials .ov-metric:last-child {
        padding-right: 0;
      }
      /* Value and unit sit inline, but wrap instead of overflowing when the
         column is tight — these metrics live in a narrow grid track. */
      #screen-cpi-obs .infl-figure {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 1px 5px;
        min-width: 0;
      }
      #screen-cpi-obs .infl-row:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      #screen-cpi-obs .infl-row--up {
        --tone: #e5484d;
      }
      #screen-cpi-obs .infl-row--down {
        --tone: #0c9b70;
      }
      #screen-cpi-obs .infl-icon {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        flex-shrink: 0;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 9%, white);
      }
      #screen-cpi-obs .infl-icon i {
        font-size: 13px;
        line-height: 1;
      }
      #screen-cpi-obs .infl-val {
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--tone);
      }
      #screen-cpi-obs .infl-unit {
        font-size: 10px;
        font-weight: 500;
        color: #8492a6;
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-row {
        border-color: var(--border);
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-icon {
        background: color-mix(in srgb, var(--tone) 18%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .infl-unit {
        color: var(--text-secondary);
      }

      /* No rule under the page title/subtitle. Zero width rather than a colour
         override, so the dark-theme border-bottom-color in css/theme.css can't
         bring it back. The padding-bottom stays as spacing. */
      #screen-cpi-obs .cpi-page-header-inner {
        border-bottom: 0;
      }

      /* Driver date badge as a standard pill — geometry from the page's own
         .kpi-badge (css/pages/cpi-obs.css): flat, inline-flex, fully rounded,
         no border. Single line, so the rounded-rect + <br> version is gone. */
      #screen-cpi-obs .dc-date {
        display: inline-flex;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 9px;
        border: 0;
        border-radius: 100px;
        background: var(--accent-light);
        color: var(--accent);
        line-height: 1.5;
        white-space: nowrap;
        text-align: initial;
      }

      /* Key Impacts — matched to the home page Daily Brief summary points
         (.brief-point in css/pages/daily-brief.css). Tone lives on the icon;
         the copy stays neutral with bold dark emphasis, as in the reference.
         Laid out as a 2×2 grid with a horizontal rule between the rows only. */
      #screen-cpi-obs .impacts-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      #screen-cpi-obs .impacts-list .impact-item {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 11px;
        align-items: start;
        padding: 10px 18px;
        border-bottom: 1px solid #edf1f6;
        font-size: 12px;
        line-height: 1.5;
        color: #536277;
        transition: transform 0.22s ease;
      }
      /* Bottom row carries no horizontal rule. */
      #screen-cpi-obs .impacts-list .impact-item:nth-last-child(-n + 2) {
        border-bottom: 0;
      }
      #screen-cpi-obs .impacts-list .impact-item:hover {
        background: none;
        transform: translateX(3px);
      }

      #screen-cpi-obs .impacts-list .impact-icon {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 9%, white);
      }
      #screen-cpi-obs .impacts-list .impact-icon i {
        font-size: 17px;
        line-height: 1;
      }
      #screen-cpi-obs .impacts-list .impact-icon--up {
        --tone: #e5484d;
      }
      #screen-cpi-obs .impacts-list .impact-icon--down {
        --tone: #0c9b70;
      }
      #screen-cpi-obs .impacts-list .impact-icon--neutral {
        --tone: #246bfd;
      }

      /* Reference emphasis is bold ink, not a tone colour. */
      #screen-cpi-obs .impacts-list .impact-val {
        color: #172033;
        font-weight: 700;
      }

      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-item {
        border-color: var(--border);
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-val {
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-cpi-obs .impacts-list .impact-icon {
        background: color-mix(in srgb, var(--tone) 18%, transparent);
      }

      /* Card sparklines — mirrors .brief-kpi__spark-area / -line
         (css/pages/daily-brief.css) from the home page cards. */
      #screen-cpi-obs .obs-spark-area {
        opacity: 1;
      }
      #screen-cpi-obs .obs-spark-line {
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Single trend line — a compact sparkline height is enough now that the
         five separated year-lines are gone. */
      #screen-cpi-obs .cpiby-spark,
      #screen-cpi-obs .cpiby-spark svg,
      #screen-cpi-obs .dc-spark,
      #screen-cpi-obs .dc-spark svg {
        height: 44px;
      }

      /* Year x-axis — five evenly-spaced ticks under the chart, spanning its
         full width (first tick at the left edge, last at the right). */
      #screen-cpi-obs .obs-year-axis {
        display: flex;
        justify-content: space-between;
        margin-top: 7px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #9aa7b8;
      }
      html[data-theme="dark"] #screen-cpi-obs .obs-year-axis {
        color: var(--text-tertiary);
      }
      /* Lift on hover for grid cards only — full-width list cards stay put,
         same as the home page's list modules. */
      #screen-cpi-obs .obs-card:not(.impacts-list):hover {
        transform: translateY(-1px);
      }
      /* Home subcards have no coloured top rule. */
      #screen-cpi-obs .kpi-card::before {
        display: none;
      }
      #screen-cpi-obs .ov-card-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text);
      }
      #screen-cpi-obs .ov-card-title i {
        font-size: 15px;
        color: var(--accent);
      }
      #screen-cpi-obs .ov-metrics {
        display: grid;
        gap: 0;
      }
      #screen-cpi-obs .ov-metrics.cols-2 {
        grid-template-columns: 1fr 1fr;
      }
      #screen-cpi-obs .ov-metrics.cols-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
      #screen-cpi-obs .ov-metric {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        padding: 0 14px;
      }
      #screen-cpi-obs .ov-metric:first-child {
        padding-left: 0;
      }
      #screen-cpi-obs .ov-metric:last-child {
        padding-right: 0;
      }
      #screen-cpi-obs .ov-metric + .ov-metric {
        border-left: 1px solid rgba(15, 23, 42, 0.06);
      }

      /* ── Labor Market Overview — comparison matrix ─────────────────────────
         A native Bayaan matrix built entirely from the page's own tokens: the
         .obs-card shell, --text/--text2/--border colours, the --up (#dc2626) /
         --down (#16a34a) semantic pair, the accent icon-chip recipe (cf.
         .impact-icon), and the existing subtle divider rgba(15,23,42,.06).
         Layout-only; no shared files touched. */
      #screen-cpi-obs .lmo-matrix-card {
        padding: 0;
        overflow: hidden; /* clip cell dividers to the card's 16px radius */
      }
      #screen-cpi-obs .lmo-matrix {
        display: grid;
        grid-template-columns: max-content repeat(3, minmax(0, 1fr));
      }
      /* Row wrappers dissolve into the parent grid so every column stays aligned
         across the header and all three body rows. */
      #screen-cpi-obs .lmo-matrix-row {
        display: contents;
      }
      #screen-cpi-obs .lmo-matrix-corner,
      #screen-cpi-obs .lmo-matrix-colhead,
      #screen-cpi-obs .lmo-matrix-rowlabel,
      #screen-cpi-obs .lmo-matrix-cell {
        padding: 16px;
        min-width: 0;
      }
      /* Header — icon chip above the column title. */
      #screen-cpi-obs .lmo-matrix-colhead {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      #screen-cpi-obs .lmo-matrix-ico {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 9%, white);
      }
      #screen-cpi-obs .lmo-matrix-ico i {
        font-size: 16px;
        line-height: 1;
      }
      #screen-cpi-obs .lmo-matrix-coltitle {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      /* Row label column. */
      #screen-cpi-obs .lmo-matrix-rowlabel {
        display: flex;
        align-items: center;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        white-space: nowrap;
      }
      /* Intersection cell — large bold metric + trend change. */
      #screen-cpi-obs .lmo-matrix-cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #screen-cpi-obs .lmo-cell-val {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      #screen-cpi-obs .lmo-cell-chg {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }
      #screen-cpi-obs .lmo-cell-chg i {
        font-size: 13px;
      }
      #screen-cpi-obs .lmo-cell-chg--pos {
        color: var(--down); /* green = positive */
      }
      #screen-cpi-obs .lmo-cell-chg--neg {
        color: var(--up); /* red = negative */
      }
      /* Dividers — reuse the page's subtle rule colour. Column dividers on the
         left edge of every data/header column (never the label column); row
         dividers on the top edge of each body row (header carries none). */
      #screen-cpi-obs .lmo-matrix-colhead,
      #screen-cpi-obs .lmo-matrix-cell {
        border-left: 1px solid rgba(15, 23, 42, 0.06);
      }
      #screen-cpi-obs .lmo-matrix-row:not(.lmo-matrix-row--head) .lmo-matrix-rowlabel,
      #screen-cpi-obs .lmo-matrix-row:not(.lmo-matrix-row--head) .lmo-matrix-cell {
        border-top: 1px solid rgba(15, 23, 42, 0.06);
      }
      html[data-theme="dark"] #screen-cpi-obs .lmo-matrix-colhead,
      html[data-theme="dark"] #screen-cpi-obs .lmo-matrix-cell,
      html[data-theme="dark"] #screen-cpi-obs .lmo-matrix-row:not(.lmo-matrix-row--head) .lmo-matrix-rowlabel,
      html[data-theme="dark"] #screen-cpi-obs .lmo-matrix-row:not(.lmo-matrix-row--head) .lmo-matrix-cell {
        border-color: var(--border);
      }
      html[data-theme="dark"] #screen-cpi-obs .lmo-matrix-ico {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      /* Responsive — scroll horizontally on very narrow viewports rather than
         collapsing the comparison (values stay aligned under their columns). */
      @media (max-width: 720px) {
        #screen-cpi-obs .lmo-matrix-card {
          overflow-x: auto;
        }
        #screen-cpi-obs .lmo-matrix {
          min-width: 480px;
        }
      }

      /* ── Emiratization section ─────────────────────────────────────────────
         Built from the page's existing atoms — .obs-card, the .ov-metric
         divided-column pattern, .section-hdr, .driver-grid, buildObsSparkline —
         plus the --up/--down semantic pair and accent tokens. Tone helpers
         .lmo-pos/.lmo-neg map positive→green(var(--down)), negative→red(var(--up)).
         Layout only; no shared files touched. */
      #screen-cpi-obs .lmo-emir {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      #screen-cpi-obs .lmo-emir-hdr .section-hdr {
        margin-bottom: 6px;
      }
      #screen-cpi-obs .lmo-emir-sub {
        margin: 0;
        font-size: 13px;
        color: var(--text2);
        line-height: 1.5;
      }
      #screen-cpi-obs .lmo-subhdr {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 15px;
        font-weight: 700;
        color: var(--navy);
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .lmo-pos { color: var(--down); }
      #screen-cpi-obs .lmo-neg { color: var(--up); }

      /* Executive Overview KPI cards — additive slots on the .lmo-kpi component:
         a title eyebrow, an optional secondary caption, and a bottom-aligned
         sector-chip footer. Tokens mirror existing .lmo-kpi-label / .lmo-tag. */
      #screen-cpi-obs .lmo-subhdr i { font-size: 17px; color: var(--accent); }
      #screen-cpi-obs .lmo-ovv-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
      }
      #screen-cpi-obs .lmo-ovv-caption {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      #screen-cpi-obs .lmo-ovv-foot {
        margin-top: auto; /* pin chip to the bottom so all cards align */
        padding-top: 4px;
      }
      /* Keep the top-right status pill centred with the icon chip. */
      #screen-cpi-obs .lmo-ovv .lmo-kpi-top .lmo-badge {
        margin-top: 0;
        align-self: center;
      }
      /* Executive Overview KPI cards are static — no click/hover affordance.
         Neutralize the global .obs-card hover lift + shadow and any pointer. */
      #screen-cpi-obs .lmo-ovv { cursor: default; }
      #screen-cpi-obs .lmo-ovv:hover { transform: none; }
      html:not([data-theme="dark"]) #screen-cpi-obs .lmo-ovv:hover {
        border-color: #eaecf0;
        box-shadow: var(--figma-subcard-shadow);
      }
      html[data-theme="dark"] #screen-cpi-obs .lmo-ovv:hover {
        border-color: var(--border);
        box-shadow: none;
      }

      /* ── Workforce Localization Progress by Sector — subsection header with
         carousel actions + insight cards. Reuses .lmo-subhdr, .lmo-qa, the
         home-carousel nav, .dg-card, and the .lmo-bar progress bar. ── */
      #screen-cpi-obs .lmo-subhdr-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      #screen-cpi-obs .lmo-subhdr-lead .lmo-subhdr { margin-bottom: 4px; }
      #screen-cpi-obs .lmo-subhdr-sub {
        margin: 0;
        font-size: 13px;
        color: var(--text2);
        line-height: 1.5;
      }
      #screen-cpi-obs .lmo-subhdr-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      /* Header-mounted carousel nav — drop the default centred/margin layout
         and the dots (the header exposes only prev/next). */
      /* Compound selector so margin-top:0 beats the base .dg-carousel-nav's
         14px (the header nav sits inline with the AI/Download actions, not
         below a track). */
      #screen-cpi-obs .dg-carousel-nav.lmo-hdr-nav {
        margin-top: 0;
        gap: 2px;
      }
      /* Keep the header prev/next arrows visible even when nothing currently
         overflows (compound selector outranks the base .dg-carousel-nav.is-single
         display:none). Arrows enable/disable per scroll position via the app's
         carousel controller. */
      #screen-cpi-obs .dg-carousel-nav.lmo-hdr-nav.is-single { display: flex; }
      #screen-cpi-obs .lmo-hdr-nav .home-carousel-dots { display: none; }

      /* 3 cards per view (the shared .dg-slide is 2-up; scope the override). */
      #screen-cpi-obs .lmo-loc-track .dg-slide {
        flex: 0 0 calc((100% - 28px) / 3);
      }
      #screen-cpi-obs .lmo-loc-card { gap: 12px; }
      #screen-cpi-obs .lmo-loc-valrow {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      #screen-cpi-obs .lmo-loc-val {
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      #screen-cpi-obs .lmo-loc-insight {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--text2);
      }
      #screen-cpi-obs .lmo-loc-foot { gap: 4px; }

      /* ── Localization cards (Sector + Domain carousels) adopt the home-page
         indicator (.product-card) look: category pill + actions, bold name,
         large value, coloured change, a sparkline graph (replacing the old
         progress bar) and a footer AI insight. Scoped to .lmo-ind-card so the
         Key Indicators cards (which share .lmo-loc-card) are untouched. The
         shared .product-card rules in style.css only apply under a
         .products-grid ancestor, so the recipe is restated here. ── */
      #screen-cpi-obs .lmo-ind-card {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 14px 16px;
      }
      #screen-cpi-obs .lmo-ind-card .product-card-toprow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      #screen-cpi-obs .lmo-ind-card .product-cat-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: #6b7280;
        background: #f3f4f6;
        border-radius: 5px;
        padding: 2px 8px;
        max-width: 70%;
      }
      #screen-cpi-obs .lmo-ind-card .product-cat-tag i { font-size: 11px; }
      #screen-cpi-obs .lmo-ind-card .product-cat-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #screen-cpi-obs .lmo-ind-card .product-actions {
        display: flex;
        gap: 1px;
        color: #9ca3af;
        flex-shrink: 0;
      }
      #screen-cpi-obs .lmo-ind-card .product-actions i {
        font-size: 15px;
        cursor: pointer;
        padding: 3px;
      }
      #screen-cpi-obs .lmo-ind-card .product-actions i:hover { color: var(--accent); }
      #screen-cpi-obs .lmo-ind-card .product-name-row {
        display: flex;
        align-items: flex-start;
        margin-bottom: 8px;
      }
      #screen-cpi-obs .lmo-ind-card .product-name {
        font-size: 14px;
        font-weight: 600;
        min-height: 40px;
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #screen-cpi-obs .lmo-ind-card .product-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.1;
      }
      /* Key Indicators keep the "Good" status badge inline beside the value. */
      #screen-cpi-obs .lmo-ind-card .lmo-key-valrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #screen-cpi-obs .lmo-ind-card .product-change {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 500;
        margin-top: 3px;
        margin-bottom: 8px;
      }
      #screen-cpi-obs .lmo-ind-card .product-change i { font-size: 13px; }
      #screen-cpi-obs .lmo-ind-card .product-change.val-green { color: #059669; }
      #screen-cpi-obs .lmo-ind-card .product-change.val-red { color: #dc2626; }
      #screen-cpi-obs .lmo-ind-card .product-viz {
        width: 100%;
        height: 92px;
        position: relative;
        margin-bottom: 2px;
      }
      #screen-cpi-obs .lmo-ind-card .product-viz svg,
      #screen-cpi-obs .lmo-ind-card .product-viz .highcharts-container {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #screen-cpi-obs .lmo-ind-card .product-viz .highcharts-container {
        overflow: visible !important;
      }
      /* Highcharts injects the axis labels, so hide the static fallback axis
         once a chart mounts (matches the home page's data-hc-axis behaviour). */
      #screen-cpi-obs .lmo-ind-card[data-hc-axis="1"] .product-axis {
        display: none !important;
      }
      #screen-cpi-obs .lmo-ind-card .product-axis {
        display: flex;
        justify-content: space-between;
        font-size: 9.5px;
        color: #9ca3af;
        margin-bottom: 10px;
      }
      #screen-cpi-obs .lmo-ind-card .product-ai-row {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        font-size: 11px;
        color: var(--text2);
        line-height: 1.5;
        margin-top: auto;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      #screen-cpi-obs .lmo-ind-card .product-ai-row .ti-bulb {
        font-size: 12px;
        color: var(--accent);
        flex-shrink: 0;
        margin-top: 1px;
      }

      @media (max-width: 1080px) {
        #screen-cpi-obs .lmo-loc-track .dg-slide { flex: 0 0 calc((100% - 14px) / 2); }
      }
      @media (max-width: 620px) {
        #screen-cpi-obs .lmo-loc-track .dg-slide { flex: 0 0 100%; }
        #screen-cpi-obs .lmo-subhdr-row { flex-direction: column; }
      }

      /* ── Key Indicators — same insight-card carousel, 4-up, with a section
         header (matching the app's 20px .cpi-section-title) + reused actions. */
      #screen-cpi-obs .lmo-key-hdr {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      /* 4 cards per view (3 gaps of 14px). */
      #screen-cpi-obs .lmo-key-track .dg-slide {
        flex: 0 0 calc((100% - 42px) / 4);
      }
      #screen-cpi-obs .lmo-key-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #screen-cpi-obs .lmo-key-top .lmo-badge {
        margin-top: 0;
        align-self: center;
      }
      #screen-cpi-obs .lmo-key-title { min-height: 2.5em; }
      @media (max-width: 1080px) {
        #screen-cpi-obs .lmo-key-track .dg-slide { flex: 0 0 calc((100% - 14px) / 2); }
      }
      @media (max-width: 620px) {
        #screen-cpi-obs .lmo-key-track .dg-slide { flex: 0 0 100%; }
        #screen-cpi-obs .lmo-key-hdr { flex-direction: column; align-items: flex-start; }
      }

      /* ── Labor Supply–Demand Analysis — tabs + Sankey/table visualization
         card. Reuses .obs-card, the .dg-view-toggle segmented control (year +
         Sankey/Table), .dg-table, .lmo-qa actions, and the app's colour tokens.
         The Sankey is a hand-built SVG (no charting lib is loaded). ── */
      #screen-cpi-obs .lmo-lsd-tabs {
        display: flex;
        gap: 20px;
        border-bottom: 1px solid var(--border, #eaecf0);
        margin-bottom: 16px;
      }
      #screen-cpi-obs .lmo-lsd-tab {
        appearance: none;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 10px 2px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text2);
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
      }
      #screen-cpi-obs .lmo-lsd-tab:hover { color: var(--text); }
      #screen-cpi-obs .lmo-lsd-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      #screen-cpi-obs .lmo-lsd-card { position: relative; }
      #screen-cpi-obs .lmo-lsd-topbar {
        display: flex;
        justify-content: center;
        margin-bottom: 12px;
      }
      /* Compound selectors (…dg-view-toggle.lmo-lsd-*) so these beat the base
         .dg-view-toggle button rule regardless of source order. */
      #screen-cpi-obs .dg-view-toggle.lmo-lsd-years {
        margin: 0;
        flex-wrap: wrap;
        justify-content: center;
        gap: 3px;
        max-width: 100%;
      }
      #screen-cpi-obs .dg-view-toggle.lmo-lsd-years button {
        width: auto;
        min-width: 40px;
        height: 26px;
        padding: 0 9px;
        font-size: 11.5px;

      #screen-cpi-obs .lmo-ov-legmeta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; line-height: 1.2; }
      #screen-cpi-obs .lmo-ov-legval { font-weight: 700; color: var(--text); }
      #screen-cpi-obs .lmo-ov-legchg--pos { display: inline-flex; align-items: center; gap: 2px; color: #16a34a; font-weight: 600; }
      #screen-cpi-obs .lmo-ov-legchg--neg { display: inline-flex; align-items: center; gap: 2px; color: #dc2626; font-weight: 600; }
      html[data-theme="dark"] #screen-cpi-obs .lmo-ov-card { --lmo-donut-track: rgba(255, 255, 255, 0.12); }
      html[data-theme="dark"] #screen-cpi-obs .lmo-ov-ico { background: color-mix(in srgb, var(--accent) 20%, transparent); }
      @media (max-width: 1100px) {
        #screen-cpi-obs .lmo-ov-grid { grid-template-columns: 1fr; }
      }

      /* Executive-summary briefing + spotlight movers row. */
      #screen-cpi-obs .lmo-split--brief { grid-template-columns: 1.15fr 1fr; }
      #screen-cpi-obs .lmo-brief {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px 20px;
      }
      #screen-cpi-obs .lmo-brief-hdr { display: flex; align-items: center; gap: 11px; }
      #screen-cpi-obs .lmo-brief-ico {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, white);
      }
      #screen-cpi-obs .lmo-brief-ico i { font-size: 17px; }
      #screen-cpi-obs .lmo-brief-title { font-size: 13.5px; font-weight: 700; color: var(--text); }
      #screen-cpi-obs .lmo-brief-sub { font-size: 11px; color: var(--muted); }
      #screen-cpi-obs .lmo-brief-text {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--text2);
      }
      #screen-cpi-obs .lmo-brief-text b { color: var(--text); font-weight: 700; }
      #screen-cpi-obs .lmo-brief-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
      #screen-cpi-obs .lmo-tag {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-light);
        border-radius: 100px;
        padding: 3px 10px;
      }

      /* Spotlight "mover" cards. */
      #screen-cpi-obs .lmo-spot-stack { display: flex; flex-direction: column; gap: 12px; }
      #screen-cpi-obs .lmo-spot {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        padding: 16px 18px;
        flex: 1;
      }
      #screen-cpi-obs .lmo-spot-ico {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        color: var(--down);
        background: color-mix(in srgb, var(--down) 12%, white);
      }
      #screen-cpi-obs .lmo-spot-ico i { font-size: 20px; }
      #screen-cpi-obs .lmo-spot-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #screen-cpi-obs .lmo-spot-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      #screen-cpi-obs .lmo-spot-val {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      #screen-cpi-obs .lmo-spot-val i { font-size: 17px; }
      #screen-cpi-obs .lmo-spot-desc { font-size: 12px; color: var(--text2); line-height: 1.4; }

      /* Shared badge pill (carried over from the previous build). */
      #screen-cpi-obs .lmo-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        align-self: flex-start;
        max-width: 100%;
        margin-top: 4px;
        padding: 3px 9px;
        border-radius: 100px;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--down);
        background: color-mix(in srgb, var(--down) 10%, white);
      }
      #screen-cpi-obs .lmo-badge i { font-size: 12px; flex-shrink: 0; }
      #screen-cpi-obs .lmo-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Dark theme — tracks/tints/dividers defer to the page's dark tokens. */
      html[data-theme="dark"] #screen-cpi-obs .lmo-bar-track,
      html[data-theme="dark"] #screen-cpi-obs .lmo-panel-note {
        background: rgba(255, 255, 255, 0.08);
      }
      html[data-theme="dark"] #screen-cpi-obs .lmo-panel--donut { --lmo-donut-track: rgba(255, 255, 255, 0.12); }
      html[data-theme="dark"] #screen-cpi-obs .lmo-donut-insight { border-color: var(--border); }
      html[data-theme="dark"] #screen-cpi-obs .lmo-kpi-ico,
      html[data-theme="dark"] #screen-cpi-obs .lmo-bar-ico,
      html[data-theme="dark"] #screen-cpi-obs .lmo-brief-ico {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .lmo-spot-ico { background: color-mix(in srgb, var(--down) 22%, transparent); }

      /* Responsive. */
      @media (max-width: 1100px) {
        #screen-cpi-obs .lmo-kpi-band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #screen-cpi-obs .lmo-split,
        #screen-cpi-obs .lmo-split--brief { grid-template-columns: 1fr; }
      }
      @media (max-width: 620px) {
        #screen-cpi-obs .lmo-kpi-band { grid-template-columns: 1fr; }
        #screen-cpi-obs .lmo-bar-row { grid-template-columns: 1fr auto; }
        #screen-cpi-obs .lmo-bar-track { grid-column: 1 / -1; order: 3; }
      }
      /* Raised from 1100px: with equal thirds, three cards side by side need
         ~1250px before CPI-by's 26px figures start colliding with their track. */
      @media (max-width: 1250px) {
        #screen-cpi-obs .cpi-overview-grid {
          grid-template-columns: 1fr;
        }
      }

      /* The breadcrumb sits outside .page-wrap, so it clears neither the 120px
         sidebar rail nor the page gutter — it falls back to the global
         .container inline padding of 32px. Realign it with the content column
         (rail + --page-gutter on the left, --page-gutter on the right). */
      #screen-cpi-obs .crisis-scroll > .container {
        /* mirrors .sidebar-rail min-width in css/pages/obs-sidebar.css */
        --obs-rail-w: 120px;
        padding-inline: calc(var(--obs-rail-w) + var(--page-gutter))
          var(--page-gutter);
      }

      /* Sidebar on brand primary (--accent / #0066FF) instead of the legacy
         navy #0c4a8e, mirroring the #screen-topic variant already in
         css/pages/obs-sidebar.css. Dark theme is left alone — it resolves to
         var(--accent) already. */
      html:not([data-theme="dark"]) #screen-cpi-obs .sidebar-icon {
        background: #ebf3ff;
        color: var(--accent);
      }
      html:not([data-theme="dark"])
        #screen-cpi-obs
        .sidebar-item:hover:not(.active):not(.sidebar-item--ai)
        .sidebar-icon {
        background: #dbe9ff;
      }
      html:not([data-theme="dark"])
        #screen-cpi-obs
        .sidebar-item.active:not(.sidebar-item--ai)
        .sidebar-icon {
        background: var(--accent);
        color: #fff;
      }

      /* AI entry point on the app's AI gradient — same fill as .ai-mode-btn in
         style.css, the "AI Mode" button in the top nav. Replaces the pale blue
         tint, which read as just another idle item. */
      /* .sidebar in the chain so this outranks both the light-theme
         .sidebar-icon rule above and the dark-theme one in css/theme.css. */
      html #screen-cpi-obs .sidebar .sidebar-item--ai .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition: transform 0.15s, box-shadow 0.2s;
      }
      html #screen-cpi-obs .sidebar .sidebar-item--ai:hover .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        transform: scale(1.04);
      }

      /* Standard expanding icon rail — icon-only by default; hovering the pill
         reveals every label at once (labels slide out to the right of every
         icon together, no per-item tooltips). */
      #screen-cpi-obs .sidebar {
        top: calc(50% + 34px);
        max-width: none;
        border-radius: 999px;
        align-items: stretch;
        transition: none;
      }
      /* When expanded (labels out), soften to a rounded rectangle so the long
         pill doesn't get awkward capsule ends. */
      #screen-cpi-obs .sidebar:hover {
        border-radius: 28px;
      }
      #screen-cpi-obs .sidebar-item {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 4px 4px;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-item {
        justify-content: flex-start;
        gap: 10px;
      }
      #screen-cpi-obs .sidebar-label {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        transition: max-width 0.22s ease, opacity 0.18s ease;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-label {
        max-width: 120px;
        opacity: 1;
      }
      #screen-cpi-obs .sidebar-item.active:not(.sidebar-item--ai) .sidebar-label {
        color: #272829;
      }
      html[data-theme="dark"] #screen-cpi-obs .sidebar-label {
        color: #cdd6e0;
      }
      #screen-cpi-obs .sidebar-item--ai .sidebar-label {
        color: #0066ff;
      }
      /* Divider between the AI entry and the view switcher. Stretches to the
         sidebar's inner width, so it grows as the pill expands on hover. */
      #screen-cpi-obs .sidebar-divider {
        width: 16px;
        height: 2px;
        border-radius: 999px;
        background: #e2e8f0;
        margin: 1px 0 1px 15px;
        align-self: flex-start;
        transition: width 0.22s ease, margin-left 0.22s ease;
      }
      #screen-cpi-obs .sidebar:hover .sidebar-divider {
        width: calc(100% - 12px);
        margin-left: 6px;
      }
      html[data-theme="dark"] #screen-cpi-obs .sidebar-divider {
        background: #3a4453;
      }

      /* ====================================================================
         DIAGNOSE VIEW
         Styled to the CPI page's own design system: neutral .obs-card surfaces,
         the shared section-module shell, .kpi-label typography, the --up/--down
         semantic tones, and the app's home-carousel navigation for every
         overflow row. No new colour language is introduced — tone lives only on
         values, the risk pill, and header/insight icons.
         ==================================================================== */
      #screen-cpi-obs #cpi-diagnose-content {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      /* The view containers carry `display` rules that would otherwise beat the
         [hidden] attribute the tab switch toggles — restore hide behaviour with
         a higher-specificity rule (id + attribute). */
      #screen-cpi-obs #cpi-obs-content[hidden],
      #screen-cpi-obs #cpi-diagnose-content[hidden] {
        display: none;
      }

      /* ── View header ── */
      #screen-cpi-obs .dg-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      #screen-cpi-obs .dg-title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #screen-cpi-obs .dg-scan {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent-light);
        color: var(--accent);
        font-size: 21px;
        flex-shrink: 0;
      }
      #screen-cpi-obs .dg-month {
        display: inline-flex;
        align-items: center;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 9px;
        border-radius: 100px;
        background: var(--accent-light);
        color: var(--accent);
        line-height: 1.4;
      }
      #screen-cpi-obs .dg-title-col {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      #screen-cpi-obs .dg-h1 {
        font-size: 21px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
        line-height: 1.1;
      }
      #screen-cpi-obs .dg-search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 240px;
        padding: 9px 12px;
        border-radius: 12px;
        border: 1px solid var(--border, #eaecf0);
        background: var(--surface, #fff);
        color: var(--text2);
        font-size: 13px;
      }
      #screen-cpi-obs .dg-search i {
        font-size: 16px;
      }
      #screen-cpi-obs .dg-search .dg-kbd {
        margin-left: auto;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--accent-light);
        color: var(--accent);
      }

      /* ── Two-panel row — each panel is a section module (same shell as the
         Analytics section and the Interpret view's sections). ── */
      #screen-cpi-obs .dg-panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
      }
      /* Raised from 640px: each panel carries an AI Summary plus a category
         carousel, so two side by side start clipping their cards well before
         640px. Stack them (Stable & optimized drops below Needs attention)
         once the content column tightens. */
      @media (max-width: 1024px) {
        #screen-cpi-obs .dg-panels {
          grid-template-columns: 1fr;
        }
      }

      /* Section body — the AI Summary stacked above the category carousel
         (full width), mirroring the Briefing Desk content order. */
      #screen-cpi-obs .dg-body {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #screen-cpi-obs .dg-indicators {
        min-width: 0;
      }

      /* AI Summary callout — the app's AI-insight treatment: blue→violet
         gradient tint, sparkle + "AI Summary" header. Ref: .hw-ai-insight in
         css/pages/built-widget-module.css. */
      #screen-cpi-obs .dg-aisummary {
        position: relative;
        padding: 0;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.06), rgba(124, 58, 237, 0.04));
        border: 1px solid rgba(0, 102, 255, 0.12);
      }
      /* Text spans the full width so the summary height is driven purely by the
         copy — this keeps the taller "Needs attention" box in step with the
         shorter "Stable" one instead of the art squeezing the text into extra
         wrapped lines. A right pad reserves room for the overlaid illustration. */
      #screen-cpi-obs .dg-aisummary-text {
        padding: 15px 88px 15px 18px;
      }
      /* Illustration is taken out of flow and anchored to the top/bottom/right
         edges, so it fills the summary height without inflating it. No fixed
         dimensions: width is a share of the summary, height follows the box. */
      #screen-cpi-obs .dg-aisummary-art {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30%;
        height: 100%;
        object-fit: cover;
        object-position: center right;
      }
      /* "Needs attention" copy is longer, so its art is narrowed to leave room
         for the text on single lines — this keeps the box the same height as the
         shorter "Stable" summary instead of wrapping into a taller block.
         The magnifier illustration is near-square, so it's contained (not
         cover-cropped) to keep the whole icon in frame. */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary-art {
        width: 20%;
        object-fit: contain;
        object-position: top right;
      }
      /* Extra right-pad reserves room for the enlarged magnifier so the copy
         still clears it (the summary grows a little taller as a result). */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary-text {
        padding-right: 92px;
      }
      /* On narrow screens the summary is too tight for the overlaid art without
         cropping it or pushing it out of place, so drop it and let the copy
         reclaim the full width. */
      @media (max-width: 768px) {
        #screen-cpi-obs .dg-aisummary-art {
          display: none;
        }
        #screen-cpi-obs .dg-aisummary-text,
        #screen-cpi-obs .dg-panel--warn .dg-aisummary-text {
          padding-right: 18px;
        }
      }
      #screen-cpi-obs .dg-aisummary-hd {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent, #0066ff);
        margin-bottom: 8px;
      }
      #screen-cpi-obs .dg-aisummary-hd i {
        font-size: 14px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-aisummary {
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.12), rgba(124, 58, 237, 0.10));
        border-color: rgba(0, 102, 255, 0.25);
      }
      /* In the "Needs attention" panel the AI Summary reads as an alert, so it
         takes the red chip tint (matches .dg-pill--accel) instead of the blue
         AI gradient. The "Stable & optimized" panel keeps the blue treatment. */
      #screen-cpi-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
        border-color: color-mix(in srgb, var(--up, #e5484d) 20%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 22%, transparent);
        border-color: color-mix(in srgb, var(--up, #e5484d) 35%, transparent);
      }
      /* "Stable & optimized" panel — AI Summary takes the green chip tint
         (matches .dg-pill--stable / --down) to read as healthy. */
      #screen-cpi-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 12%, white);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 35%, transparent);
      }
      #screen-cpi-obs .dg-eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: #718198;
        margin-bottom: 12px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-eyebrow {
        color: var(--text-secondary);
      }

      /* Summary points — compact text rows: a tone-coloured bold label followed
         by the copy, no icon and no dividers. */
      #screen-cpi-obs .dg-points {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #screen-cpi-obs .dg-point {
        --tone: #246bfd;
        font-size: 12px;
        line-height: 1.55;
        color: #536277;
      }
      #screen-cpi-obs .dg-point--critical {
        --tone: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-point--good {
        --tone: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-point--info {
        --tone: var(--text-primary, #0f172a);
      }
      #screen-cpi-obs .dg-point-tx b {
        color: var(--tone);
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-point {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-point-tx b {
        color: var(--text-primary);
      }
      #screen-cpi-obs .dg-panel,
      #screen-cpi-obs .dg-section {
        background:
          linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 28px;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
        padding: 24px 28px 28px;
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-panel,
      html[data-theme="dark"] #screen-cpi-obs .dg-section {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
      }
      #screen-cpi-obs .dg-panel-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #screen-cpi-obs .dg-panel-hdr .dg-lead {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      #screen-cpi-obs .dg-panel--warn .dg-lead {
        color: var(--up, #e5484d);
      }
      #screen-cpi-obs .dg-panel--ok .dg-lead {
        color: var(--down, #0c9b70);
      }
      #screen-cpi-obs .dg-panel-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      #screen-cpi-obs .dg-panel-sub {
        font-size: 12.5px;
        color: var(--text2);
        margin: 4px 0 16px 31px;
      }

      /* ── Insight / status callout — neutral obs-card surface, tone only on the
         icon chip so it reads as advisory, not alarming. ── */
      #screen-cpi-obs .dg-insight {
        position: relative;
        display: flex;
        gap: 11px;
        align-items: flex-start;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
        font-size: 12.5px;
        line-height: 1.7;
        color: var(--text2);
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--border, #eaecf0);
        box-shadow: 0 24px 30px 0 rgba(42, 61, 76, 0.03);
      }
      html[data-theme="dark"] #screen-cpi-obs .dg-insight {
        background: color-mix(in srgb, var(--accent) 6%, transparent);
        border-color: var(--border);
        color: var(--text-secondary);
      }
      #screen-cpi-obs .dg-insight-ic {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 16px;
        margin-top: 1px;
        color: var(--accent);
        background: var(--accent-light);
      }
      #screen-cpi-obs .dg-insight--warn .dg-insight-ic {
        color: var(--up, #e5484d);
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
      }

  <body>
    <!-- ==================== SCREEN: CPI OBSERVATORY (standalone) ==================== -->
    <div id="screen-cpi-obs" class="screen ws-screen active">

                <span class="sidebar-label">Diagnose</span>
              </button>
              <!-- Forecast/Benchmark/Observe/Trade get their own pages later —
                   kept as buttons for now (no links until those pages exist). -->
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">
                <div class="sidebar-icon"><i class="ti ti-chart-line"></i></div>
                <span class="sidebar-label">Forecast</span>
              </button>
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">
                <div class="sidebar-icon"><i class="ti ti-chart-bar"></i></div>

                <div class="sidebar-icon"><i class="ti ti-eye"></i></div>
                <span class="sidebar-label">Observe</span>
              </button>

                  </div>

                      <i class="ti ti-search" aria-hidden="true"></i> Search… <span class="cpi-hdr-kbd">Ctrl+K</span>
                    </div>

                    </button>
                  </div>

              </div>

              <div id="cpi-diagnose-content" class="cpi-obs-content" hidden></div>

    <script>
      /* ============================================================
         Standalone stubs — this page is intentionally isolated and
         does NOT link back into the main application. The shared
         top navigation and breadcrumb are kept for visual parity;
         their cross-screen actions are no-ops here.
         ============================================================ */
      function goTo() {}
      function openGeoView(e) { if (e) e.preventDefault(); }
      function openBayaanSpace(e) { if (e) e.preventDefault(); }
      function openProducts(e) { if (e) e.preventDefault(); }
      function openObservatories(e) { if (e) e.preventDefault(); }
      function openWsDrp() {}
      function onHeaderSearchClick() {}
      function openObsSidebarAI(el) { activateSidebar(el); }
      function toast() {}

      function activateSidebar(el) {
        const sidebar = el.closest(".sidebar");
        (sidebar || document)
          .querySelectorAll(".sidebar-item")
          .forEach((s) => s.classList.remove("active"));
        el.classList.add("active");

        /* Only Interpret has content today; every other item (Diagnose,
           Forecast, Benchmark, Observe, Trade) is a placeholder that will get
           its own page later, so they all fall back to Interpret and the page
           never goes blank. */
        const interpret = document.getElementById("cpi-obs-content");
        const diagnose = document.getElementById("cpi-diagnose-content");
        if (!interpret) return;
        interpret.hidden = false;
        if (diagnose) diagnose.hidden = true;
        const hdrSearch = document.getElementById("cpi-hdr-search");
        if (hdrSearch) hdrSearch.hidden = true;
      }

      /* ── Observatory content builders (shared with the main app) ── */
      function buildObsSectionHdr(title, icon, action) {
        const actionHtml = action
          ? `<span class="obs-section-action">${action} <i class="ti ti-arrow-right"></i></span>`
          : "";
        return `<div class="section-hdr">
  <h2 class="cpi-section-title"><i class="ti ${icon || "ti-circle"}" aria-hidden="true"></i>${title}</h2>
  ${actionHtml}
</div>`;
      }

      /* Sparklines follow the home page card chart (renderBriefKpi in
         index.html): a tinted area path under a round-joined line, drawn in an
         84×30 box with the baseline at y=27. Point data stays in its original
         100×32 space and is rescaled here, so the data arrays are untouched. */
      const OBS_SPARK_COLOR = {
        "sp-up": "#e5484d",
        "sp-down": "#0c9b70",
        "sp-neutral": "#246bfd",
        "sp-flat": "#8b93a7",
      };

      /* Unique gradient id per sparkline so each SVG's fill fade is isolated. */
      let obsSparkId = 0;

      function buildObsSparkline(points, cls) {
        const color = OBS_SPARK_COLOR[cls] || OBS_SPARK_COLOR["sp-flat"];
        const pts = points
          .trim()
          .split(/\s+/)
          .map((pair) => {
            const [x, y] = pair.split(",").map(Number);
            /* x → [1,83], y → [0,27] so the curve never dips below baseline */
            return [1 + (x / 100) * 82, (y / 32) * 27];
          });
        if (!pts.length) return "";

        const fmt = (n) => Math.round(n * 100) / 100;

        /* Smooth line via Catmull-Rom → cubic bézier, matching the smooth
           gradient sparklines used by the Indicators screen on the home page
           (indBuildSparkline / Chart.js tension: 0.4). */
        let line = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
        if (pts.length < 3) {
          line = `M${pts.map(([x, y]) => `${fmt(x)} ${fmt(y)}`).join(" L")}`;
        } else {
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i];
            const p1 = pts[i];
            const p2 = pts[i + 1];
            const p3 = pts[i + 2] || p2;
            const c1x = p1[0] + (p2[0] - p0[0]) / 6;
            const c1y = p1[1] + (p2[1] - p0[1]) / 6;
            const c2x = p2[0] - (p3[0] - p1[0]) / 6;
            const c2y = p2[1] - (p3[1] - p1[1]) / 6;
            line += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${fmt(p2[0])} ${fmt(p2[1])}`;
          }
        }

        const first = pts[0];
        const last = pts[pts.length - 1];
        const area = `${line} L${fmt(last[0])} 27 L${fmt(first[0])} 27 Z`;
        const gid = "obsSparkGrad" + obsSparkId++;

        /* preserveAspectRatio="none" lets the chart fill the full card width;
           non-scaling-stroke keeps the line an even weight despite the stretch.
           The area is a top-down gradient fade, same as the Indicators charts. */
        return `<svg viewBox="0 0 84 30" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <path class="obs-spark-area" fill="url(#${gid})" d="${area}"/>
  <path class="obs-spark-line" stroke="${color}" vector-effect="non-scaling-stroke" d="${line}"/>
</svg>`;
      }

      /* ── Year-over-year comparison charts ──
         Same multi-line, legended chart the home page's GCC comparison uses,
         but the series are the five most recent years rather than six GCC
         economies. Sequential blue scale: older years muted, the latest year
         emphasised (heavier stroke, on top). */
      const OBS_YEARS = [
        { year: "2022", color: "#c3d3ec" },
        { year: "2023", color: "#93b4e8" },
        { year: "2024", color: "#5b8bd9" },
        { year: "2025", color: "#2f66cf" },
        { year: "2026", color: "#1a3f86" },
      ];

      /* Catmull-Rom → cubic bézier, shared with buildObsSparkline's smoothing. */
      function obsSmoothPath(pts, fmt) {
        if (pts.length < 3) {
          return `M${pts.map(([x, y]) => `${fmt(x)} ${fmt(y)}`).join(" L")}`;
        }
        let d = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${fmt(p2[0])} ${fmt(p2[1])}`;
        }
        return d;
      }

      /* Derives five year-lines from one base spark: each year is the base
         trend shifted vertically (older years sit lower), with a little shape
         variation so the lines read as distinct traces. */
      /* One trend line spanning the five years (2022→2026), drawn in the app's
         Indicators sparkline style — a tinted blue area fade under a rounded
         line (buildObsSparkline). The years are read off the x-axis. */
      function buildObsYearChart(points) {
        return buildObsSparkline(points, "sp-neutral");
      }

      /* Five evenly-spaced year ticks under the chart (replaces the old colour
         legend). */
      function buildObsYearAxis() {
        return `<div class="obs-year-axis" aria-hidden="true">${OBS_YEARS.map(
          (yr) => `<span>&rsquo;${yr.year.slice(2)}</span>`
        ).join("")}</div>`;
      }

      function buildObsDriverCard(d) {
        return `<div class="obs-card driver-card">
  <div class="dc-head">
    <div class="dc-icon-wrap"><i class="ti ${d.icon}"></i></div>
    <div class="dc-title-col">
      <div class="dc-title">${d.title}</div>
      ${d.sub ? `<div class="dc-subtitle">${d.sub}</div>` : ""}
    </div>
    <div class="dc-date">${d.date}</div>
  </div>
  <div class="dc-value">${d.value}${d.unit ? `<small>${d.unit}</small>` : ""}</div>
  <div class="dc-changes">${d.changes}</div>
  <div class="dc-spark">${buildObsYearChart(d.spark)}</div>
  ${buildObsYearAxis()}
</div>`;
      }

      /* ── EMIRATIZATION SECTION (Labor Market Observatory) ──
