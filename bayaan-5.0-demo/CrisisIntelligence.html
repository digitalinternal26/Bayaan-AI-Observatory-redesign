        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6d7f95;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      #screen-crisis-obs .cpi-hero .brief-audio-action:hover {
        color: var(--brief-blue);
        background: #fff;
        box-shadow: 0 4px 10px rgba(36, 75, 125, 0.1);
        transform: scale(1.06);
      }
      #screen-crisis-obs .cpi-hero .brief-stop-box {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }
      #screen-crisis-obs .cpi-hero .brief-audio-action--stop:hover {
        color: var(--brief-red);
        background: #fff5f5;
      }
      #screen-crisis-obs .cpi-hero .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes ci-brief-wave {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 14px;
        }
      }
      @keyframes ci-brief-voice-ring {
        0% {
          transform: scale(0.82);
          opacity: 0.8;
        }
        80%,
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      /* ── KPI cards — ported from forecast.html's .fx-kpi strip (forecast.html:
         425-487): icon chip · uppercase label + value · period sub-line. Replaces
         the old .overview-card/.stat-pill row (still used by the Observe tab's
         signal-summary card, so those rules stay). .kpi-label and .cpiby-col-sub
         are cpi-obs.css:456 and :551, re-scoped here the same way. ── */
      #screen-crisis-obs .fx-kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      #screen-crisis-obs .fx-kpi {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border-radius: 16px;
        padding: 14px 16px;
        min-width: 0;
        transition: box-shadow 0.22s ease, border-color 0.22s ease,
          transform 0.22s ease, background 0.22s ease;
      }
      #screen-crisis-obs .fx-kpi:hover {
        transform: translateY(-1px);
      }
      #screen-crisis-obs .fx-kpi-ic {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        color: var(--tone, var(--accent));
        background: color-mix(in srgb, var(--tone, #0066ff) 9%, white);
      }
      #screen-crisis-obs .fx-kpi-ic i {
        font-size: 17px;
        line-height: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .fx-kpi-ic {
        background: color-mix(in srgb, var(--tone, #0066ff) 18%, transparent);
      }
      #screen-crisis-obs .fx-kpi-body {
        min-width: 0;
        flex: 1;
      }
      #screen-crisis-obs .fx-kpi-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-top: 8px;
      }
      #screen-crisis-obs .fx-kpi .cpiby-col-sub {
        margin-top: 3px;
      }
      #screen-crisis-obs .fx-kpi--total {
        --tone: #3b82f6;
      }
      #screen-crisis-obs .fx-kpi--critical {
        --tone: var(--red);
      }
      #screen-crisis-obs .fx-kpi--warning {
        --tone: var(--amber);
      }
      #screen-crisis-obs .fx-kpi--watch {
        --tone: var(--blue-watch);
      }
      #screen-crisis-obs .fx-kpi--stable {
        --tone: var(--green);
      }
      #screen-crisis-obs .kpi-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #screen-crisis-obs .cpiby-col-sub {
        font-size: 11.5px;
        color: var(--text2);
      }
      @media (max-width: 1200px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 480px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* ── Interior card surfaces: 16px radius + the slate-tinted card shadow,
         matching .obs-card (cpi-obs.css:395 + CPI.html:649). ── */
      #screen-crisis-obs .overview-card,
      #screen-crisis-obs .composite-card {
        border-radius: 16px;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
      }
      /* Indicator Analytics is now a <section>, so the 28px gradient module IS
         its card — strip the inner card chrome rather than nesting two.
         Matches CPI, where the Diagnose table sits straight on .dg-section. */
      #screen-crisis-obs .cio-pane > section.tasks-card {
        padding: 0;
        overflow: hidden;
      }
      #screen-crisis-obs .tasks-card {
        background: none;
        border: 0;
        box-shadow: none;
      }
      /* style.css's base .tasks-header is a single unwrapping flex row, so
         once the title + search + two filters can't all fit, the title TEXT
         itself is what shrinks and wraps ("Indicator" / "Analytics" on two
         lines), throwing off the header's vertical centering. CPI's section
         module header (observe.html:890-911's .ob-panel-hdr / .ob-hdr-right)
         wraps the whole actions cluster onto its own row instead and keeps
         the title intact — same fix, ported here. */
      #screen-crisis-obs .tasks-header {
        padding: 24px 28px 20px;
        border-bottom: 0;
        flex-wrap: wrap;
        row-gap: 12px;
      }
      #screen-crisis-obs .tasks-header h3 {
        white-space: nowrap;
      }
      #screen-crisis-obs .tasks-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      #screen-crisis-obs .tasks-filters {
        padding: 16px 28px 18px;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child {
        padding-left: 28px;
      }
      #screen-crisis-obs .tasks-card th:last-child,
      #screen-crisis-obs .tasks-card td:last-child {
        padding-right: 28px;
      }
      #screen-crisis-obs .tasks-card .pagination {
        padding: 14px 28px 22px;
        border-top: 0;
      }
      /* CPI removes the hover lift on cards (CPI.html:1015); the crisis default
         raised them on a pure-black shadow, which no CPI surface uses. */
      #screen-crisis-obs .composite-card {
        cursor: default;
        transition: border-color 0.22s ease, box-shadow 0.22s ease;
        animation: none;
      }
      #screen-crisis-obs .composite-card:hover {
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        transform: none;
      }
      /* style.css:10643 is `#screen-crisis-obs @keyframes fadeUp` — a qualified
         at-rule the parser discards, so fadeUp never registers and these four
         animations plus nine stagger delays are inert. CPI has no entry
         animation either; make that explicit rather than leave dead intent. */
      #screen-crisis-obs .overview-card,
      #screen-crisis-obs .tasks-card {
        animation: none;
      }
      /* Four composites, not five — the default grid left a dead fifth track. */
      #screen-crisis-obs .composite-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      #screen-crisis-obs .bm-panel {
        border-radius: 28px;
      }
      #screen-crisis-obs .bm-side .bm-panel {
        border-radius: 16px;
      }

      /* ── Display numerals: CPI sets 700 and negative tracking on every one,
         and uses tabular-nums rather than a mono face (CPI.html:711, :784).
         The --mono token on this screen aliases to Inter, so the mono request
         never resolved anyway. ── */
      #screen-crisis-obs .stat-pill-val,
      #screen-crisis-obs .gauge-val,
      #screen-crisis-obs td.td-val {
        font-family: var(--font);
        font-variant-numeric: tabular-nums;
      }
      #screen-crisis-obs .stat-pill-val {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      #screen-crisis-obs .gauge-val {
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* ── Titles and body copy ── */
      #screen-crisis-obs .comp-title {
        font-weight: 600;
      }
      #screen-crisis-obs .tasks-header h3 {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 18px;
        font-weight: 700;
      }
      #screen-crisis-obs .tasks-header h3 i {
        font-size: 20px;
        color: var(--accent);
      }
      #screen-crisis-obs .overview-text {
        font-size: 13.5px;
      }
      /* --muted (#94a3b8) on white is ~2.6:1 — below AA for body copy. */
      #screen-crisis-obs .comp-note,
      #screen-crisis-obs .pag-info {
        color: var(--text2);
      }

      /* ── Indicator table: CPI's .dg-table spec (CPI.html:1882-1921) ── */
      #screen-crisis-obs .tasks-card table {
        min-width: 640px;
      }
      #screen-crisis-obs .tasks-card th {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text2);
        background: transparent;
        text-align: right;
        padding: 0 16px 12px;
        border-bottom: 1px solid var(--border, #eaecf0);
      }
      #screen-crisis-obs .tasks-card td {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        text-align: right;
        padding: 13px 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.05);
        white-space: nowrap;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child,
      #screen-crisis-obs .tasks-card th:nth-child(2),
      #screen-crisis-obs .tasks-card td:nth-child(2),
      #screen-crisis-obs .tasks-card th:nth-child(3),
      #screen-crisis-obs .tasks-card td:nth-child(3) {
        text-align: left;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child {
        padding-left: 20px;
      }
      #screen-crisis-obs .tasks-card td.td-indicator {
        font-weight: 600;
        color: var(--text);
      }
      #screen-crisis-obs .tasks-card tbody tr {
        border-bottom: 0;
        transition: background 0.15s ease;
      }
      #screen-crisis-obs .tasks-card tbody tr:hover {
        background: var(--accent-light);
      }
      html[data-theme="dark"] #screen-crisis-obs .tasks-card td {
        border-color: color-mix(in srgb, var(--border) 60%, transparent);
      }
      /* Delta cells as CPI's tinted .dg-cell rather than bare coloured text. */
      #screen-crisis-obs .tasks-card td.td-mom,
      #screen-crisis-obs .tasks-card td.td-yoy {
        font-size: 13px;
      }
      #screen-crisis-obs .tasks-card .chg-up,
      #screen-crisis-obs .tasks-card .chg-down {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 9px;
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
      }
      #screen-crisis-obs .tasks-card .chg-up {
        background: color-mix(in srgb, var(--red) 9%, transparent);
      }
      #screen-crisis-obs .tasks-card .chg-down {
        background: color-mix(in srgb, var(--green) 9%, transparent);
      }
      #screen-crisis-obs th.sorted {
        color: var(--accent);
      }
      /* The sort control is a real <button> for keyboard reach, styled to
         disappear into the header cell. */
      #screen-crisis-obs .th-sort {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-left: auto;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      #screen-crisis-obs .th-sort:hover {
        color: var(--accent);
      }
      #screen-crisis-obs th:first-child .th-sort {
        margin-left: 0;
      }
      #screen-crisis-obs .sort-icon {
        font-size: 13px;
        line-height: 1;
      }

      /* ── Severity chip: CPI's .dg-pill tinted recipe (CPI.html:1699-1777).
         Also settles an internal clash — the severity ROWS on this page are
         already pale tints with a 1px border, which the old white-on-solid
         chips fought. ── */
      #screen-crisis-obs .risk-chip {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 100px;
        text-transform: uppercase;
      }
      #screen-crisis-obs .risk-critical {
        color: #b4232d;
        background: #ffe7e9;
        box-shadow: inset 0 0 0 1px #f6c9cd;
      }
      #screen-crisis-obs .risk-moderate {
        color: #9a5b00;
        background: #fff3d6;
        box-shadow: inset 0 0 0 1px #f0dbad;
      }
      #screen-crisis-obs .risk-watch {
        color: #185aa9;
        background: #e7f1ff;
        box-shadow: inset 0 0 0 1px #cbdff8;
      }
      #screen-crisis-obs .risk-stable {
        color: #087b4b;
        background: #e6f8ef;
        box-shadow: inset 0 0 0 1px #c8ead9;
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-critical {
        background: color-mix(in srgb, #e5484d 22%, transparent);
        color: #ff8a8a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #e5484d 35%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-moderate {
        background: color-mix(in srgb, #f5a623 20%, transparent);
        color: #f0b25a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #f5a623 30%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-watch {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: #7eb8ff;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-stable {
        background: color-mix(in srgb, #0c9b70 22%, transparent);
        color: #34c99a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #0c9b70 32%, transparent);
      }

      /* Domain tag → .ev-tag pill (cpi-obs.css:734); status badge → .kpi-badge
         (cpi-obs.css:464). Both were rounded rects in a system of pills. */
      #screen-crisis-obs .ind-domain-tag {
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 100px;
      }
      #screen-crisis-obs .status-badge {
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 100px;
      }
      #screen-crisis-obs .pag-btn {
        border-radius: 8px;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }

      /* ── Section action affordance: it is cursor:pointer with no feedback. ── */
      #screen-crisis-obs .obs-section-action:hover {
        opacity: 0.75;
      }

      /* ── Focus: the page shipped none. CPI's ring token (CPI.html:275). ── */
      #screen-crisis-obs a:focus-visible,
      #screen-crisis-obs button:focus-visible,
      #screen-crisis-obs input:focus-visible,
      #screen-crisis-obs select:focus-visible,
      #screen-crisis-obs [tabindex]:focus-visible {
        outline: 3px solid rgba(36, 107, 253, 0.17);
        outline-offset: 2px;
        border-radius: 8px;
      }

      /* ── Scroll-spy dot rail lane (CPI.html:1969-1985) ── */
      #screen-crisis-obs {
        --home-rail-inset: 24px;
        --home-rail-w: 28px;
        --home-rail-gap: 12px;
        --home-rail-lane: calc(var(--home-rail-inset) + var(--home-rail-w) + var(--home-rail-gap));
      }
      @media (min-width: 901px) {
        #screen-crisis-obs .cpi-page-header,
        #screen-crisis-obs .cio-pane {
          padding-right: var(--home-rail-lane);
        }
      }
      #screen-crisis-obs .cio-dots-rail[hidden] {
        display: none !important;
      }
      /* style.css:9769 `#screen-crisis-obs nav:not(.topnav) {...}` is legacy
         chrome from the in-page screen, styling any non-topnav <nav> as a
         52px-tall sticky topbar (height, background, border-bottom, position,
         padding, gap). At (1,1,1) it outranks the shared `.home-module-dots`
         pill and wins on every property the two share, not just `display`:
         the 52px height clips the glass pill's background/border to roughly
         its first two dots (the rest overflow below, dot-only, no pill), and
         `gap: 28px` blows the tight dot spacing out. Reset every property
         that rule sets back to home-widgets.css's own values. CPI has no
         equivalent rule to collide with, so it needs none of this. */
      #screen-crisis-obs nav.home-module-dots {
        display: flex;
        height: auto;
        gap: 0;
        padding: 10px 0;
        background: rgba(255, 255, 255, 0.28);
        border-bottom: 1px solid rgba(255, 255, 255, 0.55);
        position: static;
        top: auto;
        z-index: auto;
      }
      html[data-theme="dark"] #screen-crisis-obs nav.home-module-dots {
        background: rgba(15, 23, 42, 0.32);
        border-bottom-color: rgba(255, 255, 255, 0.14);
      }
      @media (max-width: 900px) {
        #screen-crisis-obs nav.home-module-dots {
          display: none;
        }
      }

      /* ── Severity Overview → dg-panels: four side-by-side severity columns
         (Critical / Warning / Watch / Stable), each its own top-indicators
         card, ported from CPI.html's Diagnose view (CPI.html:1329-1827).
         Badges reuse this page's own .risk-chip (already the .dg-pill
         recipe, see CPI.html:1699-1777 above) rather than a second copy.
         .dg-aisummary/.dg-points below stay in the sheet for the Observe
         view's AI Summary block, which reuses them directly. ── */
      #screen-crisis-obs .dg-panels {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }
      @media (max-width: 1200px) {
        #screen-crisis-obs .dg-panels {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        #screen-crisis-obs .dg-panels {
          grid-template-columns: 1fr;
        }
      }
      /* AI Summary card — LMO Observe .aib-card pattern (flat blue card,
         solid icon circle, icon-only audio-brief button) rather than the
         gradient AI-insight surface this used before. Page-local copy of
         the aib-card recipe (css/pages/lmo-briefing.css) since this page
         doesn't otherwise load it. */
      #screen-crisis-obs .dg-aisummary {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #F0F4FF;
        border: 1px solid #DBEAFE;
      }
      #screen-crisis-obs .dg-aisummary-text {
        padding: 16px 20px 20px;
      }
      #screen-crisis-obs .aib-hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      #screen-crisis-obs .aib-hd-main {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
        flex: 1;
      }
      #screen-crisis-obs .aib-ico {
        width: 40px;
        height: 40px;
        background: #3B82F6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: #fff;
        font-size: 20px;
        line-height: 1;
      }
      #screen-crisis-obs .aib-ttl {
        font-size: 18px;
        font-weight: 700;
        color: #0f172a;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      #screen-crisis-obs .aib-body {
        font-size: 13.5px;
        line-height: 1.75;
        color: var(--t2, #536277);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-aisummary {
        background: linear-gradient(135deg, #0F1626 0%, #151E30 100%);
        border-color: rgba(59, 130, 246, 0.28);
      }
      html[data-theme="dark"] #screen-crisis-obs .aib-ttl {
        color: var(--text);
      }

      /* Icon-only audio-brief control on the AI Summary card — Bayaan
         standard (see census-interpret.html .obs-overview-card). */
      #screen-crisis-obs .dg-aisummary .brief-speech {
        display: flex;
        align-items: center;
        flex-shrink: 0;
        height: 32px;
      }
      #screen-crisis-obs .dg-aisummary .brief-speech[hidden] { display: none; }
      #screen-crisis-obs .dg-aisummary .brief-listen {
        display: flex;
        align-items: center;
        gap: 0;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        font: inherit;
        cursor: pointer;
        transition: 0.22s ease;
      }
      #screen-crisis-obs .dg-aisummary .brief-listen:hover .brief-listen__icon {
        transform: scale(1.06);
        box-shadow: 0 5px 12px rgba(0, 115, 240, 0.32);
      }
      #screen-crisis-obs .dg-aisummary .brief-listen:focus-visible,
      #screen-crisis-obs .dg-aisummary .brief-audio-action:focus-visible {
        outline: 3px solid rgba(0, 115, 240, 0.2);
        outline-offset: 2px;
        border-radius: 16px;
      }
      #screen-crisis-obs .dg-aisummary .brief-listen__icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, #1f5ef0, #5b97f8);
        box-shadow: 0 3px 8px rgba(0, 115, 240, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      }

        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-crisis-obs .dg-aisummary .brief-listen[data-state="speaking"] .brief-listen__speaker,
      #screen-crisis-obs .dg-aisummary .brief-listen[data-state="paused"] .brief-listen__speaker {
        opacity: 0;
        transform: scale(0.85);
      }
      #screen-crisis-obs .dg-aisummary .brief-listen[data-state="speaking"] .brief-listen__pause {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-crisis-obs .dg-aisummary .brief-listen[data-state="paused"] .brief-listen__play {
        opacity: 1;

        pointer-events: auto;

      #screen-crisis-obs .dg-aisummary .brief-speech__actions {

        max-width: 0;

      #screen-crisis-obs .dg-aisummary .brief-speech.is-active .brief-speech__actions {
        max-width: 56px;
        opacity: 1;
        transform: none;
      }
      #screen-crisis-obs .dg-aisummary .brief-audio-action {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;

        color: var(--text2);
        font-size: 11px;
        cursor: pointer;

      }
      #screen-crisis-obs .dg-aisummary .brief-audio-action:hover {
        color: var(--accent);
        background: #fff;
        box-shadow: 0 4px 10px rgba(0, 115, 240, 0.12);
      }
      #screen-crisis-obs .dg-aisummary .brief-audio-action--stop:hover {
        color: #dc2626;
        background: #fff5f5;
      }
      #screen-crisis-obs .dg-aisummary .brief-stop-box {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-aisummary .brief-audio-action:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      #screen-crisis-obs .dg-points {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #screen-crisis-obs .dg-point {
        --tone: #246bfd;
        font-size: 12px;
        line-height: 1.55;
        color: #536277;
      }
      #screen-crisis-obs .dg-point--critical {
        --tone: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-point--good {
        --tone: var(--down, #0c9b70);
      }

        --tone: var(--text-primary, #0f172a);
      }
      #screen-crisis-obs .dg-point-tx b {

      html[data-theme="dark"] #screen-crisis-obs .dg-point {

      html[data-theme="dark"] #screen-crisis-obs .dg-point-tx b {
        color: var(--text-primary);
      }
      #screen-crisis-obs .dg-panel {
        background:
          linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 28px;

      html[data-theme="dark"] #screen-crisis-obs .dg-panel {
        background: var(--surface, #141a26);

      #screen-crisis-obs .dg-panel-hdr {

        gap: 10px;

      #screen-crisis-obs .dg-panel-hdr .dg-lead {

      #screen-crisis-obs .dg-panel--critical .dg-lead {

      }
      #screen-crisis-obs .dg-panel--warning .dg-lead {
        color: var(--warn, #f5a623);
      }
      #screen-crisis-obs .dg-panel--watch .dg-lead {

      }
      #screen-crisis-obs .dg-panel--stable .dg-lead {

      }
      #screen-crisis-obs .dg-panel-title {
        font-size: 16px;

        color: var(--text);
        letter-spacing: -0.01em;
      }
      #screen-crisis-obs .dg-panel-sub {
        font-size: 12px;
        color: var(--text2);

      }
      #screen-crisis-obs .dg-cards {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      #screen-crisis-obs .dg-panel--critical {
        --dg-card-tone: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-panel--warning {
        --dg-card-tone: var(--warn, #f5a623);
      }
      #screen-crisis-obs .dg-panel--watch {
        --dg-card-tone: var(--accent, #3b82f6);

      #screen-crisis-obs .dg-panel--stable {

      #screen-crisis-obs .dg-card {

        overflow: hidden;

        background: linear-gradient(150deg, #fff 0%, #fff 66%, #f8fafc 100%);

      html[data-theme="dark"] #screen-crisis-obs .obs-card.dg-card:hover {

        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);

      @keyframes dg-card-reveal {

          transform: none;
        }

      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs .dg-card {

      #screen-crisis-obs .dg-cardhead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      #screen-crisis-obs .dg-card-ic {
        width: 28px;

        flex-shrink: 0;

        color: #405775;

        box-shadow: inset 0 0 0 1px #e8edf3;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-card-ic {

        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--text-secondary);
      }
      #screen-crisis-obs .dg-card-id-text {
        min-width: 0;
      }
      #screen-crisis-obs .dg-card-name {
        font-size: 11.2px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #screen-crisis-obs .dg-card-tag {
        font-size: 8.5px;
        color: var(--text2);
        margin-top: 1px;
      }
      #screen-crisis-obs .dg-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px 9px;
        margin: 9px -1px 0;
        padding: 9px 9px 7px;
        border-radius: 10px;
        background: rgba(248, 250, 252, 0.67);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-stats {
        background: rgba(255, 255, 255, 0.04);
      }
      #screen-crisis-obs .dg-stat-k {
        display: block;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8996a9;
        margin-bottom: 0;
      }
      #screen-crisis-obs .dg-stat-v {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
      }
      #screen-crisis-obs .dg-stat-v.up {
        color: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-stat-v.down {
        color: var(--down, #0c9b70);
      }
      #screen-crisis-obs .dg-card-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 7px;
        padding-top: 2px;
      }
      /* Ask-CIO-AI sparkle, sat opposite the severity chip by the foot's own
         space-between. Same quiet icon-button treatment as .bm-ask above:
         accent-coloured, no chrome until hover, so it reads as available
         without competing with the chip or the card's numbers. */
      #screen-crisis-obs .dg-card-ai {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        transition: background 0.15s ease, opacity 0.15s ease;
      }
      /* sparkleGlow is style.css's shared AI-sparkle pulse (style.css:2452),
         the same one .ai-sparkle-pill / -inline / -corner and the brief
         panel's sparkle all run — reused rather than redefined so every AI
         affordance in the app breathes on the same beat. The page's global
         prefers-reduced-motion block already stops it. */
      #screen-crisis-obs .dg-card-ai i {
        font-size: 18px;
        line-height: 1;
        animation: sparkleGlow 2.4s ease-in-out infinite;
      }
      #screen-crisis-obs .dg-card-ai:hover {
        background: var(--accent-light, rgba(59, 130, 246, 0.12));
      }

      /* ── Responsive ── */
      @media (max-width: 1300px) {
        #screen-crisis-obs .bm-main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 1150px) {
        #screen-crisis-obs .driver-grid,
        #screen-crisis-obs .events-grid,
        #screen-crisis-obs .mover-grid,
        #screen-crisis-obs .composite-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        #screen-crisis-obs .cpi-page-header-inner {
          flex-direction: column;
        }
      }
      @media (max-width: 720px) {
        #screen-crisis-obs .driver-grid,
        #screen-crisis-obs .events-grid,
        #screen-crisis-obs .mover-grid,
        #screen-crisis-obs .composite-grid {
          grid-template-columns: 1fr;
        }
        #screen-crisis-obs .impacts-list.cols-2 {
          grid-template-columns: 1fr;
        }
        #screen-crisis-obs .impacts-list.cols-2 .impact-item:nth-child(odd) {
          border-right: 0;
        }
      }
      /* CPI's rule covers animation only and misses transitions entirely; this
         also disables the dot rail's smooth scroll, which is JS-driven. */
      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs *,
        #screen-crisis-obs *::before,
        #screen-crisis-obs *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ==================== SCREEN: CRISIS INTELLIGENCE OBSERVATORY (standalone) ==================== -->
    <div id="screen-crisis-obs" class="screen ws-screen active">
      <div data-bayaan-header></div>
      <div class="crisis-scroll">
        <div class="container">
          <div class="ind-page-breadcrumb">
            <button type="button" id="ciBcBack" class="ind-back-btn" data-bc-managed="1" hidden onclick="closeCiDetail(event)" title="Back" aria-label="Back"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
            <a
              href="#"
              onclick="
                goTo('screen-home');
                return false;
              "
              >Home</a
            >
            <span class="ind-bc-sep"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
            <a
              href="#"
              onclick="
                openObservatories(event);
                return false;

              >Observatory</a
            >

            <span class="ind-bc-current" id="ciBcTail">Crisis Intelligence</span>

            <span class="ind-bc-current" id="ciBcIndicator" hidden></span>

              <div id="census-global-filter-mount"></div>
              <button
                type="button"
                class="sidebar-item sidebar-item--ai"
                onclick="openObsSidebarAI(this, 'cio-ai', 'CIO AI', 'ti-sparkles')"
              >

                <span class="sidebar-label">CIO AI</span>
              </button>
              <span class="sidebar-divider" aria-hidden="true"></span>
              <button type="button" class="sidebar-item active" onclick="activateSidebar(this)">
                <div class="sidebar-icon"><i class="ti ti-layout-dashboard"></i></div>
                <span class="sidebar-label">Overview</span>

              </button>

                <span class="sidebar-label">Benchmark</span>
              </button>

              </button>

                    <div class="ind-detail-tag-row" id="ciDetailTagRow" hidden></div>
                    <h1 class="topic-title" id="cioTitle">Crisis Intelligence — Overview</h1>
                    <p class="topic-title-sub" id="cioSubtitle">Abu Dhabi · 96 monitored indicators</p>
                  </div>
                  <div class="cpi-hdr-actions">
                    <div class="prod-filter-dd" id="ciObsDomainDd" hidden>
                      <button type="button" class="prod-filter-dd-trigger" id="ciObsDomainTrigger"><i class="ti ti-category prod-filter-dd-lead"></i><span class="dd-label" id="ciObsDomainLabel">Domain</span><i class="ti ti-chevron-down"></i></button>
                      <div class="prod-filter-dd-menu" id="ciObsDomainMenu" hidden></div>
                    </div>

                      <button type="button" class="prod-filter-dd-trigger" id="ciDriversSevTrigger"><i class="ti ti-alert-circle prod-filter-dd-lead"></i><span class="dd-label" id="ciDriversSevLabel">Severity</span><i class="ti ti-chevron-down"></i></button>
                      <div class="prod-filter-dd-menu" id="ciDriversSevMenu" hidden></div>

    <script>
      /* ============================================================
         Standalone stubs — this page is isolated and does NOT link
         back into the main application beyond real navigation. The
         shared top navigation is kept for visual parity; cross-screen
         actions js/header.js emits inline onclicks for are no-ops here,
         same contract as CPI.html / benchmark.html / observe.html.
         ============================================================ */
      function goTo() {}
      function openGeoView(e) { if (e) e.preventDefault(); }
      function openBayaanSpace(e) { if (e) e.preventDefault(); }
      function openProducts(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openObservatories(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openWsDrp() {}
      function onHeaderSearchClick() {}
      function openObsSidebarAI(el) { activateSidebar(el); }
      function toast() {}

      /* ============================================================
         VIEW ROUTER
         ============================================================ */
      const CI_VIEWS = {
        overview:  { pane: "ci-overview",  init: () => initCiOverview(),  title: "Crisis Intelligence — Overview",  sub: "Abu Dhabi · 96 monitored indicators",
          sections: [["exec-brief", "Executive Brief"], ["ov-summary", "Overview"], ["ov-composites", "Composite Indicators"], ["ov-drivers", "Economic Drivers"], ["ov-severity", "Severity Overview"], ["ov-analytics", "Indicator Analytics"]] },
        observe:   { pane: "ci-observe",   init: () => initCiObserve(),   title: "Crisis Intelligence — Observe",   sub: "Signal-level detail across four monitored domains",
          sections: [["ob-summary", "Signal Health"], ["ob-indicators", "Indicators"]] },
        interpret: { pane: "ci-interpret", init: () => initCiInterpret(), title: "Crisis Intelligence — Interpret", sub: "What moved, why it matters, and where it may lead",
          sections: [["it-movers", "Top Movement"], ["it-situation", "Situation Overview"], ["it-impacts", "Impacts"], ["it-geo", "Mobility Tracker"]] },
        benchmark: { pane: "ci-benchmark", init: () => initCiBenchmark(), title: "Crisis Intelligence — Benchmark", sub: "Abu Dhabi against GCC and global peers",
          sections: [] },
      };

      /* Scroll-spy dot rail — the shared component CPI uses. Mounted against
         the visible pane only: a hidden pane measures as zero-height and would
         pin the spy to its first section forever. Re-mounted on every switch;
         Benchmark has no sections, so mountSectionDots' own `< 2` guard hides
         the rail for free. */
      let cioDotsApi = null;
      function mountCioDots(view) {
        const rail = document.querySelector(".cio-dots-rail");
        const pane = document.getElementById(view.pane);
        if (cioDotsApi) { cioDotsApi.destroy(); cioDotsApi = null; }
        const sections = (view.sections || [])
          .map(([id, label]) => ({ id, label, el: pane && pane.querySelector("#" + id) }))
          .filter((s) => s.el);
        if (rail) rail.hidden = sections.length < 2;
        if (sections.length < 2 || !window.BayaanSectionScrollSpy) return;
        cioDotsApi = window.BayaanSectionScrollSpy.mountSectionDots({
          navId: "cioDots",
          root: document.querySelector("#screen-crisis-obs .crisis-scroll"),
          sections,
          scrollFnName: "scrollToCioSection",
        });
        requestAnimationFrame(() => cioDotsApi && cioDotsApi.sync());
      }

      function activateSidebar(el) {
        const sidebar = el.closest(".sidebar");
        (sidebar || document).querySelectorAll(".sidebar-item").forEach((s) => s.classList.remove("active"));
        el.classList.add("active");
        if (el.classList.contains("sidebar-item--ai")) return; // AI trigger doesn't switch panes

        const key = (el.textContent || "").trim().toLowerCase();
        const view = CI_VIEWS[key];
        if (!view) return;

        /* #ci-detail isn't a CI_VIEWS entry (it's a leaf reached only from a
           Top Movement card, not the sidebar), so the hide-loop below never
           touches it — close it explicitly whenever a real sidebar tab is
           picked, same teardown as closeCiDetail(). */
        if (ciDetailMover) {
          if (ciDetailChart) { ciDetailChart.destroy(); ciDetailChart = null; }
          ciDetailMover = null;
          ciDetailOrigin = CI_DETAIL_ORIGINS.interpret;
          const detailPane = document.getElementById("ci-detail");
          if (detailPane) detailPane.hidden = true;
          const tagRow = document.getElementById("ciDetailTagRow");
          if (tagRow) { tagRow.hidden = true; tagRow.innerHTML = ""; }
          const backBtn = document.getElementById("ciBcBack");
          if (backBtn) backBtn.hidden = true;
          ciDetailBreadcrumbHide();
        }

        /* Same story for #ci-drivers-detail (the Economic Drivers "View
           All" pane) — not a CI_VIEWS entry either, so close it here too. */
        const driversDetailPane = document.getElementById("ci-drivers-detail");
        if (driversDetailPane && !driversDetailPane.hidden) {
          driversDetailPane.hidden = true;
          const backBtn = document.getElementById("ciBcBack");
          if (backBtn) { backBtn.hidden = true; backBtn.onclick = closeCiDetail; }
          const sevDd = document.getElementById("ciDriversSevDd");
          if (sevDd) sevDd.hidden = true;
        }

        Object.values(CI_VIEWS).forEach((v) => {
          const node = document.getElementById(v.pane);
          if (node) node.hidden = v !== view;
        });
        document.getElementById("cioTitle").textContent = view.title;
        document.getElementById("cioSubtitle").textContent = view.sub;
        const obsDomainDd = document.getElementById("ciObsDomainDd");
        if (obsDomainDd) obsDomainDd.hidden = key !== "observe";
        view.init();

        if (key === "benchmark" && ciBmChart) {
          requestAnimationFrame(() => ciBmChart.resize());
        }
        const scroller = document.querySelector("#screen-crisis-obs .crisis-scroll");
        if (scroller) scroller.scrollTop = 0;
        mountCioDots(view);
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      /* ============================================================
         SHARED BUILDERS
         ============================================================ */

      /* Domain tag + severity chip vocabulary, shared by every view. */
      const CI_DOMAIN_TAG = {
        Economy: "tag-economic", Environment: "tag-environment",
        Financial: "tag-financial", Social: "tag-social",
      };
      const CI_DOMAIN_ICON = {
        Economy: "ti-trending-up", Environment: "ti-leaf",
        Financial: "ti-currency-dollar", Social: "ti-users",
      };
      const CI_SEV_META = {
        critical: { chipClass: "risk-critical", rowClass: "row-critical", dot: "dot-critical", label: "Critical", icon: "ti-alert-triangle" },
        warning:  { chipClass: "risk-moderate", rowClass: "row-moderate", dot: "dot-moderate", label: "Warning",  icon: "ti-alert-circle" },
        watch:    { chipClass: "risk-watch",    rowClass: "row-watch",    dot: "dot-watch",    label: "Watch",    icon: "ti-eye" },
        stable:   { chipClass: "risk-stable",   rowClass: "row-stable",   dot: "dot-stable",   label: "Stable",   icon: "ti-circle-check" },
      };
      /* Section header — the home-page module title treatment (bold black
         title + accent icon), ported from CPI.html's buildObsSectionHdr. */
      function buildObsSectionHdr(title, icon, action, onClick) {
        const actionHtml = action
          ? `<span class="obs-section-action"${onClick ? ` role="button" tabindex="0" onclick="${onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${onClick}}"` : ""}>${action} <i class="ti ti-arrow-right"></i></span>`
          : "";
        return `<div class="section-hdr">
  <h2 class="cpi-section-title"><i class="ti ${icon || "ti-circle"}" aria-hidden="true"></i>${title}</h2>
  ${actionHtml}
</div>`;
      }

      function domainTag(domain) {
        return `<span class="ind-domain-tag ${CI_DOMAIN_TAG[domain] || "tag-economic"}">${esc(domain)}</span>`;
      }
      function riskChip(sev) {
        const m = CI_SEV_META[sev] || CI_SEV_META.stable;
        /* Casing is CSS's job (.risk-chip is text-transform: uppercase), so the
           accessible name stays "Critical" rather than "CRITICAL". */
        return `<span class="risk-chip ${m.chipClass}">${m.label}</span>`;
      }
      function changeSpan(delta, dir, cls) {
        const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "•";
        return `<span class="${cls || "ind-change"} ${dir}">${arrow} ${esc(delta)}</span>`;
      }

      /* Sparkline — Catmull-Rom smoothed area+line SVG, ported from CPI.html's
         buildObsSparkline/obsSmoothPath (same 84x30 box, same gradient-per-
         instance trick), scoped to this page's own #screen-crisis-obs CSS. */
      const CIO_SPARK_COLOR = {
        "sp-up": "#e5484d", "sp-down": "#0c9b70", "sp-neutral": "#246bfd", "sp-flat": "#8b93a7",
        /* Severity-keyed variants — same palette as .risk-chip — so a
           driver card's trend line reads the same "how worried should I
           be" signal as its severity badge, instead of colouring purely
           by whether the number went up or down (which says nothing
           about whether that movement is good or bad for that indicator). */
        "sp-critical": "#e5484d", "sp-warning": "#f5a623", "sp-watch": "#246bfd", "sp-stable": "#0c9b70",
      };
      /* Maps a driver's severity to its sparkline colour class — use this
         instead of branching on `dir` for any card that carries a
         .risk-chip, so the two always agree. */
      function sevSparkCls(sev) {
        return { critical: "sp-critical", warning: "sp-warning", watch: "sp-watch", stable: "sp-stable" }[sev] || "sp-stable";
      }
      let cioSparkId = 0;
      /* "Nice" round tick values spanning [min, max] (Heckbert's algorithm,
         the standard approach every charting library uses for axis ticks) —
         e.g. an 9–20 data range reads as 0/10/20 rather than the literal
         9/20, matching how the reference chart's axis (0/100/200/300) is
         also round numbers, not the raw series' exact bounds. */
      function niceNum(range, round) {
        const exp = Math.floor(Math.log10(range || 1));
        const frac = range / Math.pow(10, exp);
        let niceFrac;
        if (round) niceFrac = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
        else niceFrac = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
        return niceFrac * Math.pow(10, exp);
      }
      function niceTicks(min, max, count) {
        if (min === max) { min -= 1; max += 1; }
        const step = niceNum(niceNum(max - min, false) / (count - 1), true);
        const niceMin = Math.floor(min / step) * step;
        const niceMax = Math.ceil(max / step) * step;
        const ticks = [];
        for (let v = niceMax; v >= niceMin - step / 2; v -= step) ticks.push(Math.round(v));
        return ticks; // descending, top to bottom
      }
      /* Evenly-spaced date labels for a spark series: derived, not sourced —
         these cards only ever stored an "as of" date and a frequency, never
         real per-point timestamps, so the only honest option is to step
         back from the card's own "last updated" date by its own frequency
         (one step per point) rather than inventing a date series from
         nothing. Returns null if updatedText doesn't parse. */
      function sparkDates(freq, updatedText, count) {
        const m = (updatedText || "").match(/on (\d{1,2}) (\w+) (\d{4})/);
        if (!m) return null;
        const last = new Date(`${m[2]} ${m[1]}, ${m[3]}`);
        if (isNaN(last)) return null;
        const stepBack = (n) => {
          const d = new Date(last);
          if (freq === "Daily") d.setDate(d.getDate() - n);
          else if (freq === "Weekly") d.setDate(d.getDate() - n * 7);
          else if (freq === "Quarterly") d.setMonth(d.getMonth() - n * 3);
          else d.setMonth(d.getMonth() - n); // Monthly, and any other frequency
          return d;
        };
        const out = [];
        for (let i = count - 1; i >= 0; i--) out.push(stepBack(i));
        return out; // ascending, last entry === updatedText's own date
      }
      /* count evenly-spaced entries from arr, always including both ends —
         used to thin a per-point date array down to a handful of labels
         without needing them to land on "round" values the way niceTicks'
         numbers can. */
      function pickEvery(arr, count) {
        if (arr.length <= count) return arr;
        const step = (arr.length - 1) / (count - 1);
        return Array.from({ length: count }, (_, k) => arr[Math.round(k * step)]);
      }
      const fmtSparkDate = (d) => `${d.getDate()} ${d.toLocaleString("en-US", { month: "short" })}`;
      /* The domain the authored `spark` coordinate strings were drawn in.
         Those strings are *screen* space — a rising indicator is written as a
         falling y ("0,22 … 100,3" for a +194% card) — so they have to be
         flipped back into values before anything can label them, or the Y
         axis prints upside down against the line it annotates. */
      const CIO_SPARK_VMAX = 32;
      function buildSparkline(points, cls, freq, updatedText, dense) {
        const color = CIO_SPARK_COLOR[cls] || CIO_SPARK_COLOR["sp-flat"];
        const raw = points.trim().split(/\s+/).map((pair) => pair.split(",").map(Number));
        if (!raw.length) return "";
        /* There's no real underlying series behind these coordinates to
           calibrate against, only the points themselves — so the scale is
           derived from the card's own plotted range via niceTicks (rounded,
           like the reference chart's 0/100/200/300) and the series is then
           stretched to fill that range. Stretching is what makes the line
           legible: the authored y values only ever span ~13-19 of a 0-32 box,
           which is why they used to render as a flat band floating in the
           middle of the card with the labels nowhere near it. */
        const vals = raw.map(([, y]) => CIO_SPARK_VMAX - y);
        const yTicks = niceTicks(Math.min(...vals), Math.max(...vals), dense ? 4 : 3);
        const top = yTicks[0], bottom = yTicks[yTicks.length - 1];
        const span = (top - bottom) || 1;
        const fmt = (n) => Math.round(n * 100) / 100;
        /* Plot in a plain 0-100 square: preserveAspectRatio="none" stretches
           it to whatever box the context gives, and non-scaling-stroke keeps
           the line hairline-even through that stretch. */
        const pts = raw.map(([x], i) => [fmt(x), fmt(((top - vals[i]) / span) * 100)]);
        let line;
        if (pts.length < 3) {
          line = `M${pts.map(([x, y]) => `${x} ${y}`).join(" L")}`;
        } else {
          line = `M${pts[0][0]} ${pts[0][1]}`;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
            const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
            const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
            line += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${p2[0]} ${p2[1]}`;
          }
        }
        const first = pts[0], last = pts[pts.length - 1];
        const area = `${line} L${last[0]} 100 L${first[0]} 100 Z`;
        /* One gridline per tick, so every Y label has a line to sit against
           instead of floating beside an empty box. The last one doubles as
           the baseline, hence no separate axis <line>; the left spine the old
           version drew is gone — the label column already reads as the axis
           and the reference chart has no spine either. */
        const grid = yTicks.map((_, i) => {
          const y = fmt((i / Math.max(1, yTicks.length - 1)) * 100);
          return `<line class="obs-spark-grid" x1="0" y1="${y}" x2="100" y2="${y}" vector-effect="non-scaling-stroke"/>`;
        }).join("\n  ");
        const gid = "cioSparkGrad" + cioSparkId++;
        const svg = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
    <stop offset="1" stop-color="${color}" stop-opacity="0.02"/>
  </linearGradient></defs>
  ${grid}
  <path class="obs-spark-area" fill="url(#${gid})" d="${area}"/>
  <path class="obs-spark-line" stroke="${color}" vector-effect="non-scaling-stroke" d="${line}"/>
</svg>`;
        /* X dates come from the card's own "last updated" date + frequency,
           not a fabricated timeline. Labels sit outside the SVG (not <text>
           inside it): preserveAspectRatio="none" would non-uniformly stretch
           glyphs along with the plot. */
        const dates = sparkDates(freq, updatedText, raw.length);
        /* 4 date labels in every context: the cards are all ~256px wide (or
           narrower, for the 4-up movers grid), and 6 six-character dates in
           that space touch edge to edge. dense still buys the 4th Y tick
           above, just not extra X labels there's no room for. */
        const xLabels = dates ? pickEvery(dates, Math.min(4, dates.length)).map(fmtSparkDate) : null;
        return `<div class="obs-spark-chart${dense ? " obs-spark-chart--dense" : ""}">
  <div class="obs-spark-row">
    <div class="obs-spark-yaxis" aria-hidden="true">${yTicks.map((v, i) => `<span style="top:${fmt((i / Math.max(1, yTicks.length - 1)) * 100)}%">${v}</span>`).join("")}</div>
    <div class="obs-spark-plot">${svg}</div>
  </div>
  ${xLabels ? buildAxis(xLabels) : ""}
</div>`;
      }
      function buildAxis(labels) {
        return `<div class="obs-axis" aria-hidden="true">${labels.map((l) => `<span>${esc(l)}</span>`).join("")}</div>`;
      }

      /* Gauge — semicircle arc (green→amber→red), needle position and fill
         computed from a 0-100 percent, so every gauge on the page (Overview
         composites, Interpret mobility) shares one generator instead of the
         hand-authored per-card geometry the old in-page screen used. */
      let cioGaugeId = 0;
      function buildGauge(pct, size) {
        pct = Math.max(0, Math.min(100, pct));
        const id = "cioGaugeGrad" + cioGaugeId++;
        const arcLen = 131.9;
        const dashoffset = arcLen * (1 - pct / 100);
        const theta = (Math.PI * (180 - 1.8 * pct)) / 180;
        const needleLen = 27;
        const nx = 50 + needleLen * Math.cos(theta);
        const ny = 50 - needleLen * Math.sin(theta);
        const w = size || 100;
        return `<svg viewBox="0 0 100 56" style="width:${w}px" xmlns="http://www.w3.org/2000/svg">
  <path d="M8,50 A42,42 0 0,1 92,50" fill="none" stroke="var(--border,#e5e7eb)" stroke-width="8" stroke-linecap="round"/>
  <path d="M8,50 A42,42 0 0,1 92,50" fill="none" stroke="url(#${id})" stroke-width="8" stroke-linecap="round" stroke-dasharray="132 132" stroke-dashoffset="${dashoffset.toFixed(2)}"/>
  <defs><linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#16a34a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#dc2626"/>
  </linearGradient></defs>
  <line x1="50" y1="50" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="var(--text2,#374151)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="4" fill="var(--text2,#374151)"/>
</svg>`;
      }

      function statusBadge(status, label) {
        return `<div class="status-badge badge-${status}">${label}</div>`;
      }

      /* Pagination — real slicing (fixes the old crisis screen's non-functional
         goPage/changePage, which only toggled a CSS class). */
      function buildPagination(page, pageSize, total, onClickPrefix) {
        const pages = Math.max(1, Math.ceil(total / pageSize));
        const from = total === 0 ? 0 : (page - 1) * pageSize + 1;
        const to = Math.min(total, page * pageSize);
        let nums = [];
        const add = (n) => nums.push(n);
        if (pages <= 7) {
          for (let i = 1; i <= pages; i++) add(i);
        } else {
          add(1);
          if (page > 3) add("…");
          for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) add(i);
          if (page < pages - 2) add("…");
          add(pages);
        }
        const btns = nums.map((n) =>
          n === "…"
            ? `<span class="pag-btn" style="border:none;cursor:default;background:none">…</span>`
            : `<button class="pag-btn${n === page ? " active" : ""}" onclick="${onClickPrefix}(${n})">${n}</button>`
        ).join("");
        return `<div class="pagination">
  <div class="pag-info">Showing ${from}-${to} of ${total}</div>
  <div class="pag-btns">
    <button class="pag-btn nav" ${page <= 1 ? "disabled" : ""} onclick="${onClickPrefix}(${page - 1})"><i class="ti ti-chevron-left"></i> Previous</button>
    ${btns}
    <button class="pag-btn nav" ${page >= pages ? "disabled" : ""} onclick="${onClickPrefix}(${page + 1})">Next <i class="ti ti-chevron-right"></i></button>
  </div>
</div>`;
      }

      /* Generic filter dropdown (single- or multi-select), modelled on
         benchmark.html's toggleBmFilterDropdown/initBmFilters, generalised
         so every dropdown on this page (Domain, Severity, Sub-categories,
         Region, Metric, Year) shares one implementation. */
      const CIO_DD = {};
      function registerDd(key, opts) { CIO_DD[key] = opts; }
      function closeAllDd(except) {
        Object.keys(CIO_DD).forEach((k) => { if (k !== except) toggleDd(k, false); });
      }
      function toggleDd(key, force) {
        const cfg = CIO_DD[key]; if (!cfg) return;
        const menu = document.getElementById(cfg.menuId);
        const trigger = document.getElementById(cfg.triggerId);
        if (!menu || !trigger) return;
        const open = typeof force === "boolean" ? force : menu.hidden;
        if (open) closeAllDd(key);
        menu.hidden = !open;
        trigger.classList.toggle("is-open", open);
        trigger.setAttribute("aria-expanded", open ? "true" : "false");
      }
      document.addEventListener("click", (e) => {
        if (e.target.closest(".prod-filter-dd")) return;
        closeAllDd(null);
      });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAllDd(null); });

      /* Bayaan-standard search shortcut — Ctrl/⌘+K jumps to whichever
         .bm-search box is visible on the active Crisis Intelligence pane. */
      document.addEventListener("keydown", (e) => {
        if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "k") return;
        const input = document.querySelector("#screen-crisis-obs .cio-pane:not([hidden]) .bm-search input");
        if (!input) return;
        e.preventDefault();
        input.focus();
        input.select();
      });

      function updateMultiLabel(cfg) {
        const label = document.getElementById(cfg.labelId);
        if (!label) return;
        const n = cfg.selected.length;
        const allActive = n === cfg.options.length;
        if (cfg.fixedLabel) {
          /* Every option selected reads the same as no filter applied, so
             say so explicitly ("All Severity") instead of leaving the bare
             category name to imply a single option is chosen. */
          label.textContent = allActive ? `All ${cfg.fixedLabel}` : cfg.fixedLabel;
          return;
        }
        if (n === 0) label.textContent = "None";
        else if (n === 1) label.textContent = cfg.selected[0];
        else label.textContent = `${cfg.selected[0]} +${n - 1}`;
      }

      function renderMultiDd(cfg) {
        const menu = document.getElementById(cfg.menuId);
        if (!menu) return;
        const allActive = cfg.selected.length === cfg.options.length;
        /* checkmark variant reuses initSingleDd's own row shape (label, then a
           trailing .ti-check that .prod-filter-dd-option.is-active already
           fades in) instead of a leading checkbox square, so Sub-categories
           and Severity read like every other dropdown on this page. */
        const checkmark = cfg.checkStyle === "checkmark";
        const rows = [checkmark
          ? `<button type="button" class="prod-filter-dd-option${allActive ? " is-active" : ""}" data-all="1">All <i class="ti ti-check"></i></button>`
          : `<button type="button" class="prod-filter-dd-option dd-all${allActive ? " is-active" : ""}" data-all="1">
  <span class="dd-check">${allActive ? '<i class="ti ti-check" style="font-size:10px"></i>' : ""}</span> Select All
</button>`].concat(
          cfg.options.map((opt) => {
            /* In the checkmark variant, "All" is its own exclusive state: when
               every option is selected, only the "All" row lights up rather
               than every row lighting up alongside it. */
            const active = checkmark ? (!allActive && cfg.selected.includes(opt)) : cfg.selected.includes(opt);
            return checkmark
              ? `<button type="button" class="prod-filter-dd-option${active ? " is-active" : ""}" data-opt="${esc(opt)}">${esc(opt)} <i class="ti ti-check"></i></button>`
              : `<button type="button" class="prod-filter-dd-option${active ? " is-active" : ""}" data-opt="${esc(opt)}">
  <span class="dd-check">${active ? '<i class="ti ti-check" style="font-size:10px"></i>' : ""}</span> ${esc(opt)}
</button>`;
          })
        );
        menu.innerHTML = rows.join("");
        menu.querySelectorAll("[data-opt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const opt = btn.dataset.opt;
            const i = cfg.selected.indexOf(opt);
            if (i >= 0) cfg.selected.splice(i, 1); else cfg.selected.push(opt);
            renderMultiDd(cfg);
            updateMultiLabel(cfg);
            cfg.onChange && cfg.onChange();
          });
        });
        const allBtn = menu.querySelector("[data-all]");
        if (allBtn) {
          allBtn.addEventListener("click", () => {
            cfg.selected = allActive ? [] : cfg.options.slice();
            renderMultiDd(cfg);
            updateMultiLabel(cfg);
            cfg.onChange && cfg.onChange();
          });
        }
      }

      function initMultiDd(key, triggerId, menuId, labelId, options, selected, fixedLabel, onChange, checkStyle) {
        const cfg = { triggerId, menuId, labelId, options, selected: selected.slice(), fixedLabel, onChange, checkStyle };
        registerDd(key, { triggerId, menuId });
        renderMultiDd(cfg);
        updateMultiLabel(cfg);
        const trigger = document.getElementById(triggerId);
        if (trigger) trigger.onclick = () => toggleDd(key);
        return cfg;
      }

      function initSingleDd(key, triggerId, menuId, labelId, options, current, onChange, filterName) {
        registerDd(key, { triggerId, menuId });
        const menu = document.getElementById(menuId);
        const label = document.getElementById(labelId);
        /* "All" alone doesn't say what's unfiltered — spell it out ("All
           Severity") when the dropdown has a category name to attach. */
        const labelFor = (v) => (v === "All" && filterName ? `All ${filterName}` : v);
        menu.innerHTML = options.map((opt) =>
          `<button type="button" class="prod-filter-dd-option${opt === current ? " is-active" : ""}" data-opt="${esc(opt)}">${esc(opt)} <i class="ti ti-check"></i></button>`
        ).join("");
        label.textContent = labelFor(current);
        menu.querySelectorAll("[data-opt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            menu.querySelectorAll(".prod-filter-dd-option").forEach((o) => o.classList.remove("is-active"));
            btn.classList.add("is-active");
            label.textContent = labelFor(btn.dataset.opt);
            toggleDd(key, false);
            onChange && onChange(btn.dataset.opt);
          });
        });
        const trigger = document.getElementById(triggerId);
        if (trigger) trigger.onclick = () => toggleDd(key);
      }

      /* ============================================================
         OVERVIEW
         ============================================================ */
      const CI_SUMMARY = { total: 96, critical: 23, warning: 7, watch: 14, stable: 52 };
      const CI_OVERVIEW_TEXT =
        "As of August 31, 2026, Abu Dhabi is experiencing a complex landscape marked by softening industrial activity and trade volumes, while hospitality and retail sectors show pockets of resilience. Manufacturing output and new business registrations have moderated, reflecting a cautious business environment. Geopolitical risk has risen, contributing to a more uncertain financial climate, though local market sentiment remains relatively steady. Food import quantities have eased, yet consumer prices are under mild upward pressure. Electricity and water demand remain elevated due to seasonal factors. Overall, the emirate faces a mix of emerging pressures and stabilising trends across key domains.";
      const CI_BRIEF_HTML =
        "Abu Dhabi’s industrial activity softened, with <strong>manufacturing output and new business registrations moderating</strong>. Trade volumes eased, while <strong>hospitality and retail remained resilient</strong>. Geopolitical risk rose, alongside <strong>mild consumer price pressures</strong> and <strong>elevated electricity and water demand</strong>.";

      const CI_COMPOSITES = [
        { title: "Consumer Activity Index", value: "64.88", unit: "Index", pct: 55, status: "moderate", label: "Moderate",
          note: 'Consumer Activity Index at <strong>64.88</strong> points as of July 1, 2026 – remains in the moderate range, below the red threshold, but recent declines indicate emerging pressure on consumer demand.' },

      /* ── Global & Regional Economic Drivers — a one-row, 4-up summary on
         Overview (.driver-grid), with "View All" opening a dedicated pane
         listing every driver in one scrolling grid, filterable by
         severity. ── */
      const CI_DRIVERS_SUMMARY_COUNT = 4;
      const CI_DRIVERS_STATE = { severity: "All" };

      function ciDriverCard(d) {
        return `<div class="obs-card driver-card card-hover" role="button" tabindex="0" aria-label="Open ${esc(d.name)} detail" onclick="openCiDetail('${esc(d.name)}', 'overview')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCiDetail('${esc(d.name)}', 'overview')}">
      <div class="dc-head">
        <div class="dc-icon-wrap"><i class="ti ${d.icon}"></i></div>
        <div class="dc-title-col">
          <div class="dc-title">${esc(d.name)}</div>
        </div>
      </div>
      <div class="dc-value">${esc(d.value)}<small> ${esc(d.unit)}</small></div>
      <div class="dc-changes">${changeSpan(d.delta, d.dir)}<span class="dc-freq">${esc(d.freq)}</span></div>
      <div class="dc-spark">${buildSparkline(d.spark, sevSparkCls(d.severity), d.freq, d.updated, true)}</div>
      <div class="dc-note">${esc(d.updated)}</div>
      <div class="dc-chips">${riskChip(d.severity)}</div>
    </div>`;
      }

      function ciDriversFiltered() {
        if (CI_DRIVERS_STATE.severity === "All") return CI_DRIVERS;
        const sev = CI_DRIVERS_STATE.severity.toLowerCase();
        return CI_DRIVERS.filter((d) => d.severity === sev);
      }

      function renderCiDriversDetail() {
        const grid = document.getElementById("ciDriversDetailGrid");
        if (!grid) return;
        const rows = ciDriversFiltered();
        grid.innerHTML = rows.length
          ? rows.map((d) => ciDriverCard(d)).join("")
          : `<div class="ci-drivers-empty">No drivers match this severity.</div>`;
      }

      /* #ci-drivers-detail starts empty in the static markup (same contract
         as #ci-detail) — its whole shell is built fresh every time the pane
         opens. The severity filter itself lives in the persistent page
         header (near Download) rather than a section title in here, since
         the header's cioTitle/cioSubtitle already carry this pane's title
         and count. */
      function buildCiDriversDetailHtml() {
        return `<section id="ci-drivers-detail-list">
  <div class="driver-grid" id="ciDriversDetailGrid"></div>
</section>`;
      }

      function openCiDriversDetail() {
        Object.values(CI_VIEWS).forEach((v) => {
          const node = document.getElementById(v.pane);
          if (node) node.hidden = true;
        });
        const detailPane = document.getElementById("ci-drivers-detail");
        if (!detailPane) return;
        detailPane.hidden = false;
        detailPane.innerHTML = buildCiDriversDetailHtml();

        document.getElementById("cioTitle").textContent = "Global & Regional Economic Drivers";
        document.getElementById("cioSubtitle").textContent = `All ${CI_DRIVERS.length} monitored drivers`;
        const backBtn = document.getElementById("ciBcBack");
        if (backBtn) { backBtn.hidden = false; backBtn.onclick = closeCiDriversDetail; }
        const obsDomainDd = document.getElementById("ciObsDomainDd");
        if (obsDomainDd) obsDomainDd.hidden = true;
        const sevDd = document.getElementById("ciDriversSevDd");
        if (sevDd) sevDd.hidden = false;

        const rail = document.querySelector(".cio-dots-rail");
        if (rail) rail.hidden = true;
        if (cioDotsApi) { cioDotsApi.destroy(); cioDotsApi = null; }

        CI_DRIVERS_STATE.severity = "All";

      const CI_TABLE_STATE = { page: 1, pageSize: 10, sortKey: null, sortDir: "asc", q: "", domain: "All", severity: "All" };

      function ciFilteredIndicators() {
        return CI_INDICATORS.filter((r) => {
          if (CI_TABLE_STATE.domain !== "All" && r.domain !== CI_TABLE_STATE.domain) return false;
          if (CI_TABLE_STATE.severity !== "All" && r.severity !== CI_TABLE_STATE.severity.toLowerCase()) return false;
          if (CI_TABLE_STATE.q && !r.name.toLowerCase().includes(CI_TABLE_STATE.q.toLowerCase())) return false;
          return true;
        });
      }

      function numOf(s) {
        const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ""));
        return isNaN(n) ? -Infinity : n;
      }

      function ciSortTable(key) {
        if (CI_TABLE_STATE.sortKey === key) {
          CI_TABLE_STATE.sortDir = CI_TABLE_STATE.sortDir === "asc" ? "desc" : "asc";
        } else {
          CI_TABLE_STATE.sortKey = key;
          CI_TABLE_STATE.sortDir = "asc";
        }
        ciRenderTable();
      }

      function ciGoPage(n) {
        const rows = ciFilteredIndicators();
        const pages = Math.max(1, Math.ceil(rows.length / CI_TABLE_STATE.pageSize));
        CI_TABLE_STATE.page = Math.min(Math.max(1, n), pages);
        ciRenderTable();
      }

      function ciRenderTable() {
        let rows = ciFilteredIndicators();
        const { sortKey, sortDir } = CI_TABLE_STATE;
        if (sortKey) {
          rows = rows.slice().sort((a, b) => {
            let av = a[sortKey], bv = b[sortKey];
            if (["value", "mom", "yoy"].includes(sortKey)) { av = numOf(av); bv = numOf(bv); }
            else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
            if (av < bv) return sortDir === "asc" ? -1 : 1;
            if (av > bv) return sortDir === "asc" ? 1 : -1;
            return 0;
          });
        }
        const pages = Math.max(1, Math.ceil(rows.length / CI_TABLE_STATE.pageSize));
        CI_TABLE_STATE.page = Math.min(CI_TABLE_STATE.page, pages);
        const start = (CI_TABLE_STATE.page - 1) * CI_TABLE_STATE.pageSize;
        const pageRows = rows.slice(start, start + CI_TABLE_STATE.pageSize);

        /* Tabler icon glyphs rather than Unicode arrow characters (⇅/↑/↓):
           icon-font glyphs are drawn to fill their box tightly, so they land
           flush with the button's right edge. Unicode arrows carry font-
           dependent side-bearing that leaves visible whitespace before the
           box edge, which reads as misaligned against the solid-fill change
           pills in the data rows below even though the boxes measure equal. */
        const arrowIcon = (key) => key === CI_TABLE_STATE.sortKey
          ? (CI_TABLE_STATE.sortDir === "asc" ? "ti-sort-ascending" : "ti-sort-descending")
          : "ti-arrows-sort";
        /* Sortable headers are real controls: focusable, Enter/Space activated,
           and they report direction through aria-sort. */
        const ariaSort = (key) => key === CI_TABLE_STATE.sortKey
          ? (CI_TABLE_STATE.sortDir === "asc" ? "ascending" : "descending") : "none";
        const th = (key, label) => `<th scope="col" aria-sort="${ariaSort(key)}">
    <button type="button" class="th-sort" onclick="ciSortTable('${key}')">${label} <i class="ti ${arrowIcon(key)} sort-icon" aria-hidden="true"></i></button>
  </th>`;
        const thead = `<tr>
  ${th("name", "Indicator")}
  ${th("domain", "Domain")}
  ${th("severity", "Severity")}
  ${th("value", "Value")}
  ${th("mom", "MoM")}
  ${th("yoy", "YoY")}
</tr>`;
        const tbody = pageRows.map((r) => `<tr>
  <td class="td-indicator">${esc(r.name)}</td>
  <td>${domainTag(r.domain)}</td>
  <td>${riskChip(r.severity)}</td>
  <td class="td-val">${esc(r.value)}</td>
  <td class="td-mom">${r.mom === "N/A" ? "N/A" : changeSpan(r.mom, r.momDir, r.momDir === "up" ? "chg-up" : r.momDir === "down" ? "chg-down" : "")}</td>
  <td class="td-yoy">${r.yoy === "N/A" ? "N/A" : changeSpan(r.yoy, r.yoyDir, r.yoyDir === "up" ? "chg-up" : r.yoyDir === "down" ? "chg-down" : "")}</td>
</tr>`).join("");

        const wrap = document.getElementById("ciTableWrap");
        if (wrap) wrap.innerHTML = `<table id="ciTable"><thead>${thead}</thead><tbody>${tbody || `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">No indicators match these filters.</td></tr>`}</tbody></table>`;
        const pag = document.getElementById("ciTablePag");
        if (pag) pag.innerHTML = buildPagination(CI_TABLE_STATE.page, CI_TABLE_STATE.pageSize, rows.length, "ciGoPage");
        document.querySelectorAll("#ciTable th").forEach((th, i) => {
          const keys = ["name", "domain", "severity", "value", "mom", "yoy"];
          th.classList.toggle("sorted", keys[i] === CI_TABLE_STATE.sortKey);
        });

      /* ============================================================
         AUDIO BRIEF — ported from CPI.html's initCpiBriefSpeech(), which in
         turn ports the home page's Daily Brief listen control. Narrates the
         hero title + summary via the Web Speech API: idle → speaking →
         paused, with restart + stop affordances.
         ============================================================ */
      function initCiBriefSpeech() {
        const button = document.getElementById("ciBriefListen");
        const controls = document.getElementById("ciBriefSpeech");
        const restartButton = document.getElementById("ciBriefRestart");
        const stopButton = document.getElementById("ciBriefStop");
        const status = document.getElementById("ciBriefSpeechStatus");
        if (!button || !controls) return;

        const label = button.querySelector(".brief-listen__text");
        if (!("speechSynthesis" in window)) {
          controls.hidden = true;
          return;
        }
        const synth = window.speechSynthesis;
        let utterance = null;
        let state = "idle";

        const setState = (next) => {
          state = next;
          button.dataset.state = next;
          controls.classList.toggle("is-active", next !== "idle");
          button.setAttribute("aria-pressed", String(next === "speaking"));
          button.setAttribute(
            "aria-label",
            next === "speaking"
              ? "Pause brief"
              : next === "paused"
                ? "Resume brief"
                : "Listen to the Crisis Intelligence brief"
          );
          if (label) {
            label.textContent =
              next === "speaking" ? "Pause" : next === "paused" ? "Resume" : "Audio brief";
          }
          if (status) {
            status.textContent =
              next === "speaking"
                ? "Crisis Intelligence brief is playing"
                : next === "paused"
                  ? "Crisis Intelligence brief paused"
                  : "Crisis Intelligence brief stopped";
          }
        };

        const getBriefText = () => {
          const hero = button.closest(".cpi-hero");
          const title = (hero.querySelector(".cpi-hero-title") || {}).textContent || "";
          const sub = (hero.querySelector(".cpi-hero-sub") || {}).textContent || "";
          return `${title.trim()}. ${sub.trim()}`;
        };

        const start = () => {
          synth.cancel();
          utterance = new SpeechSynthesisUtterance(getBriefText());
          utterance.lang = "en-GB";
          utterance.rate = 0.94;
          utterance.pitch = 1;
          utterance.onstart = () => setState("speaking");
          utterance.onend = () => setState("idle");
          utterance.onerror = (event) => {
            if (event.error !== "canceled" && event.error !== "interrupted" && status) {
              status.textContent = "Unable to play the Crisis Intelligence brief";
            }
            setState("idle");
          };
          synth.speak(utterance);
        };

        button.addEventListener("click", () => {
          if (state === "speaking") {
            synth.pause();
            setState("paused");
          } else if (state === "paused") {
            synth.resume();
            setState("speaking");
          } else {
            start();
          }
        });

        if (restartButton) restartButton.addEventListener("click", start);
        if (stopButton) {
          stopButton.addEventListener("click", () => {
            synth.cancel();
            setState("idle");
          });
        }
        window.addEventListener("beforeunload", () => synth.cancel());
      }
