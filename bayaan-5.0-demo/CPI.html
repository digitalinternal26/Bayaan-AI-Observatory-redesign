      }

      /* ============================================================
         ANALYTICS GRID VIEW — squarified treemap engine.
         Tiles are always sized by category weight (basket importance) for
         the Growth and Weight tabs — this matches how CPI treemaps are
         read in practice and is why, e.g., Housing & Utilities (the
         heaviest-weighted category) dominates the canvas regardless of
         its own growth rate. Contributions sizes by |weight × change|
         instead, since that IS the metric being visualised. Tile colour
         always follows price-change direction (yoy/mom) so the
         Increased/Decreased/No Change legend stays meaningful no matter
         which tab is active. These functions are pure — they take a
         category list + metric/period and return layout data, so the
         same engine can drive any future CPI/Analytics treemap. ── */
      function dgContribution(c, period) {
        const change = parseFloat(period === "yoy" ? c.yoy : c.mom);
        const weight = parseFloat(c.weight);
        return (weight / 100) * change;
      }

      function dgTreemapItemData(c, metric, period) {
        const weight = parseFloat(c.weight);
        const change = period === "yoy" ? c.yoy : c.mom;
        const tone = dgTone(change);
        let size, valueText, metaText;
        if (metric === "weight") {
          size = weight;
          valueText = c.weight;
          metaText = (period === "yoy" ? "YoY " : "MoM ") + change;
        } else if (metric === "contributions") {
          const contrib = dgContribution(c, period);
          size = Math.max(Math.abs(contrib), 0.02);
          valueText = (contrib >= 0 ? "+" : "") + contrib.toFixed(2) + "pp";
          metaText = "Weight " + c.weight;
        } else {
          size = weight;
          valueText = change;
          metaText = "Weight " + c.weight;
        }
        return { size, valueText, metaText, tone };
      }

      function dgTooltipHtml(c, metric, period) {
        const periodLabel = period === "yoy" ? "YoY" : "MoM";
        const change = period === "yoy" ? c.yoy : c.mom;
        const contrib = dgContribution(c, period);
        const metricLabel = metric === "weight" ? "Weight" : metric === "contributions" ? "Contribution" : "Growth";
        const metricValue = metric === "weight" ? c.weight : metric === "contributions" ? (contrib >= 0 ? "+" : "") + contrib.toFixed(2) + "pp" : change;
        const tone = dgTone(change);
        return `<div class="dg-tt-title"><i class="ti ${c.icon}"></i> ${c.name}</div>
<div class="dg-tt-row"><span>${metricLabel}</span><b class="${tone}">${metricValue}</b></div>
<div class="dg-tt-row"><span>${periodLabel} change</span><b class="${tone}">${change}</b></div>
<div class="dg-tt-row"><span>Weight</span><b>${c.weight}</b></div>`;
      }

      /* Squarified layout — classic Bruls/Huizing/van Wijk algorithm.
         Items need a positive .size; returns {item,x,y,w,h} rects in the
         same pixel space as the (x0,y0,w0,h0) rect passed in. */
      function dgWorstRatio(row, rowSum, shortSide) {
        if (rowSum <= 0) return Infinity;
        const thickness = rowSum / shortSide;
        let worst = 0;
        for (const entry of row) {
          const length = entry.value / thickness;
          if (length <= 0) continue;
          const ratio = Math.max(length / thickness, thickness / length);
          if (ratio > worst) worst = ratio;
        }
        return worst || Infinity;
      }

      function dgPlaceRow(row, rowSum, rect) {
        const rects = [];
        if (rect.w <= rect.h) {
          const rowH = rowSum / rect.w;
          let cx = rect.x;
          row.forEach((entry) => {
            const itemW = entry.value / rowH;
            rects.push({ item: entry.item, x: cx, y: rect.y, w: itemW, h: rowH });
            cx += itemW;
          });
          return { rects, remaining: { x: rect.x, y: rect.y + rowH, w: rect.w, h: rect.h - rowH } };
        }
        const rowW = rowSum / rect.h;
        let cy = rect.y;
        row.forEach((entry) => {
          const itemH = entry.value / rowW;
          rects.push({ item: entry.item, x: rect.x, y: cy, w: rowW, h: itemH });
          cy += itemH;
        });
        return { rects, remaining: { x: rect.x + rowW, y: rect.y, w: rect.w - rowW, h: rect.h } };
      }

      function dgSquarify(items, x0, y0, w0, h0) {
        const positive = items.filter((it) => it.size > 0);
        const total = positive.reduce((s, it) => s + it.size, 0) || 1;
        const scale = (w0 * h0) / total;
        let remaining = positive
          .map((it) => ({ item: it, value: Math.max(it.size * scale, 1) }))
          .sort((a, b) => b.value - a.value);

        const placed = [];
        let rect = { x: x0, y: y0, w: w0, h: h0 };

        while (remaining.length && rect.w > 0.5 && rect.h > 0.5) {
          const shortSide = Math.min(rect.w, rect.h);
          let row = [remaining[0]];
          let rowSum = remaining[0].value;
          let i = 1;
          while (i < remaining.length) {
            const next = remaining[i];
            const candidateSum = rowSum + next.value;
            if (dgWorstRatio(row, rowSum, shortSide) >= dgWorstRatio(row.concat(next), candidateSum, shortSide)) {
              row.push(next);
              rowSum = candidateSum;
              i++;
            } else {
              break;
            }
          }
          const result = dgPlaceRow(row, rowSum, rect);
          placed.push(...result.rects);
          rect = result.remaining;
          remaining = remaining.slice(row.length);
        }
        return placed;
      }

      /* Renders/updates the treemap in place: existing tiles are reused
         (position/size/content updated) rather than torn down and
         rebuilt, so switching metric or period is cheap. `handlers.attach`
         is called once per tile the first time it's created. */
      function dgRenderTreemap(container, categories, metric, period, tileMap, handlers) {
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (!w || !h) return;

        const items = categories.map((c) => {
          const d = dgTreemapItemData(c, metric, period);
          return { key: c.name, category: c, ...d };
        });
        const rects = dgSquarify(items, 0, 0, w, h);
        const gap = 3;
        const seen = new Set();

        rects.forEach((r) => {
          const it = r.item;
          seen.add(it.key);
          let tile = tileMap.get(it.key);
          if (!tile) {
            tile = document.createElement("div");
            tile.className = "dg-treemap-tile";
            tile.tabIndex = 0;
            tile.setAttribute("role", "button");
            tile.dataset.category = it.key;
            tile.innerHTML = `<div class="dg-treemap-icon"><i class="ti ${it.category.icon}"></i></div>
<div class="dg-treemap-name">${it.key}</div>
<div class="dg-treemap-value"></div>
<div class="dg-treemap-meta"></div>`;
            container.appendChild(tile);
            tileMap.set(it.key, tile);
            if (handlers) handlers.attach(tile, it.key);
          }
          const rw = Math.max(r.w - gap, 4);
          const rh = Math.max(r.h - gap, 4);
          tile.className = "dg-treemap-tile " + it.tone;
          tile.style.left = r.x + gap / 2 + "px";
          tile.style.top = r.y + gap / 2 + "px";
          tile.style.width = rw + "px";
          tile.style.height = rh + "px";
          const minSide = Math.min(rw, rh);
          tile.classList.toggle("dg-treemap-tile--sm", minSide < 100);
          tile.classList.toggle("dg-treemap-tile--xs", minSide < 82);
          tile.classList.toggle("dg-treemap-tile--micro", minSide < 50);
          tile.querySelector(".dg-treemap-value").textContent = it.valueText;
          tile.querySelector(".dg-treemap-meta").textContent = it.metaText;
          tile.setAttribute("aria-label", it.category.name + ", " + it.valueText);
        });

        tileMap.forEach((tile, key) => {
          if (!seen.has(key)) {
            tile.remove();
            tileMap.delete(key);
          }
        });
      }

      function dgCard(c, i) {
        const badgeCls = "dg-pill--" + (c.badge || "stable").toLowerCase();
        const badgeLabel = (c.badge || "Stable").charAt(0).toUpperCase() + (c.badge || "stable").slice(1).toLowerCase();
        const accelHtml = c.accel
          ? `<span class="dg-pill dg-pill--accel"><i class="ti ti-trending-up"></i> Accelerating</span>`
          : "";
        return `<article class="obs-card dg-card" data-category="${c.name}" style="animation:dg-card-reveal .45s cubic-bezier(.2,.8,.2,1) ${i * 32}ms both">
  <div class="dg-cardhead">
    <div class="dg-card-ic"><i class="ti ${c.icon}"></i></div>
    <div class="dg-card-id-text">
      <div class="dg-card-name">${c.name}</div>
      <div class="dg-card-tag">${c.trend}</div>
    </div>

      /* ── Build category detail payload from an analytics entry.
         Returns the shape expected by renderCategoryDetail():
         name, icon, status, statusIcon, cpi, weight, mom, yoy,
         period, summary, performanceData[], drivers[], actions[].
         The 24-month performance series is derived from the ending
         CPI value anchored by the known YoY and MoM percentages,
         then smoothed with a cubic ease for visual clarity. ── */
      function buildCategoryDetail(cat) {
        if (!cat) return null;
        const copy = DG_CATEGORY_COPY[cat.name] || {
          summary: cat.name + " price movements reflect supply, demand, and regulatory dynamics within the category.",
          drivers: [{ title: "Market Forces", value: cat.yoy, description: "Year-over-year price changes driven by supply and demand conditions." }],
          actions: [{ title: "Monitor Price Trends", description: "Track category price index movements and their contribution to headline CPI." }]
        };

        const endCpi  = parseFloat(cat.cpi);
        const yoyPct  = parseFloat(cat.yoy);
        const momPct  = parseFloat(cat.mom);
        const MONTHS  = [
          "Jun '24","Jul '24","Aug '24","Sep '24","Oct '24","Nov '24","Dec '24",
          "Jan '25","Feb '25","Mar '25","Apr '25","May '25","Jun '25","Jul '25",
          "Aug '25","Sep '25","Oct '25","Nov '25","Dec '25","Jan '26","Feb '26",
          "Mar '26","Apr '26","May '26"
        ];

        /* Anchor points: May '25 (index 11) and Jun '24 (index 0). */
        const midCpi   = isFinite(yoyPct) && yoyPct !== 0 ? endCpi / (1 + yoyPct / 100) : endCpi * 0.99;
        const startCpi = isFinite(yoyPct) && yoyPct !== 0 ? midCpi  / (1 + yoyPct / 100) : midCpi  * 0.99;

        const performanceData = MONTHS.map((month, i) => {
          let value;
          if (i <= 11) {
            const t  = i / 11;
            const tc = t * t * (3 - 2 * t); /* smoothstep */
            value = startCpi + (midCpi - startCpi) * tc;
          } else {
            const t  = (i - 11) / 12;
            const tc = t * t * (3 - 2 * t);
            value = midCpi + (endCpi - midCpi) * tc;
          }
          return { month, value: Math.round(value * 100) / 100 };
        });

        return {
          name:        cat.name,
          icon:        cat.icon,
          status:      cat.risk === "moderate" ? "Moderate" : "Stable",
          statusIcon:  cat.risk === "moderate" ? "ti-activity" : "ti-minus",
          cpi:         cat.cpi,
          weight:      cat.weight,
          mom:         cat.mom,
          yoy:         cat.yoy,
          period:      "May 2026",
          summary:     copy.summary,
          performanceData,
          drivers:     copy.drivers,
          actions:     copy.actions
        };
      }

        function dgTreemapAriaLabel() {
          const metricLabel = dgTreemapState.metric === "weight" ? "weight" : dgTreemapState.metric === "contributions" ? "contribution to overall CPI" : "growth";
          const periodLabel = dgTreemapState.period === "yoy" ? "year over year" : "month over month";

        function dgPositionTooltip(tile) {
          const tileRect = tile.getBoundingClientRect();
          const treemapRect = treemapEl.getBoundingClientRect();
          const ttRect = tooltipEl.getBoundingClientRect();
          const minTop = Math.max(8, treemapRect.top);
          let left = tileRect.left + tileRect.width / 2 - ttRect.width / 2;
          let top = tileRect.top - ttRect.height - 10;
          if (top < minTop) top = tileRect.bottom + 10;
          left = Math.max(8, Math.min(left, window.innerWidth - ttRect.width - 8));
          tooltipEl.style.left = left + "px";
          tooltipEl.style.top = top + "px";
        }

        function dgShowTooltip(tile, key) {
          const category = analytics.find((c) => c.name === key);
          if (!category) return;

          tooltipEl.classList.add("dg-tt--visible");
          dgPositionTooltip(tile);
        }

        function dgSelectTile(key) {
          const tile = dgTiles.get(key);
          if (!tile) return;
          if (dgSelectedTile) dgSelectedTile.classList.remove("dg-treemap-tile--selected");
          dgSelectedTile = tile;
          tile.classList.add("dg-treemap-tile--selected");

        function dgAttachTileEvents(tile, key) {
          tile.addEventListener("mouseenter", () => dgShowTooltip(tile, key));
          tile.addEventListener("mousemove", () => dgPositionTooltip(tile));
          tile.addEventListener("mouseleave", dgHideTooltip);
          tile.addEventListener("focus", () => dgShowTooltip(tile, key));
          tile.addEventListener("blur", dgHideTooltip);
          tile.addEventListener("click", () => dgSelectTile(key));
          tile.addEventListener("keydown", (e) => {

        const table = root.querySelector(".dg-table");

        function parseValue(value, column) {
          if (column === "category") {
            return value.trim();
          }
          if (column === "risk") {
            return value.toLowerCase().includes("moderate") ? 0 : 1;
          }
          const numMatch = value.match(/^([+-]?[\d.]+)/);
          if (numMatch) return parseFloat(numMatch[1]);
          return value;
        }

        function compareValues(a, b, column) {
          const aVal = parseValue(a, column);
          const bVal = parseValue(b, column);
          if (typeof aVal === "number" && typeof bVal === "number") {
            return aVal - bVal;
          }
          return String(aVal).localeCompare(String(bVal));
        }

        function updateSortIcons() {
          headers.forEach((h) => {
            const col = h.getAttribute("data-sortable");
            const icon = h.querySelector(".sort-icon");
            if (!icon) return;
            if (col === currentSortColumn) {

            if (currentSortColumn === column) {
              currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";

              currentSortDirection = "asc";
              headers.forEach((h) => {
                h.removeAttribute("data-sort-active");

            header.setAttribute("data-sort-direction", currentSortDirection);

            rows.sort((rowA, rowB) => {

              const bCell = column === "category"

      function buildCategoryPerformanceChart(data) {
        const points = data.performanceData;
        const values = points.map(d => d.value);
        const labels = points.map(d => d.month);

        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        // Round to nearest 2 for nicer scale
        const yMin = Math.floor(minVal / 2) * 2;
        const yMax = Math.ceil(maxVal / 2) * 2;
        const yRange = yMax - yMin;

        const SVG_W = 720;
        const SVG_H = 280;
        const MARGIN = { top: 20, right: 20, bottom: 60, left: 62 };
        const PLOT_W = SVG_W - MARGIN.left - MARGIN.right;
        const PLOT_H = SVG_H - MARGIN.top - MARGIN.bottom;

        const fmt = (n) => Math.round(n * 100) / 100;
        const toX = (i) => MARGIN.left + (i / (values.length - 1)) * PLOT_W;
        const toY = (v) => MARGIN.top + PLOT_H - ((v - yMin) / yRange) * PLOT_H;

        // Build grid lines and Y-axis labels
        let gridHtml = "";
        const yTicks = 6;
        for (let i = 0; i <= yTicks; i++) {
          const val = yMin + (i / yTicks) * yRange;
          const y = toY(val);
          gridHtml += `<line x1="${MARGIN.left}" y1="${fmt(y)}" x2="${SVG_W - MARGIN.right}" y2="${fmt(y)}" stroke="#e2e8f0" stroke-width="1"/>`;
          gridHtml += `<text x="${MARGIN.left - 10}" y="${fmt(y + 4)}" text-anchor="end" font-size="11" fill="#9aa0b0">${fmt(val)}</text>`;
        }

        // Build data line and area
        let pathData = `M${fmt(toX(0))} ${fmt(toY(values[0]))}`;
        for (let i = 1; i < values.length; i++) {
          pathData += ` L${fmt(toX(i))} ${fmt(toY(values[i]))}`;
        }

        const areaPath = `M${fmt(toX(0))} ${fmt(toY(values[0]))} ${pathData.substring(1)} L${fmt(toX(values.length - 1))} ${fmt(MARGIN.top + PLOT_H)} L${fmt(toX(0))} ${fmt(MARGIN.top + PLOT_H)} Z`;

        // Build data points
        let pointsHtml = "";
        for (let i = 0; i < values.length; i++) {
          const x = toX(i);
          const y = toY(values[i]);
          pointsHtml += `<circle cx="${fmt(x)}" cy="${fmt(y)}" r="2.5" fill="#0066ff" opacity="0.8"/>`;
        }

        // Build X-axis labels (show every 3rd label to avoid overlap)
        let xLabelsHtml = "";
        for (let i = 0; i < labels.length; i += 3) {
          const x = toX(i);
          xLabelsHtml += `<text x="${fmt(x)}" y="${SVG_H - 15}" text-anchor="middle" font-size="10" fill="#9aa0b0">${labels[i]}</text>`;
        }

        return `
<div class="cd-perf-chart-container">
  <svg class="cd-perf-chart-svg" viewBox="0 0 ${SVG_W} ${SVG_H}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="perfAreaGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0066ff" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#0066ff" stop-opacity="0.02"/>
      </linearGradient>
    </defs>

    <!-- Grid lines and Y-axis labels -->
    ${gridHtml}

    <!-- X and Y axis lines -->
    <line x1="${MARGIN.left}" y1="${MARGIN.top}" x2="${MARGIN.left}" y2="${MARGIN.top + PLOT_H}" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="${MARGIN.left}" y1="${MARGIN.top + PLOT_H}" x2="${SVG_W - MARGIN.right}" y2="${MARGIN.top + PLOT_H}" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Data area -->
    <path d="${areaPath}" fill="url(#perfAreaGradient)"/>

    <!-- Data line -->
    <polyline points="${values.map((v, i) => `${fmt(toX(i))},${fmt(toY(v))}`).join(' ')}" fill="none" stroke="#0066ff" stroke-width="2" vector-effect="non-scaling-stroke"/>

    <!-- Data points -->
    ${pointsHtml}

    <!-- X-axis labels -->
    ${xLabelsHtml}

    <!-- Y-axis title -->
    <text x="14" y="${fmt(MARGIN.top + PLOT_H / 2)}" text-anchor="middle" font-size="10" fill="#9aa0b0" transform="rotate(-90 14 ${fmt(MARGIN.top + PLOT_H / 2)})">CPI Base Year 2021 = 100</text>
  </svg>
</div>`;
      }

            el => (el.textContent || "").trim().toLowerCase().startsWith("diagnose")
          );
          if (diagnoseItem) {
            sidebar.querySelectorAll(".sidebar-item").forEach(s => s.classList.remove("active"));
            diagnoseItem.classList.add("active");
          }
        }

        const scrollWrap = document.querySelector(".crisis-scroll");
        if (scrollWrap) scrollWrap.scrollTop = 0;
      }

      /* Performance chart expand — real fullscreen via the Fullscreen API;
         falls back to spanning the full grid width when Fullscreen is
         unsupported or blocked (e.g. a sandboxed iframe). Defined once at
         top level (rather than inside renderCategoryDetail) since that
         function re-renders #cd-perf-section/#cd-perf-toggle on every
         category switch — a listener bound there would pile up on
         `document` across switches instead of being replaced. */
      function syncPerfExpandState() {
        const perfToggle = document.getElementById("cd-perf-toggle");
        if (!perfToggle) return;
        const perfSection = document.getElementById("cd-perf-section");
        const expanded = !!(document.fullscreenElement || document.webkitFullscreenElement) || (perfSection && perfSection.classList.contains("cd-perf-expanded"));
        perfToggle.setAttribute("aria-pressed", String(expanded));
        perfToggle.setAttribute("aria-label", expanded ? "Collapse Performance chart" : "Expand Performance chart");
        const perfIcon = perfToggle.querySelector("i");
        if (perfIcon) {
          perfIcon.classList.toggle("ti-arrows-maximize", !expanded);
          perfIcon.classList.toggle("ti-arrows-minimize", expanded);
        }
      }
      function perfExpandFallback() {
        const perfSection = document.getElementById("cd-perf-section");
        if (perfSection) perfSection.classList.toggle("cd-perf-expanded");
        syncPerfExpandState();
      }
      function togglePerfExpand() {
        const perfSection = document.getElementById("cd-perf-section");
        if (!perfSection) return;
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        const request = perfSection.requestFullscreen || perfSection.webkitRequestFullscreen;
        if (!request) { perfExpandFallback(); return; }
        const result = request.call(perfSection);
        if (result && typeof result.catch === "function") result.catch(perfExpandFallback);
      }
      document.addEventListener("fullscreenchange", syncPerfExpandState);
      document.addEventListener("webkitfullscreenchange", syncPerfExpandState);

      /* ── Boot ── */
      document.addEventListener("DOMContentLoaded", function () {
        if (window.BayaanHeader && typeof window.BayaanHeader.init === "function") {
          window.BayaanHeader.init();
          window.BayaanHeader.syncActive("screen-cpi-obs");
        }
        if (window.initBayaanFooter) initBayaanFooter();
        initCpiObservatory();

        /* Deep link — #diagnose opens the Diagnose pane directly (used by the
           Forecast page's sidebar link back into this page). */
        if (location.hash === "#diagnose") {
          const item = [...document.querySelectorAll(".sidebar-item")].find(
            (el) => (el.textContent || "").trim().toLowerCase().startsWith("diagnose")
          );
          if (item) activateSidebar(item);
        }
      });
    </script>
  </body>
</html>
