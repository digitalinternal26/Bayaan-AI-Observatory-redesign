<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bayaan AI — Mobile Landing Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════ THEME TOKENS ═══════════════════════════════ */
[data-theme="dark"]{
  --bg:#171B23; --bg-hover:#1D222B; --card:#1E232D; --panel:#20252F; --fill:#252B36;
  --hairline:#2A3039; --border:#2E3540; --border-strong:#353D49; --selected:#1B2634;
  --faint:#4A505C; --muted:#6E7684; --secondary2:#9AA1AD; --secondary:#A6ACB8;
  --body:#C7CCD6; --body-strong:#E8EBF0; --text-max:#EDF0F5; --ink:#F2F4F8;
  --link:#6FA5EE; --blue-deep:#7FB0F5; --blue-tint:#15263E; --blue-tint-bd:#20395C;
  --btn-hover:#4A90E8; --amber:#E79A00; --amber-bg:#2E2513;
  --green:#46B968; --green-bg:#14291B; --green-bd:#1F4228; --green-text:#7ECD96;
  --purple:#A548F2; --purple-bg:#271A36; --purple-bd:#3C2A57; --purple-text:#C495F5;
  --red:#F16A6A; --red-bg:#3A181B; --bubble:#1D2A3E; --bubble-bd:#25344C;
  --frame-bg:#000; --island:#000;
  --bg-app: radial-gradient(130% 52% at 50% 110%, rgba(41,125,227,.30) 0%, rgba(41,125,227,.10) 46%, rgba(23,27,35,0) 76%), linear-gradient(180deg,#1D2530 0%,#171B23 34%,#171B23 100%);
  --shadow-card: 0 1px 2px rgba(0,0,0,.28);
  --shadow-pop: 0 18px 48px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --bg:#FDFDFC; --bg-hover:#FAFBFD; --card:#FFFFFF; --panel:#F8F9FB; --fill:#F3F4F6;
  --hairline:#F0F0EE; --border:#ECEDEF; --border-strong:#E5E7EB; --selected:#F8F9FB;
  --faint:#C6C9CE; --muted:#9CA3AF; --secondary2:#6B7280; --secondary:#4B5563;
  --body:#374151; --body-strong:#1F2937; --text-max:#111827; --ink:#1B1F33;
  --link:#1F65BD; --blue-deep:#184F97; --blue-tint:#EAF2FF; --blue-tint-bd:#CFE3FF;
  --btn-hover:#1F65BD; --amber:#E79A00; --amber-bg:#FEF1C9;
  --green:#228636; --green-bg:#D8F3D6; --green-bd:#BCE8B9; --green-text:#1A6B2B;
  --purple:#8436C6; --purple-bg:#F3E8FE; --purple-bd:#E4D1FC; --purple-text:#8436C6;
  --red:#DC2626; --red-bg:#FEE2E2; --bubble:#F1F6FE; --bubble-bd:#E9F1FD;
  --frame-bg:#F2F2F7; --island:#000;
  --bg-app: radial-gradient(130% 52% at 50% 110%, #CFE3FF 0%, #EAF2FF 40%, rgba(253,253,252,0) 74%), #FDFDFC;
  --shadow-card: 0 1px 2px rgba(16,24,40,.06);
  --shadow-pop: 0 18px 48px rgba(16,24,40,.18);
}
:root{ --brand:#297DE3; --brand-grad:linear-gradient(135deg,#1E5FBF,#297DE3); }

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; }
body{
  background:#e7e5df; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
  padding:40px 0; font-family:'Geist',system-ui,-apple-system,sans-serif; color:var(--ink);
}
[data-theme="dark"] body{ background:#0c0d10; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
::-webkit-scrollbar{ display:none; }
.mono{ font-family:'Geist Mono',monospace; }

/* ═══════════════════════════════ PHONE FRAME ═══════════════════════════════ */
.frame{
  position:relative; width:402px; height:874px; border-radius:52px; background:var(--frame-bg);
  box-shadow:0 40px 90px rgba(0,0,0,.30), 0 0 0 2px #0b0b0d, 0 0 0 3px rgba(255,255,255,.05);
  overflow:hidden; flex:none;
}
.screen{
  position:absolute; inset:0; border-radius:52px; overflow:hidden;
  background:var(--bg-app); color:var(--ink); display:flex; flex-direction:column;
}
.island{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:var(--island); border-radius:20px; z-index:200; }
.homebar{ position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:100px; background:var(--ink); opacity:.32; z-index:200; }
.statusbar{ position:relative; height:56px; flex:none; display:flex; align-items:flex-end; justify-content:space-between; padding:0 32px 7px; font-size:15px; font-weight:600; color:var(--ink); z-index:150; letter-spacing:.02em; }
.statusbar .sb-r{ display:flex; align-items:center; gap:7px; }
.statusbar svg{ display:block; }

/* ═══════════════════════════════ LAYERS ═══════════════════════════════ */
.layer{ position:absolute; inset:56px 0 0 0; display:flex; flex-direction:column; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity .32s ease, transform .32s ease; z-index:1; }
.layer.show{ opacity:1; visibility:visible; transform:none; z-index:2; }
.layer.slideup{ inset:0; transform:translateY(100%); transition:transform .42s cubic-bezier(.32,.72,0,1), opacity .3s; opacity:1; }
.layer.slideup.show{ transform:translateY(0); }

/* ═══════════════════════════════ TOP BAR ═══════════════════════════════ */
.topbar{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 20px 8px; }
.brand{ display:flex; align-items:center; gap:9px; }
.logo{ width:30px; height:30px; border-radius:8px; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(41,125,227,.35); }
.logo svg{ display:block; }
.brand .wm{ font-size:17px; font-weight:700; letter-spacing:-.02em; color:var(--text-max); }
.topbar .actions{ display:flex; align-items:center; gap:8px; }
.icon-btn{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--secondary); background:transparent; transition:background .18s, color .18s, transform .18s; }
.icon-btn:hover{ background:var(--fill); }
.icon-btn:active{ transform:scale(.92); }
.heart-btn.on{ color:#fff; background:var(--brand-grad); box-shadow:0 4px 14px rgba(41,125,227,.4); }
.heart-btn.on svg{ fill:#fff; stroke:#fff; }

/* ═══════════════════════════════ TAB STRIP ═══════════════════════════════ */
.tabstrip{ flex:none; max-height:0; overflow:hidden; transition:max-height .34s cubic-bezier(.32,.72,0,1); }
.tabstrip.open{ max-height:60px; }
.tabstrip-inner{ display:flex; gap:8px; padding:6px 20px 12px; overflow-x:auto; }
.tab{ flex:none; display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:99px; font-size:13px; font-weight:600; color:var(--secondary); background:var(--card); border:1px solid var(--border); white-space:nowrap; transition:all .18s; animation:chipIn .34s both; }
.tabstrip.open .tab:nth-child(1){ animation-delay:.02s } .tabstrip.open .tab:nth-child(2){ animation-delay:.06s }
.tabstrip.open .tab:nth-child(3){ animation-delay:.10s } .tabstrip.open .tab:nth-child(4){ animation-delay:.14s }
.tabstrip.open .tab:nth-child(5){ animation-delay:.18s }
.tab.active{ color:#fff; background:var(--brand-grad); border-color:transparent; box-shadow:0 4px 12px rgba(41,125,227,.32); }
.tab svg{ width:15px; height:15px; }

/* ═══════════════════════════════ SCROLL BODY ═══════════════════════════════ */
.body{ flex:1; overflow-y:auto; padding:4px 20px 28px; }
.body--explore{ padding-top:8px; }

/* Home bottom composer dock */
.home-dock{ flex:none; padding:10px 18px 26px; background:linear-gradient(180deg, transparent, var(--bg) 40%); }

/* A/B layout toggle (demo control) */
.seg{ display:inline-flex; align-items:center; background:var(--fill); border:1px solid var(--border); border-radius:99px; padding:2px; }
.seg button{ min-width:26px; height:28px; padding:0 8px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--secondary); font-family:'Geist Mono',monospace; transition:color .16s, background .16s; }
.seg button.on{ background:var(--seg-thumb); color:var(--brand); box-shadow:0 1px 2px rgba(0,0,0,.18); }

/* Version B — editorial tagline + slim brief row */
.greet--b h1{ margin-bottom:2px; }
.hero-tag{ margin-top:10px; font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.16; color:var(--brand); }
.brief-row{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; margin-top:22px; padding:13px 14px; border-radius:16px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-card); transition:transform .16s, background .18s; animation:fadeUp .5s .05s both; }
.brief-row:active{ transform:scale(.99); background:var(--bg-hover); }
.brief-row .br-ic{ position:relative; width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--blue-tint); color:var(--brand); }
.brief-row .br-dot{ position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--green); border:2px solid var(--card); }
.brief-row .br-main{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.brief-row .br-t{ font-size:14.5px; font-weight:600; color:var(--body-strong); letter-spacing:-.01em; }
.brief-row .br-s{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brief-row .br-play{ margin-left:auto; width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--brand-grad); box-shadow:0 3px 10px rgba(41,125,227,.35); }
.brief-row .br-play svg{ margin-left:1px; }

/* Greeting */
.greet{ margin:30px 2px 20px; animation:fadeUp .5s both; }
.greet .date{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.greet h1{ margin:8px 0 6px; font-size:29px; font-weight:700; letter-spacing:-.02em; color:var(--text-max); line-height:1.15; }
.greet .sub{ font-size:14.5px; color:var(--secondary); line-height:1.5; min-height:22px; }

/* Executive Brief card */
.brief-card{ position:relative; border-radius:20px; padding:17px 18px; margin-bottom:18px; overflow:hidden; cursor:pointer; border:1px solid var(--blue-tint-bd); background:linear-gradient(140deg, var(--blue-tint) 0%, var(--card) 68%); box-shadow:var(--shadow-card); animation:fadeUp .55s .05s both; transition:transform .18s, box-shadow .25s; }
.brief-card:active{ transform:scale(.985); }
.brief-card .glow{ position:absolute; top:-40px; right:-30px; width:160px; height:160px; border-radius:999px; background:radial-gradient(circle, rgba(41,125,227,.26) 0%, rgba(41,125,227,0) 70%); pointer-events:none; }
.brief-card .bc-top{ display:flex; align-items:center; gap:8px; margin-bottom:11px; position:relative; }
.brief-card .live{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; color:var(--green-text); background:var(--green-bg); border:1px solid var(--green-bd); padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.04em; }
.brief-card .live .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulseDot 1.6s infinite; }
.brief-card .bc-meta{ margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:500; }
.brief-card h2{ margin:0 0 6px; font-size:19px; font-weight:700; letter-spacing:-.02em; color:var(--text-max); position:relative; }
.brief-card p{ margin:0; font-size:13.5px; color:var(--secondary); line-height:1.5; position:relative; padding-right:40px; }
.brief-card .play{ position:absolute; right:16px; bottom:15px; width:44px; height:44px; border-radius:50%; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(41,125,227,.45); }
.brief-card .play svg{ margin-left:2px; }

/* Hero input */
.hero-label{ font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:4px 2px 10px; }
.composer{ border-radius:22px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-card); padding:14px 15px 11px; transition:border-color .2s, box-shadow .2s; }
.composer:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(41,125,227,.15); }
.composer .ci{ width:100%; border:none; outline:none; background:transparent; resize:none; color:var(--ink); font-size:15.5px; font-family:inherit; line-height:1.5; min-height:26px; }
.composer .ci::placeholder{ color:var(--muted); }
.composer .crow{ display:flex; align-items:center; gap:8px; margin-top:9px; }
.mini-btn{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--secondary); background:var(--fill); border:1px solid var(--border); transition:all .18s; }
.mini-btn.round{ width:34px; padding:0; justify-content:center; }
.mini-btn:hover{ background:var(--bg-hover); }
.mini-btn.mode{ color:var(--brand); }
.send{ margin-left:auto; width:38px; height:38px; border-radius:50%; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(41,125,227,.35); transition:transform .16s; }
.send:active{ transform:scale(.9); }

/* Conversation starters — clean borderless rows (reference style) */
.starters{ margin-top:24px; }
.starters .st-h{ font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.11em; margin:0 2px 4px; font-family:'Geist Mono',monospace; }
.starter{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:15px 2px; background:none; border:none; border-bottom:1px solid var(--hairline); transition:opacity .16s; animation:fadeUp .5s both; }
.starter:active{ opacity:.55; }
.starter .snum{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Geist Mono',monospace; font-size:12px; font-weight:600; }
.starter .st{ font-size:15.5px; font-weight:400; color:var(--body-strong); line-height:1.3; letter-spacing:-.01em; }
.starter .sc{ margin-left:auto; color:var(--faint); flex:none; }

/* ═══════════════════════════════ TAB PANELS ═══════════════════════════════ */
.panel-h{ display:flex; align-items:baseline; justify-content:space-between; margin:18px 2px 14px; animation:fadeUp .4s both; }
.panel-h h2{ margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em; color:var(--text-max); }
.panel-h .pill{ font-size:11.5px; font-weight:600; color:var(--brand); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.p-tile{ border-radius:16px; background:var(--card); border:1px solid var(--border); padding:15px 14px; animation:fadeUp .45s both; }
.p-tile .pt-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:11px; }
.p-tile h3{ margin:0 0 4px; font-size:14.5px; font-weight:600; color:var(--body-strong); letter-spacing:-.01em; }
.p-tile p{ margin:0; font-size:12px; color:var(--secondary); line-height:1.45; }
.ins-card{ border-radius:16px; background:var(--card); border:1px solid var(--border); padding:15px 16px; margin-bottom:11px; animation:fadeUp .45s both; }
.ins-card .ic-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
.ins-card .tagp{ font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:.03em; }
.ins-card h3{ margin:0 0 6px; font-size:15px; font-weight:600; color:var(--body-strong); line-height:1.35; letter-spacing:-.01em; }
.ins-card p{ margin:0; font-size:13px; color:var(--secondary); line-height:1.5; }
.report-row{ display:flex; align-items:center; gap:13px; padding:14px 15px; border-radius:14px; background:var(--card); border:1px solid var(--border); margin-bottom:10px; animation:fadeUp .45s both; }
.report-row .rr-ic{ width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--blue-tint); color:var(--brand); }
.report-row h3{ margin:0 0 3px; font-size:14px; font-weight:600; color:var(--body-strong); letter-spacing:-.01em; }
.report-row .rr-m{ font-size:11.5px; color:var(--muted); }
.report-row .rr-c{ margin-left:auto; color:var(--faint); }
/* Geo view */
.geo-map{ position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--border); background:linear-gradient(160deg,var(--blue-tint),var(--card)); height:180px; margin-bottom:13px; animation:fadeUp .45s both; }
.geo-map .blob{ position:absolute; border-radius:46% 54% 60% 40%/50% 42% 58% 50%; background:rgba(41,125,227,.18); border:1.5px solid rgba(41,125,227,.5); }
.geo-map .pin{ position:absolute; width:12px; height:12px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 4px rgba(41,125,227,.25); }
.geo-map .pin::after{ content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--brand); opacity:.5; animation:ring 2.2s infinite; }
.geo-chips{ display:flex; gap:8px; flex-wrap:wrap; }
.geo-chip{ font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:99px; background:var(--card); border:1px solid var(--border); color:var(--secondary); }
.geo-chip.sel{ color:#fff; background:var(--brand-grad); border-color:transparent; }

/* ═══════════════════════════════ BRIEF HUB ═══════════════════════════════ */
.ov-head{ flex:none; display:flex; align-items:center; gap:12px; padding:60px 18px 12px; border-bottom:1px solid var(--hairline); }
.ov-head .back{ width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; background:var(--fill); color:var(--body-strong); }
.ov-head .oh-t{ font-size:16px; font-weight:700; letter-spacing:-.01em; color:var(--text-max); }
.ov-head .oh-s{ font-size:11.5px; color:var(--muted); margin-top:1px; }
.ov-head .oh-r{ margin-left:auto; display:flex; gap:7px; }
.brief-body{ flex:1; overflow-y:auto; padding:16px 18px 20px; }
.kpi-row{ display:flex; gap:10px; margin-bottom:16px; }
.kpi{ flex:1; border-radius:15px; background:var(--card); border:1px solid var(--border); padding:12px 12px 10px; animation:fadeUp .45s both; }
.kpi .kl{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em; }
.kpi .kv{ font-size:19px; font-weight:700; letter-spacing:-.02em; color:var(--text-max); margin:5px 0 2px; }
.kpi .kc{ font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:3px; }
.kpi .kc.up{ color:var(--green-text); } .kpi .kc.dn{ color:var(--red); }
.kpi svg.spark{ display:block; margin-top:7px; width:100%; height:22px; }
.sec-h{ font-size:12.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:6px 2px 11px; }
.take{ display:flex; gap:11px; padding:13px 0; border-bottom:1px solid var(--hairline); animation:fadeUp .45s both; }
.take .tk-n{ width:24px; height:24px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--brand); background:var(--blue-tint); }
.take p{ margin:0; font-size:13.5px; color:var(--body); line-height:1.55; }
.take b{ color:var(--body-strong); font-weight:600; }
.cta-row{ display:flex; gap:11px; margin-top:20px; }
.cta{ flex:1; display:flex; align-items:center; justify-content:center; gap:9px; height:52px; border-radius:15px; font-size:14.5px; font-weight:600; transition:transform .16s, filter .18s; }
.cta:active{ transform:scale(.97); }
.cta.primary{ color:#fff; background:var(--brand-grad); box-shadow:0 6px 18px rgba(41,125,227,.35); }
.cta.ghost{ color:var(--body-strong); background:var(--card); border:1px solid var(--border-strong); }

/* unified bottom bar (brief/chat) */
.dockbar{ position:absolute; left:0; right:0; bottom:0; padding:12px 18px 26px; background:linear-gradient(180deg, transparent, var(--bg) 34%); }
.dock{ display:flex; align-items:center; gap:9px; border-radius:99px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow-card); padding:7px 8px 7px 17px; }
.dock:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(41,125,227,.15); }
.dock input{ flex:1; border:none; outline:none; background:transparent; color:var(--ink); font-size:14.5px; font-family:inherit; }
.dock input::placeholder{ color:var(--muted); }
.dock .mic{ width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--brand-grad); color:#fff; box-shadow:0 4px 12px rgba(41,125,227,.35); transition:transform .16s; }
.dock .mic:active{ transform:scale(.9); }

/* ═══════════════════════════════ VOICE MODE ═══════════════════════════════ */
.voice{ flex:1; width:100%; background:var(--bg-app); display:flex; flex-direction:column; align-items:center; min-height:0; }
.voice .v-top{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:60px 20px 6px; }
.voice .v-phase{ font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); }
.voice .v-close{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--fill); color:var(--body-strong); }
.orb-wrap{ position:relative; width:230px; height:230px; margin:26px auto 8px; display:flex; align-items:center; justify-content:center; }
.orb{ width:128px; height:128px; border-radius:50%; background:var(--brand-grad); box-shadow:0 0 60px rgba(41,125,227,.6); animation:breathe 3.4s ease-in-out infinite; display:flex; align-items:center; justify-content:center; }
.orb .wave{ display:flex; align-items:center; gap:4px; height:38px; }
.orb .wave i{ width:4px; height:12px; border-radius:2px; background:rgba(255,255,255,.9); animation:wave 1s ease-in-out infinite; }
.orb .wave i:nth-child(2){ animation-delay:.12s } .orb .wave i:nth-child(3){ animation-delay:.24s }
.orb .wave i:nth-child(4){ animation-delay:.36s } .orb .wave i:nth-child(5){ animation-delay:.48s }
.orb .wave i:nth-child(6){ animation-delay:.6s }
.r-ring{ position:absolute; border-radius:50%; border:1.5px solid rgba(41,125,227,.4); animation:ring 3s ease-out infinite; }
.r-ring.r1{ width:170px; height:170px; } .r-ring.r2{ width:210px; height:210px; animation-delay:1s; }
.voice[data-vphase="listening"] .orb{ background:linear-gradient(135deg,#8436C6,#A548F2); box-shadow:0 0 60px rgba(165,72,242,.55); animation-duration:1.6s; }
.voice[data-vphase="listening"] .r-ring{ border-color:rgba(165,72,242,.45); }
.voice[data-vphase="thinking"] .orb{ animation-duration:1s; }
.v-caption{ flex:1; width:100%; overflow-y:auto; padding:14px 26px 8px; text-align:center; }
.v-caption .cap-line{ font-size:17px; line-height:1.55; font-weight:500; color:var(--muted); transition:color .3s; letter-spacing:-.01em; }
.v-caption .cap-line.active{ color:var(--text-max); }
.v-qa{ margin-top:14px; }
.v-qa .vq{ display:inline-block; font-size:15px; font-weight:600; color:#fff; background:linear-gradient(135deg,#8436C6,#A548F2); padding:9px 15px; border-radius:16px 16px 4px 16px; animation:fadeUp .4s both; }
.v-qa .va{ margin-top:12px; font-size:15.5px; line-height:1.6; color:var(--body-strong); animation:fadeUp .4s .1s both; }
.v-controls{ flex:none; width:100%; display:flex; align-items:center; justify-content:center; gap:26px; padding:10px 20px 30px; }
.v-mic{ position:relative; width:76px; height:76px; border-radius:50%; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 10px 30px rgba(41,125,227,.5); transition:transform .16s; }
.v-mic:active{ transform:scale(.94); }
.v-mic::after{ content:''; position:absolute; inset:-8px; border-radius:50%; border:2px solid rgba(41,125,227,.4); animation:ring 2.2s infinite; }
.v-side{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--fill); color:var(--body-strong); font-size:0; }
.v-side.on{ background:var(--red-bg); color:var(--red); }
.v-hint{ font-size:12px; color:var(--muted); text-align:center; margin-bottom:6px; }

/* ═══════════════════════════════ CHAT ═══════════════════════════════ */
.chat-body{ flex:1; overflow-y:auto; padding:16px 18px 110px; }
.msg{ margin-bottom:16px; animation:fadeUp .4s both; }
.msg.user{ display:flex; justify-content:flex-end; }
.msg.user .b{ max-width:78%; background:var(--brand-grad); color:#fff; padding:11px 15px; border-radius:18px 18px 5px 18px; font-size:14.5px; line-height:1.5; box-shadow:0 4px 12px rgba(41,125,227,.28); }
.msg.ai .role{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.msg.ai .role .lg{ width:22px; height:22px; border-radius:6px; background:var(--brand-grad); display:flex; align-items:center; justify-content:center; }
.msg.ai .role span{ font-size:12.5px; font-weight:600; color:var(--secondary); }
.msg.ai .txt{ font-size:14.5px; line-height:1.62; color:var(--body); }
.msg.ai .txt b{ color:var(--body-strong); font-weight:600; }
.msg.ai .txt sup{ color:var(--brand); font-weight:600; font-size:10px; padding:0 1px; }
.cursor{ display:inline-block; width:7px; height:15px; background:var(--brand); border-radius:1px; vertical-align:-2px; animation:blink 1s steps(2) infinite; margin-left:2px; }
.stat-card{ margin-top:12px; border-radius:14px; background:var(--card); border:1px solid var(--border); padding:13px 15px; }
.stat-card .scg{ display:flex; align-items:flex-end; gap:6px; height:56px; margin-top:10px; }
.stat-card .scg i{ flex:1; border-radius:4px 4px 0 0; background:var(--brand-grad); animation:growBar .6s both; }
.followups{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.fu{ display:flex; align-items:center; gap:9px; text-align:left; padding:11px 13px; border-radius:12px; background:var(--card); border:1px solid var(--border); font-size:13.5px; font-weight:500; color:var(--body-strong); transition:all .16s; }
.fu:active{ background:var(--bg-hover); }
.fu svg{ color:var(--brand); flex:none; }
.bridge{ display:inline-flex; align-items:center; gap:7px; margin-top:14px; padding:9px 14px; border-radius:99px; font-size:13px; font-weight:600; color:var(--brand); background:var(--blue-tint); border:1px solid var(--blue-tint-bd); }

/* ═══════════════════════════════ KEYFRAMES ═══════════════════════════════ */
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
@keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
@keyframes chipIn{ from{ opacity:0; transform:translateY(8px) scale(.96);} to{ opacity:1; transform:none;} }
@keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
@keyframes ring{ 0%{ transform:scale(.85); opacity:.7;} 100%{ transform:scale(1.25); opacity:0;} }
@keyframes wave{ 0%,100%{ height:12px;} 50%{ height:34px;} }
@keyframes pulseDot{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(.8);} }
@keyframes blink{ 0%{ opacity:1;} 50%{ opacity:0;} }
@keyframes growBar{ from{ height:0;} }
@keyframes ripple{ to{ transform:scale(2.4); opacity:0; } }
</style>

/* ══════════════════════ RENDER: HOME ══════════════════════ */
function sparkPath(vals,w,h){
  const max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
  return vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-((v-min)/rng)*(h-4)-2}`).join(' ');
}
function renderTabs(){
  document.getElementById('tabsInner').innerHTML = TABS.map(t=>
    `<button class="tab ${state.activeTab===t.id?'active':''}" data-tab="${t.id}" onclick="selectTab('${t.id}')">${ICONS[t.icon]}${t.label}</button>`
  ).join('');
}
function starterRowsHTML(){
  return `<div class="starters">
    <div class="st-h">Start a conversation</div>
    ${STARTERS.map((s,i)=>{
      const c=[['var(--brand)','var(--blue-tint)'],['var(--purple-text)','var(--purple-bg)'],['var(--green-text)','var(--green-bg)']][i%3];
      return `
      <button class="starter" style="animation-delay:${.1+i*.06}s" onclick="setView('chat');initChat();sendChat('${s.replace(/'/g,"\\'")}')">
        <span class="snum" style="color:${c[0]};background:${c[1]}">0${i+1}</span>
        <span class="st">${s}</span>
        <span class="sc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
      </button>`;
    }).join('')}
  </div>`;
}

  const body = document.getElementById('homeBody');

  if(state.homeVariant==='b'){
    /* Version B — editorial / minimal: big tagline + slim brief row */
    body.innerHTML = `
      <div class="greet greet--b">
        <div class="date">${date}</div>
        <h1>${g}, Ahmed.</h1>
        <div class="hero-tag">Evidence for every decision.</div>
      </div>

      <button class="brief-row" onclick="openBrief()">
        <span class="br-ic"><span class="br-dot"></span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span>
        <span class="br-main"><span class="br-t">Executive Brief ready</span><span class="br-s">Abu Dhabi Q2 · GDP +9.3% · 6 sources</span></span>
        <span class="br-play"><svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>
      </button>

  } else {
    /* Version A — brief hero card */
    body.innerHTML = `
      <div class="greet">
        <div class="date">${date}</div>
        <h1>${g}, Ahmed</h1>
        <div class="sub" id="homeLine">${HOME_LINES[0]}</div>

      <div class="brief-card" onclick="openBrief()">
        <div class="glow"></div>
        <div class="bc-top">
          <span class="live"><span class="dot"></span>Ready</span>
          <span class="bc-meta">Updated 4h ago · 6 sources</span>
        </div>
        <h2>Your Executive Brief is ready</h2>
        <p>Abu Dhabi Q2 2026 — GDP up +9.3%, FDI at a six-year high. Listen or explore.</p>
        <div class="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
      </div>

function setHomeVariant(v){
  state.homeVariant=v;
  document.querySelectorAll('#homeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.hv===v));
  renderHomeHero();
}
let hlTimer, hlIdx=0;
function rotateHomeLine(){
  clearInterval(hlTimer);
  hlTimer=setInterval(()=>{
    const el=document.getElementById('homeLine'); if(!el){clearInterval(hlTimer);return;}
    hlIdx=(hlIdx+1)%HOME_LINES.length; el.style.opacity=0;
    setTimeout(()=>{ el.textContent=HOME_LINES[hlIdx]; el.style.transition='opacity .4s'; el.style.opacity=1; },300);
  },4200);
}

/* ══════════════════════ RENDER: TAB PANELS ══════════════════════ */
function tabPanel(id){
  if(id==='products') return `
    <div class="panel-h"><h2>Products</h2><span class="pill">12 available</span></div>
    <div class="grid2">
      ${[['Observatories','Live sector dashboards','#EAF2FF','var(--brand)','grid'],
         ['Studio','Build reports & widgets','#F3E8FE','var(--purple)','doc'],
         ['Forecasting','Scenario modelling','#D8F3D6','var(--green)','spark'],
         ['Deep Research','Structured studies','#FEF1C9','var(--amber)','doc']].map((p,i)=>`
        <div class="p-tile" style="animation-delay:${i*.05}s">
          <div class="pt-ic" style="background:${p[2]};color:${p[3]}">${ICONS[p[4]]}</div>
          <h3>${p[0]}</h3><p>${p[1]}</p>
        </div>`).join('')}
    </div>`;
  if(id==='geo') return `
    <div class="panel-h"><h2>Geo View</h2><span class="pill">Abu Dhabi</span></div>
    <div class="geo-map">
      <div class="blob" style="width:150px;height:130px;top:30px;left:40px"></div>
      <div class="pin" style="top:70px;left:120px"></div>
      <div class="pin" style="top:110px;left:80px;opacity:.6"></div>
      <div class="pin" style="top:56px;left:180px;opacity:.6"></div>
    </div>
    <div class="geo-chips">
      <span class="geo-chip sel">Abu Dhabi City</span><span class="geo-chip">Al Ain</span>
      <span class="geo-chip">Al Dhafra</span><span class="geo-chip">All regions</span>
    </div>
    <div class="ins-card" style="margin-top:13px"><div class="ic-top"><span class="tagp" style="color:var(--green-text);background:var(--green-bg)">Leading</span></div><h3>Abu Dhabi City drives 68% of emirate GDP</h3><p>Financial services and manufacturing concentration keep the capital region ahead of the national growth average.</p></div>`;
  if(id==='insights') return `
    <div class="panel-h"><h2>Insights</h2><span class="pill">3 new</span></div>
    ${[['Positive','var(--green-text)','var(--green-bg)','Non-oil sectors cross 56% of output','A structural milestone — diversification is now self-reinforcing across manufacturing, finance and logistics.'],
       ['Watch','var(--amber)','var(--amber-bg)','Red Sea freight adds CPI pressure','Freight costs up 22% YTD are feeding into consumer prices; strategic reserves are cushioning the impact for now.'],
       ['Positive','var(--green-text)','var(--green-bg)','FDI hits six-year quarterly high','AED 47.8B inflow, concentrated in advanced manufacturing and logistics infrastructure.']].map((c,i)=>`
      <div class="ins-card" style="animation-delay:${i*.05}s"><div class="ic-top"><span class="tagp" style="color:${c[1]};background:${c[2]}">${c[0]}</span></div><h3>${c[3]}</h3><p>${c[4]}</p></div>`).join('')}`;
  if(id==='reports') return `
    <div class="panel-h"><h2>Reports</h2><span class="pill">Generated files</span></div>
    ${[['Abu Dhabi Quarterly GDP — Executive Brief','v2 · Jun 18, 2026 · 6 sources'],
       ['Unemployment in Abu Dhabi — Executive Study','Deep research · Jun 12, 2026'],
       ['Economic Anomalies — Executive Brief','Notebook · Jun 09, 2026'],
       ['Housing Supply Outlook 2026','Draft · Jun 03, 2026']].map((r,i)=>`
      <div class="report-row" style="animation-delay:${i*.05}s" ${i===0?'onclick="openBrief()"':''}>
        <div class="rr-ic">${ICONS.doc}</div>
        <div><h3>${r[0]}</h3><div class="rr-m">${r[1]}</div></div>
        <div class="rr-c">${ICONS.chev}</div>
      </div>`).join('')}`;
  if(id==='agents') return `
    <div class="panel-h"><h2>Agents</h2><span class="pill">My agents</span></div>
    <div class="grid2">
      ${[['Policy Analyst','Drafts policy impact notes','#EAF2FF','var(--brand)'],
         ['Data Explainer','Explains any indicator','#F3E8FE','var(--purple)'],
         ['Forecaster','Runs what-if scenarios','#D8F3D6','var(--green)'],
         ['Peer Benchmark','Compares GCC economies','#FEF1C9','var(--amber)']].map((a,i)=>`
        <div class="p-tile" style="animation-delay:${i*.05}s"><div class="pt-ic" style="background:${a[2]};color:${a[3]}">${ICONS.bot}</div><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}
    </div>`;
  return '';
}

/* ══════════════════════ RENDER: BRIEF HUB ══════════════════════ */
function renderBrief(){
  document.getElementById('briefBody').innerHTML = `
    <div class="kpi-row">
      ${BRIEF.kpis.map((k,i)=>`
        <div class="kpi" style="animation-delay:${i*.06}s">
          <div class="kl">${k.label}</div>
          <div class="kv">${k.value}</div>
          <div class="kc ${k.dir}">${k.dir==='up'?'▲':'▼'} ${k.chg}</div>
          <svg class="spark" viewBox="0 0 60 22" preserveAspectRatio="none"><polyline points="${sparkPath(k.spark,60,22)}" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`).join('')}
    </div>
    <div class="sec-h">Key takeaways</div>
    ${BRIEF.takeaways.map((t,i)=>`<div class="take" style="animation-delay:${i*.06}s"><span class="tk-n">${i+1}</span><p>${t}</p></div>`).join('')}
    <div class="cta-row">
      <button class="cta primary" onclick="setView('voice');startVoice()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
        Listen
      </button>
      <button class="cta ghost" onclick="setView('chat');initChat()">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2Z"/></svg>
        Explore in chat
      </button>
    </div>`;
}

/* ══════════════════════ NAV ══════════════════════ */
function setView(v){
  state.view=v; screen.setAttribute('data-view',v);
  ['home','explore','brief','voice','chat'].forEach(x=>{
    document.getElementById('layer-'+x).classList.toggle('show', x===v);
  });
  if(v!=='voice') stopSpeech();
}
function submitHome(){
  const t=document.getElementById('homeInput'); const v=(t.value||'').trim(); if(!v) return;
  t.value=''; setView('chat'); initChat(); sendChat(v);
}
function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  const b=document.getElementById('themeBtn');
  b.innerHTML = state.theme==='dark'
    ? '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>'
    : '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
}
function openExplore(){
  if(!state.activeTab) state.activeTab = TABS[0].id;   // land on first tab's content
  renderTabs();
  document.getElementById('exploreBody').innerHTML = tabPanel(state.activeTab);
  setView('explore');
}
function selectTab(id){
  state.activeTab = id;
  document.querySelectorAll('#tabsInner .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===id));
  document.getElementById('exploreBody').innerHTML = tabPanel(id);
  document.getElementById('exploreBody').scrollTop = 0;
}
function openBrief(){ renderBrief(); setView('brief'); }

/* ══════════════════════ VOICE (real narration + simulated barge-in) ══════════════════════ */
const hasTTS = 'speechSynthesis' in window;
let narrIdx=0, interrupted=false, narrTimer=null, curUtter=null, ttsVoice=null;
const voiceEl = document.getElementById('voice');
const PHASE_LABEL = { idle:'Tap to listen', speaking:'Bayaan speaking', listening:'Listening…', thinking:'Consulting data', answering:'Bayaan speaking', done:'Brief complete' };

function pickVoice(){
  if(!hasTTS) return; const vs=speechSynthesis.getVoices();
  ttsVoice = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/en/i.test(v.lang)) || vs[0] || null;
}
if(hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

function setPhase(p){ voiceEl.setAttribute('data-vphase',p); document.getElementById('vPhase').textContent=PHASE_LABEL[p]||p; }

function renderCaption(){
  document.getElementById('vCaption').innerHTML =
    BRIEF.narration.map((s,i)=>`<div class="cap-line ${i===narrIdx?'active':''}" id="cap${i}">${s}</div>`).join('') +
    `<div class="v-qa" id="vQA"></div>`;
  const a=document.getElementById('cap'+narrIdx); if(a) a.scrollIntoView({block:'center'});
}

function startVoice(){
  interrupted=false; narrIdx=0; setPhase('speaking'); renderCaption();
  document.getElementById('vHint').textContent='Bayaan is reading your brief — tap the mic to jump in with a question';
  speakFrom(0);
}
function speakFrom(i){
  narrIdx=i;
  if(i>=BRIEF.narration.length){ setPhase('done'); document.getElementById('vHint').textContent='That\'s your brief. Ask a question or continue in chat.'; return; }
  document.querySelectorAll('.cap-line').forEach((el,idx)=>el.classList.toggle('active', idx===i));
  const a=document.getElementById('cap'+i); if(a) a.scrollIntoView({block:'center',behavior:'smooth'});
  speak(BRIEF.narration[i], ()=>{ if(!interrupted) speakFrom(i+1); }, 2200 + BRIEF.narration[i].length*32);
}
function speak(text, done, fallbackMs){
  clearTimeout(narrTimer);
  if(hasTTS && !state.muted){
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(text); if(ttsVoice)u.voice=ttsVoice; u.rate=1; u.pitch=1;
    u.onend=()=>{ if(done)done(); }; curUtter=u; speechSynthesis.speak(u);
    // safety: some engines never fire onend
    narrTimer=setTimeout(()=>{ if(curUtter===u && !speechSynthesis.speaking){ if(done)done(); } }, fallbackMs+4000);
  } else {
    narrTimer=setTimeout(()=>{ if(done)done(); }, fallbackMs);
  }
}
function stopSpeech(){ clearTimeout(narrTimer); if(hasTTS){ try{speechSynthesis.cancel();}catch(e){} } }
function stopVoice(){ interrupted=true; stopSpeech(); setView('brief'); }

function voiceInterrupt(){
  interrupted=true; stopSpeech(); setPhase('listening');
  document.getElementById('vHint').textContent='Go ahead — I\'m listening';
  const qa=document.getElementById('vQA'); qa.innerHTML='';
  setTimeout(()=>{
    qa.innerHTML = `<div class="vq">${INTERRUPT.q}</div>`;
    qa.scrollIntoView({block:'center',behavior:'smooth'});
    setPhase('thinking');
    setTimeout(()=>{
      setPhase('answering');
      qa.innerHTML += `<div class="va" id="vAns"></div>`;
      document.getElementById('vHint').textContent='Bayaan is answering, then will resume your brief';
      speak(INTERRUPT.a, ()=>{
        // resume narration from where it paused
        interrupted=false; setPhase('speaking');
        document.getElementById('vHint').textContent='Resuming your brief…';
        setTimeout(()=>{ const qa2=document.getElementById('vQA'); if(qa2)qa2.innerHTML=''; speakFrom(narrIdx); }, 700);
      }, 4200);
      // stream answer text
      streamInto('vAns', INTERRUPT.a);
    }, 1500);
  }, 1100);
}
function toggleMute(){
  state.muted=!state.muted;
  document.getElementById('muteBtn').classList.toggle('on', state.muted);
  if(state.muted && hasTTS){ try{speechSynthesis.cancel();}catch(e){} }
}
function voiceToChat(){ interrupted=true; stopSpeech(); initChat(); setView('chat'); }

/* ══════════════════════ CHAT ══════════════════════ */
let chatSeeded=false;
function initChat(){
  if(chatSeeded) return; chatSeeded=true;
  const body=document.getElementById('chatBody');
  body.innerHTML='';
  addAI(CHAT_SEED.ai, null, CHAT_SEED.followups);
}
function addUser(text){
  const body=document.getElementById('chatBody');
  const d=document.createElement('div'); d.className='msg user'; d.innerHTML=`<div class="b">${text}</div>`;
  body.appendChild(d); body.scrollTop=body.scrollHeight;
}
function addAI(html, bars, followups){
  const body=document.getElementById('chatBody');
  const d=document.createElement('div'); d.className='msg ai';
  d.innerHTML=`<div class="role"><span class="lg"><svg width="12" height="12" viewBox="0 0 16 16"><rect x="1" y="7" width="2.4" height="8" rx="1" fill="#fff"/><rect x="4.5" y="4" width="2.4" height="11" rx="1" fill="#fff"/><rect x="8" y="6" width="2.4" height="9" rx="1" fill="#fff" fill-opacity=".8"/><rect x="11.5" y="1.5" width="2.4" height="13.5" rx="1" fill="#fff"/></svg></span><span>Bayaan AI</span></div>
    <div class="txt" id="aitxt"></div>
    ${bars?`<div class="stat-card"><div class="kl" style="font-size:11px;color:var(--muted);font-weight:600">Contribution to GDP growth (pp)</div><div class="scg">${bars.map((b,i)=>`<i style="height:${b}%;animation-delay:${i*.06}s"></i>`).join('')}</div></div>`:''}
    ${followups?`<div class="followups">${followups.map(f=>`<button class="fu" onclick="sendChat('${f.replace(/'/g,"\\'")}')">${ICONS.spark?'':''}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>${f}</button>`).join('')}</div>`:''}
    ${!followups&&!bars?'':''}`;
  body.appendChild(d);
  const t=d.querySelector('#aitxt'); t.removeAttribute('id');
  streamHTML(t, html, ()=>{ body.scrollTop=body.scrollHeight; });
  body.scrollTop=body.scrollHeight;
  return d;
}
function sendChat(text){
  if(!text||!text.trim()) return;
  const inp=document.getElementById('chatInput'); if(inp) inp.value='';
  addUser(text);
  const bars = /fdi|sector|breakdown|driv|growth/i.test(text) ? CHAT_ANSWERS.bars : null;
  const fu = ['What are the key risks this quarter?','Compare to Dubai','Draft this as a one-pager'];
  setTimeout(()=>addAI(CHAT_ANSWERS.default, bars, fu), 380);
}
/* word streaming */
function streamHTML(el, html, done){
  const words=html.split(' '); let i=0; el.innerHTML='';
  const iv=setInterval(()=>{
    i++; el.innerHTML=words.slice(0,i).join(' ') + (i<words.length?'<span class="cursor"></span>':'');
    const body=document.getElementById('chatBody'); if(body)body.scrollTop=body.scrollHeight;
    if(i>=words.length){ clearInterval(iv); el.innerHTML=html; if(done)done(); }
  }, 34);
}
function streamInto(id, text){
  const el=document.getElementById(id); if(!el) return;
  const words=text.split(' '); let i=0;
  const iv=setInterval(()=>{ i++; el.textContent=words.slice(0,i).join(' '); if(i>=words.length)clearInterval(iv); },40);
}

/* ══════════════════════ INIT ══════════════════════ */
renderTabs();
renderHomeHero();
</script>
