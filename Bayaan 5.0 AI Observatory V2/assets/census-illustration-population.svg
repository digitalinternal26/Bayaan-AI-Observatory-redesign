<svg viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background circle -->
  <circle cx="250" cy="180" r="160" fill="#DBEAFE" opacity="0.6"/>

  <!-- Left figure (Man with traditional ghutra) -->
  <g>
    <!-- Ghutra/head wrap -->
    <circle cx="130" cy="90" r="32" fill="none" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>
    <path d="M 100 108 Q 98 130 130 138 Q 162 130 162 108" fill="none" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Agal (band on ghutra) -->
    <ellipse cx="130" cy="92" rx="34" ry="6" fill="none" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Head/face -->
    <circle cx="130" cy="105" r="22" fill="none" stroke="#0066FF" stroke-width="6"/>

    <!-- Beard -->
    <path d="M 115 120 Q 130 128 145 120" fill="none" stroke="#0066FF" stroke-width="5" opacity="0.6" stroke-linecap="round"/>

    <!-- Body/thobe -->
    <rect x="105" y="140" width="50" height="100" rx="12" fill="none" stroke="#0066FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sleeve/arm line -->
    <line x1="130" y1="140" x2="130" y2="240" stroke="#0066FF" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

    <!-- Left arm -->
    <line x1="105" y1="160" x2="55" y2="210" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Right arm -->
    <line x1="155" y1="160" x2="205" y2="210" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Left leg -->
    <line x1="115" y1="240" x2="105" y2="340" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Right leg -->
    <line x1="145" y1="240" x2="155" y2="340" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Center figure (Woman with hijab) -->
  <g>
    <!-- Head -->
    <circle cx="250" cy="100" r="26" fill="none" stroke="#0066FF" stroke-width="6"/>

    <!-- Hijab/head covering -->
    <ellipse cx="250" cy="100" rx="38" ry="32" fill="none" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Hijab drape (left) -->
    <path d="M 220 115 Q 210 145 215 175" fill="none" stroke="#7DD3FC" stroke-width="5" opacity="0.5" stroke-linecap="round"/>

    <!-- Hijab drape (right) -->
    <path d="M 280 115 Q 290 145 285 175" fill="none" stroke="#7DD3FC" stroke-width="5" opacity="0.5" stroke-linecap="round"/>

    <!-- Body/abaya -->
    <rect x="225" y="150" width="50" height="100" rx="12" fill="none" stroke="#0066FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center body line -->
    <line x1="250" y1="150" x2="250" y2="250" stroke="#0066FF" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

    <!-- Left arm -->
    <line x1="225" y1="170" x2="170" y2="220" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Right arm -->
    <line x1="275" y1="170" x2="330" y2="220" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Left leg -->
    <line x1="235" y1="250" x2="225" y2="350" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>

    <!-- Right leg -->
    <line x1="265" y1="250" x2="275" y2="350" stroke="#0066FF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Right figure (Child) -->
  <g>
    <!-- Head -->
    <circle cx="360" cy="125" r="20" fill="none" stroke="#0066FF" stroke-width="6"/>

    <!-- Body -->
    <rect x="340" y="160" width="40" height="75" rx="10" fill="none" stroke="#0066FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left arm -->
    <line x1="340" y1="180" x2="295" y2="220" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Right arm -->
    <line x1="380" y1="180" x2="425" y2="220" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Left leg -->
    <line x1="350" y1="235" x2="340" y2="325" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>

    <!-- Right leg -->
    <line x1="370" y1="235" x2="380" y2="325" stroke="#0066FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Holding hands connections -->
  <g opacity="0.4">
    <line x1="205" y1="210" x2="170" y2="220" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
    <line x1="330" y1="220" x2="295" y2="220" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Light decorative elements on left side -->
  <g opacity="0.25" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round">
    <path d="M 50 120 Q 40 150 50 180"/>
    <path d="M 45 200 Q 35 230 45 260"/>
  </g>
</svg>