<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crisis Intelligence — Geospatial · Bayaan</title>
    <link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="addp-v2/vendor/maplibre-gl.css" />
    <!-- Shared design system (same order as CrisisIntelligence.html) -->
    <link rel="stylesheet" href="css/pages/ai.css" />
    <link rel="stylesheet" href="css/pages/cpi-obs.css" />
    <link rel="stylesheet" href="css/pages/obs-sidebar.css" />
    <link rel="stylesheet" href="css/pages/exec-home.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/pages/home-widgets.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <!-- Geospatial map + floating panel component library, taken as-is
         from the Labour Market Observatory's own Geospatial view
         (lmo/lmo-geospatial.html): both pages share this map/panel
         scaffold via the body.lmo/body.lmo--geospatial CSS hooks
         obs-sidebar.css and lmo-geospatial.css already scope to. -->
    <link rel="stylesheet" href="css/pages/lmo-geospatial.css" />
    <link rel="stylesheet" href="css/pages/lmo-geo-panel.css" />
    <script>
      (function () {
        var t = localStorage.getItem("bayaan-theme") || "light";
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
    <script src="js/theme.js"></script>
  <script src="js/header.js?v=20260913-breadcrumbs3"></script>
    <style>
      /* Small page-local pieces the shared component library doesn't
         already cover — everything else comes from lmo-geo-panel.css /
         lmo-geospatial.css unchanged. */
      .cg-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: middle;
        flex-shrink: 0;
      }
      .cg-impact-text {
        white-space: normal;
        line-height: 1.5;
      }
      .cg-impact-text b {
        color: var(--gp-ink-900, #131922);
        font-weight: 700;
      }
      .cg-region-label {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface, #fff);
        border: 1px solid var(--border, #e2e8f0);
        color: var(--text-secondary, #475467);
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
        pointer-events: auto;
      }
      .cg-region-label.is-selected {
        background: var(--accent, #0066ff);
        border-color: var(--accent, #0066ff);
        color: #fff;
      }
    </style>
  </head>
  <body class="lmo lmo--geospatial">
    <div data-bayaan-header></div>

    <div class="sidebar-rail">
      <aside class="sidebar" aria-label="Crisis Intelligence views">
        <button type="button" class="sidebar-item sidebar-item--ai" onclick="openObsSidebarAI()">
          <div class="sidebar-icon"><i class="ti ti-sparkles"></i></div>
          <span class="sidebar-label">CIO AI</span>
        </button>
        <span class="sidebar-divider" aria-hidden="true"></span>
        <button type="button" class="sidebar-item" onclick="location.href='CrisisIntelligence.html'+location.search">
          <div class="sidebar-icon"><i class="ti ti-layout-dashboard"></i></div>
          <span class="sidebar-label">Overview</span>
        </button>
        <button type="button" class="sidebar-item" onclick="location.href='CrisisIntelligence.html'+location.search">
          <div class="sidebar-icon"><i class="ti ti-search"></i></div>
          <span class="sidebar-label">Diagnose</span>
        </button>
        <button type="button" class="sidebar-item" onclick="location.href='CrisisIntelligence.html'+location.search">
          <div class="sidebar-icon"><i class="ti ti-eye"></i></div>
          <span class="sidebar-label">Observe</span>
        </button>
        <button type="button" class="sidebar-item active">
          <div class="sidebar-icon"><i class="ti ti-map-2"></i></div>
          <span class="sidebar-label">Geospatial</span>
        </button>
        <button type="button" class="sidebar-item" onclick="location.href='CrisisIntelligence.html'+location.search">
          <div class="sidebar-icon"><i class="ti ti-bulb"></i></div>
          <span class="sidebar-label">Interpret</span>
        </button>
        <button type="button" class="sidebar-item" onclick="location.href='CrisisIntelligence.html'+location.search">
          <div class="sidebar-icon"><i class="ti ti-chart-bar"></i></div>
          <span class="sidebar-label">Benchmark</span>
        </button>
      </aside>
    </div>

    <div class="geo-main" id="geoMain">
      <button type="button" class="geo-exit-fullscreen" id="geoExitFullscreen" title="Exit full view (Esc)">
        <i class="ti ti-arrow-left"></i> Exit full view
      </button>

      <div class="geo-map-stage" id="mapStage">
        <div id="geoMapView" aria-label="Abu Dhabi crisis intelligence map"></div>

        <div class="gp-map-legend" aria-label="Map legend">
          <span class="gp-map-legend-item">
            <span class="gp-map-legend-swatch" style="background:var(--accent, #0066ff)" aria-hidden="true"></span>
            <span class="gp-map-legend-label">Selected region</span>
          </span>
          <span class="gp-map-legend-item">
            <span class="gp-map-legend-swatch" style="background:var(--accent-mid, #99c2ff)" aria-hidden="true"></span>
            <span class="gp-map-legend-label">Abu Dhabi regions</span>
          </span>
        </div>

        <div class="geo-map-tools">
          <button type="button" class="geo-tool-btn" id="geoZoomIn" title="Zoom in"><i class="ti ti-plus"></i></button>
          <button type="button" class="geo-tool-btn" id="geoZoomOut" title="Zoom out"><i class="ti ti-minus"></i></button>
          <button type="button" class="geo-tool-btn" id="geoResetView" title="Reset view"><i class="ti ti-rotate-2"></i></button>
          <button type="button" class="geo-tool-btn" id="geoFullscreen" title="Expand to fullscreen"><i class="ti ti-arrows-maximize"></i></button>
        </div>
      </div>

      <aside class="geo-sidebar" id="sidebar">
        <button
          type="button"
          class="geo-sidebar-toggle"
          id="sidebarToggle"
          aria-expanded="true"
          aria-controls="sidebarContent"
          title="Collapse panel"
        >
          <i class="ti ti-chevron-left"></i>
        </button>
        <div id="sidebarContent"></div>
      </aside>
    </div>

    <script src="addp-v2/vendor/maplibre-gl.js"></script>
    <!-- Accurate Abu Dhabi region boundaries (ADDP's own dataset — the same
         one lmo/lmo-geospatial.js prefers); the coarse bounding-box shapes in
         abu-dhabi-regions-data.js are kept only as a fallback if this is
         ever unavailable. -->
    <script src="addp-v2/data/region-boundaries.geojson.js"></script>
    <script src="lmo/data/abu-dhabi-regions-data.js"></script>
    <script>
      /* ============================================================
         Standalone stubs — same isolation contract as CrisisIntelligence.html
         (this page does not link back into the main application beyond
         real navigation; cross-screen actions header.js emits inline
         onclicks for are no-ops here).
         ============================================================ */
      function goTo() {}
      function openBayaanSpace(e) { if (e) e.preventDefault(); }
      function openProducts(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openObservatories(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openWsDrp() {}
      function onHeaderSearchClick() {}
      function openObsSidebarAI() {}
      function toast() {}
    </script>
    <script src="js/crisis-geospatial.js"></script>
  </body>
</html>
