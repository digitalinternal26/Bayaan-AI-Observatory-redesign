    <style>
      /* ====================================================================
         CRISIS INTELLIGENCE OBSERVATORY (standalone)

         Built on #screen-crisis-obs, which already carries a full component
         set for this screen id in style.css (~9717-10735) and its dark-theme
         counterpart in css/theme.css (203-227, 2878-2964) — the severity
         palette, gauges, severity columns, indicator table and pagination all
         come from there for free.

         The shell below is the standard observatory prelude shared verbatim by
         CPI.html / observe.html / benchmark.html / forecast.html / trade.html,
         re-scoped from #screen-cpi-obs. Components are re-scoped copies of the
         real cpi-obs.css specs, kept under their original class names so a
         future extraction to a shared stylesheet is a merge, not a rename.
         No shared .css file is modified by this page.
         ==================================================================== */

      /* ── Token alignment ──
         style.css:9718 gives #screen-crisis-obs a slightly different palette
         from cpi-obs.css:2's #screen-cpi-obs (--text/--text2/--muted/--bg all
         differ, --page-gutter is undefined, and the semantic up/down pair is
         named --red/--green here). Re-point them at the CPI values so body
         copy, captions, the page plate and the breadcrumb's column alignment
         match the sibling pages. Dark mode is untouched: theme.css:203 is
         [data-theme="dark"] #screen-crisis-obs and outranks this block. */
      #screen-crisis-obs {
        --text: #0f172a;
        --text2: #475569;
        --muted: #94a3b8;
        --bg: #f8fafc;
        --page-gutter: clamp(16px, 2vw, 32px);
        /* cpi-obs.css components reference --up/--down; crisis names them --red/--green. */
        --up: var(--red);
        --down: var(--green);
        /* --navy (#0d1b3e) is declared for this screen id in style.css:9721 and
           painted by eight live rules, but CPI declares the same token and never
           uses it — every CPI ink role resolves to --text. Re-pointing it here
           fixes all eight at once instead of overriding them one by one. */
        --navy: var(--text);
      }

      /* css/pages/indicator-detail.css (shared with lmo/lmo-indicator-detail.html)
         reads a different token set (--t1/--t2/--t3/--sf/--sf2/--sf3/--bd/--ac/
         --up/--dn/--or/--rd/--rdlg/--sh) than this screen defines. Scoped to
         #ci-detail rather than the whole screen: #screen-crisis-obs already
         re-points --up to --red for its own severity semantics (a rising risk
         score is bad), but the indicator-detail KPI icons use --up/--dn the
         LMO way (green = positive change, red = negative) — redeclaring
         screen-wide would repaint every severity chip on the page. */
      #screen-crisis-obs #ci-detail {
        --t1: var(--text);
        --t2: var(--text2);
        --t3: var(--muted);
        --title: var(--text);
        --sf: var(--white);
        --sf2: #f8f9fb;
        --sf3: #eef1f5;
        --bd: var(--border);
        --ac: var(--blue);
        --acbg: var(--blue-light);
        --up: var(--green);
        --upbg: var(--green-bg);
        --dn: var(--red);
        --dnbg: var(--red-bg);
        --or: var(--amber);
        --orbg: var(--amber-bg);
        --rd: 10px;
        --rdlg: 12px;
        --sh: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      /* --t1/--t2/--t3/--title/--sf/--bd/--ac/--acbg/--up/--upbg/--dn/--dnbg/
         --or/--orbg above are all var()-on-var(), so they already pick up
         theme.css:203's dark redeclarations of --text/--white/--blue/--green/
         --red/--amber/--border for free. Only the two hardcoded hex fills
         need an explicit dark pass, matched to lmo-common.css's own dark
         --sf2/--sf3 (#151E30 / #1A2438) so the ported cards read the same. */
      html[data-theme="dark"] #screen-crisis-obs #ci-detail {
        --sf2: #151e30;
        --sf3: var(--border);
        --sh: 0 1px 3px rgba(0, 0, 0, 0.3);
      }

      /* #ci-detail's overview card never carries a KPI row (that's now its
         own .ind-detail-fx-kpis section below) — LMO's page still uses the
         base two-column grid for its inline KPI tiles, so
         this narrows to one column only here rather than in the shared
         indicator-detail.css rule. Unconditional: it's the same 1fr the
         base rule's own @media max-width:900px already falls back to at
         narrow widths, just applied at every width for this page. */
      #screen-crisis-obs .ind-detail-overview--kpi-outside {
        grid-template-columns: 1fr;
      }
      /* #ci-detail's KPI row — .fx-kpi tiles (ov-summary's own, ~line 2461)
         reused as-is; only the wrapping grid is new, since #ov-summary's
         .fx-kpis is hardcoded to 5 fixed columns for its own Total/
         Critical/Warning/Watch/Stable row and this needs to hold 3 (movers)
         or 5 (drivers) items evenly either way. auto-fit does that without
         a variant-specific column count or extra breakpoints. */
      #screen-crisis-obs .ind-detail-fx-kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      /* Change-direction tones for those tiles — green/red/blue-watch,
         the same colour vocabulary #ov-summary's own --critical/--warning/
         --watch/--stable modifiers draw from, applied by direction instead
         of severity since these tiles are MOM/QOQ/YOY-style deltas. */
      #screen-crisis-obs .fx-kpi--up {
        --tone: var(--green);
      }
      #screen-crisis-obs .fx-kpi--down {
        --tone: var(--red);
      }
      #screen-crisis-obs .fx-kpi--flat {
        --tone: var(--blue-watch);
      }
      /* indicator-detail.css draws a small diamond marker before every
         Impacts / Suggested Actions paragraph (shared with body.lmo, which
         keeps it) — dropped here only, per request. */
      #screen-crisis-obs .ind-detail-side-card p::before {
        content: none;
      }
      /* When the Actions column is absent (no d.actions — see
         ciDetailActionItems, true for every Overview-origin driver) the
         grid drops from three tracks to two so Performance fills the row
         instead of leaving an empty gutter. Additive on the shared base
         rule, gated behind the same min-width indicator-detail.css's own
         @media max-width: 1100px collapses at, so an unqualified selector
         here doesn't outrank the mobile single-column layout. */
      @media (min-width: 1101px) {
        #screen-crisis-obs .ind-detail-grid--2col {
          grid-template-columns: 1.65fr 1fr;
        }
      }
      /* .back-btn (style.css:9880) was authored for the old single-view
         #screen-crisis-obs shell with margin-left: auto, pinning it to the
         right of its flex parent — the breadcrumb needs it flush left,
         first in the row, matching the reference. */
      #screen-crisis-obs .ind-page-breadcrumb .back-btn {
        margin-left: 0;
      }
      #screen-crisis-obs .ind-page-breadcrumb .back-btn i {
        font-size: 15px;
      }

      /* CPI declares --figma-subcard-* but never applies them: its .obs-card
         stays opaque white with a tight 1px/6px shadow. The translucent 60%
         fill + 30px-blur treatment that benchmark.html uses is deliberately NOT
         part of the CPI card, so it is not redeclared here. */

      /* Pre-existing: the light border shorthand in cpi-obs.css outranks the
         dark `border-color` in theme.css, leaving pale edges on dark cards. */
      html[data-theme="dark"] #screen-crisis-obs .obs-card {
        border-color: var(--border);
      }

      /* No rule under the page title — zero width rather than a colour
         override, so the dark-theme border-bottom-color can't bring it back. */
      #screen-crisis-obs .cpi-page-header-inner {
        border-bottom: 0;
        padding-bottom: 0;
      }
      #screen-crisis-obs .topic-title {
        line-height: 1.2;
      }
      /* #ci-detail's severity eyebrow — .risk-chip (style.css:10427) is
         already self-contained (padding/colour/uppercase all come from the
         class itself), so this only adds the spacing an eyebrow needs
         above the H1 it now sits over instead of inline beside it. */
      #screen-crisis-obs .ind-detail-tag-row {
        margin-bottom: 8px;
      }

      /* Breadcrumb sits outside .page-wrap, so it clears neither the 120px rail
         nor the page gutter. Realign it with the content column. */
      #screen-crisis-obs .crisis-scroll > .container {
        --obs-rail-w: 120px;
        padding-inline: calc(var(--obs-rail-w) + var(--page-gutter))
          var(--page-gutter);
      }

      /* .crisis-scroll is the scroll container on this shell; style.css:9896
         sets #screen-crisis-obs .main { overflow-y: auto } for the old
         single-view screen, which would nest a second scrollbar here. */
      #screen-crisis-obs .main {
        overflow: visible;
        /* style.css:10534 pads .main 24px inline; drop it so the header and
           every view pane share the breadcrumb's column (120px rail + gutter,
           see .crisis-scroll > .container below) instead of sitting 24px in. */
        padding-inline: 0;
      }

      /* style.css:10534 styles a bare `footer` element under this screen id
         (specificity 1,0,1) — it outranks the shared footer component's own
         class rule (.bayaan-products-footer, 0,1,0) regardless of stylesheet
         order, which would paint the shared footer navy-on-navy in light mode. */
      #screen-crisis-obs footer.bayaan-products-footer {
        background: var(--bpf-bg);
        color: var(--bpf-text);
        padding: 0;
        margin: 0;
        border: none;
      }

      /* Sidebar on brand primary (--accent / #0066FF), mirroring #screen-topic
         in css/pages/obs-sidebar.css. obs-sidebar.css:239-270 grants this to
         #screen-cpi-obs but deliberately excludes #screen-crisis-obs, which
         falls back to the legacy navy fills — hence this block. */
      html:not([data-theme="dark"]) #screen-crisis-obs .sidebar-icon {
        background: #ebf3ff;
        color: var(--accent);
      }
      html:not([data-theme="dark"])
        #screen-crisis-obs
        .sidebar-item:hover:not(.active):not(.sidebar-item--ai)
        .sidebar-icon {
        background: #dbe9ff;
      }
      html:not([data-theme="dark"])
        #screen-crisis-obs
        .sidebar-item.active:not(.sidebar-item--ai)
        .sidebar-icon {
        background: var(--accent);
        color: #fff;
      }
      /* AI entry point on the app's AI gradient — same fill as .ai-mode-btn. */
      html #screen-crisis-obs .sidebar .sidebar-item--ai .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        color: #fff;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition: transform 0.15s, box-shadow 0.2s;
      }
      html #screen-crisis-obs .sidebar .sidebar-item--ai:hover .sidebar-icon {
        background: linear-gradient(135deg, #9292ff 0%, #3295ff 100%);
        transform: scale(1.04);
      }
      /* Compact floating sidebar — fits all items below the top nav. */
      #screen-crisis-obs .sidebar {
        top: calc(50% + 34px);
        padding: 14px 10px;
        gap: 9px;
      }
      #screen-crisis-obs .sidebar-item {
        padding: 4px 0;
        gap: 5px;
        font-size: 10.5px;
      }
      /* Sidebar items that navigate are anchors — strip the link underline so
         they render identically to the button items. */
      #screen-crisis-obs a.sidebar-item {
        text-decoration: none;
      }
      #screen-crisis-obs .sidebar-icon {
        width: 38px;
        height: 38px;
      }
      #screen-crisis-obs .sidebar-icon i {
        font-size: 17px;
      }

      /* === Standard expanding icon rail (shared across observatory views) ===
         Icons only by default; hovering the pill reveals every label at once,
         to the right of its icon. CIO AI sits on top, split from the view
         switcher by a divider that grows with the rail. */
      #screen-crisis-obs .sidebar {
        max-width: none;
        border-radius: 999px;
        align-items: stretch;
        padding: 8px 10px;
        transition: none;
      }
      #screen-crisis-obs .sidebar:hover {
        border-radius: 28px;
      }
      #screen-crisis-obs .sidebar-item {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        padding: 4px 4px;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-item {
        justify-content: flex-start;
        gap: 10px;
      }
      #screen-crisis-obs .sidebar-label {
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        opacity: 0;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text2);
        transition: max-width 0.22s ease, opacity 0.18s ease;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-label {
        max-width: 120px;
        opacity: 1;
      }
      #screen-crisis-obs .sidebar-item.active:not(.sidebar-item--ai) .sidebar-label {
        color: #272829;
      }
      html[data-theme="dark"] #screen-crisis-obs .sidebar-label {
        color: #cdd6e0;
      }
      #screen-crisis-obs .sidebar-item--ai .sidebar-label {
        color: #0066ff;
      }
      #screen-crisis-obs .sidebar-divider {
        width: 16px;
        height: 2px;
        border-radius: 999px;
        background: #e2e8f0;
        margin: 1px 0 1px 15px;
        align-self: flex-start;
        transition: width 0.22s ease, margin-left 0.22s ease;
      }
      #screen-crisis-obs .sidebar:hover .sidebar-divider {
        width: calc(100% - 12px);
        margin-left: 6px;
      }
      html[data-theme="dark"] #screen-crisis-obs .sidebar-divider {
        background: #3a4453;
      }

      /* ── Page header band (cpi-obs.css:54-61, #screen-cpi-obs-scoped) ── */
      #screen-crisis-obs .cpi-page-header {
        padding: 24px var(--page-gutter) 0;
        /* 32px between the title band (title + subtitle + header actions) and
           the view content below it — applies to every crisis-observatory view. */
        margin-bottom: 32px;
      }
      #screen-crisis-obs .cpi-page-header-inner {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      #screen-crisis-obs .cpi-hdr-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      @media (max-width: 640px) {
        #screen-crisis-obs .cpi-page-header-inner {
          flex-direction: column;
        }
      }

      /* ── View panes + section modules ──
         Each pane's content is grouped into home-page-style gradient module
         cards, exactly as CPI.html:46-62 does for #cpi-obs-content > section. */
      #screen-crisis-obs .cio-pane {
        padding: 0 var(--page-gutter) 8px;
      }
      #screen-crisis-obs .cio-pane[hidden] {
        display: none;
      }
      #screen-crisis-obs .cio-pane > section,
      #screen-crisis-obs .it-columns > section {
        background:
          radial-gradient(ellipse 90% 70% at 0% 0%, rgba(219, 234, 254, 0.55) 0%, transparent 52%),
          linear-gradient(180deg, #ffffff 0%, #fafcff 100%);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.05),
          0 10px 28px rgba(42, 61, 76, 0.07);
        padding: 24px 28px 28px;
        margin-bottom: 24px;
      }
      html[data-theme="dark"] #screen-crisis-obs .cio-pane > section,
      html[data-theme="dark"] #screen-crisis-obs .it-columns > section {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      }
      /* Impacts + the Geo Mobility promo sit side by side (CIO-4321), stretched
         to match height (grid's default align-items) so both cards' bottom
         edges line up rather than the shorter one trailing off early. */
      #screen-crisis-obs .it-columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
        margin-bottom: 24px;
      }
      #screen-crisis-obs .it-columns > section {
        margin-bottom: 0;
      }
      /* it-geo stretches taller than its own content (to match Impacts), so
         it's a flex column: the promo row takes the top of the slack and the
         globe fills the bottom-right corner it leaves behind. */
      #screen-crisis-obs #it-geo {
        display: flex;
        flex-direction: column;
        /* The globe is deliberately bled past the section's padding onto the
           card's own border (see .geo-promo-art) — clip it to the card's
           rounded corner rather than letting it poke past. */
        overflow: hidden;
      }
      #screen-crisis-obs #it-geo .geo-promo {
        flex: 1;
        align-content: center;
      }
      @media (max-width: 900px) {
        #screen-crisis-obs .it-columns {
          grid-template-columns: 1fr;
        }
      }
      /* Toolbars and notices sit on the plate, not inside a module. */
      #screen-crisis-obs .cio-pane > .bm-toolbar,
      #screen-crisis-obs .cio-pane > .bm-filter-row,
      #screen-crisis-obs .cio-pane > .cpi-notice {
        margin-bottom: 20px;
      }

      /* Section headings styled like the home page module titles: bold black
         title + prominent accent icon (replaces the section pip).
         Mirrors .screen-home .home-module-title / .home-module-title-icon. */
      #screen-crisis-obs .section-hdr {
        margin-bottom: 20px;
      }
      #screen-crisis-obs .section-hdr h2.cpi-section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 700;
        color: #000;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      #screen-crisis-obs .section-hdr h2.cpi-section-title i {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .section-hdr h2.cpi-section-title {
        color: var(--text);
      }
      #screen-crisis-obs .obs-section-action {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }
      /* Section-header tools slot — a severity filter (or similar control)
         sitting beside a section title, standing in for .obs-section-action
         when a section needs a control rather than a simple link. */
      #screen-crisis-obs .section-hdr-tools {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
        margin-left: auto;
      }
      #screen-crisis-obs .ci-drivers-count {
        font-size: 12.5px;
        color: var(--muted, #64748b);
      }
      #screen-crisis-obs .ci-drivers-empty {
        grid-column: 1 / -1;
        padding: 40px 16px;
        text-align: center;
        font-size: 13px;
        color: var(--muted, #64748b);
      }

      /* ── Cards (cpi-obs.css:395-407 + CPI.html:649-655, 1015-1019) ── */
      #screen-crisis-obs .obs-card {
        background: var(--white, #fff);
        border: 1px solid #eaecf0;
        border-radius: 16px;
        padding: 16px 18px;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        transition: box-shadow 0.22s ease, border-color 0.22s ease,
          transform 0.22s ease, background 0.22s ease;
      }
      /* CPI cards deliberately do not react on hover. */
      #screen-crisis-obs .obs-card:not(.impacts-list):hover {
        border: 1px solid #eaecf0;
        box-shadow: none;
        transform: none;
      }

      /* Two domain tags the shared component doesn't define (style.css:10196
         ships financial/economic/energy/tourism/infrastructure/trade/
         consumption — no environment or social). Same recipe, new hues. */
      #screen-crisis-obs .tag-environment {
        background: #ecfdf5;
        color: #047857;
      }
      #screen-crisis-obs .tag-social {
        background: #fdf2f8;
        color: #a21caf;
      }
      html[data-theme="dark"] #screen-crisis-obs .tag-environment,
      html[data-theme="dark"] #screen-crisis-obs .tag-social {
        background: color-mix(in srgb, currentColor 16%, transparent);
      }

      /* ── Driver / indicator cards (cpi-obs.css:571-700, re-scoped) ──
         Backs Overview's economic drivers and Observe's indicator grid, both
         4-up by default and stepping 4 → 3 → 2 → 1 with width (the 1400px step
         is here; the 1150 → 2 and 720 → 1 steps are in the shared responsive
         block lower down). Interpret's top movers use .mover-grid below. */
      #screen-crisis-obs .driver-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      @media (max-width: 1400px) {
        #screen-crisis-obs .driver-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      #screen-crisis-obs .mover-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      #screen-crisis-obs .driver-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #screen-crisis-obs .dc-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #screen-crisis-obs .dc-icon-wrap {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;

      #screen-crisis-obs .obs-spark-grid {

      /* Chart shell every buildSparkline() call returns: a Y-axis label
         column beside the plot, an X-axis date row (via .obs-axis) below it.
         One size everywhere — the driver/mover cards and the Observe indicator
         cards sit in equal-width (256px) cards, so their graphs render
         identically rather than one being a squat sparkline and the other a
         full chart. --spark-yw / --spark-gap are declared once here so the
         X-axis row can inset itself by exactly the Y-axis column's footprint
         (see .obs-axis) and stay aligned to the plot if either value changes. */
      #screen-crisis-obs .obs-spark-chart {
        --spark-yw: 26px;

      #screen-crisis-obs .obs-spark-row {

      /* Y labels are absolutely positioned at their own tick's percentage and

      #screen-crisis-obs .obs-spark-yaxis {

      #screen-crisis-obs .obs-axis {

      /* ── Geospatial promo (cpi-obs.css:227-248 `.intel-engine`, re-scoped)
         The promo used to sit inside its own tinted box (.intel-engine); it
         now sits straight on the section card like Impacts does, so two
         side-by-side sections don't read as a card nested inside a card. ── */
      #screen-crisis-obs .geo-section-intro {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text2);
        line-height: 1.55;
        margin: -8px 0 18px;
        max-width: 640px;
      }
      /* Gauge on top, copy below, both flush to the card's left edge and the
         pair centred as a unit in the card's available height — a left
         column, not a centred block. justify-items:start also keeps each
         grid item shrunk to its own content width rather than stretching to
         the full column, which matters below: without it .geo-promo-copy
         would report the whole column as its box even though the text
         inside is shorter, and the bled globe (position:absolute, so it
         paints above static text regardless of DOM order) would visibly
         occlude any part of that oversized box it overlapped. */
      #screen-crisis-obs .geo-promo {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: start;
        row-gap: 32px;
      }
      /* style.css's shared .gauge-wrap (built for the centred composite-card
         gauges, and fixed at 100x56 to match their own gauge size) sets
         margin:0 auto 8px — auto margins win over justify-items on a grid
         item, so the gauge centred here despite the rule above; the bottom
         margin is also zeroed so the 32px row-gap above is the only source
         of space between the gauge and the copy below it, rather than the
         two stacking. width/height switch to auto so the wrapper's own box
         matches this gauge's actual 150x84 (buildGauge's inline SVG width,
         viewBox 100x56 so height follows at the same 1.5x this page draws
         it at) instead of clipping-box-free overflow past a 100x56 box —
         which, with nothing establishing the wrapper's real footprint, was
         leaving the 32px gap short and letting the SVG's bottom 28px run
         into "Mobility Flow" below it. Overridden locally rather than
         touching the shared rule, which other gauges on this page still
         rely on. */
      #screen-crisis-obs .geo-promo .gauge-wrap {
        margin: 0;
        width: auto;
        height: auto;
      }
      /* Reserves clearance for the globe as a share of the card's own width
         (not a flat max-width) so the note wraps only once the card is
         actually too narrow for both — a flat cap wrapped it needlessly
         early on wide cards, no cap let it run a single line straight under
         the globe on narrow ones. 221px = the globe's own reach past the art
         box's left edge (artW × 0.9366 — how far left of the box the
         sphere's silhouette extends, worked out from its measured centre/
         radius) plus this card's ~28px right padding and a ~15px buffer.
         artW here is 260 × the 0.962 scale above = 250px. The 1200px/560px
         queries near the globe's own scale rules further down recompute
         this the same way for their own artW. */
      #screen-crisis-obs .geo-promo-copy {
        max-width: calc(100% - 221px);
      }
      /* Label/value/note replace a single combined heading so the number
         reads as a stat (matches .dc-value/.fx-kpi-val elsewhere on this
         page) rather than being buried mid-sentence in a title. */
      #screen-crisis-obs .geo-promo-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        margin: 0 0 2px;
      }
      #screen-crisis-obs .geo-promo-value {
        font-size: 26px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        margin: 0 0 6px;
      }
      #screen-crisis-obs .geo-promo-note {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text2);
        line-height: 1.5;
        margin: 0 0 14px;
      }
      /* The asset is itself a cropped sphere — it runs off its own right and
         bottom edges — so it's anchored into the card's bottom-right corner
         (the -28px offsets cancel the section's padding, putting the file's
         cut edges exactly on the card's borders). The globe then reads as
         continuing past the corner instead of as a chopped disc floating
         mid-card. The box keeps the file's aspect ratio so the geometry the
         orbit rings below depend on stays exact: measured from the asset,
         the sphere's centre is at 61.4% / 60.5% of the file and its radius
         is 55.1% of the file's width — at 260px wide that's centre 160,161
         with r=143. */
      #screen-crisis-obs .geo-promo-art {
        position: absolute;
        right: -28px;
        bottom: -28px;
        width: 260px;
        aspect-ratio: 1436 / 1474;
        /* Scaled from the reference 260px box (not resized directly) so the
         hand-tuned ring/particle geometry below — all absolute px pinned to
         that 260px reference — stays correct at any size: 0.962× renders at
         a 250px maximum width. */
        transform: scale(0.962);
        transform-origin: 100% 100%;
      }
      #screen-crisis-obs .geo-globe-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.4, 1);
      }
      #screen-crisis-obs .geo-promo-art:hover .geo-globe-img {
        transform: scale(1.015);
      }
      /* Soft radiating rings behind the sphere — first in DOM so they paint
         under the globe img and the orbit rings without needing a z-index.
         Both PNGs are crops of the same design frame about the same centre:
         measured, the rings sit at 71.2%/70.4% of their file with an outer
         radius of 71.2% of its width, the sphere at 61.4%/60.5% with a
         radius of 55.1% — and each file's centre-to-crop-edge distance is
         the same 5.9× ratio in both axes. So they're concentric when both
         are pinned to the same corner, which is what the offsets below do;
         133.9% is the width that makes the rings' centre land on the
         sphere's (326 × 554/93.9 ÷ 1436). Centring the two boxes instead —
         the obvious-looking approach — puts the rings' centre a third of
         the box down and right of the sphere, which is what made the glow
         look like it was radiating from off to the side. */
      #screen-crisis-obs .geo-globe-backdrop {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 133.9%;
        height: auto;
        pointer-events: none;
      }

      /* ── Orbit rings (Mobility Tracker promo) — CSS-only flowing-line
         animation around the globe photo: two tilted rings with particles
         riding them via offset-path. No SVG/canvas/JS — transform/opacity
         only, so it stays on the compositor thread. Every ring measurement
         is anchored to the sphere's centre inside the art box (160px/161px),
         NOT the box's own centre — the asset is a cropped sphere, so those
         two points differ by ~30px and centring on the box would leave the
         rings visibly sliding off the globe. ── */
      #screen-crisis-obs .geo-orbit-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transform-origin: 160px 161px;
      }
      #screen-crisis-obs .geo-orbit-wrap--a {
        transform: rotate(-16deg);
      }
      #screen-crisis-obs .geo-orbit-wrap--b {
        transform: rotate(20deg);
      }
      #screen-crisis-obs .geo-orbit {
        position: absolute;
        left: 160px;
        top: 161px;
        border-radius: 50%;
        border: 1.4px solid rgba(147, 197, 253, 0.8);
        box-shadow: 0 0 6px rgba(96, 165, 250, 0.25);
      }
      /* rx 152 × ry 47 — just wider than the sphere's 143px radius, so the
         ring passes outside its silhouette at the sides and across it in the
         middle. */
      #screen-crisis-obs .geo-orbit--a {
        width: 304px;
        height: 94px;
        margin: -47px 0 0 -152px;
      }
      /* rx 123 × ry 67 — tucked inside the sphere's radius, so this one
         reads as passing through it. */
      #screen-crisis-obs .geo-orbit--b {
        width: 246px;
        height: 134px;
        margin: -67px 0 0 -123px;
        border-color: rgba(196, 181, 253, 0.65);
      }
      /* Each ring is split in half so it wraps the sphere instead of lying
         flat on it: the back half paints before the image in the DOM (the
         opaque globe hides the part crossing it, leaving only what escapes
         the silhouette), the front half after (crossing over). The split is
         at the ellipse's own midline, before the wrap's tilt, so the seam
         still lands correctly once rotated. */
      #screen-crisis-obs .geo-orbit--back {
        clip-path: inset(0 0 50% 0);
        opacity: 0.45;
      }
      #screen-crisis-obs .geo-orbit--front {
        clip-path: inset(50% 0 0 0);
      }
      #screen-crisis-obs .geo-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: radial-gradient(circle, #f0f9ff 0%, #60a5fa 55%, transparent 78%);
        box-shadow: 0 0 5px 1px rgba(96, 165, 250, 0.7);
        opacity: 0.9;
        offset-distance: 0%;
        transition: opacity 0.4s ease;
        will-change: offset-distance, opacity;
      }
      /* offset-path takes absolute units, so these ellipses restate the ring
         geometry above rather than inheriting it: centre 160,161 with the
         same rx/ry as .geo-orbit--a / --b. */
      #screen-crisis-obs .geo-particle--a1 {
        offset-path: path("M 8 161 A 152 47 0 1 0 312 161 A 152 47 0 1 0 8 161");
        animation: geoOrbitA 15s linear infinite, geoPulse 3.4s ease-in-out infinite;
        animation-delay: 0s, 0s;
      }
      #screen-crisis-obs .geo-particle--a2 {
        offset-path: path("M 8 161 A 152 47 0 1 0 312 161 A 152 47 0 1 0 8 161");
        width: 3px;
        height: 3px;
        animation: geoOrbitA 19s linear infinite, geoPulse 4.2s ease-in-out infinite;
        animation-delay: -9s, -1.6s;
      }
      #screen-crisis-obs .geo-particle--b1 {
        offset-path: path("M 37 161 A 123 67 0 1 0 283 161 A 123 67 0 1 0 37 161");
        animation: geoOrbitB 13s linear infinite, geoPulse 3.8s ease-in-out infinite;
        animation-delay: -4s, -2.4s;
      }
      #screen-crisis-obs .geo-particle--b2 {
        offset-path: path("M 37 161 A 123 67 0 1 0 283 161 A 123 67 0 1 0 37 161");
        width: 3px;
        height: 3px;
        animation: geoOrbitB 17s linear infinite, geoPulse 4.6s ease-in-out infinite;
        animation-delay: -11s, -3.1s;
      }
      @keyframes geoOrbitA {
        to {
          offset-distance: 100%;
        }
      }
      @keyframes geoOrbitB {
        to {
          offset-distance: 100%;
        }
      }
      @keyframes geoPulse {
        0%, 100% {
          transform: scale(1);
          filter: brightness(1);
        }
        50% {
          transform: scale(1.35);
          filter: brightness(1.3);
        }
      }
      /* Hover — gentle scale on the image, brighter particles. Kept small on
         purpose (1.5%). */
      #screen-crisis-obs .geo-promo-art:hover .geo-particle {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs .geo-particle {
          animation: none !important;
          opacity: 0.6;
          offset-distance: 15%;
        }
        #screen-crisis-obs .geo-promo-art:hover .geo-globe-img {
          transform: none;
        }
      }
      /* Between 900 and 1200 the two it-columns cards are still side by side
         but each is only ~400px wide, where a 260px globe would sit under the
         copy. The whole art box scales as one — image, rings and the paths the
         particles ride — so shrinking it here keeps the geometry intact rather
         than needing a second set of hand-tuned ring measurements. */
      @media (max-width: 1200px) {
        #screen-crisis-obs .geo-promo-art {
          transform: scale(0.62);
          transform-origin: 100% 100%;
        }
        /* Globe box shrank to 0.62 — same formula, smaller artW. */
        #screen-crisis-obs .geo-promo-copy {
          max-width: calc(100% - 138px);
        }
        #screen-crisis-obs .geo-promo {
          row-gap: 24px;
        }
      }
      /* it-columns stacks to one full-width column at 900px, but that only
         widens the card — it doesn't add height (no sibling to stretch-match
         any more), so the art box, bottom-anchored to the now content-height
         .geo-promo, has nowhere to grow into without climbing back up over
         the intro paragraph. The 900-1200 scale stays in effect through this
         range rather than resetting, for exactly that reason. Hidden below
         560px, where even the small globe would crowd a phone-width card. */
      @media (max-width: 560px) {
        #screen-crisis-obs .geo-promo-art {
          display: none;
        }
        /* Globe is gone at this width — copy can use the full card again. */
        #screen-crisis-obs .geo-promo-copy {
          max-width: none;
        }
        #screen-crisis-obs .geo-promo {
          row-gap: 16px;
        }
      }

      /* ── Benchmark view (benchmark.html inline <style>, re-scoped — the
         .bm-* family has no shared-stylesheet home to widen). Also supplies
         this page's search field, segmented controls and toolbar rows. ── */
      #screen-crisis-obs .bm-search {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 220px;
        height: 42px;
        padding: 0 12px;
        border-radius: 12px;

        background: var(--white, #fff);
        color: var(--text2);

      #screen-crisis-obs .bm-search > i {

      #screen-crisis-obs .bm-search input {

      #screen-crisis-obs .bm-filter-row {

      #screen-crisis-obs .bm-spacer {

      /* Segmented control — the shell is the secondary button (white /

      #screen-crisis-obs .bm-region-seg {

        padding: 4px;

      }
      html[data-theme="dark"] #screen-crisis-obs .bm-region-seg {

        border-color: var(--border-md);
      }
      #screen-crisis-obs .bm-seg-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 100%;
        padding: 0 13px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-primary, #0f172a);
        font-family: inherit;
        font-size: 13px;

      #screen-crisis-obs .bm-seg-btn i {

      #screen-crisis-obs .bm-seg-btn:hover:not(.is-active) {

      }
      #screen-crisis-obs .bm-seg-btn.is-active {

      }
      html[data-theme="dark"] #screen-crisis-obs .bm-seg-btn {
        color: var(--text-primary);
      }

      #screen-crisis-obs .bm-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }
      #screen-crisis-obs .bm-col {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      /* Panel shell — identical recipe to .fx-panel on the Forecast page (the
         home-page section module at the content-panel radius). */
      #screen-crisis-obs .bm-panel {
        background: linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 24px;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
        padding: 20px 22px;
      }
      html[data-theme="dark"] #screen-crisis-obs .bm-panel {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
      }
      #screen-crisis-obs .bm-chart-card {
        position: relative;
        min-width: 0;
      }
      #screen-crisis-obs .bm-chart-toprow-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #screen-crisis-obs .bm-expand-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        flex-shrink: 0;
        border: 1px solid #ced4da;

        background: #fff;

      #screen-crisis-obs .bm-expand-btn:hover {

      }
      html[data-theme="dark"] #screen-crisis-obs .bm-expand-btn {
        background: var(--surface2, #1a2740);
        border-color: var(--border-md, var(--border));
        color: var(--accent-mid, var(--accent));
      }
      html[data-theme="dark"] #screen-crisis-obs .bm-expand-btn:hover {
        background: var(--surface);
        border-color: var(--accent);
        color: var(--accent);
      }
      #screen-crisis-obs .bm-expand-btn i {
        font-size: 14px;
      }
      #screen-crisis-obs .bm-chart-card.bm-chart-expanded {
        grid-column: 1 / -1;
      }
      /* True fullscreen (Fullscreen API) — the card fills the viewport and
         everything else on the page is hidden by the browser itself. */
      #screen-crisis-obs .bm-chart-card:fullscreen,
      #screen-crisis-obs .bm-chart-card:-webkit-full-screen {
        display: flex; flex-direction: column; justify-content: center;
        width: 100vw; height: 100vh; padding: 32px 40px; background: var(--white, #fff);
      }
      html[data-theme="dark"] #screen-crisis-obs .bm-chart-card:fullscreen,
      html[data-theme="dark"] #screen-crisis-obs .bm-chart-card:-webkit-full-screen {

      #screen-crisis-obs .bm-chart-toprow {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 10px;
      }
      #screen-crisis-obs .bm-chart-eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;

      #screen-crisis-obs .bm-chart-val {

      }
      /* Legend — dot + label, centred under the plot (matches .fx-legend on the

      #screen-crisis-obs .bm-legend {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 14px;
        max-height: 96px;
        overflow-y: auto;
      }
      #screen-crisis-obs .bm-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--text2);
        cursor: pointer;
        transition: opacity 0.15s, background 0.15s;
      }
      #screen-crisis-obs .bm-legend-item:hover {

      }
      #screen-crisis-obs .bm-legend-item.is-off {

      }
      #screen-crisis-obs .bm-legend-dot {

      /* Side insight panels — the app's AI-insight card treatment
         (blue→violet gradient tint + blue border), same as the Forecast
         view's .fx-side .fx-panel. */
      #screen-crisis-obs .bm-side {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      #screen-crisis-obs .bm-side .bm-panel {
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.06), rgba(124, 58, 237, 0.04));
        border: 1px solid rgba(0, 102, 255, 0.12);
        border-radius: 16px;
      }
      html[data-theme="dark"] #screen-crisis-obs .bm-side .bm-panel {
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.12), rgba(124, 58, 237, 0.1));
        border-color: rgba(0, 102, 255, 0.25);
      }
      #screen-crisis-obs .bm-side-hd {

      #screen-crisis-obs .bm-side-title {

      }
      #screen-crisis-obs .bm-ask {

        justify-content: center;

        height: 32px;

        animation: sparkleGlow 2.4s ease-in-out infinite;

      #screen-crisis-obs .bm-ask:hover {

      }
      #screen-crisis-obs .bm-point {
        font-size: 12.5px;
        line-height: 1.65;
        color: #536277;
      }
      html[data-theme="dark"] #screen-crisis-obs .bm-point {

      #screen-crisis-obs .bm-point-label {

      html[data-theme="dark"] #screen-crisis-obs .bm-point b {

      /* ── Filter dropdowns (single- and multi-select) ──
         The application's standard filter control (.prod-filter-dd from the
         Products screen). Its rules in style.css are scoped to #screen-products
         / #tv-requests / #tv-artifacts, so the spec is mirrored here, exactly
         as observe.html / benchmark.html / forecast.html each do. Keep in sync
         with `#screen-products .prod-filter-*` in style.css. */
      #screen-crisis-obs .prod-filter-dd {
        position: relative;
      }
      #screen-crisis-obs .prod-filter-dd-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 168px;
        max-width: 260px;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        color: #0f2744;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;

        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
      }
      /* Leading glyph — names the dimension the way the field label does on the
         Products filter bar, without stacking a second line above the row. */
      #screen-crisis-obs .prod-filter-dd-lead {
        font-size: 16px;
        color: var(--accent);
        flex-shrink: 0;
      }
      #screen-crisis-obs .prod-filter-dd-trigger span.dd-label {

        margin-right: auto;
      }
      #screen-crisis-obs .prod-filter-dd-trigger > i.ti-chevron-down {
        font-size: 15px;
        color: #9ca3af;
        flex-shrink: 0;
        transition: transform 0.15s;
      }
      #screen-crisis-obs .prod-filter-dd-trigger.is-open > i.ti-chevron-down {
        transform: rotate(180deg);
      }
      #screen-crisis-obs .prod-filter-dd-trigger:hover:not(:disabled),
      #screen-crisis-obs .prod-filter-dd-trigger.is-open {
        border-color: var(--accent);
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger {
        background: var(--surface);
        border-color: var(--border-md);
        color: var(--text-primary);
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger:hover:not(:disabled),
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-trigger.is-open {
        border-color: var(--accent);
        color: var(--accent-mid);
      }
      #screen-crisis-obs .prod-filter-dd-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 400;
        min-width: 100%;
        width: max-content;
        max-width: min(300px, calc(100vw - 32px));
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(11, 28, 61, 0.14), 0 4px 12px rgba(0, 0, 0, 0.06);
        padding: 6px;
        max-height: 320px;
        overflow-y: auto;
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-menu {
        background: var(--surface);
        border-color: var(--border-md);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      #screen-crisis-obs .prod-filter-dd-option {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        font-size: 13px;
        font-weight: 500;
        color: #0f2744;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option {
        color: var(--text-primary);
      }
      #screen-crisis-obs .prod-filter-dd-option:hover {
        background: #f8fbff;
        color: var(--accent);
      }
      #screen-crisis-obs .prod-filter-dd-option.is-active {
        background: #eff6ff;
        color: var(--accent);
        font-weight: 600;
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option:hover,
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option.is-active {
        background: var(--accent-light);

        margin-left: auto;

      }
      #screen-crisis-obs .prod-filter-dd-option.is-active .ti-check {
        opacity: 1;

      #screen-crisis-obs .dd-check {
        width: 15px;
        height: 15px;
        border-radius: 4px;

        flex-shrink: 0;

        justify-content: center;

        background: var(--accent);
        border-color: var(--accent);
      }
      #screen-crisis-obs .prod-filter-dd-option.dd-all {
        border-bottom: 1px solid var(--border, #eaecf0);
        border-radius: 8px 8px 0 0;
        margin-bottom: 4px;
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-crisis-obs .prod-filter-dd-option.dd-all {
        border-bottom-color: var(--border-md);

      /* ── Signal Health ladder (Observe) — ported from trade.html's Alert
         Ladder (trade.html:831-1020): a lead label card + tone-count cards in
         one row. Adds a fourth, --good count (trade's ladder only ever needed
         three) for this page's Stable bucket, matching the tone convention. ── */
      #screen-crisis-obs .tr-ladder {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
        gap: 12px;
        padding: 14px;
        border-radius: 24px;
        margin-bottom: 16px;
      }
      html:not([data-theme="dark"]) #screen-crisis-obs .tr-ladder {
        background: #fff;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-ladder {
        background: var(--surface);
        border: 1px solid var(--border);
      }
      #screen-crisis-obs .tr-lad-card {
        --tone: var(--accent);
        border-radius: 16px;
        padding: 14px 16px;
        min-width: 0;
        background: color-mix(in srgb, var(--tone) 7%, white);
      }
      #screen-crisis-obs .tr-lad-lead {
        background: transparent;
        border: none;
      }
      html[data-theme="dark"] #screen-crisis-obs .tr-lad-card {
        background: color-mix(in srgb, var(--tone) 16%, transparent);
      }
      #screen-crisis-obs .tr-lad-lead {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #screen-crisis-obs .tr-lad-ic {
        width: 40px;

      /* ── Indicator card (Observe) — ported from the main app's Products
         grid card (style.css:3651-4104, .products-grid .product-card and its
         children), re-scoped here under the same class names so a future
         extraction is a merge. Skips the e-commerce-only pieces (select
         checkbox, download/bookmark actions, confidential tag) that don't
         apply to a standalone indicator card; keeps the category tag, name,
         value, change, chart and the AI-summary footer row. Replaces the old
         .cio-insight callout box with .product-ai-row's quieter treatment. ── */
      #screen-crisis-obs .product-card {
        position: relative;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      #screen-crisis-obs .product-card-toprow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      #screen-crisis-obs .product-cat-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--text2);
        background: #f3f4f6;
        border-radius: 5px;
        padding: 2px 8px;
      }
      #screen-crisis-obs .product-cat-tag i {
        font-size: 11px;
      }
      html[data-theme="dark"] #screen-crisis-obs .product-cat-tag {
        background: var(--surface2);
        color: var(--text-secondary);
      }
      #screen-crisis-obs .product-name {
        font-size: 14px;
        font-weight: 600;

      #screen-crisis-obs .product-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.1;
      }
      #screen-crisis-obs .product-val small {
        font-size: 13px;
        font-weight: 500;
        color: var(--text2);
        margin-left: 2px;
      }
      #screen-crisis-obs .product-change {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        margin-top: 3px;
        margin-bottom: 8px;
        font-weight: 500;
      }
      #screen-crisis-obs .product-viz {
        width: 100%;
        margin-bottom: 2px;
      }
      #screen-crisis-obs .product-ai-row {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        font-size: 11px;
        color: var(--text2);
        line-height: 1.5;
        padding: 10px 26px 37px 0;
        margin-top: auto;
        border-top: 1px solid var(--border);
      }
      #screen-crisis-obs .product-ai-row i.ti-bulb {
        font-size: 12px;
        color: var(--accent);
        flex-shrink: 0;
        margin-top: 1px;
      }
      #screen-crisis-obs .product-ai-lbl {
        font-weight: 700;
        color: var(--text);
      }
      /* Severity chip, moved out of .product-card-toprow (where it sat next
         to the domain tag) down to the opposite corner from the sparkle
         button below — the two read as a footer strip, chip left / ask
         right, the same pairing .dg-card-foot uses on the severity cards.
         .product-ai-row's own bottom padding (22px) is what actually clears
         this row and the button below: both are position:absolute, so nudging
         them individually wouldn't move the text out from under them — only
         the row's own box can do that. */
      #screen-crisis-obs .product-severity-tag {
        position: absolute;
        left: 16px;
        bottom: 14px;
      }
      /* .dg-card-ai (the severity cards' Ask-CIO-AI sparkle, styles above)
         reused as-is here, but pinned to the card's own bottom-right corner
         instead of the end of the AI row — a sibling of .product-ai-row, not
         a child of it, so it stays anchored to the card even though the row
         above it can grow to two or three lines. */
      #screen-crisis-obs .product-ai-ask {
        position: absolute;
        right: 12px;
        bottom: 12px;
      }

      /* ── Indicator Analytics filter row ── */
      #screen-crisis-obs .tasks-filters {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px 14px;
        flex-wrap: wrap;
      }

      /* ====================================================================
         CPI ALIGNMENT — component interiors
         The crisis component set in style.css:9717-10735 predates the CPI
         design system. Everything below re-points its interiors at the CPI
         spec: the 700 display weight, the negative tracking on numerals, the
         uppercase tracked table header, the 16px card radius, the tinted
         severity pill, and the slate-tinted shadow. Each rule names its CPI
         source so the two stay traceable.
         ==================================================================== */

      /* ── Header actions: CPI's own 40px download control (CPI.html:587) ── */
      #screen-crisis-obs .cpi-hdr-download {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--white, #fff);
        color: var(--text);
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #screen-crisis-obs .cpi-hdr-download:hover {
        border-color: var(--accent);
        background: var(--bg);
      }
      #screen-crisis-obs .cpi-hdr-download i {
        font-size: 16px;
        color: var(--accent);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hdr-download {
        background: var(--surface);
        border-color: var(--border-md);
        color: var(--text-primary);
      }

      /* Date control (CPI.html:528-586) */
      #screen-crisis-obs .cpi-hdr-date {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #screen-crisis-obs .cpi-hdr-date-label {
        font-size: 14px;
        font-weight: 500;
        color: #64748b;
        white-space: nowrap;
      }
      #screen-crisis-obs .cpi-hdr-date-field {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      #screen-crisis-obs .cpi-hdr-date-input {
        height: 36px;
        min-width: 132px;
        padding: 0 36px 0 12px;
        border: 1px solid rgba(191, 219, 254, 0.65);
        border-radius: 10px;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      #screen-crisis-obs .cpi-hdr-date-field:hover .cpi-hdr-date-input,
      #screen-crisis-obs .cpi-hdr-date-field:focus-within .cpi-hdr-date-input {
        border-color: #bfdbfe;

        position: absolute;

        top: 0;
        width: 36px;
        height: 100%;

        padding: 0;

        cursor: pointer;

      #screen-crisis-obs .cpi-hdr-date-field > i {
        position: absolute;
        right: 10px;
        pointer-events: none;
        color: #64748b;
        font-size: 16px;
        line-height: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hdr-date-input {
        background: var(--surface);
        border-color: var(--border-md);
        color: var(--text-primary);
      }

      /* ── Executive Brief hero — ported from CPI.html's .cpi-hero (CPI.html:131-219),
         replacing the old .overview-card's narrative half. The KPI stat-pills move to
         their own section below (still .overview-card/.stat-pill — unchanged, just
         relocated). Audio brief control is CPI.html's own port (CPI.html:221-460) of
         the home page Daily Brief listen affordance (css/pages/daily-brief.css),
         re-scoped here the same way. ── */
      #screen-crisis-obs .cpi-hero {
        position: relative;
        overflow: hidden;
        min-height: 150px;
        margin-bottom: 24px;
        border-radius: 16px;
        padding: 24px 28px;
        background: radial-gradient(ellipse 70% 55% at 8% 15%, rgba(99, 179, 255, 0.22) 0%, transparent 55%), linear-gradient(135deg, #f0f6ff 0%, #eef4fc 45%, #e8f0fa 100%);
        border: 1px solid #bfdbfe;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        --brief-blue: #246bfd;
        --brief-red: #e5484d;
      }
      #screen-crisis-obs .cpi-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1.5px, transparent 1.5px);
        background-size: 18px 18px;

      }

      html[data-theme="dark"] #screen-crisis-obs .cpi-hero::before {

        opacity: 0.5;

      #screen-crisis-obs .cpi-hero-inner {

        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      #screen-crisis-obs .cpi-hero-meta {

      }
      #screen-crisis-obs .cpi-hero-ico {
        color: #fff;
        font-size: 22px;
        line-height: 1;
        margin-top: 1px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;

        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.28);
      }

        font-size: 18px;

        color: var(--text-primary);

        margin-top: 20px;
        max-width: 100%;
        font-size: 14px;
        line-height: 1.55;
        color: var(--text2);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero-sub {
        color: var(--text-secondary);
      }

      #screen-crisis-obs .cpi-hero .brief-speech {
        position: relative;
        display: flex;
        align-items: center;
        width: fit-content;
        height: 32px;
        padding: 0;
        border-radius: 16px;
        background: transparent;
        box-shadow: none;
        transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen-crisis-obs .cpi-hero .brief-speech::before {
        content: "";
        position: absolute;

        transition: 0.3s;

      #screen-crisis-obs .cpi-hero .brief-speech.is-active {

      }
      #screen-crisis-obs .cpi-hero .brief-speech.is-active::before {
        opacity: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero .brief-speech {
        background: linear-gradient(120deg, rgba(30, 58, 95, 0.95), rgba(20, 30, 50, 0.9));
        box-shadow: inset 0 0 0 1px var(--border-md), 0 4px 12px rgba(0, 0, 0, 0.25);
      }
      html[data-theme="dark"] #screen-crisis-obs .cpi-hero .brief-speech.is-active {
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35), 0 5px 14px rgba(0, 0, 0, 0.3);
      }
      #screen-crisis-obs .cpi-hero .brief-listen {
        display: flex;
        align-items: center;

      #screen-crisis-obs .cpi-hero .brief-listen__icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, #1f5ef0, #5b97f8);
        box-shadow: 0 3px 8px rgba(36, 107, 253, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__icon::after {
        content: "";
        position: absolute;
        inset: -2px;
        border: 1px solid rgba(36, 107, 253, 0.22);
        border-radius: 50%;
        transform: scale(0.84);
        opacity: 0;

      #screen-crisis-obs .cpi-hero .brief-listen__speaker,
      #screen-crisis-obs .cpi-hero .brief-listen__play,
      #screen-crisis-obs .cpi-hero .brief-listen__pause {

        margin-left: 1px;
        opacity: 0;
        transform: scale(0.85);

        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }

        opacity: 1;
        transform: scale(1);
      }

      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__speaker {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__pause {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__play {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__icon {
        background: linear-gradient(145deg, #3b7af5, #7aafff);

      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__text {
        display: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave {

        justify-content: center;

        height: 14px;

        height: 5px;

        background: currentColor;
        animation: ci-brief-wave 0.72s ease-in-out infinite;

      #screen-crisis-obs .cpi-hero .brief-listen__wave i:nth-child(2) {

      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave {

      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave i {

      #screen-crisis-obs .cpi-hero .brief-speech.is-active .brief-speech__actions {

      #screen-crisis-obs .cpi-hero .brief-speech__actions::before {
