<svg viewBox="0 0 500 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background circle -->
  <circle cx="250" cy="180" r="160" fill="#D1FAE5" opacity="0.6"/>

  <!-- Construction Worker (Left) -->
  <g>
    <!-- Hard hat -->
    <ellipse cx="120" cy="90" rx="32" ry="28" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <path d="M 92 115 Q 92 135 120 140 Q 148 135 148 115" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <line x1="105" y1="115" x2="135" y2="115" stroke="#0D9488" stroke-width="5" stroke-linecap="round"/>

    <!-- Face -->
    <circle cx="120" cy="120" r="24" fill="none" stroke="#0D9488" stroke-width="6"/>

    <!-- Beard/facial hair -->
    <path d="M 103 135 Q 120 145 137 135" fill="none" stroke="#0D9488" stroke-width="5" opacity="0.6" stroke-linecap="round"/>

    <!-- Body -->
    <rect x="95" y="155" width="50" height="85" rx="10" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Shirt/jacket front line -->
    <line x1="120" y1="155" x2="120" y2="240" stroke="#0D9488" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

    <!-- Left arm -->
    <line x1="95" y1="175" x2="55" y2="220" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <!-- Left hand -->
    <circle cx="50" cy="225" r="8" fill="#0D9488"/>

    <!-- Right arm with clipboard -->
    <line x1="145" y1="175" x2="210" y2="195" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <!-- Clipboard -->
    <rect x="205" y="180" width="50" height="40" rx="4" fill="none" stroke="#0D9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="215" y1="190" x2="245" y2="190" stroke="#0D9488" stroke-width="3" opacity="0.6"/>
    <line x1="215" y1="200" x2="245" y2="200" stroke="#0D9488" stroke-width="3" opacity="0.6"/>
    <line x1="215" y1="210" x2="235" y2="210" stroke="#0D9488" stroke-width="3" opacity="0.6"/>
    <!-- Clipboard clip -->
    <circle cx="232" cy="185" r="5" fill="#0D9488"/>

    <!-- Legs -->
    <line x1="105" y1="240" x2="95" y2="330" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <line x1="135" y1="240" x2="145" y2="330" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Professional Woman (Right) -->
  <g>
    <!-- Head -->
    <circle cx="340" cy="110" r="26" fill="none" stroke="#0D9488" stroke-width="6"/>

    <!-- Long hair -->
    <path d="M 318 125 Q 315 160 320 190" fill="none" stroke="#0D9488" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <path d="M 362 125 Q 365 160 360 190" fill="none" stroke="#0D9488" stroke-width="5" opacity="0.5" stroke-linecap="round"/>

    <!-- Body/Blazer -->
    <rect x="315" y="150" width="50" height="90" rx="10" fill="none" stroke="#0D9488" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Blazer lapels -->
    <path d="M 330 160 L 320 200" fill="none" stroke="#0D9488" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <path d="M 350 160 L 360 200" fill="none" stroke="#0D9488" stroke-width="4" opacity="0.6" stroke-linecap="round"/>

    <!-- Left arm with clipboard -->
    <line x1="315" y1="180" x2="255" y2="210" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <!-- Clipboard -->
    <rect x="210" y="195" width="50" height="40" rx="4" fill="none" stroke="#0D9488" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="220" y1="205" x2="250" y2="205" stroke="#0D9488" stroke-width="3" opacity="0.6"/>
    <line x1="220" y1="215" x2="250" y2="215" stroke="#0D9488" stroke-width="3" opacity="0.6"/>
    <line x1="220" y1="225" x2="240" y2="225" stroke="#0D9488" stroke-width="3" opacity="0.6"/>

    <!-- Right arm -->
    <line x1="365" y1="180" x2="415" y2="215" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <!-- Right hand -->
    <circle cx="420" cy="220" r="8" fill="#0D9488"/>

    <!-- Legs -->
    <line x1="325" y1="240" x2="310" y2="330" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <line x1="355" y1="240" x2="370" y2="330" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Gear icon (center) -->
  <g opacity="0.45">
    <circle cx="240" cy="160" r="24" fill="none" stroke="#0D9488" stroke-width="5"/>
    <circle cx="240" cy="160" r="12" fill="none" stroke="#0D9488" stroke-width="4"/>
    <!-- Gear teeth -->
    <g stroke="#0D9488" stroke-width="5" stroke-linecap="round">
      <line x1="240" y1="130" x2="240" y2="115"/>
      <line x1="240" y1="190" x2="240" y2="205"/>
      <line x1="270" y1="160" x2="285" y2="160"/>
      <line x1="210" y1="160" x2="195" y2="160"/>
    </g>
  </g>

  <!-- Background bars (right side) -->
  <g opacity="0.4">
    <rect x="410" y="220" width="18" height="60" rx="3" fill="#0D9488"/>
    <rect x="435" y="195" width="18" height="85" rx="3" fill="#0D9488"/>
    <rect x="460" y="210" width="18" height="70" rx="3" fill="#0D9488"/>
  </g>
</svg>