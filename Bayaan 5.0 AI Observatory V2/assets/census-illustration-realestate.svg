<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background circle -->
  <circle cx="250" cy="160" r="155" fill="#FEF3C7" opacity="0.55"/>

  <!-- Small building (left) -->
  <g>
    <rect x="60" y="220" width="65" height="140" rx="8" fill="none" stroke="#EA8C1E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Windows -->
    <rect x="78" y="245" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>
    <rect x="103" y="245" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>

    <rect x="78" y="280" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>
    <rect x="103" y="280" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>

    <rect x="78" y="315" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>
    <rect x="103" y="315" width="15" height="15" fill="none" stroke="#EA8C1E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tall building (center-left) -->
  <g>
    <rect x="145" y="130" width="70" height="230" rx="8" fill="none" stroke="#EA8C1E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Windows grid - 3 columns -->
    <rect x="162" y="160" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="160" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="160" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="162" y="185" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="185" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="185" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="162" y="210" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="210" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="210" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="162" y="235" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="235" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="235" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="162" y="260" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="260" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="260" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="162" y="285" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="180" y="285" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="198" y="285" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Medium building with slanted roof (center) -->
  <g>
    <!-- Roof -->
    <polygon points="235,95 280,95 295,140 220,140" fill="none" stroke="#EA8C1E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Building body -->
    <rect x="220" y="140" width="75" height="220" rx="8" fill="none" stroke="#EA8C1E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Windows -->
    <rect x="238" y="165" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="260" y="165" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="282" y="165" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="238" y="195" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="260" y="195" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="282" y="195" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="238" y="225" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="260" y="225" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="282" y="225" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="238" y="255" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="260" y="255" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="282" y="255" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Small building (right) -->
  <g>
    <rect x="315" y="275" width="60" height="85" rx="7" fill="none" stroke="#EA8C1E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Windows -->
    <rect x="330" y="295" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="350" y="295" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>

    <rect x="330" y="325" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="350" y="325" width="12" height="12" fill="none" stroke="#EA8C1E" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Dome/Globe structure (right side) -->
  <g>
    <!-- Main circle -->
    <circle cx="395" cy="210" r="70" fill="none" stroke="#EA8C1E" stroke-width="7" stroke-linecap="round"/>

    <!-- Horizontal line -->
    <line x1="325" y1="210" x2="465" y2="210" stroke="#EA8C1E" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

    <!-- Diagonal grid lines -->
    <line x1="345" y1="155" x2="435" y2="260" stroke="#EA8C1E" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <line x1="345" y1="260" x2="435" y2="155" stroke="#EA8C1E" stroke-width="4" opacity="0.5" stroke-linecap="round"/>

    <!-- Additional grid curves -->
    <path d="M 345 180 Q 395 150 445 180" fill="none" stroke="#EA8C1E" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
    <path d="M 345 240 Q 395 270 445 240" fill="none" stroke="#EA8C1E" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Ground line with dashes -->
  <g stroke="#EA8C1E" stroke-width="6" stroke-linecap="round" stroke-dasharray="15,12">
    <line x1="40" y1="360" x2="160" y2="360"/>
    <line x1="190" y1="360" x2="310" y2="360"/>
    <line x1="340" y1="360" x2="460" y2="360"/>
  </g>
</svg>