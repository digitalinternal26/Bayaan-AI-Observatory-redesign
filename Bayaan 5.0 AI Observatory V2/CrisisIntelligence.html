      #screen-crisis-obs .cpi-hero .brief-audio-action:focus-visible {
        outline: 3px solid rgba(36, 107, 253, 0.17);
        outline-offset: 2px;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__icon {
        position: relative;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(145deg, #1f5ef0, #5b97f8);
        box-shadow: 0 3px 8px rgba(36, 107, 253, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__icon::after {
        content: "";
        position: absolute;
        inset: -2px;
        border: 1px solid rgba(36, 107, 253, 0.22);
        border-radius: 50%;
        transform: scale(0.84);
        opacity: 0;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__speaker,
      #screen-crisis-obs .cpi-hero .brief-listen__play,
      #screen-crisis-obs .cpi-hero .brief-listen__pause {
        grid-area: 1 / 1;
        font-size: 16px;
        line-height: 1;
        transition: opacity 0.15s, transform 0.15s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__play {
        margin-left: 1px;
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__pause {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__speaker {
        opacity: 1;
        transform: scale(1);
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__speaker,
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__speaker {
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__pause {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__play {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__icon {
        background: linear-gradient(145deg, #3b7af5, #7aafff);
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__icon::after {
        animation: ci-brief-voice-ring 1.8s ease-out infinite;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__copy {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        line-height: 1.05;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__text {
        color: #2b4462;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__text,
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__text {
        display: none;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 2px;
        height: 14px;
        color: var(--brief-blue);
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave i {
        display: block;
        width: 2px;
        height: 5px;
        border-radius: 2px;
        background: currentColor;
        animation: ci-brief-wave 0.72s ease-in-out infinite;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave i:nth-child(2) {
        animation-delay: 0.12s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave i:nth-child(3) {
        animation-delay: 0.24s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen__wave i:nth-child(4) {
        animation-delay: 0.36s;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="speaking"] .brief-listen__wave,
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave {
        display: inline-flex;
      }
      #screen-crisis-obs .cpi-hero .brief-listen[data-state="paused"] .brief-listen__wave i {
        height: 8px;
        animation-play-state: paused;
      }
      #screen-crisis-obs .cpi-hero .brief-speech__actions {
        display: flex;
        align-items: center;
        gap: 1px;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateX(-6px);
        transition: max-width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s, transform 0.3s;
      }
      #screen-crisis-obs .cpi-hero .brief-speech.is-active .brief-speech__actions {
        max-width: 56px;
        opacity: 1;
        transform: none;
      }
      #screen-crisis-obs .cpi-hero .brief-speech__actions::before {
        content: "";
        width: 1px;
        height: 14px;
        margin: 0 2px 0 0;
        background: #d7e2f0;
      }
      #screen-crisis-obs .cpi-hero .brief-audio-action {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6d7f95;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s ease;
      }
      #screen-crisis-obs .cpi-hero .brief-audio-action:hover {
        color: var(--brief-blue);
        background: #fff;
        box-shadow: 0 4px 10px rgba(36, 75, 125, 0.1);
        transform: scale(1.06);
      }
      #screen-crisis-obs .cpi-hero .brief-stop-box {
        display: block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: currentColor;
      }
      #screen-crisis-obs .cpi-hero .brief-audio-action--stop:hover {
        color: var(--brief-red);
        background: #fff5f5;
      }
      #screen-crisis-obs .cpi-hero .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @keyframes ci-brief-wave {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 14px;
        }
      }
      @keyframes ci-brief-voice-ring {
        0% {
          transform: scale(0.82);
          opacity: 0.8;
        }
        80%,
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      /* ── KPI cards — ported from forecast.html's .fx-kpi strip (forecast.html:
         425-487): icon chip · uppercase label + value · period sub-line. Replaces
         the old .overview-card/.stat-pill row (still used by the Observe tab's
         signal-summary card, so those rules stay). .kpi-label and .cpiby-col-sub
         are cpi-obs.css:456 and :551, re-scoped here the same way. ── */
      #screen-crisis-obs .fx-kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      #screen-crisis-obs .fx-kpi {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border-radius: 16px;
        padding: 14px 16px;
        min-width: 0;
        transition: box-shadow 0.22s ease, border-color 0.22s ease,
          transform 0.22s ease, background 0.22s ease;
      }
      #screen-crisis-obs .fx-kpi:hover {
        transform: translateY(-1px);
      }
      #screen-crisis-obs .fx-kpi-ic {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        color: var(--tone, var(--accent));
        background: color-mix(in srgb, var(--tone, #0066ff) 9%, white);
      }
      #screen-crisis-obs .fx-kpi-ic i {
        font-size: 17px;
        line-height: 1;
      }
      html[data-theme="dark"] #screen-crisis-obs .fx-kpi-ic {
        background: color-mix(in srgb, var(--tone, #0066ff) 18%, transparent);
      }
      #screen-crisis-obs .fx-kpi-body {
        min-width: 0;
        flex: 1;
      }
      #screen-crisis-obs .fx-kpi-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-top: 8px;
      }
      #screen-crisis-obs .fx-kpi .cpiby-col-sub {
        margin-top: 3px;
      }
      #screen-crisis-obs .fx-kpi--total {
        --tone: #3b82f6;
      }
      #screen-crisis-obs .fx-kpi--critical {
        --tone: var(--red);
      }
      #screen-crisis-obs .fx-kpi--warning {
        --tone: var(--amber);
      }
      #screen-crisis-obs .fx-kpi--watch {
        --tone: var(--blue-watch);
      }
      #screen-crisis-obs .fx-kpi--stable {
        --tone: var(--green);
      }
      #screen-crisis-obs .kpi-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #screen-crisis-obs .cpiby-col-sub {
        font-size: 11.5px;
        color: var(--text2);
      }
      @media (max-width: 1200px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 480px) {
        #screen-crisis-obs .fx-kpis {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* ── Interior card surfaces: 16px radius + the slate-tinted card shadow,
         matching .obs-card (cpi-obs.css:395 + CPI.html:649). ── */
      #screen-crisis-obs .overview-card,
      #screen-crisis-obs .composite-card {
        border-radius: 16px;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
      }
      /* Indicator Analytics is now a <section>, so the 28px gradient module IS
         its card — strip the inner card chrome rather than nesting two.
         Matches CPI, where the Diagnose table sits straight on .dg-section. */
      #screen-crisis-obs .cio-pane > section.tasks-card {
        padding: 0;
        overflow: hidden;
      }
      #screen-crisis-obs .tasks-card {
        background: none;
        border: 0;
        box-shadow: none;
      }
      #screen-crisis-obs .tasks-header {
        padding: 24px 28px 0;
        border-bottom: 0;
      }
      #screen-crisis-obs .tasks-filters {
        padding: 16px 28px 18px;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child {
        padding-left: 28px;
      }
      #screen-crisis-obs .tasks-card th:last-child,
      #screen-crisis-obs .tasks-card td:last-child {
        padding-right: 28px;
      }
      #screen-crisis-obs .tasks-card .pagination {
        padding: 14px 28px 22px;
        border-top: 0;
      }
      /* CPI removes the hover lift on cards (CPI.html:1015); the crisis default
         raised them on a pure-black shadow, which no CPI surface uses. */
      #screen-crisis-obs .composite-card {
        cursor: default;
        transition: border-color 0.22s ease, box-shadow 0.22s ease;
        animation: none;
      }
      #screen-crisis-obs .composite-card:hover {
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.04);
        transform: none;
      }
      /* style.css:10643 is `#screen-crisis-obs @keyframes fadeUp` — a qualified
         at-rule the parser discards, so fadeUp never registers and these four
         animations plus nine stagger delays are inert. CPI has no entry
         animation either; make that explicit rather than leave dead intent. */
      #screen-crisis-obs .overview-card,
      #screen-crisis-obs .tasks-card {
        animation: none;
      }
      /* Four composites, not five — the default grid left a dead fifth track. */
      #screen-crisis-obs .composite-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      #screen-crisis-obs .bm-panel {
        border-radius: 28px;
      }
      #screen-crisis-obs .bm-side .bm-panel {
        border-radius: 16px;
      }

      /* ── Display numerals: CPI sets 700 and negative tracking on every one,
         and uses tabular-nums rather than a mono face (CPI.html:711, :784).
         The --mono token on this screen aliases to Inter, so the mono request
         never resolved anyway. ── */
      #screen-crisis-obs .stat-pill-val,
      #screen-crisis-obs .gauge-val,
      #screen-crisis-obs td.td-val {
        font-family: var(--font);
        font-variant-numeric: tabular-nums;
      }
      #screen-crisis-obs .stat-pill-val {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      #screen-crisis-obs .gauge-val {
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      /* ── Titles and body copy ── */
      #screen-crisis-obs .comp-title {
        font-weight: 600;
      }
      #screen-crisis-obs .tasks-header h3 {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 18px;
        font-weight: 700;
      }
      #screen-crisis-obs .tasks-header h3 i {
        font-size: 20px;
        color: var(--accent);
      }
      #screen-crisis-obs .overview-text {
        font-size: 13.5px;
      }
      /* --muted (#94a3b8) on white is ~2.6:1 — below AA for body copy. */
      #screen-crisis-obs .comp-note,
      #screen-crisis-obs .pag-info {
        color: var(--text2);
      }

      /* ── Indicator table: CPI's .dg-table spec (CPI.html:1882-1921) ── */
      #screen-crisis-obs .tasks-card table {
        min-width: 640px;
      }
      #screen-crisis-obs .tasks-card th {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text2);
        background: transparent;
        text-align: right;
        padding: 0 16px 12px;
        border-bottom: 1px solid var(--border, #eaecf0);
      }
      #screen-crisis-obs .tasks-card td {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        text-align: right;
        padding: 13px 16px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.05);
        white-space: nowrap;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child,
      #screen-crisis-obs .tasks-card th:nth-child(2),
      #screen-crisis-obs .tasks-card td:nth-child(2),
      #screen-crisis-obs .tasks-card th:nth-child(3),
      #screen-crisis-obs .tasks-card td:nth-child(3) {
        text-align: left;
      }
      #screen-crisis-obs .tasks-card th:first-child,
      #screen-crisis-obs .tasks-card td:first-child {
        padding-left: 20px;
      }
      #screen-crisis-obs .tasks-card td.td-indicator {
        font-weight: 600;
        color: var(--text);
      }
      #screen-crisis-obs .tasks-card tbody tr {
        border-bottom: 0;
        transition: background 0.15s ease;
      }
      #screen-crisis-obs .tasks-card tbody tr:hover {
        background: var(--accent-light);
      }
      html[data-theme="dark"] #screen-crisis-obs .tasks-card td {
        border-color: color-mix(in srgb, var(--border) 60%, transparent);
      }
      /* Delta cells as CPI's tinted .dg-cell rather than bare coloured text. */
      #screen-crisis-obs .tasks-card td.td-mom,
      #screen-crisis-obs .tasks-card td.td-yoy {
        font-size: 13px;
      }
      #screen-crisis-obs .tasks-card .chg-up,
      #screen-crisis-obs .tasks-card .chg-down {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3px 9px;
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
      }
      #screen-crisis-obs .tasks-card .chg-up {
        background: color-mix(in srgb, var(--red) 9%, transparent);
      }
      #screen-crisis-obs .tasks-card .chg-down {
        background: color-mix(in srgb, var(--green) 9%, transparent);
      }
      #screen-crisis-obs th.sorted {
        color: var(--accent);
      }
      /* The sort control is a real <button> for keyboard reach, styled to
         disappear into the header cell. */
      #screen-crisis-obs .th-sort {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-left: auto;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      #screen-crisis-obs .th-sort:hover {
        color: var(--accent);
      }
      #screen-crisis-obs th:first-child .th-sort {
        margin-left: 0;
      }

      /* ── Severity chip: CPI's .dg-pill tinted recipe (CPI.html:1699-1777).
         Also settles an internal clash — the severity ROWS on this page are
         already pale tints with a 1px border, which the old white-on-solid
         chips fought. ── */
      #screen-crisis-obs .risk-chip {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 100px;
        text-transform: uppercase;
      }
      #screen-crisis-obs .risk-critical {
        color: #b4232d;
        background: #ffe7e9;
        box-shadow: inset 0 0 0 1px #f6c9cd;
      }
      #screen-crisis-obs .risk-moderate {
        color: #9a5b00;
        background: #fff3d6;
        box-shadow: inset 0 0 0 1px #f0dbad;
      }
      #screen-crisis-obs .risk-watch {
        color: #185aa9;
        background: #e7f1ff;
        box-shadow: inset 0 0 0 1px #cbdff8;
      }
      #screen-crisis-obs .risk-stable {
        color: #087b4b;
        background: #e6f8ef;
        box-shadow: inset 0 0 0 1px #c8ead9;
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-critical {
        background: color-mix(in srgb, #e5484d 22%, transparent);
        color: #ff8a8a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #e5484d 35%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-moderate {
        background: color-mix(in srgb, #f5a623 20%, transparent);
        color: #f0b25a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #f5a623 30%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-watch {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: #7eb8ff;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .risk-stable {
        background: color-mix(in srgb, #0c9b70 22%, transparent);
        color: #34c99a;
        box-shadow: inset 0 0 0 1px color-mix(in srgb, #0c9b70 32%, transparent);
      }

      /* Domain tag → .ev-tag pill (cpi-obs.css:734); status badge → .kpi-badge
         (cpi-obs.css:464). Both were rounded rects in a system of pills. */
      #screen-crisis-obs .ind-domain-tag {
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 100px;
      }
      #screen-crisis-obs .status-badge {
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 100px;
      }
      #screen-crisis-obs .pag-btn {
        border-radius: 8px;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }

      /* ── Section action affordance: it is cursor:pointer with no feedback. ── */
      #screen-crisis-obs .obs-section-action:hover {
        opacity: 0.75;
      }

      /* ── Focus: the page shipped none. CPI's ring token (CPI.html:275). ── */
      #screen-crisis-obs a:focus-visible,
      #screen-crisis-obs button:focus-visible,
      #screen-crisis-obs input:focus-visible,
      #screen-crisis-obs select:focus-visible,
      #screen-crisis-obs [tabindex]:focus-visible {
        outline: 3px solid rgba(36, 107, 253, 0.17);
        outline-offset: 2px;
        border-radius: 8px;
      }

      /* ── Scroll-spy dot rail lane (CPI.html:1969-1985) ── */
      #screen-crisis-obs {
        --home-rail-inset: 24px;
        --home-rail-w: 28px;
        --home-rail-gap: 12px;
        --home-rail-lane: calc(var(--home-rail-inset) + var(--home-rail-w) + var(--home-rail-gap));
      }
      @media (min-width: 901px) {
        #screen-crisis-obs .cpi-page-header,
        #screen-crisis-obs .cio-pane {
          padding-right: var(--home-rail-lane);
        }
      }
      #screen-crisis-obs .cio-dots-rail[hidden] {
        display: none !important;
      }
      /* style.css:9769 `#screen-crisis-obs nav:not(.topnav) {...}` is legacy
         chrome from the in-page screen, styling any non-topnav <nav> as a
         52px-tall sticky topbar (height, background, border-bottom, position,
         padding, gap). At (1,1,1) it outranks the shared `.home-module-dots`
         pill and wins on every property the two share, not just `display`:
         the 52px height clips the glass pill's background/border to roughly
         its first two dots (the rest overflow below, dot-only, no pill), and
         `gap: 28px` blows the tight dot spacing out. Reset every property
         that rule sets back to home-widgets.css's own values. CPI has no
         equivalent rule to collide with, so it needs none of this. */
      #screen-crisis-obs nav.home-module-dots {
        display: flex;
        height: auto;
        gap: 0;
        padding: 10px 0;
        background: rgba(255, 255, 255, 0.28);
        border-bottom: 1px solid rgba(255, 255, 255, 0.55);
        position: static;
        top: auto;
        z-index: auto;
      }
      html[data-theme="dark"] #screen-crisis-obs nav.home-module-dots {
        background: rgba(15, 23, 42, 0.32);
        border-bottom-color: rgba(255, 255, 255, 0.14);
      }
      @media (max-width: 900px) {
        #screen-crisis-obs nav.home-module-dots {
          display: none;
        }
      }

      /* ── Severity Overview → dg-panels — ported from CPI.html's Diagnose
         view (CPI.html:1329-1827): two grouped panels (Needs attention /
         Stable & optimized) instead of four side-by-side severity columns.
         Badges reuse this page's own .risk-chip (already the .dg-pill
         recipe, see CPI.html:1699-1777 above) rather than a second copy. ── */
      #screen-crisis-obs .dg-panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 22px;
        align-items: start;
        margin-bottom: 24px;
      }
      @media (max-width: 1580px) {
        #screen-crisis-obs .dg-panels {
          grid-template-columns: 1fr;
        }
      }
      #screen-crisis-obs .dg-body {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #screen-crisis-obs .dg-indicators {
        min-width: 0;
      }
      #screen-crisis-obs .dg-aisummary {
        position: relative;
        padding: 0;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.06), rgba(124, 58, 237, 0.04));
        border: 1px solid rgba(0, 102, 255, 0.12);
      }
      #screen-crisis-obs .dg-aisummary-text {
        padding: 15px 88px 15px 18px;
      }
      #screen-crisis-obs .dg-aisummary-art {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 30%;
        height: 100%;
        object-fit: cover;
        /* The stable illustration's checkmark badge sits low in the frame;
           a vertically-centered crop clips it against the card's rounded
           corner. Anchoring to the bottom keeps the badge fully in view and
           crops from the (empty) top of the image instead. */
        object-position: bottom right;
      }
      #screen-crisis-obs .dg-panel--warn .dg-aisummary-art {
        width: 20%;
        object-fit: contain;
        object-position: top right;
      }
      #screen-crisis-obs .dg-panel--warn .dg-aisummary-text {
        padding-right: 92px;
      }
      @media (max-width: 768px) {
        #screen-crisis-obs .dg-aisummary-art {
          display: none;
        }
        #screen-crisis-obs .dg-aisummary-text,
        #screen-crisis-obs .dg-panel--warn .dg-aisummary-text {
          padding-right: 18px;
        }
      }
      #screen-crisis-obs .dg-aisummary-hd {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent, #0066ff);
        margin-bottom: 8px;
      }
      #screen-crisis-obs .dg-aisummary-hd i {
        font-size: 14px;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-aisummary {
        background: linear-gradient(135deg, rgba(0, 102, 255, 0.12), rgba(124, 58, 237, 0.10));
        border-color: rgba(0, 102, 255, 0.25);
      }
      #screen-crisis-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 10%, white);
        border-color: color-mix(in srgb, var(--up, #e5484d) 20%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-panel--warn .dg-aisummary {
        background: color-mix(in srgb, var(--up, #e5484d) 22%, transparent);
        border-color: color-mix(in srgb, var(--up, #e5484d) 35%, transparent);
      }
      #screen-crisis-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 12%, white);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-panel--ok .dg-aisummary {
        background: color-mix(in srgb, var(--down, #0c9b70) 22%, transparent);
        border-color: color-mix(in srgb, var(--down, #0c9b70) 35%, transparent);
      }
      #screen-crisis-obs .dg-points {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #screen-crisis-obs .dg-point {
        --tone: #246bfd;
        font-size: 12px;
        line-height: 1.55;
        color: #536277;
      }
      #screen-crisis-obs .dg-point--critical {
        --tone: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-point--good {
        --tone: var(--down, #0c9b70);
      }
      #screen-crisis-obs .dg-point--info {
        --tone: var(--text-primary, #0f172a);
      }
      #screen-crisis-obs .dg-point-tx b {
        color: var(--tone);
        font-weight: 700;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-point {
        color: var(--text-secondary);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-point-tx b {
        color: var(--text-primary);
      }
      #screen-crisis-obs .dg-panel {
        background:
          linear-gradient(-76deg, #f3fbff 1.2%, rgba(255, 255, 255, 0) 40%),
          linear-gradient(90deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.5) 100%);
        border-radius: 28px;
        box-shadow: 0 24px 30px -4px rgba(42, 61, 76, 0.03);
        padding: 24px 28px 28px;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-panel {
        background: var(--surface, #141a26);
        border: 1px solid var(--border);
      }
      #screen-crisis-obs .dg-panel-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #screen-crisis-obs .dg-panel-hdr .dg-lead {
        font-size: 21px;
        line-height: 1;
        color: var(--accent);
      }
      #screen-crisis-obs .dg-panel--warn .dg-lead {
        color: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-panel--ok .dg-lead {
        color: var(--down, #0c9b70);
      }
      #screen-crisis-obs .dg-panel-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      #screen-crisis-obs .dg-panel-sub {
        font-size: 12.5px;
        color: var(--text2);
        margin: 4px 0 16px 31px;
      }
      /* 3 columns is the base because above 1580px .dg-panels splits into two
         side-by-side panels (CPI.html:1337-1341) — each panel only gets half
         the viewport, so 5 columns there would squeeze cards to ~110px. Once
         .dg-panels stacks to full width at ≤1580px there's room for 5 in a
         row (CPI.html's own bump, ported as-is), then it steps back down as
         that single stacked panel narrows further. */
      #screen-crisis-obs .dg-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        min-width: 0;
      }
      @media (max-width: 1580px) {
        #screen-crisis-obs .dg-cards {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        #screen-crisis-obs .dg-cards {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 760px) {
        #screen-crisis-obs .dg-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 460px) {
        #screen-crisis-obs .dg-cards {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      #screen-crisis-obs .dg-panel--warn {
        --dg-card-tone: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-panel--ok {
        --dg-card-tone: var(--down, #0c9b70);
      }
      #screen-crisis-obs .dg-card {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
        border-radius: 16px;
        padding: 11px;
        background: linear-gradient(150deg, #fff 0%, #fff 66%, #f8fafc 100%);
        box-shadow: 0 5px 15px rgba(25, 48, 75, 0.03), inset 0 1px #fff;
        transform-style: preserve-3d;
        cursor: default;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-card {
        background: linear-gradient(150deg, var(--surface, #141a26) 0%, var(--surface, #141a26) 66%, rgba(255, 255, 255, 0.02) 100%);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.18), inset 0 1px rgba(255, 255, 255, 0.04);
      }
      #screen-crisis-obs .dg-card::before {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        right: -48px;
        top: -50px;
        background: var(--dg-card-tone);
        opacity: 0.055;
        transition: transform 0.25s ease, opacity 0.25s ease;
        pointer-events: none;
      }
      #screen-crisis-obs .obs-card.dg-card:hover {
        transform: translateY(-4px) rotateX(1deg);
        border-color: #c7d2e1;
        box-shadow: 0 18px 34px rgba(32, 56, 84, 0.09);
      }
      #screen-crisis-obs .obs-card.dg-card:hover::before {
        transform: scale(1.35);
        opacity: 0.09;
      }
      html[data-theme="dark"] #screen-crisis-obs .obs-card.dg-card:hover {
        border-color: var(--border);
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      }
      @keyframes dg-card-reveal {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs .dg-card {
          animation: none !important;
        }
      }
      #screen-crisis-obs .dg-cardhead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      #screen-crisis-obs .dg-card-ic {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 15px;
        color: #405775;
        background: linear-gradient(145deg, #f8fafc, #edf2f7);
        box-shadow: inset 0 0 0 1px #e8edf3;
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-card-ic {
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--text-secondary);
      }
      #screen-crisis-obs .dg-card-id-text {
        min-width: 0;
      }
      #screen-crisis-obs .dg-card-name {
        font-size: 11.2px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #screen-crisis-obs .dg-card-tag {
        font-size: 8.5px;
        color: var(--text2);
        margin-top: 1px;
      }
      #screen-crisis-obs .dg-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px 9px;
        margin: 9px -1px 0;
        padding: 9px 9px 7px;
        border-radius: 10px;
        background: rgba(248, 250, 252, 0.67);
      }
      html[data-theme="dark"] #screen-crisis-obs .dg-stats {
        background: rgba(255, 255, 255, 0.04);
      }
      #screen-crisis-obs .dg-stat-k {
        display: block;
        font-size: 7.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8996a9;
        margin-bottom: 0;
      }
      #screen-crisis-obs .dg-stat-v {
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
      }
      #screen-crisis-obs .dg-stat-v.up {
        color: var(--up, #e5484d);
      }
      #screen-crisis-obs .dg-stat-v.down {
        color: var(--down, #0c9b70);
      }
      #screen-crisis-obs .dg-card-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-top: 7px;
        padding-top: 2px;
      }

      /* ── Responsive ── */
      @media (max-width: 1300px) {
        #screen-crisis-obs .bm-main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      @media (max-width: 1150px) {
        #screen-crisis-obs .driver-grid,
        #screen-crisis-obs .events-grid,
        #screen-crisis-obs .mover-grid,
        #screen-crisis-obs .composite-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 768px) {
        #screen-crisis-obs .cpi-page-header-inner {
          flex-direction: column;
        }
      }
      @media (max-width: 720px) {
        #screen-crisis-obs .driver-grid,
        #screen-crisis-obs .events-grid,
        #screen-crisis-obs .mover-grid,
        #screen-crisis-obs .composite-grid {
          grid-template-columns: 1fr;
        }
        #screen-crisis-obs .impacts-list.cols-2 {
          column-count: 1;
        }
      }
      /* CPI's rule covers animation only and misses transitions entirely; this
         also disables the dot rail's smooth scroll, which is JS-driven. */
      @media (prefers-reduced-motion: reduce) {
        #screen-crisis-obs *,
        #screen-crisis-obs *::before,
        #screen-crisis-obs *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ==================== SCREEN: CRISIS INTELLIGENCE OBSERVATORY (standalone) ==================== -->
    <div id="screen-crisis-obs" class="screen ws-screen active">
      <div data-bayaan-header></div>
      <div class="crisis-scroll">
        <div class="container">
          <div class="ind-page-breadcrumb">

              href="#"
              onclick="
                goTo('screen-home');
                return false;

            <a
              href="#"
              onclick="
                openObservatories(event);
                return false;
              "
              >Observatory</a
            >
            <span class="ind-bc-sep"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>

              <button
                type="button"
                class="sidebar-item sidebar-item--ai"
                onclick="openObsSidebarAI(this, 'cio-ai', 'CIO AI', 'ti-sparkles')"

              <button type="button" class="sidebar-item active" onclick="activateSidebar(this)">

              </button>
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">

              </button>
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">

                <span class="sidebar-label">Observe</span>
              </button>
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">
                <div class="sidebar-icon"><i class="ti ti-bulb"></i></div>
                <span class="sidebar-label">Interpret</span>
              </button>
              <button type="button" class="sidebar-item" onclick="activateSidebar(this)">
                <div class="sidebar-icon"><i class="ti ti-chart-bar"></i></div>
                <span class="sidebar-label">Benchmark</span>
              </button>
            </aside>
          </div>
          <div class="obs-ai-split">
            <main class="main">
              <div class="cpi-page-header">
                <div class="cpi-page-header-inner">

                    <h1 class="topic-title" id="cioTitle">Crisis Intelligence — Overview</h1>
                    <p class="topic-title-sub" id="cioSubtitle">Abu Dhabi · 96 monitored indicators</p>
                  </div>
                  <div class="cpi-hdr-actions">
                    <div class="prod-filter-dd" id="ciObsDomainDd" hidden>
                      <button type="button" class="prod-filter-dd-trigger" id="ciObsDomainTrigger"><i class="ti ti-category prod-filter-dd-lead"></i><span class="dd-label" id="ciObsDomainLabel">Domain</span><i class="ti ti-chevron-down"></i></button>
                      <div class="prod-filter-dd-menu" id="ciObsDomainMenu" hidden></div>
                    </div>
                    <button type="button" class="cpi-hdr-download">
                      <i class="ti ti-download" aria-hidden="true"></i> Download

                  </div>
                </div>
              </div>

              <div id="ci-overview" class="cio-pane"></div>
              <div id="ci-diagnose" class="cio-pane" hidden></div>
              <div id="ci-observe" class="cio-pane" hidden></div>
              <div id="ci-interpret" class="cio-pane" hidden></div>

      <div class="home-module-rail cio-dots-rail" hidden>
        <nav id="cioDots" class="home-module-dots" aria-label="Sections" hidden></nav>

    <script>
      /* ============================================================
         Standalone stubs — this page is isolated and does NOT link
         back into the main application beyond real navigation. The
         shared top navigation is kept for visual parity; cross-screen
         actions js/header.js emits inline onclicks for are no-ops here,
         same contract as CPI.html / benchmark.html / observe.html.
         ============================================================ */
      function goTo() {}
      function openGeoView(e) { if (e) e.preventDefault(); }
      function openBayaanSpace(e) { if (e) e.preventDefault(); }
      function openProducts(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openObservatories(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openWsDrp() {}
      function onHeaderSearchClick() {}
      function openObsSidebarAI(el) { activateSidebar(el); }
      function toast() {}

      /* ============================================================
         VIEW ROUTER
         ============================================================ */
      const CI_VIEWS = {
        overview:  { pane: "ci-overview",  init: () => initCiOverview(),  title: "Crisis Intelligence — Overview",  sub: "Abu Dhabi · 96 monitored indicators",
          sections: [["exec-brief", "Executive Brief"], ["ov-summary", "Overview"], ["ov-composites", "Composite Indicators"], ["ov-drivers", "Economic Drivers"]] },
        diagnose:  { pane: "ci-diagnose",  init: () => initCiDiagnose(),  title: "Crisis Intelligence — Diagnose",  sub: "Severity breakdown and full indicator analytics",
          sections: [["ov-severity", "Severity Overview"], ["ov-analytics", "Indicator Analytics"]] },
        observe:   { pane: "ci-observe",   init: () => initCiObserve(),   title: "Crisis Intelligence — Observe",   sub: "Signal-level detail across four monitored domains",
          sections: [["ob-summary", "Signal Health"], ["ob-indicators", "Indicators"]] },
        interpret: { pane: "ci-interpret", init: () => initCiInterpret(), title: "Crisis Intelligence — Interpret", sub: "What moved, why it matters, and where it may lead",
          sections: [["it-movers", "Top Movement"], ["it-situation", "Situation Overview"], ["it-impacts", "Impacts"], ["it-geo", "Mobility Tracker"]] },
        benchmark: { pane: "ci-benchmark", init: () => initCiBenchmark(), title: "Crisis Intelligence — Benchmark", sub: "Abu Dhabi against GCC and global peers",
          sections: [] },
      };

      /* Scroll-spy dot rail — the shared component CPI uses. Mounted against
         the visible pane only: a hidden pane measures as zero-height and would
         pin the spy to its first section forever. Re-mounted on every switch;
         Benchmark has no sections, so mountSectionDots' own `< 2` guard hides
         the rail for free. */
      let cioDotsApi = null;
      function mountCioDots(view) {
        const rail = document.querySelector(".cio-dots-rail");
        const pane = document.getElementById(view.pane);
        if (cioDotsApi) { cioDotsApi.destroy(); cioDotsApi = null; }
        const sections = (view.sections || [])
          .map(([id, label]) => ({ id, label, el: pane && pane.querySelector("#" + id) }))
          .filter((s) => s.el);
        if (rail) rail.hidden = sections.length < 2;
        if (sections.length < 2 || !window.BayaanSectionScrollSpy) return;
        cioDotsApi = window.BayaanSectionScrollSpy.mountSectionDots({
          navId: "cioDots",
          root: document.querySelector("#screen-crisis-obs .crisis-scroll"),
          sections,
          scrollFnName: "scrollToCioSection",
        });
        requestAnimationFrame(() => cioDotsApi && cioDotsApi.sync());
      }

      function activateSidebar(el) {
        const sidebar = el.closest(".sidebar");
        (sidebar || document).querySelectorAll(".sidebar-item").forEach((s) => s.classList.remove("active"));
        el.classList.add("active");
        if (el.classList.contains("sidebar-item--ai")) return; // AI trigger doesn't switch panes

        const key = (el.textContent || "").trim().toLowerCase();
        const view = CI_VIEWS[key];
        if (!view) return;

        Object.values(CI_VIEWS).forEach((v) => {
          const node = document.getElementById(v.pane);
          if (node) node.hidden = v !== view;
        });
        document.getElementById("cioTitle").textContent = view.title;
        document.getElementById("cioSubtitle").textContent = view.sub;
        const obsDomainDd = document.getElementById("ciObsDomainDd");
        if (obsDomainDd) obsDomainDd.hidden = key !== "observe";
        view.init();

        if (key === "benchmark" && ciBmChart) {
          requestAnimationFrame(() => ciBmChart.resize());
        }
        const scroller = document.querySelector("#screen-crisis-obs .crisis-scroll");
        if (scroller) scroller.scrollTop = 0;
        mountCioDots(view);
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      /* ============================================================
         SHARED BUILDERS
         ============================================================ */

      /* Domain tag + severity chip vocabulary, shared by every view. */
      const CI_DOMAIN_TAG = {
        Economy: "tag-economic", Environment: "tag-environment",
        Financial: "tag-financial", Social: "tag-social",
      };
      const CI_DOMAIN_ICON = {
        Economy: "ti-trending-up", Environment: "ti-leaf",
        Financial: "ti-currency-dollar", Social: "ti-users",
      };
      const CI_SEV_META = {
        critical: { chipClass: "risk-critical", rowClass: "row-critical", dot: "dot-critical", label: "Critical" },
        warning:  { chipClass: "risk-moderate", rowClass: "row-moderate", dot: "dot-moderate", label: "Warning" },
        watch:    { chipClass: "risk-watch",    rowClass: "row-watch",    dot: "dot-watch",    label: "Watch" },
        stable:   { chipClass: "risk-stable",   rowClass: "row-stable",   dot: "dot-stable",   label: "Stable" },
      };
      /* Section header — the home-page module title treatment (bold black
         title + accent icon), ported from CPI.html's buildObsSectionHdr. */
      function buildObsSectionHdr(title, icon, action) {
        const actionHtml = action
          ? `<span class="obs-section-action">${action} <i class="ti ti-arrow-right"></i></span>`
          : "";
        return `<div class="section-hdr">
  <h2 class="cpi-section-title"><i class="ti ${icon || "ti-circle"}" aria-hidden="true"></i>${title}</h2>
  ${actionHtml}
</div>`;
      }

      function domainTag(domain) {
        return `<span class="ind-domain-tag ${CI_DOMAIN_TAG[domain] || "tag-economic"}">${esc(domain)}</span>`;
      }
      function riskChip(sev) {
        const m = CI_SEV_META[sev] || CI_SEV_META.stable;
        /* Casing is CSS's job (.risk-chip is text-transform: uppercase), so the
           accessible name stays "Critical" rather than "CRITICAL". */
        return `<span class="risk-chip ${m.chipClass}">${m.label}</span>`;
      }
      function changeSpan(delta, dir, cls) {
        const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "•";
        return `<span class="${cls || "ind-change"} ${dir}">${arrow} ${esc(delta)}</span>`;
      }

      /* Sparkline — Catmull-Rom smoothed area+line SVG, ported from CPI.html's
         buildObsSparkline/obsSmoothPath (same 84x30 box, same gradient-per-
         instance trick), scoped to this page's own #screen-crisis-obs CSS. */
      const CIO_SPARK_COLOR = {
        "sp-up": "#e5484d", "sp-down": "#0c9b70", "sp-neutral": "#246bfd", "sp-flat": "#8b93a7",
      };
      let cioSparkId = 0;
      function buildSparkline(points, cls) {
        const color = CIO_SPARK_COLOR[cls] || CIO_SPARK_COLOR["sp-flat"];
        const pts = points.trim().split(/\s+/).map((pair) => {
          const [x, y] = pair.split(",").map(Number);
          return [1 + (x / 100) * 82, (y / 32) * 27];
        });
        if (!pts.length) return "";
        const fmt = (n) => Math.round(n * 100) / 100;
        let line = `M${fmt(pts[0][0])} ${fmt(pts[0][1])}`;
        if (pts.length < 3) {
          line = `M${pts.map(([x, y]) => `${fmt(x)} ${fmt(y)}`).join(" L")}`;
        } else {
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
            const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
            const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
            line += ` C${fmt(c1x)} ${fmt(c1y)}, ${fmt(c2x)} ${fmt(c2y)}, ${fmt(p2[0])} ${fmt(p2[1])}`;
          }
        }
        const first = pts[0], last = pts[pts.length - 1];
        const area = `${line} L${fmt(last[0])} 27 L${fmt(first[0])} 27 Z`;
        const gid = "cioSparkGrad" + cioSparkId++;
        return `<svg viewBox="0 0 84 30" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
    <stop offset="1" stop-color="${color}" stop-opacity="0.02"/>
  </linearGradient></defs>
  <path class="obs-spark-area" fill="url(#${gid})" d="${area}"/>
  <path class="obs-spark-line" stroke="${color}" vector-effect="non-scaling-stroke" d="${line}"/>
</svg>`;
      }
      function buildAxis(labels) {
        return `<div class="obs-axis" aria-hidden="true">${labels.map((l) => `<span>${esc(l)}</span>`).join("")}</div>`;
      }

      /* Gauge — semicircle arc (green→amber→red), needle position and fill
         computed from a 0-100 percent, so every gauge on the page (Overview
         composites, Interpret mobility) shares one generator instead of the
         hand-authored per-card geometry the old in-page screen used. */
      let cioGaugeId = 0;
      function buildGauge(pct, size) {
        pct = Math.max(0, Math.min(100, pct));
        const id = "cioGaugeGrad" + cioGaugeId++;
        const arcLen = 131.9;
        const dashoffset = arcLen * (1 - pct / 100);
        const theta = (Math.PI * (180 - 1.8 * pct)) / 180;
        const needleLen = 27;
        const nx = 50 + needleLen * Math.cos(theta);
        const ny = 50 - needleLen * Math.sin(theta);
        const w = size || 100;
        return `<svg viewBox="0 0 100 56" style="width:${w}px" xmlns="http://www.w3.org/2000/svg">
  <path d="M8,50 A42,42 0 0,1 92,50" fill="none" stroke="var(--border,#e5e7eb)" stroke-width="8" stroke-linecap="round"/>
  <path d="M8,50 A42,42 0 0,1 92,50" fill="none" stroke="url(#${id})" stroke-width="8" stroke-linecap="round" stroke-dasharray="132 132" stroke-dashoffset="${dashoffset.toFixed(2)}"/>
  <defs><linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#16a34a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#dc2626"/>
  </linearGradient></defs>
  <line x1="50" y1="50" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="var(--text2,#374151)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="4" fill="var(--text2,#374151)"/>
</svg>`;
      }

      function statusBadge(status, label) {
        return `<div class="status-badge badge-${status}">${label}</div>`;
      }

      /* Pagination — real slicing (fixes the old crisis screen's non-functional
         goPage/changePage, which only toggled a CSS class). */
      function buildPagination(page, pageSize, total, onClickPrefix) {
        const pages = Math.max(1, Math.ceil(total / pageSize));
        const from = total === 0 ? 0 : (page - 1) * pageSize + 1;
        const to = Math.min(total, page * pageSize);
        let nums = [];
        const add = (n) => nums.push(n);
        if (pages <= 7) {
          for (let i = 1; i <= pages; i++) add(i);
        } else {
          add(1);
          if (page > 3) add("…");
          for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) add(i);
          if (page < pages - 2) add("…");
          add(pages);
        }
        const btns = nums.map((n) =>
          n === "…"
            ? `<span class="pag-btn" style="border:none;cursor:default;background:none">…</span>`
            : `<button class="pag-btn${n === page ? " active" : ""}" onclick="${onClickPrefix}(${n})">${n}</button>`
        ).join("");
        return `<div class="pagination">
  <div class="pag-info">Showing ${from}-${to} of ${total}</div>
  <div class="pag-btns">
    <button class="pag-btn nav" ${page <= 1 ? "disabled" : ""} onclick="${onClickPrefix}(${page - 1})"><i class="ti ti-chevron-left"></i> Previous</button>
    ${btns}
    <button class="pag-btn nav" ${page >= pages ? "disabled" : ""} onclick="${onClickPrefix}(${page + 1})">Next <i class="ti ti-chevron-right"></i></button>
  </div>
</div>`;
      }

      /* Generic filter dropdown (single- or multi-select), modelled on
         benchmark.html's toggleBmFilterDropdown/initBmFilters, generalised
         so every dropdown on this page (Domain, Severity, Sub-categories,
         Region, Metric, Year) shares one implementation. */
      const CIO_DD = {};
      function registerDd(key, opts) { CIO_DD[key] = opts; }
      function closeAllDd(except) {
        Object.keys(CIO_DD).forEach((k) => { if (k !== except) toggleDd(k, false); });
      }
      function toggleDd(key, force) {
        const cfg = CIO_DD[key]; if (!cfg) return;
        const menu = document.getElementById(cfg.menuId);
        const trigger = document.getElementById(cfg.triggerId);
        if (!menu || !trigger) return;
        const open = typeof force === "boolean" ? force : menu.hidden;
        if (open) closeAllDd(key);
        menu.hidden = !open;
        trigger.classList.toggle("is-open", open);
        trigger.setAttribute("aria-expanded", open ? "true" : "false");
      }
      document.addEventListener("click", (e) => {
        if (e.target.closest(".prod-filter-dd")) return;
        closeAllDd(null);
      });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAllDd(null); });

      function updateMultiLabel(cfg) {
        const label = document.getElementById(cfg.labelId);
        if (!label) return;
        if (cfg.fixedLabel) { label.textContent = cfg.fixedLabel; return; }
        const n = cfg.selected.length;
        if (n === 0) label.textContent = "None";
        else if (n === 1) label.textContent = cfg.selected[0];
        else label.textContent = `${cfg.selected[0]} +${n - 1}`;
      }

      function renderMultiDd(cfg) {
        const menu = document.getElementById(cfg.menuId);
        if (!menu) return;
        const allActive = cfg.selected.length === cfg.options.length;
        /* checkmark variant reuses initSingleDd's own row shape (label, then a
           trailing .ti-check that .prod-filter-dd-option.is-active already
           fades in) instead of a leading checkbox square, so Sub-categories
           and Severity read like every other dropdown on this page. */
        const checkmark = cfg.checkStyle === "checkmark";
        const rows = [checkmark
          ? `<button type="button" class="prod-filter-dd-option${allActive ? " is-active" : ""}" data-all="1">All <i class="ti ti-check"></i></button>`
          : `<button type="button" class="prod-filter-dd-option dd-all${allActive ? " is-active" : ""}" data-all="1">
  <span class="dd-check">${allActive ? '<i class="ti ti-check" style="font-size:10px"></i>' : ""}</span> Select All
</button>`].concat(
          cfg.options.map((opt) => {
            /* In the checkmark variant, "All" is its own exclusive state: when
               every option is selected, only the "All" row lights up rather
               than every row lighting up alongside it. */
            const active = checkmark ? (!allActive && cfg.selected.includes(opt)) : cfg.selected.includes(opt);
            return checkmark
              ? `<button type="button" class="prod-filter-dd-option${active ? " is-active" : ""}" data-opt="${esc(opt)}">${esc(opt)} <i class="ti ti-check"></i></button>`
              : `<button type="button" class="prod-filter-dd-option${active ? " is-active" : ""}" data-opt="${esc(opt)}">
  <span class="dd-check">${active ? '<i class="ti ti-check" style="font-size:10px"></i>' : ""}</span> ${esc(opt)}
</button>`;
          })
        );
        menu.innerHTML = rows.join("");
        menu.querySelectorAll("[data-opt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const opt = btn.dataset.opt;
            const i = cfg.selected.indexOf(opt);
            if (i >= 0) cfg.selected.splice(i, 1); else cfg.selected.push(opt);
            renderMultiDd(cfg);
            updateMultiLabel(cfg);
            cfg.onChange && cfg.onChange();
          });
        });
        const allBtn = menu.querySelector("[data-all]");
        if (allBtn) {
          allBtn.addEventListener("click", () => {
            cfg.selected = allActive ? [] : cfg.options.slice();
            renderMultiDd(cfg);
            updateMultiLabel(cfg);
            cfg.onChange && cfg.onChange();
          });
        }
      }

      function initMultiDd(key, triggerId, menuId, labelId, options, selected, fixedLabel, onChange, checkStyle) {
        const cfg = { triggerId, menuId, labelId, options, selected: selected.slice(), fixedLabel, onChange, checkStyle };
        registerDd(key, { triggerId, menuId });
        renderMultiDd(cfg);
        updateMultiLabel(cfg);
        const trigger = document.getElementById(triggerId);
        if (trigger) trigger.onclick = () => toggleDd(key);
        return cfg;
      }

      function initSingleDd(key, triggerId, menuId, labelId, options, current, onChange) {
        registerDd(key, { triggerId, menuId });
        const menu = document.getElementById(menuId);
        const label = document.getElementById(labelId);
        menu.innerHTML = options.map((opt) =>
          `<button type="button" class="prod-filter-dd-option${opt === current ? " is-active" : ""}" data-opt="${esc(opt)}">${esc(opt)} <i class="ti ti-check"></i></button>`
        ).join("");
        label.textContent = current;
        menu.querySelectorAll("[data-opt]").forEach((btn) => {
          btn.addEventListener("click", () => {
            menu.querySelectorAll(".prod-filter-dd-option").forEach((o) => o.classList.remove("is-active"));
            btn.classList.add("is-active");
            label.textContent = btn.dataset.opt;
            toggleDd(key, false);
            onChange && onChange(btn.dataset.opt);
          });
        });
        const trigger = document.getElementById(triggerId);
        if (trigger) trigger.onclick = () => toggleDd(key);
      }

      function numOf(s) {
        const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ""));

      function ciSortTable(key) {
        if (CI_TABLE_STATE.sortKey === key) {

            let av = a[sortKey], bv = b[sortKey];

            else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
            if (av < bv) return sortDir === "asc" ? -1 : 1;
            if (av > bv) return sortDir === "asc" ? 1 : -1;
            return 0;
          });
        }
        const pages = Math.max(1, Math.ceil(rows.length / CI_TABLE_STATE.pageSize));
