<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favourites · Bayaan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/pages/exec-home.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/pages/home-widgets.css" />
<link rel="stylesheet" href="css/components/bayaan-footer.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/pages/favourites.css" />
<script>
  (function () {
    var t = localStorage.getItem("bayaan-theme") || "light";
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<script src="js/theme.js"></script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>
</head>
<body>
<div class="ws-screen header-flush screen-home" id="favouritesPage">
  <div data-bayaan-header></div>
  <section class="fav-hero">
    <h1>Favourites</h1>
    <p class="fav-hero-sub">Your saved indicators, dashboards, and observatories — all in one place for quick access.</p>
  </section>

  <div class="container fav-page-container">
    <div class="home-favourites-module">
      <div class="prod-browse-section">
        <div class="prod-browse-row">
          <div class="prod-browse-toggles" id="favTabs" role="tablist" aria-label="Favourites type">
            <button type="button" class="prod-browse-toggle active" role="tab" data-fav-tab="indicators" tabindex="0">
              <div class="prod-browse-toggle-icon"><i class="ti ti-chart-line"></i></div>
              <div class="prod-browse-toggle-body">
                <span class="prod-browse-toggle-title">Indicators</span>
              </div>
              <span class="prod-browse-toggle-count" id="favCountIndicators">0</span>
            </button>
            <button type="button" class="prod-browse-toggle" role="tab" data-fav-tab="dashboards" tabindex="0">
              <div class="prod-browse-toggle-icon"><i class="ti ti-layout-dashboard"></i></div>
              <div class="prod-browse-toggle-body">
                <span class="prod-browse-toggle-title">Dashboards</span>
              </div>
              <span class="prod-browse-toggle-count" id="favCountDashboards">0</span>
            </button>
            <button type="button" class="prod-browse-toggle" role="tab" data-fav-tab="observatory" tabindex="0">
              <div class="prod-browse-toggle-icon"><i class="ti ti-telescope"></i></div>
              <div class="prod-browse-toggle-body">
                <span class="prod-browse-toggle-title">Observatories</span>
              </div>
              <span class="prod-browse-toggle-count" id="favCountObservatory">0</span>
            </button>
            <button type="button" class="prod-browse-toggle" role="tab" data-fav-tab="frequent" tabindex="0">
              <div class="prod-browse-toggle-icon"><i class="ti ti-clock"></i></div>
              <div class="prod-browse-toggle-body">
                <span class="prod-browse-toggle-title">Frequently accessed</span>
              </div>
              <span class="prod-browse-toggle-count" id="favCountFrequent">0</span>
            </button>
          </div>
          <div class="prod-browse-tools">
            <div class="obs-search-wrap page-list-search">
              <input id="favSearchInput" type="text" class="obs-search-input" placeholder="Search favourites" aria-label="Search favourites" autocomplete="off" oninput="FavPage.search(this.value)">
              <button type="button" class="obs-search-btn" title="Search"><i class="ti ti-search"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="home-favourites-panel" id="favPanel" aria-live="polite"></div>
    </div>
  </div>

  <div data-bayaan-footer></div>
</div>
<div id="toast-container"></div>
<script src="js/favourites-page.js"></script>
</body>
</html>
