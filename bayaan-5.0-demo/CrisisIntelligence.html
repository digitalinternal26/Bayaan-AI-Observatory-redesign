        const count = CI_DETAIL_RANGE_COUNTS[rangeKey] || 8;
        const series = (d.series || []).slice(-count);
        const dates = sparkDates(d.freq, d.updated, series.length);
        const labels = dates ? dates.map(fmtSparkDate) : series.map((_, i) => String(i + 1));
        /* Full date for the tooltip title only — fmtSparkDate's short "29
           Aug" is what stays on the axis (labels above), matching the
           reference's rotated "Aug. 29, 2026" in substance, not literally. */
        const fmtFullDate = (dt) => `${dt.getDate()} ${dt.toLocaleString("en-US", { month: "long" })} ${dt.getFullYear()}`;

        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        const grid = dark ? "rgba(148,163,184,.14)" : "rgba(148,163,184,.22)";
        const tick = bmToken("--muted", "#94a3b8");
        const color = CIO_SPARK_COLOR[sevSparkCls(d.severity)];

        ciDetailChart = new Chart(canvas.getContext("2d"), {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: d.name,
              data: series,
              borderColor: color,
              backgroundColor: color + "22",
              fill: true,
              borderWidth: 2.5,
              pointRadius: 0,
              pointHoverRadius: 4,
              pointBackgroundColor: color,
              tension: 0.35,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(15,23,42,.92)", titleColor: "#fff", bodyColor: "#cbd5e1",
                borderColor: "rgba(255,255,255,.1)", borderWidth: 1, padding: 10,
                displayColors: false,
                callbacks: {
                  title: (items) => dates && items.length ? fmtFullDate(dates[items[0].dataIndex]) : undefined,
                  label: (c) => `${d.name}: ${c.parsed.y}`,
                },
              },
            },
            scales: {
              x: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font: { size: 10.5 }, maxRotation: 0, autoSkip: true, autoSkipPadding: 12 } },
              y: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font: { size: 11 } },
                   title: { display: true, text: d.unit || "", color: tick, font: { size: 10 } } },
            },
          },
        });
      }

      function ciSetDetailRange(range, btn) {
        ciDetailRange = range;
        document.querySelectorAll("#ciDetailRangeSeg .bm-seg-btn").forEach((b) => b.classList.remove("is-active"));
        if (btn) btn.classList.add("is-active");
        if (ciDetailMover) renderCiDetailChart(ciDetailMover, range);
      }

      /* Breadcrumb tail toggle — swaps the shell's static "Crisis
         Intelligence" for "<Origin> › [Domain ›] <Indicator>", matching
         the reference (id is "ciBcInterpret" from when this only opened
         from Interpret; it now carries whichever origin label applies).
         Restored verbatim on close. */
      function ciDetailBreadcrumbShow(d, origin) {
        if (!window.BayaanBreadcrumb) return;
        BayaanBreadcrumb.setContext({
          view: origin.label,
          viewRoot: `CrisisIntelligence.html#${origin.view}`,
          detail: origin.showDomain ? [d.domain, d.name] : d.name,
        });
      }
      function ciDetailBreadcrumbHide() {
        if (window.BayaanBreadcrumb) BayaanBreadcrumb.clearContext();
      }

      function openCiDetail(name, originKey) {
        const d = ciFindMover(name);
        if (!d) return;
        const origin = CI_DETAIL_ORIGINS[originKey] || CI_DETAIL_ORIGINS.interpret;
        ciDetailMover = d;
        ciDetailOrigin = origin;
        ciDetailRange = "recent";

        Object.values(CI_VIEWS).forEach((v) => {
          const node = document.getElementById(v.pane);
          if (node) node.hidden = true;
        });
        const detailPane = document.getElementById("ci-detail");
        if (detailPane) detailPane.hidden = false;
        renderCiDetail(d, origin);

        /* Severity now sits as an eyebrow tag above the title, and "Last
           updated" as subtext below it — not inline beside the title / off
           in the header's action row, per the reference. */
        document.getElementById("cioTitle").textContent = d.name;
        document.getElementById("cioSubtitle").textContent = d.updated;
        const tagRow = document.getElementById("ciDetailTagRow");
        if (tagRow) { tagRow.hidden = false; tagRow.innerHTML = riskChip(d.severity); }
        const obsDomainDd = document.getElementById("ciObsDomainDd");
        if (obsDomainDd) obsDomainDd.hidden = true;
        const sevDd = document.getElementById("ciDriversSevDd");
        if (sevDd) sevDd.hidden = true;
        const backBtn = document.getElementById("ciBcBack");
        if (backBtn) backBtn.hidden = false;

        ciDetailBreadcrumbShow(d, origin);

        const rail = document.querySelector(".cio-dots-rail");
        if (rail) rail.hidden = true;
        if (cioDotsApi) { cioDotsApi.destroy(); cioDotsApi = null; }

        const scroller = document.querySelector("#screen-crisis-obs .crisis-scroll");
        if (scroller) scroller.scrollTop = 0;
      }

      function closeCiDetail(e) {
        if (e) e.preventDefault();
        if (ciDetailChart) { ciDetailChart.destroy(); ciDetailChart = null; }
        ciDetailMover = null;
        const detailPane = document.getElementById("ci-detail");
        if (detailPane) detailPane.hidden = true;

        const view = CI_VIEWS[ciDetailOrigin.view] || CI_VIEWS.interpret;
        const node = document.getElementById(view.pane);
        if (node) node.hidden = false;
        document.getElementById("cioTitle").textContent = view.title;
        document.getElementById("cioSubtitle").textContent = view.sub;
        const tagRow = document.getElementById("ciDetailTagRow");
        if (tagRow) { tagRow.hidden = true; tagRow.innerHTML = ""; }
        const backBtn = document.getElementById("ciBcBack");
        if (backBtn) backBtn.hidden = true;
        /* Neither detail origin (interpret/overview) is the Observe view,
           so this filter dropdown is always hidden on close — same as it
           was hidden on open. */
        const obsDomainDd = document.getElementById("ciObsDomainDd");
        if (obsDomainDd) obsDomainDd.hidden = true;

        ciDetailBreadcrumbHide();
        ciDetailOrigin = CI_DETAIL_ORIGINS.interpret;

        const scroller = document.querySelector("#screen-crisis-obs .crisis-scroll");
        if (scroller) scroller.scrollTop = 0;
        mountCioDots(view);
      }

      /* ============================================================
         BENCHMARK
         ============================================================ */
      const CI_BM_METRICS = ["Exchange Rate Index", "Industrial Production Index", "Labor Force Participation rate", "Money Supply", "Producer Price Index", "Real GDP", "Unemployment rate"];
      const CI_BM_REGIONS = ["Americas", "Asia Pacific (APAC)", "Europe", "MENA"];
      const CI_BM_YEARS = ["Recent", "2026", "2025", "2024", "2023", "2022", "2021", "2020"];
      const CI_BM_STATE = { metric: "Exchange Rate Index", scope: "GCC", regions: CI_BM_REGIONS.slice(), years: CI_BM_YEARS.slice() };

      const CI_BM_LABELS = ["12 Aug", "13 Aug", "14 Aug", "15 Aug", "16 Aug", "17 Aug", "18 Aug", "19 Aug", "20 Aug", "21 Aug", "22 Aug", "23 Aug", "24 Aug", "25 Aug", "26 Aug", "27 Aug", "28 Aug"];
      function jitter(base, n, spread, drift) {
        const out = [];
        for (let i = 0; i < n; i++) out.push(+(base + (drift || 0) * (i / (n - 1)) + (Math.sin(i * 1.7 + base) * spread)).toFixed(2));
        return out;
      }
      const N = CI_BM_LABELS.length;
      const CI_BM_SERIES = [
        { label: "Abu Dhabi", region: "MENA", color: "#dc2626", you: true, data: jitter(100.0, N, 0.05, 0.01) },
        { label: "Egypt", region: "MENA", color: "#a3572c", data: jitter(93.4, N, 0.3, -0.6) },
        { label: "Jordan", region: "MENA", color: "#8b3d3d", data: jitter(92.6, N, 0.2, -0.1) },
        { label: "Saudi Arabia", region: "MENA", color: "#0891b2", data: jitter(105.5, N, 0.06, 0.0) },
        { label: "Brazil", region: "Americas", color: "#1e40af", data: jitter(85.6, N, 0.4, 0.2) },
        { label: "Canada", region: "Americas", color: "#ea580c", data: jitter(110.2, N, 0.25, -0.1) },
        { label: "Chile", region: "Americas", color: "#7c3aed", data: jitter(104.1, N, 0.3, 0.1) },
        { label: "Mexico", region: "Americas", color: "#64748b", data: jitter(94.9, N, 0.3, -0.2) },
        { label: "Australia", region: "Asia Pacific (APAC)", color: "#16a34a", data: jitter(118.9, N, 0.2, -0.15) },
        { label: "China", region: "Asia Pacific (APAC)", color: "#78350f", data: jitter(103.5, N, 0.1, 0.02) },
        { label: "Hong Kong", region: "Asia Pacific (APAC)", color: "#0d9488", data: jitter(100.4, N, 0.05, 0.0) },
        { label: "India", region: "Asia Pacific (APAC)", color: "#d8b4fe", data: jitter(128.2, N, 0.15, 0.1) },
        { label: "Indonesia", region: "Asia Pacific (APAC)", color: "#92400e", data: jitter(124.9, N, 0.2, -0.1) },
        { label: "Japan", region: "Asia Pacific (APAC)", color: "#f472b6", data: jitter(139.0, N, 0.3, -0.05) },
        { label: "Korea, Rep. (South Korea)", region: "Asia Pacific (APAC)", color: "#5dcaa5", data: jitter(86.9, N, 0.25, 0.08) },
        { label: "Singapore", region: "Asia Pacific (APAC)", color: "#6b7280", data: jitter(86.5, N, 0.1, 0.0) },
        { label: "Thailand", region: "Asia Pacific (APAC)", color: "#1f2937", data: jitter(88.1, N, 0.15, -0.05) },
        { label: "France", region: "Europe", color: "#a3e635", data: jitter(100.2, N, 0.08, 0.0) },
        { label: "Russian Federation", region: "Europe", color: "#facc15", data: jitter(111.8, N, 0.9, 0.4) },
        { label: "Sweden", region: "Europe", color: "#fca5a5", data: jitter(90.3, N, 0.2, -0.1) },
        { label: "Switzerland", region: "Europe", color: "#67e8f9", data: jitter(102.6, N, 0.08, 0.02) },
        { label: "Turkey", region: "Europe", color: "#374151", data: jitter(106.4, N, 0.15, 0.0) },
        { label: "United Kingdom", region: "Europe", color: "#22d3ee", data: jitter(100.9, N, 0.1, 0.0) },
      ];
      const CI_BM_Y_TITLE = "Exchange Rate Index (Domestic Currency per USD, Base = 100, 31 Dec 2021)";
      const CI_BM_INSIGHTS = [
        { icon: "ti-trophy", title: "Competitive Position", html: "Abu Dhabi's Exchange Rate Index stands at <b>100.01</b> as of August 2026, ranking 14th among 23 benchmarked peers. This position reflects a stable and moderate exchange-rate environment relative to both regional and global comparators within the current assessment period." },
        { icon: "ti-chart-line", title: "Growth Stability", html: "Over a five-year window, Abu Dhabi's Exchange Rate Index has averaged <b>100.006</b>, demonstrating remarkable consistency. The latest value of <b>100.01</b> closely aligns with this average, indicating sustained exchange-rate stability and minimal fluctuations throughout the observed period." },
        { icon: "ti-world", title: "Regional Comparison", html: "Abu Dhabi's Exchange Rate Index is marginally above the GCC average of <b>99.98</b>, with a difference of <b>0.03</b> percentage points. This slight positive gap highlights Abu Dhabi's alignment with regional monetary stability among Gulf Cooperation Council peers." },
        { icon: "ti-target", title: "Key Impacts", html: "Abu Dhabi's stable exchange-rate performance underpins monetary confidence and supports macroeconomic resilience. This consistency enhances competitiveness, facilitates regional integration, and provides a reliable foundation for diversification and liquidity management in a dynamic global economic environment." },
      ];

      let ciBmChart = null;
      function bmToken(name, fallback) {
        const el = document.getElementById("screen-crisis-obs");
        const v = el ? getComputedStyle(el).getPropertyValue(name).trim() : "";
        return v || fallback;
      }

      function ciBmVisibleSeries() {
        return CI_BM_SERIES.filter((s) => s.you || CI_BM_STATE.regions.includes(s.region));
      }

      function renderCiBmLegend() {
        const wrap = document.getElementById("ciBmLegend");
        if (!wrap) return;
        const series = ciBmVisibleSeries();
        wrap.innerHTML = series.map((s, i) => `<button type="button" class="bm-legend-item" data-idx="${i}" aria-pressed="true">
  <span class="bm-legend-dot" style="background:${s.color}"></span>${esc(s.label)}
</button>`).join("");
        wrap.querySelectorAll(".bm-legend-item").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (!ciBmChart) return;
            const i = Number(btn.dataset.idx);
            const hidden = ciBmChart.isDatasetVisible(i);
            ciBmChart.setDatasetVisibility(i, !hidden);
            ciBmChart.update();
            btn.classList.toggle("is-off", hidden);
          });
        });
      }

      function renderCiBenchmarkChart() {
        const canvas = document.getElementById("ciBmChart");
        if (!canvas || typeof Chart === "undefined") return;
        if (document.getElementById("ci-benchmark").hidden) return;
        if (ciBmChart) ciBmChart.destroy();

        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        const grid = dark ? "rgba(148,163,184,.14)" : "rgba(148,163,184,.22)";
        const tick = bmToken("--muted", "#94a3b8");
        const pointRing = dark ? "#141e32" : "#fff";
        const series = ciBmVisibleSeries();

        ciBmChart = new Chart(canvas.getContext("2d"), {
          type: "line",
          data: {
            labels: CI_BM_LABELS,
            datasets: series.map((s) => ({
              label: s.label,
              data: s.data,
              borderColor: s.color,
              backgroundColor: "transparent",
              fill: false,
              borderWidth: s.you ? 3 : 1.5,
              pointBackgroundColor: s.color,
              pointBorderColor: pointRing,
              pointBorderWidth: s.you ? 2 : 1,
              pointRadius: s.you ? 3 : 1.5,
              pointHoverRadius: s.you ? 5 : 3.5,
              tension: 0.35,
              order: s.you ? -1 : 0,
            })),
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(15,23,42,.92)", titleColor: "#fff", bodyColor: "#cbd5e1",
                borderColor: "rgba(255,255,255,.1)", borderWidth: 1, padding: 10,
                displayColors: true, boxWidth: 8, boxHeight: 8, usePointStyle: true,
                callbacks: { label: (c) => c.parsed.y == null ? null : `  ${c.dataset.label}: ${c.parsed.y.toFixed(2)}` },
              },
            },
            scales: {
              x: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font: { size: 10.5 }, maxRotation: 0, autoSkip: true, autoSkipPadding: 12 } },
              y: { grid: { color: grid }, border: { display: false }, ticks: { color: tick, font: { size: 11 } },
                   title: { display: true, text: CI_BM_Y_TITLE, color: tick, font: { size: 10 } } },
            },
          },
        });
        renderCiBmLegend();
      }

      function ciSetBmScope(scope, btn) {
        CI_BM_STATE.scope = scope;
        document.querySelectorAll("#ciBmScopeSeg .bm-seg-btn").forEach((b) => b.classList.remove("is-active"));
        btn.classList.add("is-active");
      }
      function initCiBenchmark() {
        const root = document.getElementById("ci-benchmark");
        if (!root || root.dataset.ready) return;
        root.dataset.ready = "1";

        root.innerHTML = `
<div class="bm-toolbar">
  <div class="bm-region-seg" id="ciBmScopeSeg">
    <button type="button" class="bm-seg-btn is-active" onclick="ciSetBmScope('GCC', this)"><i class="ti ti-users"></i> GCC</button>
    <button type="button" class="bm-seg-btn" onclick="ciSetBmScope('Global', this)"><i class="ti ti-world"></i> Global</button>
  </div>
  <div class="prod-filter-dd" id="ciMetricDd" style="margin-left:auto"><button type="button" class="prod-filter-dd-trigger" id="ciMetricTrigger"><i class="ti ti-trending-up prod-filter-dd-lead"></i><span class="dd-label" id="ciMetricLabel">Exchange Rate Index</span><i class="ti ti-chevron-down"></i></button><div class="prod-filter-dd-menu" id="ciMetricMenu" hidden></div></div>
  <div class="prod-filter-dd" id="ciYearDd"><button type="button" class="prod-filter-dd-trigger" id="ciYearTrigger"><i class="ti ti-calendar prod-filter-dd-lead"></i><span class="dd-label" id="ciYearLabel">2026 +6</span><i class="ti ti-chevron-down"></i></button><div class="prod-filter-dd-menu" id="ciYearMenu" hidden></div></div>
</div>

<div class="bm-main" id="ciBmMain">
  <div class="bm-col">
    <div class="bm-panel bm-chart-card" id="ciBmChartCard">
      <div class="bm-chart-toprow">
        <div>
          <div class="bm-chart-eyebrow">Abu Dhabi</div>
          <div class="bm-chart-val">100.01</div>
        </div>
        <div class="bm-chart-toprow-actions">
          <div class="prod-filter-dd" id="ciRegionDd"><button type="button" class="prod-filter-dd-trigger" id="ciRegionTrigger" style="min-width:150px"><span class="dd-label" id="ciRegionLabel">Americas +3</span><i class="ti ti-chevron-down"></i></button><div class="prod-filter-dd-menu" id="ciRegionMenu" hidden></div></div>
          <button type="button" class="bm-expand-btn" id="ciBmExpandToggle" aria-pressed="false" aria-label="Expand chart">
            <i class="ti ti-arrows-maximize"></i>
          </button>
        </div>
      </div>
      <div class="bm-chart-canvas"><canvas id="ciBmChart"></canvas></div>
      <div class="bm-legend" id="ciBmLegend"></div>
      <div class="cpi-notice" style="margin-top:16px">
        <i class="ti ti-alert-triangle"></i>
        <div class="cpi-notice-text">The benchmark data is subject to source availability and will be updated periodically to reflect any changes in the source data.</div>
      </div>
    </div>
  </div>
  <aside class="bm-side">
    <section class="bm-panel">
      <div class="bm-side-hd"><div class="bm-side-title"><i class="ti ti-bulb"></i> At a Glance</div><button type="button" class="bm-ask" title="Ask CIO AI" onclick="ciAskAi()"><i class="ti ti-sparkles"></i></button></div>
      ${CI_BM_INSIGHTS.map((p, i) => `${i > 0 ? `<div class="bm-divider"></div>` : ""}
      <div class="bm-point">
        <div class="bm-point-label">${esc(p.title)}</div>
        <p>${p.html}</p>
      </div>`).join("")}
    </section>
  </aside>
</div>`;

        initMultiDd("ciYear", "ciYearTrigger", "ciYearMenu", "ciYearLabel", CI_BM_YEARS, CI_BM_STATE.years, null, () => {}, "checkmark");
        initSingleDd("ciMetric", "ciMetricTrigger", "ciMetricMenu", "ciMetricLabel", CI_BM_METRICS, CI_BM_STATE.metric, (v) => { CI_BM_STATE.metric = v; });
        const ciRegionCfg = initMultiDd("ciRegion", "ciRegionTrigger", "ciRegionMenu", "ciRegionLabel", CI_BM_REGIONS, CI_BM_STATE.regions, null, () => {
          CI_BM_STATE.regions = ciRegionCfg.selected.slice();
          renderCiBenchmarkChart();
        }, "checkmark");

        renderCiBenchmarkChart();

        const bmExpandToggle = document.getElementById("ciBmExpandToggle");
        if (bmExpandToggle) bmExpandToggle.addEventListener("click", toggleBmChartExpand);
      }

      /* Benchmark chart expand — real fullscreen via the Fullscreen API;
         falls back to spanning the full grid width when Fullscreen is
         unsupported or blocked (e.g. a sandboxed iframe). Mirrors the CPI
         Performance-chart expand pattern (see #cd-perf-toggle in CPI.html). */
      function syncBmChartExpandState() {
        const bmToggle = document.getElementById("ciBmExpandToggle");
        if (!bmToggle) return;
        const bmCard = document.getElementById("ciBmChartCard");
        const expanded = !!(document.fullscreenElement || document.webkitFullscreenElement) || (bmCard && bmCard.classList.contains("bm-chart-expanded"));
        bmToggle.setAttribute("aria-pressed", String(expanded));
        bmToggle.setAttribute("aria-label", expanded ? "Collapse chart" : "Expand chart");
        const bmIcon = bmToggle.querySelector("i");
        if (bmIcon) {
          bmIcon.classList.toggle("ti-arrows-maximize", !expanded);
          bmIcon.classList.toggle("ti-arrows-minimize", expanded);
        }
        if (ciBmChart) requestAnimationFrame(() => ciBmChart.resize());
      }
      function bmChartExpandFallback() {
        const bmCard = document.getElementById("ciBmChartCard");
        if (bmCard) bmCard.classList.toggle("bm-chart-expanded");
        syncBmChartExpandState();
      }
      function toggleBmChartExpand() {
        const bmCard = document.getElementById("ciBmChartCard");
        if (!bmCard) return;
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        const request = bmCard.requestFullscreen || bmCard.webkitRequestFullscreen;
        if (!request) { bmChartExpandFallback(); return; }
        const result = request.call(bmCard);
        if (result && typeof result.catch === "function") result.catch(bmChartExpandFallback);
      }
      document.addEventListener("fullscreenchange", syncBmChartExpandState);
      document.addEventListener("webkitfullscreenchange", syncBmChartExpandState);

      window.addEventListener("bayaan-theme-change", () => {
        if (!document.getElementById("ci-benchmark").hidden) renderCiBenchmarkChart();
        if (ciDetailMover && !document.getElementById("ci-detail").hidden) renderCiDetailChart(ciDetailMover, ciDetailRange);
      });

      /* ============================================================
         BOOT
         ============================================================ */
      document.addEventListener("DOMContentLoaded", function () {
        if (window.BayaanHeader && typeof window.BayaanHeader.init === "function") {
          window.BayaanHeader.init();
          window.BayaanHeader.syncActive("screen-crisis-obs");
        }
        if (window.initBayaanFooter) initBayaanFooter();
        if (window.CensusGlobalFilter) CensusGlobalFilter.mount();
        initCiOverview();
        mountCioDots(CI_VIEWS.overview);
      });
    </script>
  </body>
</html>
