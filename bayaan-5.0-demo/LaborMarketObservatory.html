      /* ══════════════════════════════════════════════════════════════════
         LABOR SUPPLY–DEMAND ANALYSIS — one reusable renderer drives both the
         Age and Education datasets, and both the Sankey and Table views. No
         charting lib is loaded, so the Sankey is a hand-built SVG (same
         approach as the donut/sparklines) in the app's visual language. */
      const LSD_DATA = {
        age: {
          label: "Age group",
          supply: 3000000, emirati: 294800, nonEmirati: 2700000, demand: 2900000, gap: 112900,
          groups: [
            { name: "15–19", value: 22400 }, { name: "20–24", value: 260000 },
            { name: "25–29", value: 474700 }, { name: "30–34", value: 619600 },
            { name: "35–39", value: 558500 }, { name: "40–44", value: 441800 },
            { name: "45–49", value: 301700 }, { name: "50–54", value: 180800 },
            { name: "55–59", value: 104100 },
          ],
        },
        education: {
          label: "Education level",
          placeholder: true,
          supply: 3000000, emirati: 294800, nonEmirati: 2700000, demand: 2900000, gap: 112900,
          /* Illustrative attainment split — replace with the official SCAD
             education dataset when available (same structure, real values). */
          groups: [
            { name: "Below Secondary", value: 651000 }, { name: "Secondary", value: 861000 },
            { name: "Diploma", value: 474000 }, { name: "Bachelor", value: 772000 },
            { name: "Postgraduate", value: 205600 },
          ],
        },
      };
      function lsdForYear(base, year) {
        const f = 1 - (2025 - year) * 0.032; /* ~3.2% lower per year back */
        const s = (v) => Math.round(v * f);
        return {
          ...base,
          supply: s(base.supply), emirati: s(base.emirati), nonEmirati: s(base.nonEmirati),
          demand: s(base.demand), gap: s(base.gap),
          groups: base.groups.map((g) => ({ name: g.name, value: s(g.value) })),
        };
      }
      function lsdFmt(v) {
        const t = (n) => n.toFixed(1).replace(/\.0$/, "");
        if (Math.abs(v) >= 1e6) return t(v / 1e6) + "M";
        if (Math.abs(v) >= 1e3) return t(v / 1e3) + "K";
        return String(Math.round(v));
      }
      function lsdSankeySVG(d) {
        const W = 980, H = 440, nodeW = 13, mL = 78, mR = 84;
        const eShare = d.emirati / (d.emirati + d.nonEmirati);
        const dShare = d.demand / (d.demand + d.gap);
        const cols = [
          [{ id: "supply", name: "Labor Supply", value: d.supply, tone: "supply" }],
          [{ id: "emirati", name: "Emirati", value: d.emirati, tone: "emirati" },
           { id: "nonemirati", name: "Non-Emirati", value: d.nonEmirati, tone: "nonemirati" }],
          d.groups.map((g, i) => ({ id: "g" + i, name: g.name, value: g.value, tone: "group" })),
          [{ id: "demand", name: "Demand", value: d.demand, tone: "demand" },
           { id: "gap", name: "Gap", value: d.gap, tone: "gap" }],
        ];
        const chartW = W - mL - mR;
        const xs = [mL, Math.round(mL + chartW * 0.30), Math.round(mL + chartW * 0.60), mL + chartW - nodeW];
        const gaps = [0, 30, 7, 30];
        const totals = cols.map((c) => c.reduce((s, n) => s + n.value, 0));
        const scale = (H * 0.86) / Math.max(...totals);
        const N = {};
        cols.forEach((c, ci) => {
          const g = gaps[ci];
          const stackH = c.reduce((s, n) => s + Math.max(2, n.value * scale), 0) + (c.length - 1) * g;
          let y = (H - stackH) / 2;
          c.forEach((n) => { const h = Math.max(2, n.value * scale); N[n.id] = { ...n, x: xs[ci], y, h, outY: y, inY: y }; y += h + g; });
        });
        const links = [];
        links.push({ s: "supply", t: "emirati", v: d.emirati, tone: "emirati" });
        links.push({ s: "supply", t: "nonemirati", v: d.nonEmirati, tone: "nonemirati" });
        d.groups.forEach((g, i) => {
          links.push({ s: "emirati", t: "g" + i, v: g.value * eShare, tone: "emirati" });
          links.push({ s: "nonemirati", t: "g" + i, v: g.value * (1 - eShare), tone: "nonemirati" });
        });
        d.groups.forEach((g, i) => {
          links.push({ s: "g" + i, t: "demand", v: g.value * dShare, tone: "demand" });
          links.push({ s: "g" + i, t: "gap", v: g.value * (1 - dShare), tone: "gap" });
        });
        const linkSVG = links.map((l) => {
          const sn = N[l.s], tn = N[l.t], h = Math.max(0.6, l.v * scale);
          const y0 = sn.outY; sn.outY += h;
          const y1 = tn.inY; tn.inY += h;
          const x0 = sn.x + nodeW, x1 = tn.x, xm = (x0 + x1) / 2;
          const dp = `M${x0},${y0.toFixed(1)} C${xm},${y0.toFixed(1)} ${xm},${y1.toFixed(1)} ${x1},${y1.toFixed(1)} L${x1},${(y1 + h).toFixed(1)} C${xm},${(y1 + h).toFixed(1)} ${xm},${(y0 + h).toFixed(1)} ${x0},${(y0 + h).toFixed(1)} Z`;
          return `<path class="lsd-link lsd-link--${l.tone}" data-s="${l.s}" data-t="${l.t}" data-tip="${sn.name} → ${tn.name}&#10;${lsdFmt(l.v)}" d="${dp}"></path>`;
        }).join("");
        let nodeSVG = "", labelSVG = "";
        Object.values(N).forEach((n) => {
          nodeSVG += `<rect class="lsd-node lsd-node--${n.tone}" data-id="${n.id}" data-tip="${n.name}&#10;${lsdFmt(n.value)}" x="${n.x}" y="${n.y.toFixed(1)}" width="${nodeW}" height="${n.h.toFixed(1)}" rx="2"></rect>`;
          const cy = n.y + n.h / 2;
          if (n.tone === "supply") {
            labelSVG += `<text class="lsd-label lsd-label--strong" x="${n.x - 8}" y="${(cy - 2).toFixed(1)}" text-anchor="end">${n.name}</text><text class="lsd-label" x="${n.x - 8}" y="${(cy + 11).toFixed(1)}" text-anchor="end">${lsdFmt(n.value)}</text>`;
          } else if (n.tone === "emirati" || n.tone === "nonemirati") {
            labelSVG += `<text class="lsd-label lsd-label--strong" x="${n.x + nodeW / 2}" y="${(n.y - 10).toFixed(1)}" text-anchor="middle">${n.name}</text><text class="lsd-label" x="${n.x + nodeW / 2}" y="${(n.y - 1).toFixed(1)}" text-anchor="middle">${lsdFmt(n.value)}</text>`;
          } else if (n.tone === "demand" || n.tone === "gap") {
            labelSVG += `<text class="lsd-label lsd-label--strong" x="${n.x + nodeW + 8}" y="${(cy - 2).toFixed(1)}" text-anchor="start">${n.name}</text><text class="lsd-label" x="${n.x + nodeW + 8}" y="${(cy + 11).toFixed(1)}" text-anchor="start">${lsdFmt(n.value)}</text>`;
          } else {

      /* Donut — hand-built SVG (circumference = 100 so values map 1:1 to %). */
      function buildLmoDonut(pct, color, centerNum, centerLbl) {
        const R = 15.9154943;
        return `<svg viewBox="0 0 42 42" class="lmo-donut-svg" role="img" aria-label="${centerNum} ${centerLbl}">
  <circle cx="21" cy="21" r="${R}" fill="none" style="stroke:var(--lmo-donut-track)" stroke-width="3.8"></circle>
  <circle cx="21" cy="21" r="${R}" fill="none" style="stroke:${color}" stroke-width="3.8" stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="25"></circle>
  <text x="21" y="20.5" class="lmo-donut-num">${centerNum}</text>
  <text x="21" y="26" class="lmo-donut-lbl">${centerLbl}</text>
</svg>`;
      }

      /* Segmented composition donut — rounded, gapped arcs (circumference = 100
         → values map 1:1 to %). Each segment reveals its value on hover: the
         centre swaps to the hovered segment's value/label and the arc thickens.
         `segments` = [{ lbl, val, pct, color }]. */
      function buildLmoOvDonut(segments, centerNum, centerLbl) {
        const R = 15.9154943;
        const gap = segments.length > 1 ? 6 : 0;
        let start = 0; // cumulative position from top, clockwise
        const arcs = segments
          .map((s) => {
            const len = Math.max(s.pct - gap, 0.5);
            const off = 25 - (start + gap / 2);
            start += s.pct;
            return `<circle class="lmo-ov-seg" cx="21" cy="21" r="${R}" fill="none" style="stroke:${s.color}" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${off}" data-val="${s.val}" data-lbl="${s.lbl}" onmouseenter="lmoOvSegHover(this, true)" onmouseleave="lmoOvSegHover(this, false)"><title>${s.lbl}: ${s.val}</title></circle>`;
          })
          .join("");
        return `<svg viewBox="0 0 42 42" class="lmo-donut-svg" role="img" aria-label="${centerNum} ${centerLbl}" data-cnum="${centerNum}" data-clbl="${centerLbl}">
  ${arcs}
  <text x="21" y="20.5" class="lmo-donut-num">${centerNum}</text>
  <text x="21" y="26" class="lmo-donut-lbl">${centerLbl}</text>
</svg>`;
      }

      /* Hover a donut segment → show its value in the centre; restore the
         default (Total) on leave. */
      function lmoOvSegHover(seg, on) {
        const svg = seg.closest("svg");
        if (!svg) return;
        const num = svg.querySelector(".lmo-donut-num");
        const lbl = svg.querySelector(".lmo-donut-lbl");
        if (!num || !lbl) return;
        num.textContent = on ? seg.getAttribute("data-val") : svg.getAttribute("data-cnum");
        lbl.textContent = on ? seg.getAttribute("data-lbl") : svg.getAttribute("data-clbl");
      }

        const cards = () => [...track.children];
        const gap = () => {
          const s = getComputedStyle(track);
          return parseFloat(s.columnGap || s.gap) || 14;
        };
        const step = () => {
          const first = cards()[0];
          return first ? first.offsetWidth + gap() : track.clientWidth;
        };
        const maxScroll = () => Math.max(0, track.scrollWidth - track.clientWidth);
        const pageCount = () => {
          const ms = maxScroll();
          if (ms <= 2) return 1;
          return Math.ceil(ms / step()) + 1;

        const currentPage = () => {
          const s = step();
          return s <= 0 ? 0 : Math.round(track.scrollLeft / s);

          const page = Math.min(currentPage(), pages - 1);
          nav.classList.toggle("is-single", pages <= 1);

          if (dots.length !== pages) {

          arrows[1].disabled = ms <= 2 || track.scrollLeft >= ms - 2;

          const pages = pageCount();
          const page = Math.max(0, Math.min(i, pages - 1));
