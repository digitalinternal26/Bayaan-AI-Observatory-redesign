<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bayaan — Contact Support</title>
<link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/components/bayaan-footer.css" />
<link rel="stylesheet" href="css/pages/contact-support.css" />
<script>
  (function () {
    var t = localStorage.getItem("bayaan-theme") || "light";
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
<script src="js/theme.js"></script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>
</head>
<body>

<div id="screen-contact-support" class="ws-screen header-flush active">
  <div data-bayaan-header></div>

  <main class="contact-support-main">
    <div class="contact-support-wrap">
      <nav class="contact-support-breadcrumb-row" aria-label="Breadcrumb">
        <div class="contact-support-breadcrumb">
          <a href="index.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> Home</a>
          <i class="ti ti-chevron-right" aria-hidden="true"></i>
          <span class="contact-support-bc-current">Contact</span>
        </div>
      </nav>

      <h1 class="contact-support-title">Contact Us</h1>

      <div class="contact-support-grid">
        <section class="contact-support-form-panel" aria-labelledby="contactFormHeading">
          <h2 id="contactFormHeading" class="sr-only">Contact support form</h2>
          <form id="contactSupportForm" novalidate>
            <fieldset class="contact-support-fieldset">
              <legend class="contact-support-label">My concern is about:</legend>
              <div class="contact-support-radio-group" role="radiogroup" aria-label="Concern type">
                <label class="contact-support-radio">
                  <input type="radio" name="concernType" value="issue" required />
                  <span>I have an Issue/Query</span>
                </label>
                <label class="contact-support-radio">
                  <input type="radio" name="concernType" value="suggestion" />
                  <span>I have a feature/data model suggestion</span>
                </label>
              </div>
            </fieldset>

            <div class="contact-support-field">
              <label class="contact-support-label" for="contactConcernText">Please elaborate your concern:</label>
              <textarea
                id="contactConcernText"
                class="input contact-support-textarea"
                name="concernText"
                rows="6"
                required
                aria-describedby="contactCharCount"
              ></textarea>
              <div class="contact-support-char-row">
                <span id="contactCharCount" class="contact-support-char-count" aria-live="polite">0/4000 characters allowed</span>
              </div>
            </div>

            <div id="contactFormStatus" class="contact-form-status" role="status" aria-live="polite"></div>

            <button type="submit" class="btn btn-primary contact-support-submit">SUBMIT</button>
          </form>
        </section>

        <section class="contact-support-map-panel" aria-labelledby="contactMapHeading">
          <h2 id="contactMapHeading" class="sr-only">Statistics Centre – Abu Dhabi location</h2>
          <iframe
            id="contactMap"
            class="contact-support-map"
            title="Map showing Statistics Centre - Abu Dhabi location"
            src="https://maps.google.com/maps?q=Statistics+Centre+Abu+Dhabi&z=15&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>

          <div class="contact-support-address">
            <p class="contact-support-address-item">
              <i class="ti ti-map-pin" aria-hidden="true"></i>
              <span>Department of Government Enablement twofour54 Building, Abu Dhabi</span>
            </p>
            <p class="contact-support-address-item">
              <i class="ti ti-phone" aria-hidden="true"></i>
              <a href="tel:800555">800 555</a>
            </p>
            <p class="contact-support-address-item">
              <i class="ti ti-mail" aria-hidden="true"></i>
              <a href="mailto:info@scad.gov.ae">Info@scad.gov.ae</a>
            </p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div data-bayaan-footer></div>
</div>

<script>
  (function () {
    function bootContactSupport() {
      if (window.BayaanHeader) {
        BayaanHeader.initScreenHeader("screen-contact-support");
      }
      var nav = document.querySelector("#screen-contact-support .topnav");
      if (nav) {
        var logo = nav.querySelector(".nav-logo");
        if (logo) {
          logo.setAttribute("href", "index.html");
          logo.removeAttribute("onclick");
        }
        nav.querySelectorAll(".nav-link[data-nav]").forEach(function (link) {
          link.setAttribute(
            "href",
            link.dataset.nav === "geo" ? "addp/index.html" : "index.html",
          );
          link.removeAttribute("onclick");
        });
      }
      if (window.initBayaanFooter) initBayaanFooter();
    }

    window.onHeaderSearchClick = window.onHeaderSearchClick || function () {
      window.location.href = "index.html";
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootContactSupport);
    } else {
      bootContactSupport();
    }
  })();
</script>
<script src="js/contact-support.js"></script>

</body>
</html>
