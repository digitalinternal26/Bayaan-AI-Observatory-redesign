<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Map — Spatial Analytics · Bayaan</title>
    <link rel="icon" type="image/png" href="assets/bayaan-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="addp-v2/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="css/pages/ai.css" />
    <link rel="stylesheet" href="css/pages/cpi-obs.css" />
    <link rel="stylesheet" href="css/pages/obs-sidebar.css" />
    <link rel="stylesheet" href="css/pages/exec-home.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/pages/home-widgets.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/pages/lmo-geospatial.css" />
    <link rel="stylesheet" href="css/pages/lmo-geo-panel.css" />
    <link rel="stylesheet" href="css/pages/my-map.css" />
    <script>
      (function () {
        var t = localStorage.getItem("bayaan-theme") || "light";
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
    <script src="js/theme.js"></script>
    <script src="js/header.js?v=20260913-breadcrumbs3"></script>
  </head>
  <body class="lmo lmo--geospatial mm">
    <div id="screen-geo-view" class="ws-screen header-flush">
    <div data-bayaan-header></div>

    <div class="geo-main" id="geoMain">
      <div class="geo-map-stage" id="mapStage">
        <div id="geoMapView" aria-label="My Map — Abu Dhabi"></div>

        <div class="gp-map-legend mm-legend" aria-label="Map legend">
          <span class="gp-map-legend-item">
            <span class="gp-map-legend-swatch" style="background:var(--accent, #0066ff)" aria-hidden="true"></span>
            <span class="gp-map-legend-label">Selected region</span>
          </span>
          <span class="gp-map-legend-item">
            <span class="gp-map-legend-swatch" style="background:var(--accent-mid, #99c2ff)" aria-hidden="true"></span>
            <span class="gp-map-legend-label">Abu Dhabi regions</span>
          </span>
          <span class="gp-map-legend-item" id="mmLegendPois" hidden>
            <span class="gp-map-legend-swatch mm-legend-dot" aria-hidden="true"></span>
            <span class="gp-map-legend-label" id="mmLegendPoisLabel">Facilities</span>
          </span>
        </div>
      </div>

      <!-- Top controls (My Map workspace and source selector) -->
      <div class="mm-toolbar" id="mmToolbar">
        <div class="mm-dd" id="mmSwitcher">
          <button type="button" class="mm-ctl" id="mmSwitcherBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="mmSwitcherMenu" title="Map source">
            <img class="mm-ctl-img" id="mmSwitcherIcon" src="addp-v2/assets/nav-my-map.svg" alt="" />
            <span class="mm-ctl-label" id="mmSwitcherLabel">My Map</span>
            <i class="ti ti-chevron-down mm-ctl-chevron" aria-hidden="true"></i>
          </button>
          <div class="mm-menu" id="mmSwitcherMenu" role="listbox" aria-label="Map sources" hidden></div>
        </div>
        <button type="button" class="mm-ctl mm-ctl--primary" id="mmAiReportBtn" title="AI Report">
          <i class="ti ti-file-text" aria-hidden="true"></i><span class="mm-ctl-label">AI Report</span>
        </button>
        <button type="button" class="mm-ctl" id="mmFocusBtn" aria-pressed="false" title="Focus Districts">
          <i class="ti ti-focus-2" aria-hidden="true"></i><span class="mm-ctl-label">Focus Districts</span>
        </button>
        <div class="mm-dd" id="mmDownload">
          <button type="button" class="mm-ctl mm-ctl--icon" id="mmDownloadBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="mmDownloadMenu" aria-label="Download" title="Download">
            <i class="ti ti-download" aria-hidden="true"></i>
          </button>
          <div class="mm-menu mm-menu--end" id="mmDownloadMenu" role="menu" hidden>
            <div class="mm-menu-label">Export My Map</div>
            <button type="button" class="mm-menu-item" role="menuitem" data-mm-export="csv">
              <i class="ti ti-table" aria-hidden="true"></i>
              <span class="mm-menu-copy"><span class="mm-menu-title">Excel</span><span class="mm-menu-meta">Widget figures (.csv)</span></span>
            </button>
            <button type="button" class="mm-menu-item" role="menuitem" data-mm-export="pdf">
              <i class="ti ti-file-type-pdf" aria-hidden="true"></i>
              <span class="mm-menu-copy"><span class="mm-menu-title">PDF</span><span class="mm-menu-meta">Print or save the workspace</span></span>
            </button>
            <button type="button" class="mm-menu-item" role="menuitem" data-mm-export="png">
              <i class="ti ti-photo" aria-hidden="true"></i>
              <span class="mm-menu-copy"><span class="mm-menu-title">Map image</span><span class="mm-menu-meta">Current map view (.png)</span></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Right tool column (ADDP floating actions) -->
      <div class="mm-tools" id="mmTools" aria-label="Map tools">
        <div class="mm-tools-group">
          <button type="button" class="mm-tool" data-mm-tool="level" aria-expanded="false" aria-controls="mmToolPanel" title="Selection level" aria-label="Selection level"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
          <button type="button" class="mm-tool" data-mm-tool="filters" aria-expanded="false" aria-controls="mmToolPanel" title="Filters" aria-label="Filters"><i class="ti ti-adjustments-horizontal" aria-hidden="true"></i><span class="mm-tool-dot" id="mmFilterDot" hidden></span></button>
          <button type="button" class="mm-tool mm-tool--ai" data-mm-tool="ai" aria-expanded="false" aria-controls="mmToolPanel" title="AI insights" aria-label="AI insights"><i class="ti ti-sparkles" aria-hidden="true"></i></button>
          <button type="button" class="mm-tool" data-mm-tool="layers" aria-expanded="false" aria-controls="mmToolPanel" title="Map layers" aria-label="Map layers"><i class="ti ti-stack-2" aria-hidden="true"></i></button>
          <button type="button" class="mm-tool" data-mm-tool="stats" aria-expanded="false" aria-controls="mmToolPanel" title="Statistics" aria-label="Statistics"><i class="ti ti-chart-bar" aria-hidden="true"></i></button>
        </div>
        <button type="button" class="mm-tool mm-tool--solo" data-mm-tool="info" aria-expanded="false" aria-controls="mmToolPanel" title="Disclaimer" aria-label="Disclaimer"><i class="ti ti-info-circle" aria-hidden="true"></i></button>
        <div class="mm-tools-group">
          <button type="button" class="mm-tool" id="geoZoomIn" title="Zoom in" aria-label="Zoom in"><i class="ti ti-plus" aria-hidden="true"></i></button>
          <button type="button" class="mm-tool" id="geoZoomOut" title="Zoom out" aria-label="Zoom out"><i class="ti ti-minus" aria-hidden="true"></i></button>
        </div>
      </div>
      <aside class="mm-tool-panel" id="mmToolPanel" hidden></aside>

      <nav class="mm-rail" id="mmRail" role="tablist" aria-orientation="vertical" aria-label="Map sources"></nav>

      <div class="mm-workspace is-empty" id="mmWorkspace" aria-label="My widgets"></div>

      <aside class="geo-sidebar" id="sidebar">
        <button
          type="button"
          class="geo-sidebar-toggle"
          id="sidebarToggle"
          aria-expanded="true"
          aria-controls="sidebarContent"
          title="Collapse panel"
        >
          <i class="ti ti-chevron-left"></i>
        </button>
        <div id="sidebarContent"></div>
      </aside>

      <section class="mm-sheet" id="mmSheet" aria-labelledby="mmSheetTitle" hidden></section>

      <div class="mm-sr-only" id="mmLive" aria-live="polite"></div>
    </div>
    </div>

    <script src="addp-v2/vendor/maplibre-gl.js"></script>
    <script src="addp-v2/data/region-boundaries.geojson.js"></script>
    <script src="lmo/data/abu-dhabi-regions-data.js"></script>
    <script>
      /* header.js emits inline onclicks for cross-screen actions; no-ops here. */
      function goTo() {}
      function openBayaanSpace(e) { if (e) e.preventDefault(); }
      function openProducts(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openObservatories(e) { if (e) e.preventDefault(); window.location.href = "index.html"; }
      function openWsDrp() {}
      function onHeaderSearchClick() {}
      function openObsSidebarAI() {}
      function toast() {}

      if (window.BayaanHeader && window.parent === window) {
        BayaanHeader.initScreenHeader("screen-geo-view");
        BayaanHeader.syncActive("screen-geo-view");
      }
    </script>
    <script src="js/my-map-sources.js"></script>
    <script src="js/my-map.js"></script>
  </body>
</html>
